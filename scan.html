<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d7377">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Scanner Gudang Puskesmas Sanden">
<title>Scanner — Puskesmas Sanden</title>

<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleapis.com" crossorigin>

<link rel="stylesheet" href="shared/core.css">

<style>
/* ============================================================
   BOOT SPLASH
   ============================================================ */
.boot-splash {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0d7377 0%, #14a3a8 100%);
  z-index: 9999;
  transition: opacity 0.3s;
}
.boot-splash.hide { opacity: 0; pointer-events: none; }
.boot-splash-inner { text-align: center; color: white; padding: 20px; }
.boot-splash-logo {
  width: 72px; height: 72px;
  margin: 0 auto 18px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 700;
}
.boot-splash-text { font-size: 15px; opacity: 0.9; margin-bottom: 16px; }
.boot-splash-spinner {
  display: inline-block;
  width: 22px; height: 22px;
  border: 2.5px solid rgba(255, 255, 255, 0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: bootspin 0.8s linear infinite;
}
@keyframes bootspin { to { transform: rotate(360deg); } }

/* ============================================================
   SCAN APP LAYOUT
   ============================================================ */
.scan-app {
  display: grid;
  grid-template-rows: auto 1fr;
  min-height: 100dvh;
  width: 100%;
}
.scan-main {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: var(--sp-3);
  padding-left: calc(var(--sp-3) + var(--safe-left));
  padding-right: calc(var(--sp-3) + var(--safe-right));
  padding-bottom: calc(var(--sp-4) + var(--safe-bottom));
}
.scan-main-inner {
  max-width: 640px;
  margin: 0 auto;
  width: 100%;
}

/* ============================================================
   SCAN MODE PILL
   ============================================================ */
.scan-mode-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 7px 16px;
  border-radius: var(--r-full);
  font-size: var(--fs-sm); font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.scan-mode-pill.obat { background: var(--primary-bg); color: var(--primary-dark); }
.scan-mode-pill.bmhp { background: var(--success-bg); color: var(--success); }
.scan-mode-pill.atk { background: var(--warning-bg); color: var(--warning); }

/* ============================================================
   WELCOME (Layer 1)
   ============================================================ */
.scan-welcome { padding: var(--sp-3) 0 var(--sp-4); }
.scan-welcome-greeting {
  font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 2px;
}
.scan-welcome-name {
  font-size: var(--fs-xl); font-weight: 700;
  line-height: 1.2; word-break: break-word;
}
.scan-welcome-role {
  display: inline-block;
  margin-top: var(--sp-2);
  padding: 3px 12px;
  background: var(--primary-bg);
  color: var(--primary-dark);
  border-radius: var(--r-full);
  font-size: var(--fs-xs);
  font-weight: 600;
}

/* ============================================================
   MENU CARDS (Layer 1)
   ============================================================ */
.scan-menu-title {
  font-size: var(--fs-base);
  color: var(--text-muted);
  margin-bottom: var(--sp-3);
  font-weight: 500;
}
.scan-menu-cards {
  display: flex; flex-direction: column;
  gap: var(--sp-2);
  margin-bottom: var(--sp-4);
}
.scan-menu-card {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  text-align: left;
  transition: all 0.15s;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  width: 100%;
  color: var(--text);
}
.scan-menu-card:hover {
  border-color: var(--primary);
  box-shadow: var(--shadow-md);
}
.scan-menu-card:active { transform: scale(0.99); }
.scan-menu-card-icon {
  width: 52px; height: 52px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; flex-shrink: 0;
}
.scan-menu-card-icon.obat { background: var(--primary-bg); }
.scan-menu-card-icon.bmhp { background: var(--success-bg); }
.scan-menu-card-icon.atk { background: var(--warning-bg); }
.scan-menu-card-body { flex: 1; min-width: 0; }
.scan-menu-card-title {
  font-size: var(--fs-md); font-weight: 700;
  margin-bottom: 2px; color: var(--text);
}
.scan-menu-card-desc {
  font-size: var(--fs-sm); color: var(--text-muted);
  word-break: break-word;
}
.scan-menu-card-arrow { color: var(--text-light); flex-shrink: 0; }

/* ============================================================
   HISTORY PREVIEW (Layer 1)
   ============================================================ */
.scan-history-preview {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
}
.scan-history-preview-header {
  display: flex; align-items: center;
  justify-content: space-between;
  margin-bottom: var(--sp-2);
}
.scan-history-preview-title {
  font-size: var(--fs-sm); font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

/* ============================================================
   EMPTY SCANNER
   ============================================================ */
.scan-empty {
  text-align: center;
  padding: var(--sp-5) var(--sp-3);
  color: var(--text-muted);
}
.scan-empty svg {
  width: 42px; height: 42px;
  color: var(--text-light);
  margin: 0 auto var(--sp-3);
}
.scan-empty h3 {
  font-size: var(--fs-md); color: var(--text); margin-bottom: 4px;
}
.scan-empty p { font-size: var(--fs-sm); }
</style>
</head>
<body>

<!-- BOOT SPLASH -->
<div class="boot-splash" id="boot-splash">
  <div class="boot-splash-inner">
    <div class="boot-splash-logo">PKM</div>
    <div class="boot-splash-text">Memuat aplikasi...</div>
    <div class="boot-splash-spinner"></div>
  </div>
</div>

<div id="scan-root"></div>

<div class="toast-container" id="toast-container"></div>
<div class="loading-overlay" id="loading-overlay"><div class="spinner"></div></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="shared/core.js" defer></script>

<script defer>
'use strict';

const ScanApp = {
  session: null,
  master: null,
  currentLayer: 'login',
  selectedGroup: null,
  selectedItem: null,
  availableBatches: [],
  stockInfo: { total_stok: 0, batches: [], is_obat: false },
  currentTipe: 'Masuk',
  _submitting: false,

  // ============================================================
  // INIT
  // ============================================================
  async init() {
    dbg('ScanApp init');
    const session = Store.getSession();

    if (session && session.token) {
      dbg('Ada session, verifikasi...');
      try {
        const res = await Api.whoAmI();
        if (res && res.code === 200) {
          this.session = {
            token: session.token,
            id_petugas: res.data.id_petugas,
            username: res.data.username,
            nama: res.data.nama,
            role: res.data.role,
            wilayah_binaan: res.data.wilayah_binaan || '',
            expiry: res.data.expiry
          };
          Store.setSession(this.session);
          await this._loadMaster();
          this._hideBootSplash();
          this.showMenu();
          return;
        }
      } catch (err) {
        dbgWarn('whoAmI gagal:', err.message);
        Store.clearSession();
      }
    }

    dbg('Tampilkan login');
    this._hideBootSplash();
    this.showLogin();
  },

  _hideBootSplash() {
    const splash = document.getElementById('boot-splash');
    if (!splash) return;
    splash.classList.add('hide');
    setTimeout(() => {
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }, 300);
  },

  async _loadMaster() {
    let master = Store.getMaster();
    if (master) {
      dbg('Master dari cache');
      this.master = master;
      return;
    }
    dbg('Fetch master...');
    try {
      const res = await Api.getMasterData();
      master = res.data;
      Store.setMaster(master);
      this.master = master;
      dbg('Master loaded:', {
        obat: (master.obat || []).length,
        bmhp: (master.bmhp || []).length,
        atk: (master.atk || []).length
      });
    } catch (err) {
      dbgWarn('Gagal load master:', err.message);
      Toast.warning('Data master belum termuat.');
      this.master = { obat: [], bmhp: [], atk: [], supplier: [], unit: [], rak: [] };
    }
  },

  // ============================================================
  // LAYER 0 — LOGIN
  // ============================================================
  showLogin() {
    this.currentLayer = 'login';
    const root = U.$('#scan-root');
    LoginForm.mount(root, (session) => {
      this.session = session;
      this._onLoginSuccess();
    }, { variant: 'compact' });
  },

  async _onLoginSuccess() {
    dbg('Login sukses, load master di background');
    try { await this._loadMaster(); } catch (e) { /* handled */ }
    this.showMenu();
  },

  // ============================================================
  // LAYER 1 — MENU
  // ============================================================
  showMenu() {
    this.currentLayer = 'menu';
    this.selectedGroup = null;
    this.selectedItem = null;
    this.availableBatches = [];
    this.stockInfo = { total_stok: 0, batches: [], is_obat: false };

    const root = U.$('#scan-root');
    root.innerHTML = this._renderMenu();

    U.$$('.scan-menu-card', root).forEach(card => {
      card.addEventListener('click', () => {
        this.showScanner(card.dataset.group);
      });
    });

    const logoutBtn = U.$('#btn-logout', root);
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        Modal.confirm('Keluar', 'Yakin ingin keluar dari aplikasi?',
          () => this.logout(), 'Ya, Keluar', true,
          { icon: 'danger', subtitle: 'Anda harus login ulang' });
      });
    }

    const adminBtn = U.$('#btn-go-admin', root);
    if (adminBtn) {
      adminBtn.addEventListener('click', () => { location.href = 'index.html'; });
    }

    this._renderHistoryPreview();
  },

  _renderMenu() {
    const s = this.session;
    const isAdmin = ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'].indexOf(s.role) !== -1;

    return '' +
      '<div class="scan-app">' +
        '<header class="app-topbar">' +
          '<div class="app-topbar-brand">' +
            '<div class="app-topbar-logo">PKM</div>' +
            '<div style="min-width:0">' +
              '<div class="app-topbar-title">Scanner Gudang</div>' +
              '<div class="app-topbar-subtitle">' + U.escapeHtml(s.nama || s.username) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="app-topbar-actions">' +
            (isAdmin
              ? '<button class="app-icon-btn" id="btn-go-admin" title="Menu Utama">' + U.icon('home', 20) + '</button>'
              : '') +
            '<button class="app-icon-btn danger" id="btn-logout" title="Keluar">' + U.icon('logout', 20) + '</button>' +
          '</div>' +
        '</header>' +

        '<main class="scan-main">' +
          '<div class="scan-main-inner">' +
            '<div class="scan-welcome">' +
              '<div class="scan-welcome-greeting">Selamat datang,</div>' +
              '<div class="scan-welcome-name">' + U.escapeHtml(s.nama || s.username) + '</div>' +
              '<span class="scan-welcome-role">' + U.escapeHtml(s.role) + '</span>' +
            '</div>' +

            '<div class="scan-menu-title">Pilih jenis barang yang akan Anda scan:</div>' +

            '<div class="scan-menu-cards">' +
              this._renderMenuCard('obat', '💊', 'Scan Obat', 'Batch, ED, VVM, dan golongan') +
              this._renderMenuCard('bmhp', '🩹', 'Scan BMHP', 'Masker, kasa, cairan medis') +
              this._renderMenuCard('atk', '📄', 'Scan ATK', 'Kertas, alat tulis, kebersihan') +
            '</div>' +

            '<div class="scan-history-preview" id="history-preview">' +
              '<div class="scan-history-preview-header">' +
                '<div class="scan-history-preview-title">Riwayat Hari Ini</div>' +
                '<span class="badge badge-muted">...</span>' +
              '</div>' +
              '<div class="skeleton skeleton-line long"></div>' +
              '<div class="skeleton skeleton-line medium"></div>' +
            '</div>' +
          '</div>' +
        '</main>' +
      '</div>';
  },

  _renderMenuCard(group, emoji, title, desc) {
    return '' +
      '<button class="scan-menu-card" data-group="' + group + '">' +
        '<div class="scan-menu-card-icon ' + group + '">' + emoji + '</div>' +
        '<div class="scan-menu-card-body">' +
          '<div class="scan-menu-card-title">' + title + '</div>' +
          '<div class="scan-menu-card-desc">' + desc + '</div>' +
        '</div>' +
        '<div class="scan-menu-card-arrow">' + U.icon('chevronRight', 20) + '</div>' +
      '</button>';
  },

  async _renderHistoryPreview() {
    const el = U.$('#history-preview');
    if (!el) return;
    try {
      const res = await Api.getMyScanHistory(20);
      const total = res.data.total || 0;
      const items = res.data.items || [];

      let html = '<div class="scan-history-preview-header">' +
        '<div class="scan-history-preview-title">Riwayat Hari Ini</div>' +
        '<span class="badge badge-primary">' + total + ' scan</span>' +
      '</div>';

      if (items.length === 0) {
        html += '<div class="text-muted text-center" style="font-size:12px;padding:12px">' +
          'Belum ada scan hari ini.</div>';
      } else {
        html += '<div class="scan-history">';
        items.slice(0, 5).forEach(it => {
          html += '<div class="scan-history-item">' +
            '<span class="check">' + U.icon('check', 15) + '</span>' +
            '<span class="text"><strong>' + U.escapeHtml(it.id_barang) + '</strong> ' +
              U.escapeHtml(it.tipe_mutasi) + ' (' + it.qty + ')</span>' +
            '<span class="time">' + U.formatDateTime(it.timestamp) + '</span>' +
          '</div>';
        });
        html += '</div>';
      }
      el.innerHTML = html;
    } catch (err) {
      dbgWarn('History error:', err.message);
      el.innerHTML = '<div class="text-muted text-center" style="font-size:12px;padding:12px">' +
        'Riwayat tidak tersedia.</div>';
    }
  },

  // ============================================================
  // LAYER 2 — SCANNER
  // ============================================================
  showScanner(group) {
    this.currentLayer = 'scan';
    this.selectedGroup = group;
    this.selectedItem = null;
    this.availableBatches = [];
    this.stockInfo = { total_stok: 0, batches: [], is_obat: false };
    this.currentTipe = 'Masuk';

    const root = U.$('#scan-root');
    root.innerHTML = this._renderScanner();

    U.$('#btn-back', root).addEventListener('click', () => {
      this._stopScanner();
      this.showMenu();
    });
    U.$('#btn-flash', root).addEventListener('click', async () => {
      const on = await QRScanner.toggleFlash();
      Toast.info(on ? 'Flash aktif' : 'Flash mati');
    });
    U.$('#btn-start-scan', root).addEventListener('click', () => this._startScanner());
    U.$('#btn-manual', root).addEventListener('click', () => this._showManualInput());
    U.$('#btn-stop', root).addEventListener('click', () => this._stopScanner());

    this._renderFormArea();
  },

  _renderScanner() {
    const label = this.selectedGroup === 'obat' ? 'Obat' :
                  this.selectedGroup === 'bmhp' ? 'BMHP' : 'ATK';
    return '' +
      '<div class="scan-app">' +
        '<header class="app-topbar">' +
          '<button class="app-icon-btn" id="btn-back" title="Ganti Jenis">' +
            U.icon('arrowLeft', 20) +
          '</button>' +
          '<div class="app-topbar-center">' +
            '<div class="scan-mode-pill ' + this.selectedGroup + '">' + label + '</div>' +
          '</div>' +
          '<div class="app-topbar-actions">' +
            '<button class="app-icon-btn" id="btn-flash" title="Flash">' +
              U.icon('zap', 20) +
            '</button>' +
          '</div>' +
        '</header>' +

        '<main class="scan-main">' +
          '<div class="scan-main-inner">' +
            '<div class="scanner-box">' +
              '<div class="scanner-placeholder" id="scanner-placeholder">' +
                U.icon('camera', 40) +
                '<p>Kamera belum aktif</p>' +
              '</div>' +
              '<video id="scanner-video" style="display:none" playsinline muted></video>' +
              '<div class="scanner-frame" id="scanner-frame" style="display:none"></div>' +
              '<div class="scanner-mode-badge in" id="mode-badge" style="display:none">SCAN</div>' +
              '<div class="scanner-controls" id="scanner-controls" style="display:none">' +
                '<button id="btn-stop">' + U.icon('x', 14) + ' Stop</button>' +
              '</div>' +
            '</div>' +

            '<div class="flex gap-2 flex-wrap mb-3">' +
              '<button class="btn btn-primary" id="btn-start-scan" style="flex:1">' +
                U.icon('camera', 16) + ' Mulai Scan' +
              '</button>' +
              '<button class="btn btn-secondary" id="btn-manual">' +
                U.icon('keyboard', 16) + ' Manual' +
              '</button>' +
            '</div>' +

            '<div id="form-area"></div>' +
          '</div>' +
        '</main>' +
      '</div>';
  },

  async _startScanner() {
    const video = U.$('#scanner-video');
    const placeholder = U.$('#scanner-placeholder');
    const frame = U.$('#scanner-frame');
    const badge = U.$('#mode-badge');
    const controls = U.$('#scanner-controls');

    video.style.display = 'block';
    placeholder.style.display = 'none';
    frame.style.display = 'block';
    badge.style.display = 'block';
    controls.style.display = 'flex';

    await QRScanner.start(video, (text) => {
      U.vibrate(50);
      U.beepSuccess();
      this._stopScanner();
      this._handleScannedCode(text, false);
    }, (err) => {
      Toast.error('Kamera tidak bisa diakses: ' + err.message);
      this._stopScanner();
    });
  },

  _stopScanner() {
    QRScanner.stop();
    const v = U.$('#scanner-video');
    if (v) v.style.display = 'none';
    const p = U.$('#scanner-placeholder');
    if (p) p.style.display = 'flex';
    ['#scanner-frame', '#mode-badge', '#scanner-controls'].forEach(sel => {
      const el = U.$(sel);
      if (el) el.style.display = 'none';
    });
  },

  _showManualInput() {
    const expectedPrefix = this.selectedGroup === 'obat' ? 'OBT-' :
                          this.selectedGroup === 'bmhp' ? 'BMP-' : 'ATK-';
    const example = expectedPrefix + '0001';
    const modeLabel = this.selectedGroup === 'obat' ? 'Obat' :
                     this.selectedGroup === 'bmhp' ? 'BMHP' : 'ATK';
    const self = this;

    Modal.open({
      title: 'Input Manual',
      subtitle: 'Mode ' + modeLabel + ' — ID diawali ' + expectedPrefix,
      icon: 'primary',
      body: '' +
        '<div class="field">' +
          '<label class="field-label">ID Barang <span class="required">*</span></label>' +
          '<input type="text" class="input" id="manual-id" ' +
            'placeholder="contoh: ' + example + '" ' +
            'autofocus autocomplete="off" ' +
            'autocapitalize="characters" spellcheck="false" ' +
            'inputmode="text" ' +
            'style="font-family:ui-monospace,monospace;font-weight:600;letter-spacing:0.5px">' +
          '<div class="field-hint">Format: <strong>' + expectedPrefix + '0001</strong> dst.</div>' +
        '</div>',
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        {
          label: 'Lanjut', class: 'btn-primary', close: false,
          icon: 'arrowRight',
          onClick: async (btn) => {
            const inputEl = U.$('#manual-id');
            const val = inputEl.value.trim().toUpperCase();

            FormError.clear(inputEl);

            if (!val) {
              FormError.set(inputEl, 'ID wajib diisi');
              return;
            }
            if (val.indexOf(expectedPrefix) !== 0) {
              FormError.set(inputEl, 'ID harus diawali ' + expectedPrefix);
              return;
            }
            if (!/^(OBT|BMP|ATK)-\d+$/.test(val)) {
              FormError.set(inputEl, 'Format ID tidak valid. Contoh: ' + example);
              return;
            }

            Btn.setLoading(btn, 'Memuat...');

            try {
              const found = await self._handleScannedCode(val, true);
              if (found === false) {
                Btn.stopLoading(btn, 'Lanjut', 'arrowRight');
                FormError.set(inputEl, 'Barang tidak ditemukan di master');
                return;
              }
              Modal.close();
            } catch (err) {
              Btn.stopLoading(btn, 'Lanjut', 'arrowRight');
              FormError.set(inputEl, 'Gagal memuat: ' + err.message);
            }
          }
        }
      ]
    });

    setTimeout(() => {
      const el = U.$('#manual-id');
      if (el) el.focus();
    }, 200);
  },

  async _handleScannedCode(code, fromModal) {
    if (!code) return false;

    const expectedPrefix = this.selectedGroup === 'obat' ? 'OBT-' :
                          this.selectedGroup === 'bmhp' ? 'BMP-' : 'ATK-';
    if (code.indexOf(expectedPrefix) !== 0) {
      const actualGroup = code.indexOf('OBT-') === 0 ? 'Obat' :
                          code.indexOf('BMP-') === 0 ? 'BMHP' :
                          code.indexOf('ATK-') === 0 ? 'ATK' : 'Unknown';
      Toast.error('QR ini "' + actualGroup + '". Ganti mode scan.');
      U.vibrate([100, 50, 100]);
      return false;
    }

    const master = this.master;
    if (!master) {
      Toast.error('Data master belum dimuat');
      return false;
    }

    let item = null;
    if (this.selectedGroup === 'obat') item = (master.obat || []).find(o => o.ID_Obat === code);
    else if (this.selectedGroup === 'bmhp') item = (master.bmhp || []).find(o => o.ID_BMHP === code);
    else item = (master.atk || []).find(o => o.ID_ATK === code);

    if (!item) {
      Toast.error('Barang tidak ditemukan: ' + code);
      return false;
    }
    if (item.Status_Aktif === 'Nonaktif') {
      Toast.error('Barang dinonaktifkan');
      return false;
    }

    this.selectedItem = item;
    this.availableBatches = [];
    this.stockInfo = { total_stok: 0, batches: [], is_obat: false };

    if (!fromModal) {
      this._renderFormAreaWithLoading();
    }

    // Fetch stock info
    try {
      const res = await Api.getAvailableBatches(code);
      this.stockInfo = res.data || this.stockInfo;
      this.availableBatches = this.stockInfo.batches || [];
    } catch (err) {
      dbgWarn('Fetch stock info gagal:', err.message);
    }

    this._renderFormArea();
    return true;
  },

  _renderFormAreaWithLoading() {
    const area = U.$('#form-area');
    if (!area) return;
    const item = this.selectedItem;
    if (!item) return;
    const group = this.selectedGroup;
    const idField = group === 'obat' ? 'ID_Obat' : group === 'bmhp' ? 'ID_BMHP' : 'ID_ATK';
    const nameField = group === 'obat' ? 'Nama_Obat' : 'Nama_Barang';

    area.innerHTML = '' +
      '<div class="selected-item-card">' +
        '<div class="selected-item-name">' + U.escapeHtml(item[nameField] || '-') + '</div>' +
        '<div class="selected-item-id">' + U.escapeHtml(item[idField]) + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="skeleton skeleton-card"></div>' +
        '<div class="skeleton skeleton-line long"></div>' +
        '<div class="skeleton skeleton-line medium"></div>' +
      '</div>';
  },

  _renderFormArea() {
    const area = U.$('#form-area');
    if (!area) return;

    if (!this.selectedItem) {
      area.innerHTML = '' +
        '<div class="card">' +
          '<div class="scan-empty">' +
            U.icon('qr', 42) +
            '<h3>Belum ada item</h3>' +
            '<p>Scan QR atau input ID manual untuk memulai.</p>' +
          '</div>' +
        '</div>';
      return;
    }

    const item = this.selectedItem;
    const group = this.selectedGroup;
    const idField = group === 'obat' ? 'ID_Obat' : group === 'bmhp' ? 'ID_BMHP' : 'ID_ATK';
    const nameField = group === 'obat' ? 'Nama_Obat' : 'Nama_Barang';
    const satuan = item.Satuan || '';
    const totalStok = Number(this.stockInfo.total_stok) || 0;
    const hasStok = totalStok > 0;

    // Selected item card
    let html = '' +
      '<div class="selected-item-card">' +
        '<div class="selected-item-name">' + U.escapeHtml(item[nameField] || '-') + '</div>' +
        '<div class="selected-item-id">' + U.escapeHtml(item[idField]) + '</div>' +
        '<div class="selected-item-meta">' +
          '<span class="selected-item-meta-item">' + U.icon('package', 13) + ' ' + U.escapeHtml(satuan || '-') + '</span>' +
          '<span class="selected-item-meta-item">' + U.icon('mapPin', 13) + ' ' + U.escapeHtml(item.Lokasi_Rak || '-') + '</span>' +
        '</div>' +
      '</div>';

    // Stock info card
    html += '' +
      '<div class="stock-info-card' + (hasStok ? '' : ' empty') + '">' +
        '<div class="stock-info-left">' +
          '<div class="stock-info-label">Stok Sistem</div>' +
          '<div class="stock-info-value">' +
            U.formatNumber(totalStok) +
            ' <span class="stock-info-unit">' + U.escapeHtml(satuan) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="stock-info-hint' + (hasStok ? '' : ' danger') + '">' +
          (hasStok ? 'Tersedia untuk dikeluarkan' : 'Stok kosong — tidak bisa keluar') +
        '</div>' +
      '</div>';

    // Form
    html += '<form class="card" id="scan-form">';

    html += '' +
      '<div class="field">' +
        '<label class="field-label">Tipe Mutasi <span class="required">*</span></label>' +
        '<div class="tipe-toggle">' +
          '<button type="button" class="tipe-toggle-btn active in" data-tipe="Masuk">' +
            U.icon('arrowDown', 16) + ' Masuk' +
          '</button>' +
          '<button type="button" class="tipe-toggle-btn" data-tipe="Keluar">' +
            U.icon('arrowUp', 16) + ' Keluar' +
          '</button>' +
        '</div>' +
        '<input type="hidden" id="f-tipe" value="Masuk">' +
      '</div>';

    html += '' +
      '<div class="field">' +
        '<label class="field-label">Qty <span class="required">*</span></label>' +
        '<input type="number" class="input" id="f-qty" min="1" step="1" required inputmode="numeric" autofocus>' +
      '</div>';

    if (group === 'obat') html += this._renderObatFields(item);
    else if (group === 'bmhp') html += this._renderBmhpFields(item);

    const master = this.master;
    const supplierOptions = (master.supplier || []).map(s =>
      '<option value="' + U.escapeHtml(s.ID_Supplier) + '">' + U.escapeHtml(s.Nama_Perusahaan) + '</option>'
    ).join('');
    const unitOptions = (master.unit || []).map(u =>
      '<option value="' + U.escapeHtml(u.ID_Unit) + '">' + U.escapeHtml(u.Nama_Unit) + '</option>'
    ).join('');
    const sumberOptions = ['JKN', 'BOK', 'APBD', 'Dropping_Dinkes', 'Lainnya'].map(s =>
      '<option value="' + s + '">' + s + '</option>'
    ).join('');

    // Sumber Dana — hanya untuk Masuk
    html += '' +
      '<div class="field" id="field-sumber">' +
        '<label class="field-label">Sumber Dana</label>' +
        '<select class="select" id="f-sumber">' +
          '<option value="">— Pilih —</option>' + sumberOptions +
        '</select>' +
      '</div>';

    // Supplier — untuk Masuk
    html += '' +
      '<div class="field" id="field-supplier" style="display:block">' +
        '<label class="field-label">Supplier <span class="required">*</span></label>' +
        '<select class="select" id="f-supplier">' +
          '<option value="">— Pilih —</option>' + supplierOptions +
        '</select>' +
      '</div>';

    // Unit Tujuan — untuk Keluar
    html += '' +
      '<div class="field" id="field-unit" style="display:none">' +
        '<label class="field-label">Unit Tujuan <span class="required">*</span></label>' +
        '<select class="select" id="f-unit">' +
          '<option value="">— Pilih —</option>' + unitOptions +
        '</select>' +
      '</div>';

    html += '' +
      '<div class="field">' +
        '<label class="field-label">No. Dokumen</label>' +
        '<input type="text" class="input" id="f-dok" placeholder="Faktur / SJ / Resep">' +
      '</div>';

    html += '' +
      '<div class="field">' +
        '<label class="field-label">Keterangan</label>' +
        '<textarea class="textarea" id="f-ket" rows="2"></textarea>' +
      '</div>';

    html += '' +
      '<div class="flex gap-2 flex-wrap mt-2">' +
        '<button type="button" class="btn btn-secondary" id="btn-cancel">Batal</button>' +
        '<button type="submit" class="btn btn-primary" id="btn-submit" style="flex:1">' +
          U.icon('check', 16) + ' Simpan' +
        '</button>' +
      '</div>';

    html += '</form>';
    area.innerHTML = html;

    // Attach type toggle
    U.$$('[data-tipe]', area).forEach(btn => {
      btn.addEventListener('click', () => {
        this.currentTipe = btn.dataset.tipe;
        U.$('#f-tipe', area).value = this.currentTipe;
        U.$$('[data-tipe]', area).forEach(b => {
          b.classList.remove('active', 'in', 'out');
          if (b.dataset.tipe === this.currentTipe) {
            b.classList.add('active', this.currentTipe === 'Masuk' ? 'in' : 'out');
          }
        });
        this._updateConditionalFields();
      });
    });

    // Mount BatchSelector untuk Obat Keluar
    const batchWrap = U.$('#batch-selector-wrap', area);
    if (batchWrap && this.availableBatches.length > 0) {
      BatchSelector.mount(
        batchWrap,
        this.availableBatches,
        () => { /* callback opsional */ },
        satuan
      );
    }

    U.$('#btn-cancel', area).addEventListener('click', () => {
      this.selectedItem = null;
      this.availableBatches = [];
      this.stockInfo = { total_stok: 0, batches: [], is_obat: false };
      BatchSelector.reset();
      this._renderFormArea();
    });

    U.$('#scan-form', area).addEventListener('submit', (e) => {
      e.preventDefault();
      this._submit();
    });
  },

  _updateConditionalFields() {
    const isMasuk = this.currentTipe === 'Masuk';

    const sumber = U.$('#field-sumber');
    if (sumber) sumber.style.display = isMasuk ? 'block' : 'none';

    const sup = U.$('#field-supplier');
    if (sup) sup.style.display = isMasuk ? 'block' : 'none';

    const unit = U.$('#field-unit');
    if (unit) unit.style.display = isMasuk ? 'none' : 'block';

    if (this.selectedGroup === 'obat') {
      const bm = U.$('#field-batch-masuk');
      const bk = U.$('#field-batch-keluar');
      if (bm) bm.style.display = isMasuk ? 'block' : 'none';
      if (bk) bk.style.display = isMasuk ? 'none' : 'block';
    }
  },

  _renderObatFields(item) {
    const needVVM = String(item.Wajib_VVM) === 'Ya';
    let html = '';

    // Masuk — input manual batch & ED
    html += '' +
      '<div id="field-batch-masuk">' +
        '<div class="field-row">' +
          '<div class="field">' +
            '<label class="field-label">No. Batch <span class="required">*</span></label>' +
            '<input type="text" class="input" id="f-batch" placeholder="contoh: B2026-X9" autocomplete="off">' +
          '</div>' +
          '<div class="field">' +
            '<label class="field-label">Exp. Date <span class="required">*</span></label>' +
            '<input type="date" class="input" id="f-ed">' +
          '</div>' +
        '</div>' +
        (needVVM ? '' +
          '<div class="field">' +
            '<label class="field-label">Status VVM <span class="required">*</span></label>' +
            '<select class="select" id="f-vvm">' +
              '<option value="">— Pilih —</option>' +
              '<option value="A">A (Baik)</option>' +
              '<option value="B">B (Baik)</option>' +
              '<option value="C">C (Rusak — karantina)</option>' +
              '<option value="D">D (Rusak — karantina)</option>' +
            '</select>' +
          '</div>'
        : '') +
      '</div>';

    // Keluar — BatchSelector modern
    html += '<div id="field-batch-keluar" style="display:none">';
    if (this.availableBatches.length === 0) {
      html += '' +
        '<div class="field">' +
          '<label class="field-label">Batch yang Diambil <span class="required">*</span></label>' +
          '<div class="input" style="background:var(--warning-bg);border-color:var(--warning);color:var(--warning);font-weight:600;display:flex;align-items:center;gap:8px">' +
            U.icon('alert', 16) + '<span>Tidak ada batch tersedia</span>' +
          '</div>' +
          '<div class="field-hint">Belum ada batch dengan stok. Lakukan penerimaan dulu.</div>' +
        '</div>';
    } else {
      html += '' +
        '<div class="field">' +
          '<label class="field-label">Batch yang Diambil <span class="required">*</span></label>' +
          '<div id="batch-selector-wrap"></div>' +
          '<div class="field-hint">Ketuk untuk memilih batch. Rekomendasi FEFO ditandai ⭐</div>' +
        '</div>';
    }
    html += '</div>';

    return html;
  },

  _renderBmhpFields(item) {
    const needED = String(item.Wajib_ED) === 'Ya';
    if (!needED) return '';
    return '' +
      '<div class="field">' +
        '<label class="field-label">Exp. Date <span class="required">*</span></label>' +
        '<input type="date" class="input" id="f-ed">' +
        '<div class="field-hint">Item ini wajib menyertakan tanggal kedaluwarsa.</div>' +
      '</div>';
  },

  async _submit() {
    if (this._submitting) return;
    this._submitting = true;

    const item = this.selectedItem;
    if (!item) { this._submitting = false; return; }
    const group = this.selectedGroup;
    const idField = group === 'obat' ? 'ID_Obat' : group === 'bmhp' ? 'ID_BMHP' : 'ID_ATK';

    FormError.clearAll(document);

    const tipe = U.$('#f-tipe').value;
    const qtyEl = U.$('#f-qty');
    const qty = Number(qtyEl.value);

    if (!qty || qty <= 0) {
      FormError.set(qtyEl, 'Qty harus lebih dari 0');
      this._submitting = false;
      return;
    }

    const sumber = U.$('#f-sumber') ? U.$('#f-sumber').value : '';
    const dok = U.$('#f-dok').value.trim();
    const ket = U.$('#f-ket').value.trim();

    const payload = {
      id_barang: item[idField],
      tipe_mutasi: tipe,
      qty: qty,
      no_dokumen: dok,
      keterangan: ket
    };

    if (tipe === 'Masuk') {
      payload.sumber_dana = sumber;
      const supEl = U.$('#f-supplier');
      const sup = supEl ? supEl.value : '';
      if (!sup) { FormError.set(supEl, 'Supplier wajib dipilih'); this._submitting = false; return; }
      payload.id_supplier = sup;
    } else {
      const unitEl = U.$('#f-unit');
      const unit = unitEl ? unitEl.value : '';
      if (!unit) { FormError.set(unitEl, 'Unit tujuan wajib dipilih'); this._submitting = false; return; }
      payload.id_unit = unit;
    }

    if (group === 'obat') {
      if (tipe === 'Masuk') {
        const batchEl = U.$('#f-batch');
        const edEl = U.$('#f-ed');
        const batch = batchEl.value.trim();
        const ed = edEl.value;
        if (!batch) { FormError.set(batchEl, 'No. Batch wajib diisi'); this._submitting = false; return; }
        if (!ed) { FormError.set(edEl, 'Exp. Date wajib diisi'); this._submitting = false; return; }
        payload.no_batch = batch;
        payload.exp_date = ed;
        const vvmEl = U.$('#f-vvm');
        if (vvmEl) {
          if (!vvmEl.value) { FormError.set(vvmEl, 'Status VVM wajib dipilih'); this._submitting = false; return; }
          payload.status_vvm = vvmEl.value;
        }
      } else {
        const selectedBatch = BatchSelector.getValue();
        if (!selectedBatch) {
          const trigger = U.$('#batch-trigger');
          if (trigger) {
            trigger.classList.add('error');
            FormError.set(trigger, 'Batch wajib dipilih');
          }
          this._submitting = false;
          return;
        }
        payload.no_batch = selectedBatch;
      }
    } else if (group === 'bmhp') {
      const edEl = U.$('#f-ed');
      if (edEl) {
        if (!edEl.value) { FormError.set(edEl, 'Exp. Date wajib diisi'); this._submitting = false; return; }
        payload.exp_date = edEl.value;
      }
    }

    const btn = U.$('#btn-submit');
    Btn.setLoading(btn, 'Menyimpan...');

    try {
      const res = await Api.simpanTransaksi(payload);
      U.vibrate([50, 50, 50]);
      U.beepSuccess();
      const isPending = res.data && res.data.status_approval === 'Pending';
      Toast.success('Berhasil: ' + res.data.id_transaksi + (isPending ? ' (pending)' : ''));

      this.selectedItem = null;
      this.availableBatches = [];
      this.stockInfo = { total_stok: 0, batches: [], is_obat: false };
      BatchSelector.reset();
      this._renderFormArea();
    } catch (err) {
      Toast.error('Gagal: ' + err.message);

      if (err.code === 'STOK_KURANG' || err.code === 'STOK_BATCH_KURANG') {
        const isApprover = ['SuperAdmin','Apoteker'].indexOf(this.session.role) !== -1;
        const prompt = err.message + '\n\n' +
          (isApprover ? 'Lanjutkan sebagai pengeluaran darurat?'
                      : 'Lanjutkan sebagai pengeluaran darurat? Butuh approval Apoteker.');

        const self = this;
        Modal.confirm('Stok Tidak Mencukupi', prompt,
          async () => {
            payload.is_emergency = true;
            const btn2 = U.$('#btn-submit');
            Btn.setLoading(btn2, 'Menyimpan...');
            try {
              const res2 = await Api.simpanTransaksi(payload);
              Toast.success('Darurat: ' + res2.data.id_transaksi);
              self.selectedItem = null;
              self.availableBatches = [];
              self.stockInfo = { total_stok: 0, batches: [], is_obat: false };
              BatchSelector.reset();
              self._renderFormArea();
            } catch (err2) {
              Toast.error('Gagal: ' + err2.message);
              Btn.stopLoading(btn2, 'Simpan', 'check');
            }
          }, 'Ya, Darurat', true,
          { icon: 'danger', subtitle: 'Tindakan ini akan tercatat di log' });
      }

      Btn.stopLoading(btn, 'Simpan', 'check');
    } finally {
      this._submitting = false;
    }
  },

  // ============================================================
  // LOGOUT
  // ============================================================
  async logout() {
    try { await Api.logout(); } catch (e) { /* silent */ }
    Store.clearSession();
    Store.clearMaster();
    this.session = null;
    this.master = null;
    this.selectedItem = null;
    this.availableBatches = [];
    this.stockInfo = { total_stok: 0, batches: [], is_obat: false };
    Toast.info('Anda telah keluar.');
    this.showLogin();
  }
};

window.addEventListener('DOMContentLoaded', () => {
  dbg('DOM ready, boot ScanApp');
  ScanApp.init().catch(err => {
    dbgErr('ScanApp init fatal:', err);
    const splash = document.getElementById('boot-splash');
    if (splash) splash.classList.add('hide');
    Toast.error('Gagal memuat aplikasi: ' + err.message);
  });
  dbg('[SCAN] v' + CONFIG.APP_VERSION + ' booted');
});
</script>
</body>
</html>
