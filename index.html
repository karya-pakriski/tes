                '</td>' +
              '</tr>'
            ).join('') +
          '</tbody>' +
        '</table>' +
      '</div></div>';
  },

  _attachHandlers(container) {
    U.$$('[data-approve]', container).forEach(btn => {
      btn.addEventListener('click', () =>
        this._handleApprove(btn.dataset.approve, 'Approved', container, btn));
    });
    U.$$('[data-reject]', container).forEach(btn => {
      btn.addEventListener('click', () =>
        this._handleApprove(btn.dataset.reject, 'Rejected', container, btn));
    });
  },

  _handleApprove(idTrx, keputusan, container, triggerBtn) {
    const isApprove = keputusan === 'Approved';
    const self = this;
    Modal.open({
      title: isApprove ? 'Setujui Transaksi' : 'Tolak Transaksi',
      subtitle: isApprove ? 'Stok akan langsung berkurang' : 'Transaksi dibatalkan',
      icon: isApprove ? 'success' : 'danger',
      body: '<p style="font-size:var(--fs-md);line-height:1.6;color:var(--text)">' +
        'Yakin ingin ' + (isApprove ? 'menyetujui' : 'menolak') +
        ' transaksi <strong style="font-family:ui-monospace,monospace">' +
        U.escapeHtml(idTrx) + '</strong>?</p>',
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        {
          label: isApprove ? 'Ya, Setujui' : 'Ya, Tolak',
          class: isApprove ? 'btn-primary' : 'btn-danger',
          close: false,
          icon: isApprove ? 'check' : 'x',
          onClick: async (btn) => {
            Btn.setLoading(btn, isApprove ? 'Menyetujui...' : 'Menolak...');
            try {
              await Api.approveTransaksi(idTrx, keputusan);
              Modal.close();
              Toast.success('Transaksi ' + idTrx + ' telah di-' + keputusan);
              AdminApp._updateBadges();
              await self.render(container, ++AdminApp._routeRenderId);
            } catch (err) {
              Toast.error('Gagal: ' + err.message);
              Btn.stopLoading(btn, isApprove ? 'Ya, Setujui' : 'Ya, Tolak');
            }
          }
        }
      ]
    });
  }
};

/* ============================================================
   PAGE: OPNAME
   ============================================================ */
const PageOpname = {
  _entries: {},
  _submitting: false,
  _filter: '',
  _search: '',

  async render(container, renderId) {
    this._entries = {};
    this._filter = '';
    this._search = '';

    if (!AdminApp.master) {
      container.innerHTML = Helper.loader('Memuat data master...');
      const self = this;
      AdminApp.onMasterLoaded(() => {
        if (renderId !== AdminApp._routeRenderId) return;
        self.render(container, renderId);
      });
      return;
    }

    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title">Stock Opname</div>' +
          '<div class="page-subtitle">Sinkronisasi stok fisik dengan sistem</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          '<button class="btn btn-primary" id="btn-submit-opname" disabled>' +
            U.icon('check', 16) + ' Simpan Opname (0)' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="card card-tight" style="margin-bottom:14px">' +
        '<div class="field-row">' +
          '<div class="field" style="margin-bottom:0">' +
            '<input type="text" class="input" id="opname-search" ' +
              'placeholder="Cari nama atau kode...">' +
          '</div>' +
          '<div class="field" style="margin-bottom:0">' +
            '<select class="select" id="opname-filter">' +
              '<option value="">Semua Jenis</option>' +
              '<option value="obat">Hanya Obat</option>' +
              '<option value="bmhp">Hanya BMHP</option>' +
              '<option value="atk">Hanya ATK</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card" style="padding:0">' +
        '<div class="text-muted" style="font-size:12px;padding:14px 18px;' +
          'border-bottom:1px solid var(--border)">' +
          'Masukkan stok fisik yang Anda hitung. Baris yang berbeda akan disorot. ' +
          'Sistem menghitung selisih otomatis saat disimpan.' +
        '</div>' +
        '<div id="opname-table-container"></div>' +
      '</div>';

    U.$('#btn-submit-opname').addEventListener('click', () => this._submit(container));
    U.$('#opname-search').addEventListener('input', U.debounce(() => {
      this._search = U.$('#opname-search').value;
      this._renderTable();
    }, 200));
    U.$('#opname-filter').addEventListener('change', () => {
      this._filter = U.$('#opname-filter').value;
      this._renderTable();
    });

    CS.enhanceAll(container);
    this._renderTable();
  },

  _renderTable() {
    const master = AdminApp.master || {};
    const items = [];
    const search = (this._search || '').toLowerCase().trim();
    const filter = this._filter;

    if (filter !== 'bmhp' && filter !== 'atk') {
      (master.obat || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        items.push({ id: o.ID_Obat, nama: o.Nama_Obat, tipe: 'Obat',
                     satuan: o.Satuan, rak: o.Lokasi_Rak });
      });
    }
    if (filter !== 'obat' && filter !== 'atk') {
      (master.bmhp || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        items.push({ id: o.ID_BMHP, nama: o.Nama_Barang, tipe: 'BMHP',
                     satuan: o.Satuan, rak: o.Lokasi_Rak });
      });
    }
    if (filter !== 'obat' && filter !== 'bmhp') {
      (master.atk || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        items.push({ id: o.ID_ATK, nama: o.Nama_Barang, tipe: 'ATK',
                     satuan: o.Satuan, rak: o.Lokasi_Rak });
      });
    }

    const filtered = search
      ? items.filter(it => it.nama.toLowerCase().indexOf(search) !== -1 ||
                            it.id.toLowerCase().indexOf(search) !== -1)
      : items;

    const target = U.$('#opname-table-container');
    if (filtered.length === 0) {
      target.innerHTML = Helper.emptyState('Tidak ada item', '', 'package');
      return;
    }

    target.innerHTML = '' +
      '<div class="table-scroll">' +
        '<table class="data-table">' +
          '<thead><tr>' +
            '<th>Kode</th><th>Nama</th><th>Rak</th>' +
            '<th class="num">Stok Fisik</th><th>Status</th>' +
          '</tr></thead>' +
          '<tbody>' +
            filtered.slice(0, 500).map(it =>
              '<tr data-id="' + U.escapeHtml(it.id) + '">' +
                '<td class="mono">' + U.escapeHtml(it.id) + '</td>' +
                '<td>' +
                  '<div style="font-weight:600">' + U.escapeHtml(it.nama) + '</div>' +
                  '<div class="text-muted" style="font-size:11px">' +
                    U.escapeHtml(it.satuan || '-') + ' · ' + it.tipe +
                  '</div>' +
                '</td>' +
                '<td class="mono">' + U.escapeHtml(it.rak || '-') + '</td>' +
                '<td class="num">' +
                  '<input type="number" class="opname-input" min="0" step="1" ' +
                    'inputmode="numeric" placeholder="—" ' +
                    'data-barang="' + U.escapeHtml(it.id) + '">' +
                '</td>' +
                '<td><span class="text-muted" style="font-size:12px">—</span></td>' +
              '</tr>'
            ).join('') +
          '</tbody>' +
        '</table>' +
      '</div>';

    U.$$('.opname-input', target).forEach(input => {
      if (this._entries[input.dataset.barang] !== undefined) {
        input.value = this._entries[input.dataset.barang];
        input.classList.add('changed');
        const row = input.closest('tr');
        const statusEl = row.querySelector('td:last-child span');
        statusEl.textContent = '✓ akan disimpan';
        statusEl.className = 'text-success';
      }
      input.addEventListener('input', () => {
        const id = input.dataset.barang;
        const val = input.value.trim();
        const row = input.closest('tr');
        const statusEl = row.querySelector('td:last-child span');
        if (val === '' || isNaN(Number(val)) || Number(val) < 0) {
          input.classList.remove('changed');
          statusEl.textContent = '—';
          statusEl.className = 'text-muted';
          delete this._entries[id];
        } else {
          input.classList.add('changed');
          this._entries[id] = Number(val);
          statusEl.textContent = '✓ akan disimpan';
          statusEl.className = 'text-success';
        }
        this._updateSubmitButton();
      });
    });

    this._updateSubmitButton();
  },

  _updateSubmitButton() {
    const count = Object.keys(this._entries).length;
    const btn = U.$('#btn-submit-opname');
    if (btn) {
      btn.disabled = count === 0;
      btn.innerHTML = U.icon('check', 16) + ' Simpan Opname (' + count + ')';
    }
  },

  async _submit(container) {
    if (this._submitting) return;
    const ids = Object.keys(this._entries);
    if (ids.length === 0) {
      Toast.error('Belum ada data untuk disimpan');
      return;
    }

    const self = this;
    Modal.confirm(
      'Konfirmasi Opname',
      'Stok fisik akan dicatat untuk ' + ids.length + ' item. Sistem akan menghitung ' +
      'selisih dan membuat penyesuaian otomatis.\n\nLanjutkan?',
      async () => {
        if (self._submitting) return;
        self._submitting = true;
        const btn = U.$('#btn-submit-opname');
        Btn.setLoading(btn, 'Menyimpan...');
        const tableWrap = U.$('#opname-table-container');
        if (tableWrap) tableWrap.classList.add('busy', 'busy-plain');

        try {
          const payload = ids.map(id => ({
            id_barang: id,
            stok_fisik: self._entries[id],
            keterangan: 'Opname via aplikasi'
          }));
          const res = await Api.simpanOpnameBulk(payload);
          Toast.success(res.message || 'Opname tersimpan');
          self._entries = {};
          self.render(container, ++AdminApp._routeRenderId);
        } catch (err) {
          Toast.error('Gagal: ' + err.message);
          Btn.stopLoading(btn, 'Simpan Opname (' + ids.length + ')', 'check');
        } finally {
          if (tableWrap) tableWrap.classList.remove('busy', 'busy-plain');
          self._submitting = false;
        }
      },
      'Ya, Simpan', false,
      { icon: 'primary', subtitle: 'Tindakan ini mengubah stok sistem' }
    );
  }
};

/* ============================================================
   PAGE: KARTU STOK (v5.4.1: print fix + kolom Keterangan + filename PDF)
   ============================================================ */
const PageKartuStok = {
  _currentData: null,
  _selectedId: null,
  _selectedBulan: null,
  _selectedTahun: null,
  _searchHandler: null,
  _clickHandler: null,
  _renderId: 0,

  async render(container, renderId) {
    const now = new Date();
    this._selectedBulan = now.getMonth() + 1;
    this._selectedTahun = now.getFullYear();
    this._renderId = renderId;

    LibLoader.load('sheetjs').catch(() => {});

    container.innerHTML = '' +
      '<div class="page-header no-print">' +
        '<div class="page-header-left">' +
          '<div class="page-title">Kartu Stok</div>' +
          '<div class="page-subtitle">Riwayat mutasi barang per bulan</div>' +
        '</div>' +
      '</div>' +
      '<div class="card no-print">' +
        '<div class="field-row">' +
          '<div class="field" style="margin-bottom:0">' +
            '<label class="field-label">Barang <span class="required">*</span></label>' +
            '<div class="autocomplete-wrap">' +
              '<input type="text" class="input" id="ks-search" ' +
                'placeholder="Cari nama atau kode..." autocomplete="off">' +
              '<div class="autocomplete-list" id="ks-suggestions"></div>' +
            '</div>' +
            '<input type="hidden" id="ks-id">' +
          '</div>' +
          '<div class="field" style="margin-bottom:0">' +
            '<label class="field-label">Tahun</label>' +
            '<select class="select" id="ks-tahun">' +
              Array.from({ length: 5 }, (_, i) => now.getFullYear() - 2 + i).map(y =>
                '<option value="' + y + '"' +
                  (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>'
              ).join('') +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-2 mt-3 flex-wrap">' +
          '<button class="btn btn-primary" id="ks-load">' +
            U.icon('search', 16) + ' Tampilkan' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div id="ks-nav"></div>' +
      '<div id="ks-result">' +
        Helper.emptyState('Belum ada data',
          'Pilih barang dan bulan untuk menampilkan kartu stok.', 'file') +
      '</div>';

    this._attachSearch(container);
    CS.enhanceAll(container);

    U.$('#ks-load').addEventListener('click', () => {
      const id = U.$('#ks-id').value;
      if (!id) { Toast.error('Pilih barang dulu'); return; }
      this._selectedId = id;
      this._selectedTahun = Number(U.$('#ks-tahun').value) || this._selectedTahun;
      this._loadData();
    });
  },

  _attachSearch(container) {
    const searchEl = U.$('#ks-search');
    const suggestEl = U.$('#ks-suggestions');
    const idEl = U.$('#ks-id');
    if (!searchEl) return;

    if (this._searchHandler) searchEl.removeEventListener('input', this._searchHandler);

    this._searchHandler = U.debounce(() => {
      const q = searchEl.value.trim().toLowerCase();
      if (!q) { suggestEl.innerHTML = ''; return; }

      suggestEl.innerHTML = '<div class="autocomplete-empty">' +
        Helper.loaderSm('Mencari...') + '</div>';

      setTimeout(() => {
        const master = AdminApp.master || {};
        const items = [];
        (master.obat || []).forEach(o => {
          if (o.Status_Aktif === 'Nonaktif') return;
          if (o.Nama_Obat.toLowerCase().indexOf(q) !== -1 ||
              o.ID_Obat.toLowerCase().indexOf(q) !== -1) {
            items.push({ id: o.ID_Obat, nama: o.Nama_Obat, tipe: 'Obat' });
          }
        });
        (master.bmhp || []).forEach(o => {
          if (o.Status_Aktif === 'Nonaktif') return;
          if (o.Nama_Barang.toLowerCase().indexOf(q) !== -1 ||
              o.ID_BMHP.toLowerCase().indexOf(q) !== -1) {
            items.push({ id: o.ID_BMHP, nama: o.Nama_Barang, tipe: 'BMHP' });
          }
        });
        (master.atk || []).forEach(o => {
          if (o.Status_Aktif === 'Nonaktif') return;
          if (o.Nama_Barang.toLowerCase().indexOf(q) !== -1 ||
              o.ID_ATK.toLowerCase().indexOf(q) !== -1) {
            items.push({ id: o.ID_ATK, nama: o.Nama_Barang, tipe: 'ATK' });
          }
        });

        if (items.length === 0) {
          suggestEl.innerHTML = '<div class="autocomplete-empty">Tidak ditemukan</div>';
          return;
        }
        suggestEl.innerHTML = items.slice(0, 10).map(it =>
          '<button type="button" class="autocomplete-item" ' +
            'data-id="' + U.escapeHtml(it.id) + '" ' +
            'data-nama="' + U.escapeHtml(it.nama) + '">' +
            '<span class="ac-id">' + U.escapeHtml(it.id) + '</span>' +
            '<span class="ac-name">' + U.escapeHtml(it.nama) + '</span>' +
            '<span class="badge badge-muted">' + it.tipe + '</span>' +
          '</button>'
        ).join('');

        U.$$('.autocomplete-item', suggestEl).forEach(el => {
          el.addEventListener('click', () => {
            idEl.value = el.dataset.id;
            searchEl.value = el.dataset.nama + ' (' + el.dataset.id + ')';
            suggestEl.innerHTML = '';
          });
        });
      }, 120);
    }, 220);

    searchEl.addEventListener('input', this._searchHandler);

    if (this._clickHandler) container.removeEventListener('click', this._clickHandler);
    this._clickHandler = (e) => {
      if (!e.target.closest('#ks-suggestions') && e.target !== searchEl) {
        suggestEl.innerHTML = '';
      }
    };
    container.addEventListener('click', this._clickHandler);
  },

  _renderMonthNav() {
    const navEl = U.$('#ks-nav');
    if (!navEl || !this._selectedId) {
      if (navEl) navEl.innerHTML = '';
      return;
    }
    const nama = U.formatMonthName(this._selectedBulan);
    navEl.innerHTML =
      '<div class="month-nav no-print">' +
        '<button id="ks-prev" aria-label="Bulan sebelumnya">' +
          U.icon('chevronLeft', 18) +
        '</button>' +
        '<div class="current">' + nama + ' ' + this._selectedTahun + '</div>' +
        '<button id="ks-next" aria-label="Bulan berikutnya">' +
          U.icon('chevronRight', 18) +
        '</button>' +
      '</div>';

    U.$('#ks-prev').addEventListener('click', () => {
      let b = this._selectedBulan - 1, t = this._selectedTahun;
      if (b < 1) { b = 12; t--; }
      this._selectedBulan = b;
      this._selectedTahun = t;
      this._loadData();
    });
    U.$('#ks-next').addEventListener('click', () => {
      let b = this._selectedBulan + 1, t = this._selectedTahun;
      if (b > 12) { b = 1; t++; }
      this._selectedBulan = b;
      this._selectedTahun = t;
      this._loadData();
    });
  },

  async _loadData() {
    if (!this._selectedId) return;
    const myRenderId = this._renderId;
    const btn = U.$('#ks-load');
    Btn.setLoading(btn, 'Memuat...');
    const resultEl = U.$('#ks-result');
    if (resultEl) resultEl.innerHTML = Helper.loader('Memuat kartu stok...');

    try {
      const res = await Api.getKartuStokBulanan(
        this._selectedId, this._selectedBulan, this._selectedTahun);
      if (myRenderId !== AdminApp._routeRenderId) return;
      if (!U.$('#ks-result')) return;
      this._currentData = res.data;
      this._renderMonthNav();
      this._renderPreview(res.data);
    } catch (err) {
      if (myRenderId !== AdminApp._routeRenderId) return;
      if (!U.$('#ks-result')) return;
      Toast.error('Gagal memuat: ' + err.message);
      U.$('#ks-result').innerHTML = Helper.emptyState(
        'Gagal memuat data', err.message, 'alertCircle');
    } finally {
      Btn.stopLoading(btn, 'Tampilkan', 'search');
    }
  },

  _renderPreview(data) {
    const target = U.$('#ks-result');
    if (!target) return;

    const bulanNama = U.formatMonthName(data.bulan).toUpperCase();
    const logo = Store.getLogo();

    let running = data.saldo_awal;

        .indexOf(r.Tipe_Mutasi) !== -1;
      const qty = Number(r.Qty) || 0;
      if (isMasuk) running += qty;
      else if (isKeluar) running -= qty;
      const d = new Date(r.Timestamp);
      const tgl = isNaN(d.getTime()) ? '-' :
        String(d.getDate()).padStart(2, '0') + '/' +
        String(d.getMonth() + 1).padStart(2, '0');
      const ket = r.Keterangan || '';
      return '<tr>' +
        '<td>' + tgl + '</td>' +
        '<td class="mono">' +

        '<td class="num">' + (isKeluar ? qty : '') + '</td>' +
        '<td class="num">' + running + '</td>' +

            '<div class="label">Kode</div><div>:</div><div>' +

              '<th style="width:15%">No Trx</th>' +
              '<th style="width:10%">Batch</th>' +
              '<th style="width:8%">ED</th>' +
              '<th style="width:7%">Masuk</th>' +
              '<th style="width:7%">Keluar</th>' +
              '<th style="width:7%">Sisa</th>' +
              '<th style="width:22%">Keterangan</th>' +
              '<th style="width:18%">Paraf</th>' +
            '</tr></thead>' +
            '<tbody>' +
              '<tr>' +
                '<td colspan="7" style="text-align:right"><strong>Saldo Awal</strong></td>' +

  async _downloadXLSX(data, btn) {
    Btn.setLoading(btn, 'Menyiapkan...');
    try {
      const XLSX = await LibLoader.load('sheetjs');
      const wb = XLSX.utils.book_new();

      const info = [
        ['KARTU STOK — INFO BARANG'], [''],
        ['Nama', data.nama], ['Kode', data.id_barang],
        ['Satuan', data.satuan], ['Rak', data.rak],
        ['Bulan', U.formatMonthName(data.bulan) + ' ' + data.tahun], [''],
        ['Saldo Awal', data.saldo_awal],
        ['Total Masuk', data.total_in],
        ['Total Keluar', data.total_out],
        ['Saldo Akhir', data.saldo_akhir],
        [''], ['Dicetak', U.formatDateTime(new Date())]
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'Info');

      let saldo = data.saldo_awal;
      const riwayat = [[
        'Tanggal', 'ID Transaksi', 'Tipe', 'Qty', 'Batch', 'ED',
        'Masuk', 'Keluar', 'Saldo', 'Keterangan'
      ]];
      (data.riwayat_mentah || []).forEach(r => {
        const isMasuk = r.Tipe_Mutasi === 'Masuk';
        const isKeluar = ['Keluar', 'Karantina', 'Retur_Supplier', 'Rusak']
          .indexOf(r.Tipe_Mutasi) !== -1;
        const qty = Number(r.Qty) || 0;
        if (isMasuk) saldo += qty;
        else if (isKeluar) saldo -= qty;
        riwayat.push([
          U.formatDate(r.Timestamp), r.ID_Transaksi, r.Tipe_Mutasi, qty,
          r.No_Batch || '', r.Exp_Date ? U.formatDate(r.Exp_Date) : '',
          isMasuk ? qty : '', isKeluar ? qty : '', saldo, r.Keterangan || ''
        ]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(riwayat), 'Riwayat');

      XLSX.writeFile(wb, 'KartuStok_' + data.id_barang + '_' + data.tahun + '-' +
                    String(data.bulan).padStart(2, '0') + '.xlsx');
      Toast.success('File XLSX berhasil diunduh');
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
    } finally {
      Btn.stopLoading(btn, 'Unduh XLSX', 'download');
    }
  }
};

const PageCetakQR = {
  _selected: null,

  _qrCache: null,

              '<select class="select" id="qr-filter-rak">' +
                '<option value="">Semua Rak</option>' +

              '<input class="input" id="qr-filter-search" placeholder="Nama atau kode...">' +
            '</div>' +
            '<div class="flex gap-2 flex-wrap mt-3">' +
              '<button class="btn btn-secondary btn-sm" id="qr-select-all">Pilih Semua</button>' +
              '<button class="btn btn-secondary btn-sm" id="qr-select-none">Kosongkan</button>' +
              '<button class="btn btn-secondary btn-sm" id="qr-select-invert">Invert</button>' +
            '</div>' +
          '</div>' +
          '<div class="card card-tight" style="padding:0">' +
            '<div class="qr-checkbox-list" id="qr-checkbox-list">' +
              Helper.loaderSm('Memuat daftar...') +
            '</div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="card card-tight">' +
            '<div class="card-title" style="margin-bottom:14px">' +
              '<span>Preview</span>' +
              '<span class="badge badge-primary" id="qr-count-badge">0 label</span>' +
            '</div>' +
            '<div class="flex gap-3 flex-wrap mb-3" style="font-size:13px">' +
              '<label style="display:flex;align-items:center;gap:6px;cursor:pointer">' +
                '<input type="radio" name="qr-mode" value="mode-24" checked> 24 label (3×8)' +
              '</label>' +
              '<label style="display:flex;align-items:center;gap:6px;cursor:pointer">' +
                '<input type="radio" name="qr-mode" value="mode-40"> 40 label (4×10)' +
              '</label>' +
            '</div>' +
            '<div class="flex gap-2 flex-wrap">' +
              '<button class="btn btn-primary" id="qr-print" disabled>' +
                U.icon('printer', 16) + ' Cetak' +
              '</button>' +
              '<button class="btn btn-secondary" id="qr-download" disabled>' +
                U.icon('download', 16) + ' Unduh HTML' +
              '</button>' +
            '</div>' +
          '</div>' +
          '<div class="card card-tight" style="padding:0">' +
            '<div class="qr-preview-area" id="qr-preview">' +
              Helper.emptyState('Belum ada label dipilih',
                'Pilih item di panel kiri untuk melihat preview.', 'qr') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>';

    this._populateRakFilter();
    this._attachListeners(container);
    CS.enhanceAll(container);
    this._renderCheckboxList(container);
  },

  _populateRakFilter() {
    const master = AdminApp.master || {};
    const raks = master.rak || [];
    const sel = U.$('#qr-filter-rak');
    if (!sel) return;
    raks.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.ID_Rak;
      opt.textContent = r.Nama_Rak + ' (' + r.ID_Rak + ')';
      sel.appendChild(opt);
    });
    if (sel._csRender) sel._csRender();
  },

  _attachListeners(container) {
    U.$('#qr-filter-tipe').addEventListener('change', () => this._renderCheckboxList(container));
    U.$('#qr-filter-rak').addEventListener('change', () => this._renderCheckboxList(container));
    U.$('#qr-filter-search').addEventListener('input', U.debounce(() => {
      this._renderCheckboxList(container);
    }, 200));

    U.$('#qr-select-all').addEventListener('click', () => {
      const items = this._getFilteredItems();
      if (items.length > 100) {
        Toast.warning('Maksimal 100 label per cetak. Hanya item pertama yang dipilih.');
      }
      this._selected.clear();
      items.slice(0, 100).forEach(it => this._selected.add(it.id));
      this._renderCheckboxList(container);
      this._refreshAfterSelection();
    });

    U.$('#qr-select-none').addEventListener('click', () => {
      this._selected.clear();
      this._renderCheckboxList(container);
      this._refreshAfterSelection();
    });

    U.$('#qr-select-invert').addEventListener('click', () => {
      const items = this._getFilteredItems();
      const next = new Set();
      items.forEach(it => {
        if (!this._selected.has(it.id)) next.add(it.id);
      });
      this._selected = next;
      this._renderCheckboxList(container);
      this._refreshAfterSelection();
    });

    U.$('#qr-print').addEventListener('click', () => window.print());
    U.$('#qr-download').addEventListener('click', (e) =>
      this._downloadHTML(e.currentTarget));

    U.$$('input[name="qr-mode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        this._mode = e.target.value;
        this._renderPreview();
      });
    });
  },

  _getFilteredItems() {
    const master = AdminApp.master || {};
    const tipeEl = U.$('#qr-filter-tipe');
    const rakEl = U.$('#qr-filter-rak');
    const searchEl = U.$('#qr-filter-search');
    const tipe = tipeEl ? tipeEl.value : '';
    const rak = rakEl ? rakEl.value : '';
    const q = (searchEl ? searchEl.value : '').toLowerCase().trim();

    const items = [];
    if (tipe !== 'bmhp' && tipe !== 'atk') {
      (master.obat || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (rak && o.Lokasi_Rak !== rak) return;
        if (q && o.Nama_Obat.toLowerCase().indexOf(q) === -1 &&
            o.ID_Obat.toLowerCase().indexOf(q) === -1) return;
        items.push({ id: o.ID_Obat, nama: o.Nama_Obat, rak: o.Lokasi_Rak,
                     satuan: o.Satuan, tipe: 'Obat' });
      });
    }
    if (tipe !== 'obat' && tipe !== 'atk') {
      (master.bmhp || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (rak && o.Lokasi_Rak !== rak) return;
        if (q && o.Nama_Barang.toLowerCase().indexOf(q) === -1 &&
            o.ID_BMHP.toLowerCase().indexOf(q) === -1) return;
        items.push({ id: o.ID_BMHP, nama: o.Nama_Barang, rak: o.Lokasi_Rak,
                     satuan: o.Satuan, tipe: 'BMHP' });
      });
    }
    if (tipe !== 'obat' && tipe !== 'bmhp') {
      (master.atk || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (rak && o.Lokasi_Rak !== rak) return;
        if (q && o.Nama_Barang.toLowerCase().indexOf(q) === -1 &&
            o.ID_ATK.toLowerCase().indexOf(q) === -1) return;
        items.push({ id: o.ID_ATK, nama: o.Nama_Barang, rak: o.Lokasi_Rak,
                     satuan: o.Satuan, tipe: 'ATK' });
      });
    }
    items.sort((a, b) => a.id.localeCompare(b.id));
    return items;
  },

  _renderCheckboxList(container) {
    const items = this._getFilteredItems();
    const list = U.$('#qr-checkbox-list');
    if (!list) return;

    if (items.length === 0) {
      list.innerHTML = Helper.emptyState('Tidak ada item', '', 'package');
      return;
    }

    list.innerHTML = items.map(it => {
      const checked = this._selected.has(it.id);
      return '<label class="qr-check-item' + (checked ? ' checked' : '') + '" ' +
          'data-id="' + U.escapeHtml(it.id) + '">' +
          '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
          '<div class="info">' +
            '<div class="id">' + U.escapeHtml(it.id) + '</div>' +
            '<div class="name">' + U.escapeHtml(it.nama) + '</div>' +
            '<div class="meta">' + U.escapeHtml(it.rak || '-') + ' · ' +
              U.escapeHtml(it.satuan || '-') + ' · ' + it.tipe + '</div>' +
          '</div>' +
        '</label>';
    }).join('');

    const self = this;
    U.$$('.qr-check-item', list).forEach(el => {
      const cb = el.querySelector('input[type="checkbox"]');
      el.addEventListener('click', (e) => {
        if (e.target.tagName === 'INPUT') return;
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event('change'));
      });
      cb.addEventListener('change', () => {
        const id = el.dataset.id;
        if (cb.checked) self._selected.add(id);
        else self._selected.delete(id);
        el.classList.toggle('checked', cb.checked);
        self._refreshAfterSelection();
      });
    });
  },

  _refreshAfterSelection() {
    const badge = U.$('#qr-count-badge');
    const printBtn = U.$('#qr-print');
    const dlBtn = U.$('#qr-download');
    if (badge) badge.textContent = this._selected.size + ' label';
    if (printBtn) printBtn.disabled = this._selected.size === 0;
    if (dlBtn) dlBtn.disabled = this._selected.size === 0;
    this._renderPreview();
  },

  async _renderPreview() {
    if (this._rendering) return;
    this._rendering = true;

    try {
      const preview = U.$('#qr-preview');
      if (!preview) return;

      const selectedIds = Array.from(this._selected);

      if (selectedIds.length === 0) {
        preview.innerHTML = Helper.emptyState(
          'Belum ada label dipilih',
          'Pilih item di panel kiri untuk melihat preview.', 'qr');
        return;
      }

      const master = AdminApp.master || {};
      const allItems = {};
      (master.obat || []).forEach(o => {
        allItems[o.ID_Obat] = { id: o.ID_Obat, nama: o.Nama_Obat, rak: o.Lokasi_Rak, satuan: o.Satuan };
      });
      (master.bmhp || []).forEach(o => {
        allItems[o.ID_BMHP] = { id: o.ID_BMHP, nama: o.Nama_Barang, rak: o.Lokasi_Rak, satuan: o.Satuan };
      });
      (master.atk || []).forEach(o => {
        allItems[o.ID_ATK] = { id: o.ID_ATK, nama: o.Nama_Barang, rak: o.Lokasi_Rak, satuan: o.Satuan };
      });

      const items = selectedIds.map(id => allItems[id]).filter(Boolean);

      preview.innerHTML =
        '<div class="inline-loading">' +
          '<span class="spinner"></span>' +
          '<span id="qr-progress">Menyiapkan QR... 0/' + items.length + '</span>' +
        '</div>';

      const toGenerate = items.filter(it => !this._qrCache[it.id]);
      const chunkSize = 6;

      for (let i = 0; i < toGenerate.length; i += chunkSize) {
        const chunk = toGenerate.slice(i, i + chunkSize);
        await Promise.all(chunk.map(it =>
          this._generateQR(it.id, 220).then(url => { this._qrCache[it.id] = url; })
        ));
        const done = Math.min(i + chunkSize, toGenerate.length);
        const progressEl = U.$('#qr-progress');
        if (progressEl) {
          progressEl.textContent = 'Menyiapkan QR... ' +
            (items.length - toGenerate.length + done) + '/' + items.length;
        }
        await new Promise(r => setTimeout(r, 0));
      }

      if (!U.$('#qr-preview')) return;

      const perPage = this._mode === 'mode-24' ? 24 : 40;
      const pages = Math.ceil(items.length / perPage);
      let html = '';
      for (let p = 0; p < pages; p++) {
        const pageItems = items.slice(p * perPage, (p + 1) * perPage);
        html += '<div class="qr-page ' + this._mode + '">';
        pageItems.forEach(it => {
          const qrUrl = this._qrCache[it.id];
          html += '<div class="qr-label ' + this._mode + '">' +
            '<div class="qr-img-wrap">' +
              '<img src="' + qrUrl + '" alt="QR ' + U.escapeHtml(it.id) + '">' +
            '</div>' +
            '<div class="label-text">' +
              '<div class="label-id">' + U.escapeHtml(it.id) + '</div>' +
              '<div class="label-name">' + U.escapeHtml(it.nama) + '</div>' +
              '<div class="label-meta">' + U.escapeHtml(it.satuan || '') +
                (it.rak ? ' · ' + U.escapeHtml(it.rak) : '') + '</div>' +
            '</div>' +
          '</div>';
        });
        html += '</div>';
      }
      preview.innerHTML = html;
    } catch (err) {
      dbgErr('Render QR gagal:', err);
      const preview = U.$('#qr-preview');
      if (!preview) return;

      const isLibFail = (err && err.message && err.message.indexOf('Library') !== -1);
      const fallbackBtn = isLibFail
        ? '<button class="btn btn-secondary" id="qr-print-nofallback">' +
          U.icon('printer', 16) + ' Cetak Tanpa QR' +
          '</button>'
        : '';

      preview.innerHTML =
        '<div class="empty-state" style="padding:40px">' +
          U.icon('alertCircle', 48) +
          '<h3>Gagal generate QR</h3>' +
          '<p style="margin-bottom:16px;max-width:400px">' +
            U.escapeHtml(err.message || 'Terjadi kesalahan tidak dikenal') +
          '</p>' +
          '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
            '<button class="btn btn-primary" id="qr-retry">' +
              U.icon('refresh', 16) + ' Coba Lagi' +
            '</button>' +
            fallbackBtn +
          '</div>' +
        '</div>';

      const retryBtn = U.$('#qr-retry');
      if (retryBtn) {
        retryBtn.addEventListener('click', () => {
          // v5.4.1: pakai reset() untuk clear cache + cooldown
          if (LibLoader.reset) LibLoader.reset('qrcode');
          else {
            LibLoader._cache = {};
            if (LibLoader._cleanupOldScripts) LibLoader._cleanupOldScripts('qrcode');
          }
          this._qrCache = {};
          this._renderPreview();
        });
      }

      const noFallbackBtn = U.$('#qr-print-nofallback');
      if (noFallbackBtn) {
        noFallbackBtn.addEventListener('click', () => {
          this._renderPreviewWithoutQR(Array.from(this._selected));
        });
      }
    } finally {
      this._rendering = false;
    }
  },

  _renderPreviewWithoutQR(selectedIds) {
    const preview = U.$('#qr-preview');
    if (!preview) return;

    const master = AdminApp.master || {};
    const allItems = {};
    (master.obat || []).forEach(o => {
      allItems[o.ID_Obat] = { id: o.ID_Obat, nama: o.Nama_Obat,
                              rak: o.Lokasi_Rak, satuan: o.Satuan };
    });
    (master.bmhp || []).forEach(o => {
      allItems[o.ID_BMHP] = { id: o.ID_BMHP, nama: o.Nama_Barang,
                              rak: o.Lokasi_Rak, satuan: o.Satuan };
    });
    (master.atk || []).forEach(o => {
      allItems[o.ID_ATK] = { id: o.ID_ATK, nama: o.Nama_Barang,
                             rak: o.Lokasi_Rak, satuan: o.Satuan };
    });

    const items = selectedIds.map(id => allItems[id]).filter(Boolean);
    const perPage = this._mode === 'mode-24' ? 24 : 40;
    const pages = Math.ceil(items.length / perPage);
    let html = '';

    for (let p = 0; p < pages; p++) {
      const pageItems = items.slice(p * perPage, (p + 1) * perPage);
      html += '<div class="qr-page ' + this._mode + '">';
      pageItems.forEach(it => {
        html += '<div class="qr-label ' + this._mode + '">' +
          '<div class="qr-img-wrap" style="background:#f0f0f0;' +
            'display:flex;align-items:center;justify-content:center;' +
            'font-size:8pt;color:#999;font-weight:700">NO&nbsp;QR</div>' +
          '<div class="label-text">' +
            '<div class="label-id" style="font-size:12pt">' +
              U.escapeHtml(it.id) + '</div>' +
            '<div class="label-name" style="font-size:8pt">' +
              U.escapeHtml(it.nama) + '</div>' +
            '<div class="label-meta">' +
              U.escapeHtml(it.satuan || '') +
              (it.rak ? ' · ' + U.escapeHtml(it.rak) : '') +
            '</div>' +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }

    preview.innerHTML = html;
    Toast.warning('QR tidak tersedia. Label dicetak tanpa QR — kode barang tetap terbaca.');
  },

  _generateQR(text, size) {
    return LibLoader.load('qrcode').then(lib => {
      return new Promise((resolve, reject) => {
        try {
          const opts = {
            width: size || 220,
            margin: 1,
            errorCorrectionLevel: 'M',
            color: { dark: '#000000', light: '#ffffff' }
          };
          lib.toDataURL(text, opts, function(err, url) {
            if (err) reject(new Error('QR encode gagal: ' + (err.message || err)));
            else if (!url) reject(new Error('QR kosong'));
            else resolve(url);
          });
        } catch (e) {
          reject(e);
        }
      });
    }).catch(err => {
      dbgErr('QR generate error:', err);
      const msg = (err && err.message) || String(err);
      if (msg.indexOf('Semua sumber gagal') !== -1 ||
          msg.indexOf('Semua CDN gagal') !== -1) {
        throw new Error('Library QR tidak dapat dimuat. Cek koneksi internet ' +
          'atau pastikan file shared/vendor/qrcode.min.js ada.');
      }
      throw err;
    });
  },

  _downloadHTML(btn) {
    const preview = U.$('#qr-preview');
    if (!preview) return;
    Btn.setLoading(btn, 'Menyiapkan...');
    try {
      const html = '<!DOCTYPE html><html><head><meta charset="UTF-8">' +
        '<title>QR Labels</title><style>' +
        'body{margin:0;font-family:system-ui,sans-serif;background:#f5f5f5}' +
        '.qr-page{background:white;width:210mm;min-height:297mm;padding:8mm;' +
        'margin:0 auto 12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);' +
        'display:grid;grid-template-columns:repeat(3,1fr);' +
        'grid-template-rows:repeat(8,33.9mm);gap:0;box-sizing:border-box}' +
        '.qr-page.mode-40{grid-template-columns:repeat(4,1fr);' +
        'grid-template-rows:repeat(10,25.4mm)}' +
        '.qr-label{border:0.3mm dashed #ccc;padding:2mm;display:flex;' +
        'align-items:center;gap:2mm;overflow:hidden;box-sizing:border-box}' +
        '.qr-img-wrap{width:22mm;height:22mm;flex-shrink:0;display:flex;' +
        'align-items:center;justify-content:center}' +
        '.qr-label.mode-40 .qr-img-wrap{width:18mm;height:18mm}' +
        '.qr-img-wrap img{width:100%;height:100%;image-rendering:pixelated}' +
        '.label-text{flex:1;min-width:0;line-height:1.15;overflow:hidden}' +
        '.label-id{font-size:11pt;font-weight:700;font-family:ui-monospace,monospace}' +
        '.qr-label.mode-40 .label-id{font-size:9pt}' +
        '.label-name{font-size:8pt;color:#222;display:-webkit-box;' +
        '-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}' +
        '.qr-label.mode-40 .label-name{font-size:7pt;-webkit-line-clamp:1}' +
        '.label-meta{font-size:6.5pt;color:#666;margin-top:2px}' +
        '@media print{body{background:white}.qr-page{box-shadow:none;margin:0;' +
        'page-break-after:always}.qr-page:last-child{page-break-after:auto}' +
        '@page{margin:0}}' +
        '</style></head><body>' + preview.innerHTML + '</body></html>';

      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'QR_Labels_' + new Date().toISOString().slice(0, 10) + '.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      // v5.4: delayed revoke supaya browser sempat baca blob
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      Toast.success('File HTML berhasil diunduh.');
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
    } finally {
      Btn.stopLoading(btn, 'Unduh HTML', 'download');
    }
  }
};

  async render(container, sheetName, renderId) {
    const cfg = this.CONFIG[sheetName];
    if (!cfg) {
      container.innerHTML = Helper.emptyState('Config tidak ditemukan');
      return;
    }

    if (!AdminApp.master) {
      container.innerHTML = Helper.loader('Memuat data master...');
      const self = this;
      AdminApp.onMasterLoaded(() => {
        if (renderId !== AdminApp._routeRenderId) return;
        self.render(container, sheetName, renderId);
      });
      return;
    }

    const canAdd = sheetName !== 'Ref_Petugas' || AdminApp.session.role === 'SuperAdmin';

    container.innerHTML =
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title">' + U.escapeHtml(cfg.title) + '</div>' +
          '<div class="page-subtitle">Kelola data master ' +
            U.escapeHtml(cfg.title.toLowerCase()) + '</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          (canAdd
            ? '<button class="btn btn-primary" id="btn-add">' +
                U.icon('plus', 16) + ' Tambah' +
              '</button>'
            : '') +
        '</div>' +
      '</div>' +
      '<div class="card card-tight" style="margin-bottom:14px">' +
        '<input class="input" id="master-search" placeholder="Cari...">' +
      '</div>' +
      '<div id="master-table-container">' + Helper.skeletonTable(6, 6) + '</div>';

    if (canAdd) {
      U.$('#btn-add').addEventListener('click', () =>
        this._openForm(sheetName, null, container));
    }
    U.$('#master-search').addEventListener('input', U.debounce(() => {
      this._renderTable(container, sheetName, U.$('#master-search').value);
    }, 200));

    setTimeout(() => this._renderTable(container, sheetName, ''), 0);
  },

  _renderTable(container, sheetName, query) {
    const cfg = this.CONFIG[sheetName];
    const master = AdminApp.master || {};
    let data = [];
    if (sheetName === 'Master_Obat') data = master.obat || [];
    else if (sheetName === 'Master_BMHP') data = master.bmhp || [];
    else if (sheetName === 'Master_ATK') data = master.atk || [];
    else if (sheetName === 'Ref_Supplier') data = master.supplier || [];
    else if (sheetName === 'Ref_UnitInternal') data = master.unit || [];
    else if (sheetName === 'Ref_LokasiRak') data = master.rak || [];
    else if (sheetName === 'Ref_Ruang') data = master.ruang || [];
    else if (sheetName === 'Ref_Petugas') data = master.petugas || [];

    const q = (query || '').toLowerCase().trim();
    if (q) {
      data = data.filter(item =>
        cfg.columns.some(c =>
          String(item[c.key] || '').toLowerCase().indexOf(q) !== -1));
    }

    const target = U.$('#master-table-container');
    if (!target) return;

    if (data.length === 0) {
      target.innerHTML = Helper.emptyState(
        'Tidak ada data',
        q ? 'Tidak ditemukan hasil untuk "' + q + '"' : 'Belum ada item.',
        cfg.icon
      );
      return;
    }

    target.innerHTML =
      '<div class="table-wrap"><div class="table-scroll">' +
        '<table class="data-table">' +
          '<thead><tr>' +
            cfg.columns.map(c =>
              '<th' + (c.num ? ' class="num"' : '') + '>' +
                U.escapeHtml(c.label) + '</th>'
            ).join('') +
            '<th class="col-actions">Aksi</th>' +
          '</tr></thead>' +
          '<tbody>' +
            data.map(item => {
              const tds = cfg.columns.map(c => {
                const val = item[c.key];
                let content = '';
                if (c.badge) {
                  let cls = 'badge-muted';
                  if (val === 'Aktif' || val === 'Ya') cls = 'badge-success';
                  else if (val === 'Nonaktif' || val === 'Tidak') cls = 'badge-muted';
                  else if (val === 'SuperAdmin') cls = 'badge-danger';
                  else if (val === 'Apoteker') cls = 'badge-primary';
                  else if (val === 'Gudang') cls = 'badge-warning';
                  else if (val === 'Scanner') cls = 'badge-primary';
                  else if (val === 'Bidan_Desa') cls = 'badge-warning';
                  content = '<span class="badge ' + cls + '">' +
                            U.escapeHtml(val || '-') + '</span>';
                } else if (c.rp) {
                  content = U.formatRupiah(val);
                } else if (c.num) {
                  content = U.formatNumber(val);
                } else {
                  content = U.escapeHtml(val || '-');
                }
                const cls = (c.mono ? 'mono ' : '') + (c.num ? 'num' : '');
                return '<td' + (cls ? ' class="' + cls.trim() + '"' : '') + '>' +
                       content + '</td>';
              }).join('');

              const idVal = item[cfg.idField];
              const canDelete = item.Status_Aktif !== 'Nonaktif';
              const actions =
                '<button class="btn btn-ghost btn-sm" data-action="edit" ' +
                  'data-id="' + U.escapeHtml(idVal) + '" title="Edit">' +
                  U.icon('edit', 15) + '</button>' +
                (sheetName === 'Ref_Petugas'
                  ? '<button class="btn btn-ghost btn-sm" data-action="resetpin" ' +
                      'data-id="' + U.escapeHtml(idVal) + '" title="Reset PIN">' +
                      U.icon('refresh', 15) + '</button>'
                  : '') +
                (canDelete
                  ? '<button class="btn btn-ghost btn-sm text-danger" ' +
                      'data-action="delete" data-id="' + U.escapeHtml(idVal) + '" ' +
                      'title="Nonaktifkan">' +
                      U.icon('trash', 15) + '</button>'
                  : '');

              return '<tr>' + tds + '<td class="col-actions">' + actions + '</td></tr>';
            }).join('') +
          '</tbody>' +
        '</table>' +
      '</div></div>';

    U.$$('[data-action]', target).forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const item = data.find(x => String(x[cfg.idField]) === String(id));
        if (action === 'edit') this._openForm(sheetName, item, container);
        else if (action === 'delete') this._confirmDelete(sheetName, item, container);
        else if (action === 'resetpin') this._resetPin(id, container);
      });
    });
  },

  _openForm(sheetName, item, container) {
    const cfg = this.CONFIG[sheetName];
    const isEdit = !!item;
    const master = AdminApp.master || {};
    const fields = cfg.formFields.filter(f => !(isEdit && f.addOnly));

    const fieldsHtml = fields.map(f => {
      const val = isEdit ? (item[f.key] || '') : '';
      let inputHtml = '';

      if (f.type === 'select') {
        let options = f.options || [];
        if (f.source === 'rak') options = (master.rak || []).map(r => r.ID_Rak);
        inputHtml = '<select class="select" name="' + f.key + '"' +
          (f.required ? ' required' : '') + '>' +
          '<option value="">— Pilih —</option>' +
          options.map(o => '<option value="' + U.escapeHtml(o) + '"' +
            (o === val ? ' selected' : '') + '>' + U.escapeHtml(o) + '</option>').join('') +
          '</select>';
      } else if (f.type === 'textarea') {
        inputHtml = '<textarea class="textarea" name="' + f.key + '"' +
          (f.required ? ' required' : '') + '>' + U.escapeHtml(val) + '</textarea>';
      } else {
        inputHtml = '<input type="' + f.type + '" class="input" name="' + f.key + '" ' +
          'value="' + U.escapeHtml(val) + '"' +
          (f.required ? ' required' : '') +
          (f.type === 'number' ? ' step="any"' : '') + '>';
      }

      return '<div class="field">' +
        '<label class="field-label">' + U.escapeHtml(f.label) +
          (f.required ? ' <span class="required">*</span>' : '') + '</label>' +
        inputHtml +
      '</div>';
    }).join('');

    const formHtml = '<form id="master-form" autocomplete="off">' +
      (isEdit
        ? '<div class="field">' +
            '<label class="field-label">' + U.escapeHtml(cfg.idField) + '</label>' +
            '<div class="mono" style="font-family:ui-monospace,monospace;' +
              'font-weight:600">' + U.escapeHtml(item[cfg.idField]) + '</div>' +
          '</div>'
        : '') +
      fieldsHtml +
    '</form>';

    const self = this;
    Modal.open({
      title: isEdit ? 'Edit ' + cfg.title : 'Tambah ' + cfg.title,
      icon: 'primary',
      body: formHtml,
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        {
          label: isEdit ? 'Simpan Perubahan' : 'Simpan',
          class: 'btn-primary', close: false, icon: 'check',
          onClick: async (btn) => {
            const form = U.$('#master-form');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const values = {};
            fields.forEach(f => {
              const el = form.querySelector('[name="' + f.key + '"]');
              if (!el) return;
              let v = el.value;
              if (f.type === 'number') v = Number(v) || 0;
              values[f.key] = v;
            });
            if (sheetName === 'Ref_Petugas' && !isEdit) values.Status_Aktif = 'Aktif';

            Btn.setLoading(btn, isEdit ? 'Menyimpan...' : 'Menambahkan...');

            try {
              let res;
              if (isEdit) {
                res = await Api.editMasterData({
                  sheet_target: sheetName,
                  id_field: cfg.idField,
                  id_record: item[cfg.idField],
                  changes: values
                });
              } else {
                res = await Api.tambahMaster({
                  sheet_target: sheetName,
                  fields: values
                });
              }
              Modal.close();
              Toast.success(isEdit
                ? 'Data diperbarui.'
                : 'Data ditambahkan: ' + (res.data && res.data.id || ''));
              await AdminApp.refreshMaster();
              self.render(container, sheetName, ++AdminApp._routeRenderId);
            } catch (err) {
              Toast.error('Gagal: ' + err.message);
              Btn.stopLoading(btn, isEdit ? 'Simpan Perubahan' : 'Simpan', 'check');
            }
          }
        }
      ]
    });

    setTimeout(() => {
      CS.enhanceAll(U.$('#master-form'));
      const first = U.$('#master-form input, #master-form select, #master-form textarea');
      if (first) first.focus();
    }, 150);
  },

  _confirmDelete(sheetName, item, container) {
    const cfg = this.CONFIG[sheetName];
    const self = this;
    Modal.confirm(
      'Nonaktifkan Item',
      'Item "' + (item[cfg.nameField] || item[cfg.idField]) + '" akan dinonaktifkan ' +
      '(tidak dihapus dari sistem). Lanjutkan?',
      async () => {
        try {
          await Api.hapusMaster({
            sheet_target: sheetName,
            id_field: cfg.idField,
            id_record: item[cfg.idField]
          });
          Toast.success('Item dinonaktifkan.');
          await AdminApp.refreshMaster();
          self.render(container, sheetName, ++AdminApp._routeRenderId);
        } catch (err) {
          Toast.error('Gagal: ' + err.message);
        }
      },
      'Ya, Nonaktifkan',
      true,
      { icon: 'warning', subtitle: 'Data historis tetap tersimpan' }
    );
  },

  _resetPin(idPetugas, container) {
    Modal.open({
      title: 'Reset PIN Petugas',
      subtitle: 'PIN baru akan di-generate acak untuk ' + idPetugas,
      icon: 'warning',
      body: '<p style="font-size:var(--fs-md);line-height:1.6;color:var(--text)">' +
        'Yakin ingin me-reset PIN petugas <strong>' + U.escapeHtml(idPetugas) +
        '</strong>?<br><br>' +
        'PIN lama tidak akan bisa dipakai lagi. Pastikan Anda mencatat PIN baru ' +
        'dan memberikannya ke petugas yang bersangkutan.</p>',
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        {
          label: 'Ya, Reset',
          class: 'btn-danger',
          close: false,
          icon: 'refresh',
          onClick: async (btn) => {
            Btn.setLoading(btn, 'Mereset...');
            try {
              const res = await Api.resetPin(idPetugas);
              Modal.close();
              setTimeout(() => {
                Modal.open({
                  title: 'PIN Baru',
                  icon: 'success',
                  subtitle: 'Catat PIN berikut — tidak akan ditampilkan lagi',
                  body: '<div style="text-align:center;padding:24px;' +
                        'background:var(--primary-bg);border-radius:14px;' +
                        'font-size:34px;font-family:ui-monospace,monospace;' +
                        'font-weight:800;letter-spacing:10px;color:var(--primary-dark)">' +
                        U.escapeHtml(res.data.new_pin) + '</div>',
                  actions: [{ label: 'Selesai', class: 'btn-primary' }]
                });
              }, 200);
            } catch (err) {
              Toast.error('Gagal reset PIN: ' + err.message);
              Btn.stopLoading(btn, 'Ya, Reset', 'refresh');
            }
          }
        }
      ]
    });
  }
};

/* ============================================================
   PAGE: AUDIT LOG (v5.4: handle approximate + fast path)
   ============================================================ */
const PageAudit = {
  _page: 0,
  _perPage: 50,
  _totalRecords: 0,
  _approximate: false,
  _hasMore: false,
  _renderId: 0,

  async render(container, renderId) {
    this._page = 0;
    this._approximate = false;
    this._totalRecords = 0;
    this._hasMore = false;
    this._renderId = renderId;

    container.innerHTML =
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title">Audit Log</div>' +
          '<div class="page-subtitle">Riwayat perubahan data master</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          '<button class="btn btn-secondary" id="btn-refresh">' +
            U.icon('refresh', 16) + ' Refresh' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div id="audit-result">' + Helper.skeletonTable(7, 8) + '</div>';

    U.$('#btn-refresh').addEventListener('click', () => {
      this._page = 0;
      this._load();
    });
    this._load();
  },

  async _load() {
    const target = U.$('#audit-result');
    if (!target) return;
    target.innerHTML = Helper.skeletonTable(7, 8);

    try {
      const res = await Api.getAuditLog({
        limit: this._perPage,
        offset: this._page * this._perPage
      });
      if (!U.$('#audit-result')) return;
      const items = (res.data && res.data.items) || [];
      const d = res.data || {};

      this._approximate = !!d.approximate;
      this._totalRecords = this._approximate ? null : (d.total_records || 0);
      this._hasMore = !!d.has_more;

      if (items.length === 0 && this._page === 0) {
        target.innerHTML = Helper.emptyState('Belum ada audit', '', 'clipboard');
        return;
      }

      let totalLabel = '';
      if (this._approximate) {
        totalLabel = 'Menampilkan ' + items.length + ' baris terbaru' +
          (this._hasMore ? ' (ada data lebih lama)' : '');
      } else {
        totalLabel = 'Halaman ' + (this._page + 1) + ' · Total ' +
          U.formatNumber(this._totalRecords) + ' entri';
      }

      target.innerHTML =
        '<div class="table-wrap"><div class="table-scroll">' +
          '<table class="data-table">' +
            '<thead><tr>' +
              '<th>Waktu</th><th>Petugas</th><th>Aksi</th>' +
              '<th>Target</th><th>Record</th><th>Field</th>' +
              '<th>Lama → Baru</th>' +
            '</tr></thead>' +
            '<tbody>' +
              items.map(it =>
                '<tr>' +
                  '<td style="font-size:12px">' + U.formatDateTime(it.Timestamp) + '</td>' +
                  '<td class="mono">' + U.escapeHtml(it.ID_Petugas || '-') + '</td>' +
                  '<td><span class="badge badge-muted">' +
                    U.escapeHtml(it.Aksi || '-') + '</span></td>' +
                  '<td>' + U.escapeHtml(it.Sheet_Target || '-') + '</td>' +
                  '<td class="mono">' + U.escapeHtml(it.ID_Record || '-') + '</td>' +
                  '<td>' + U.escapeHtml(it.Field_Changed || '-') + '</td>' +
                  '<td style="font-size:12px">' +
                    U.escapeHtml(String(it.Nilai_Lama || '').substring(0, 30)) +
                    ' → ' + U.escapeHtml(String(it.Nilai_Baru || '').substring(0, 30)) +
                  '</td>' +
                '</tr>'
              ).join('') +
            '</tbody>' +
          '</table>' +
        '</div></div>' +
        '<div class="flex items-center justify-between mt-3 flex-wrap gap-2">' +
          '<button class="btn btn-secondary" id="audit-prev"' +
            (this._page === 0 ? ' disabled' : '') + '>' +
            U.icon('chevronLeft', 14) + ' Sebelumnya' +
          '</button>' +
          '<span class="text-muted" style="font-size:12px">' + totalLabel + '</span>' +
          '<button class="btn btn-secondary" id="audit-next"' +
            (!this._hasMore ? ' disabled' : '') + '>' +
            'Selanjutnya ' + U.icon('chevronRight', 14) +
          '</button>' +
        '</div>';

      const prev = U.$('#audit-prev');
      const next = U.$('#audit-next');
      const self = this;
      if (prev) prev.addEventListener('click', () => { self._page--; self._load(); });
      if (next) next.addEventListener('click', () => { self._page++; self._load(); });
    } catch (err) {
      if (!U.$('#audit-result')) return;
      target.innerHTML = Helper.emptyState('Gagal', err.message, 'alertCircle');
    }
  }
};

/* ============================================================
   PAGE: SETTINGS (v5.4: card Aksi dihapus)
   ============================================================ */
const PageSettings = {
  async render(container, renderId) {
    const s = AdminApp.session;

    container.innerHTML =
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title">Pengaturan</div>' +
          '<div class="page-subtitle">Profil, keamanan, dan preferensi aplikasi</div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Profil Pengguna</div>' +
        '<div class="field"><label class="field-label">Nama</label>' +
          '<div style="font-weight:600">' + U.escapeHtml(s.nama) + '</div></div>' +
        '<div class="field"><label class="field-label">Username</label>' +
          '<div class="mono" style="font-family:ui-monospace,monospace">' +
            U.escapeHtml(s.username) + '</div></div>' +
        '<div class="field" style="margin-bottom:0">' +
          '<label class="field-label">Role</label>' +
          '<div><span class="badge badge-primary">' +
            U.escapeHtml(s.role) + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Ubah PIN</div>' +
        '<div class="field">' +
          '<label class="field-label">PIN Lama</label>' +
          '<input type="password" class="input" id="set-old-pin" ' +
            'inputmode="numeric" maxlength="8" autocomplete="current-password">' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label">PIN Baru (min 4 digit)</label>' +
          '<input type="password" class="input" id="set-new-pin" ' +
            'inputmode="numeric" maxlength="8" autocomplete="new-password">' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label">Ulangi PIN Baru</label>' +
          '<input type="password" class="input" id="set-new-pin2" ' +
            'inputmode="numeric" maxlength="8" autocomplete="new-password">' +
        '</div>' +
        '<button class="btn btn-primary" id="btn-ubah-pin">Ubah PIN</button>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Logo Puskesmas</div>' +
        '<p class="text-muted" style="font-size:13px;margin-bottom:14px">' +
          'Logo akan ditampilkan di header Kartu Stok. Maks 500 KB.' +
        '</p>' +
        '<div id="logo-preview" style="text-align:center;padding:18px;' +
          'background:var(--surface-2);border-radius:12px;margin-bottom:14px"></div>' +
        '<input type="file" id="logo-input" accept="image/*" style="display:none">' +
        '<div class="flex gap-2 flex-wrap">' +
          '<button class="btn btn-secondary" id="btn-pick-logo">Pilih File</button>' +
          '<button class="btn btn-ghost text-danger" id="btn-remove-logo">Hapus Logo</button>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">Informasi</div>' +
        '<div class="field"><label class="field-label">Versi Aplikasi</label>' +
          '<div>' + CONFIG.APP_VERSION + '</div></div>' +
        '<div class="field" style="margin-bottom:0">' +
          '<label class="field-label">Status Koneksi</label>' +
          '<div id="info-online"></div>' +
        '</div>' +
      '</div>';

    this._refreshLogo();
    this._refreshOnline();

    U.$('#btn-pick-logo').addEventListener('click', () => U.$('#logo-input').click());
    U.$('#logo-input').addEventListener('change', (e) => this._handleLogoUpload(e));
    U.$('#btn-remove-logo').addEventListener('click', () => {
      Store.setLogo('');
      this._refreshLogo();
      Toast.info('Logo dihapus');
    });
    U.$('#btn-ubah-pin').addEventListener('click', (e) => this._ubahPin(e.currentTarget));
  },

  _refreshLogo() {
    const logo = Store.getLogo();
    const el = U.$('#logo-preview');
    if (!el) return;
    if (logo) {
      el.innerHTML = '<img src="' + logo + '" alt="Logo" ' +
                     'style="max-height:80px;display:inline-block">';
    } else {
      el.innerHTML = '<div class="text-muted">Belum ada logo</div>';
    }
  },

  _refreshOnline() {
    const el = U.$('#info-online');
    if (!el) return;
    el.innerHTML = navigator.onLine
      ? '<span class="badge badge-success">Terhubung</span>'
      : '<span class="badge badge-danger">Offline</span>';
  },

  _handleLogoUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500 * 1024) {
      Toast.error('File terlalu besar (maks 500 KB)');
      return;
    }

    const previewEl = U.$('#logo-preview');
    if (previewEl) previewEl.innerHTML = Helper.loader('Memproses gambar...');

    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 400;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = h * maxDim / w; w = maxDim; }
          else { w = w * maxDim / h; h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        Store.setLogo(canvas.toDataURL('image/png'));
        PageSettings._refreshLogo();
        Toast.success('Logo diperbarui');
      };
      img.onerror = () => {
        Toast.error('Gagal membaca gambar');
        PageSettings._refreshLogo();
      };
      img.src = ev.target.result;
    };
    reader.onerror = () => {
      Toast.error('Gagal membaca file');
      PageSettings._refreshLogo();
    };
    reader.readAsDataURL(file);
  },

  async _ubahPin(btn) {
    const oldPin = U.$('#set-old-pin').value;
    const newPin = U.$('#set-new-pin').value;
    const newPin2 = U.$('#set-new-pin2').value;

    if (!oldPin || !newPin || !newPin2) {
      Toast.error('Semua field wajib diisi');
      return;
    }
    if (newPin.length < 4) {
      Toast.error('PIN baru minimal 4 digit');
      return;
    }
    if (newPin !== newPin2) {
      Toast.error('PIN baru tidak sama');
      return;
    }

    Btn.setLoading(btn, 'Menyimpan...');
    try {
      await Api.ubahPin({ old_pin: oldPin, new_pin: newPin });
      Toast.success('PIN berhasil diubah');
      U.$('#set-old-pin').value = '';
      U.$('#set-new-pin').value = '';
      U.$('#set-new-pin2').value = '';
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
    } finally {
      Btn.stopLoading(btn, 'Ubah PIN');
    }
  }
};

/* ============================================================
   BOOTSTRAP
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  dbg('[ADMIN] v5.4.1 DOM ready');

  if (typeof U === 'undefined' || typeof Api === 'undefined') {
    const el = document.getElementById('boot-splash');
    if (el) el.classList.add('hide');
    document.getElementById('app').innerHTML =
      '<div style="padding:32px;text-align:center;color:#d32f2f;' +
      'font-family:system-ui,sans-serif">' +
        '<h2 style="margin-bottom:12px">Gagal memuat sistem</h2>' +
        '<p style="color:#666">File <code>shared/core.js</code> tidak ditemukan.</p>' +
      '</div>';
    return;
  }

  AdminApp.init().catch(err => {
    dbgErr('AdminApp init fatal:', err);
    const splash = document.getElementById('boot-splash');
    if (splash) splash.classList.add('hide');
    Toast.error('Gagal memuat aplikasi: ' + err.message);
  });
});
