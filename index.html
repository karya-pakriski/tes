    const canAdd = sheetName !== 'Ref_Petugas' || AdminApp.session.role === 'SuperAdmin';

    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title" style="font-size:var(--fs-xl);font-weight:700">' +
            U.escapeHtml(cfg.title) + '</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          (canAdd
            ? '<button class="btn btn-primary" id="btn-add">' +
                U.icon('plus', 16) + ' Tambah' +
              '</button>'
            : '') +
        '</div>' +
      '</div>' +
      '<div class="card card-tight">' +
        '<input class="input" id="master-search" placeholder="Cari...">' +
      '</div>' +
      '<div id="master-table-container"></div>';

    if (canAdd) {
      U.$('#btn-add').addEventListener('click', () => this._openForm(sheetName, null, container));
    }
    U.$('#master-search').addEventListener('input', U.debounce(() => {
      this._renderTable(container, sheetName, U.$('#master-search').value);
    }, 200));
    this._renderTable(container, sheetName, '');
  },

  _renderTable(container, sheetName, query) {
    const cfg = this.CONFIG[sheetName];
    const master = AdminApp.master || {};
    let data = [];
    if (sheetName === 'Master_Obat') data = master.obat || [];
    else if (sheetName === 'Master_BMHP') data = master.bmhp || [];
    else if (sheetName === 'Master_ATK') data = master.atk || [];
    else if (sheetName === 'Ref_Supplier') data = master.supplier || [];
    else if (sheetName === 'Ref_UnitInternal') data = master.unit || [];
    else if (sheetName === 'Ref_LokasiRak') data = master.rak || [];
    else if (sheetName === 'Ref_Petugas') data = master.petugas || [];

    const q = (query || '').toLowerCase().trim();
    if (q) {
      data = data.filter(item =>
        cfg.columns.some(c => String(item[c.key] || '').toLowerCase().indexOf(q) !== -1));
    }

    const target = U.$('#master-table-container');

    if (data.length === 0) {
      target.innerHTML = AdminApp._renderEmpty(
        'Tidak ada data',
        q ? 'Tidak ditemukan hasil untuk "' + q + '"' : 'Belum ada item.',
        cfg.icon
      );
      return;
    }

    target.innerHTML = '' +
      '<div class="table-wrap">' +
        '<div class="table-scroll">' +
          '<table class="data-table">' +
            '<thead><tr>' +
              cfg.columns.map(c =>
                '<th' + (c.num ? ' class="num"' : '') + '>' + U.escapeHtml(c.label) + '</th>'
              ).join('') +
              '<th class="col-actions">Aksi</th>' +
            '</tr></thead>' +
            '<tbody>' +
              data.map(item => {
                const tds = cfg.columns.map(c => {
                  const val = item[c.key];
                  let content = '';
                  if (c.badge) {
                    let cls = 'badge-muted';
                    if (val === 'Aktif' || val === 'Ya') cls = 'badge-success';
                    else if (val === 'Nonaktif' || val === 'Tidak') cls = 'badge-muted';
                    else if (val === 'SuperAdmin') cls = 'badge-danger';
                    else if (val === 'Apoteker') cls = 'badge-primary';
                    else if (val === 'Gudang') cls = 'badge-warning';
                    else if (val === 'Scanner') cls = 'badge-primary';
                    else if (val === 'Bidan_Desa') cls = 'badge-warning';
                    content = '<span class="badge ' + cls + '">' +
                              U.escapeHtml(val || '-') + '</span>';
                  } else if (c.rp) content = U.formatRupiah(val);
                  else if (c.num) content = U.formatNumber(val);
                  else content = U.escapeHtml(val || '-');
                  const cls = (c.mono ? 'mono ' : '') + (c.num ? 'num' : '');
                  return '<td' + (cls ? ' class="' + cls.trim() + '"' : '') + '>' +
                         content + '</td>';
                }).join('');

                const idVal = item[cfg.idField];
                const canDelete = item.Status_Aktif !== 'Nonaktif';
                const actions =
                  '<button class="btn btn-ghost btn-sm" data-action="edit" ' +
                    'data-id="' + U.escapeHtml(idVal) + '" title="Edit">' +
                    U.icon('edit', 15) +
                  '</button>' +
                  (sheetName === 'Ref_Petugas'
                    ? '<button class="btn btn-ghost btn-sm" data-action="resetpin" ' +
                        'data-id="' + U.escapeHtml(idVal) + '" title="Reset PIN">' +
                        U.icon('refresh', 15) +
                      '</button>'
                    : '') +
                  (canDelete
                    ? '<button class="btn btn-ghost btn-sm text-danger" ' +
                        'data-action="delete" data-id="' + U.escapeHtml(idVal) + '" ' +
                        'title="Nonaktifkan">' +
                        U.icon('trash', 15) +
                      '</button>'
                    : '');

                return '<tr>' + tds + '<td class="col-actions">' + actions + '</td></tr>';
              }).join('') +
            '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>';

    U.$$('[data-action]', target).forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const item = data.find(x => String(x[cfg.idField]) === String(id));
        if (action === 'edit') this._openForm(sheetName, item, container);
        else if (action === 'delete') this._confirmDelete(sheetName, item, container);
        else if (action === 'resetpin') this._resetPin(id, container);
      });
    });
  },

  _openForm(sheetName, item, container) {
    const cfg = this.CONFIG[sheetName];
    const isEdit = !!item;
    const master = AdminApp.master || {};
    const fields = cfg.formFields.filter(f => !(isEdit && f.addOnly));

    const fieldsHtml = fields.map(f => {
      const val = isEdit ? (item[f.key] || '') : '';
      let inputHtml = '';

      if (f.type === 'select') {
        let options = f.options || [];
        if (f.source === 'rak') options = (master.rak || []).map(r => r.ID_Rak);
        inputHtml = '<select class="select" name="' + f.key + '"' +
          (f.required ? ' required' : '') + '>' +
          '<option value="">— Pilih —</option>' +
          options.map(o => '<option value="' + U.escapeHtml(o) + '"' +
            (o === val ? ' selected' : '') + '>' + U.escapeHtml(o) + '</option>').join('') +
          '</select>';
      } else if (f.type === 'textarea') {
        inputHtml = '<textarea class="textarea" name="' + f.key + '"' +
          (f.required ? ' required' : '') + '>' + U.escapeHtml(val) + '</textarea>';
      } else {
        inputHtml = '<input type="' + f.type + '" class="input" name="' + f.key + '" ' +
          'value="' + U.escapeHtml(val) + '"' +
          (f.required ? ' required' : '') +
          (f.type === 'number' ? ' step="any"' : '') + '>';
      }

      return '<div class="field">' +
        '<label class="field-label">' + U.escapeHtml(f.label) +
          (f.required ? ' <span class="required">*</span>' : '') + '</label>' +
        inputHtml +
      '</div>';
    }).join('');

    const formHtml = '<form id="master-form" autocomplete="off">' +
      (isEdit
        ? '<div class="field">' +
            '<label class="field-label">' + U.escapeHtml(cfg.idField) + '</label>' +
            '<div class="mono" style="font-family:ui-monospace,monospace;font-weight:600">' +
              U.escapeHtml(item[cfg.idField]) + '</div>' +
          '</div>'
        : '') +
      fieldsHtml +
    '</form>';

    Modal.open({
      title: isEdit ? 'Edit ' + cfg.title : 'Tambah ' + cfg.title,
      icon: 'primary',
      body: formHtml,
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        {
          label: isEdit ? 'Simpan Perubahan' : 'Simpan',
          class: 'btn-primary', close: false, icon: 'check',
          onClick: async (btn) => {
            const form = U.$('#master-form');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const values = {};
            fields.forEach(f => {
              const el = form.querySelector('[name="' + f.key + '"]');
              if (!el) return;
              let v = el.value;
              if (f.type === 'number') v = Number(v) || 0;
              values[f.key] = v;
            });
            if (sheetName === 'Ref_Petugas' && !isEdit) values.Status_Aktif = 'Aktif';

            Btn.setLoading(btn, isEdit ? 'Menyimpan...' : 'Menambahkan...');

            try {
              let res;
              if (isEdit) {
                res = await Api.editMasterData({
                  sheet_target: sheetName,
                  id_field: cfg.idField,
                  id_record: item[cfg.idField],
                  changes: values
                });
              } else {
                res = await Api.tambahMaster({
                  sheet_target: sheetName,
                  fields: values
                });
              }
              Modal.close();
              Toast.success(isEdit ? 'Data diperbarui.'
                                    : 'Data ditambahkan: ' + (res.data && res.data.id || ''));
              await AdminApp.refreshMaster();
              PageMaster.render(container, sheetName);
            } catch (err) {
              Toast.error('Gagal: ' + err.message);
              Btn.stopLoading(btn, isEdit ? 'Simpan Perubahan' : 'Simpan', 'check');
            }
          }
        }
      ]
    });

    setTimeout(() => {
      const first = U.$('#master-form input, #master-form select, #master-form textarea');
      if (first) first.focus();
    }, 200);
  },

  _confirmDelete(sheetName, item, container) {
    const cfg = this.CONFIG[sheetName];
    Modal.confirm(
      'Nonaktifkan Item',
      'Item "' + (item[cfg.nameField] || item[cfg.idField]) + '" akan dinonaktifkan ' +
      '(tidak dihapus dari sistem). Lanjutkan?',
      async () => {
        try {
          await Api.hapusMaster({
            sheet_target: sheetName,
            id_field: cfg.idField,
            id_record: item[cfg.idField]
          });
          Toast.success('Item dinonaktifkan.');
          await AdminApp.refreshMaster();
          PageMaster.render(container, sheetName);
        } catch (err) {
          Toast.error('Gagal: ' + err.message);
        }
      },
      'Ya, Nonaktifkan',
      true,
      { icon: 'warning', subtitle: 'Data historis tetap tersimpan' }
    );
  },

  async _resetPin(idPetugas, container) {
    Modal.confirm(
      'Reset PIN Petugas',
      'PIN baru akan di-generate acak untuk ' + idPetugas + '. Lanjutkan?',
      async () => {
        try {
          const res = await Api.resetPin(idPetugas);
          Modal.open({
            title: 'PIN Baru',
            icon: 'success',
            subtitle: 'Catat PIN berikut — tidak akan ditampilkan lagi',
            body: '<div style="text-align:center;padding:20px;background:var(--primary-bg);' +
                  'border-radius:var(--r-md);font-size:28px;font-family:ui-monospace,monospace;' +
                  'font-weight:800;letter-spacing:6px;color:var(--primary-dark)">' +
                  U.escapeHtml(res.data.new_pin) + '</div>',
            actions: [{ label: 'Tutup', class: 'btn-primary' }]
          });
        } catch (err) {
          Toast.error('Gagal reset PIN: ' + err.message);
        }
      },
      'Ya, Reset',
      true,
      { icon: 'warning' }
    );
  }
};

/* ============================================================
   PAGE: AUDIT LOG
   ============================================================ */
const PageAudit = {
  _page: 0,
  _perPage: 50,
  _totalRecords: 0,
  _hasMore: false,

  async render(container) {
    this._page = 0;

    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title" style="font-size:var(--fs-xl);font-weight:700">Audit Log</div>' +
          '<div class="text-muted" style="font-size:var(--fs-sm);margin-top:2px">' +
            'Riwayat perubahan data master' +
          '</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          '<button class="btn btn-secondary" id="btn-refresh">' +
            U.icon('refresh', 16) + ' Refresh' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div id="audit-result"></div>';

    U.$('#btn-refresh').addEventListener('click', () => {
      this._page = 0;
      this._load();
    });
    this._load();
  },

  async _load() {
    const target = U.$('#audit-result');
    target.innerHTML = '<div class="card"><div class="skeleton skeleton-line long"></div>' +
      '<div class="skeleton skeleton-line medium"></div></div>';

    try {
      const res = await Api.getAuditLog({
        limit: this._perPage,
        offset: this._page * this._perPage
      });
      const items = (res.data && res.data.items) || [];
      this._hasMore = res.data && res.data.has_more;
      this._totalRecords = res.data && res.data.total_records || 0;

      if (items.length === 0 && this._page === 0) {
        target.innerHTML = AdminApp._renderEmpty('Belum ada audit', '', 'clipboard');
        return;
      }

      let html = '' +
        '<div class="table-wrap">' +
          '<div class="table-scroll">' +
            '<table class="data-table">' +
              '<thead><tr>' +
                '<th>Waktu</th>' +
                '<th>Petugas</th>' +
                '<th>Aksi</th>' +
                '<th>Target</th>' +
                '<th>Record</th>' +
                '<th>Field</th>' +
                '<th>Lama → Baru</th>' +
              '</tr></thead>' +
              '<tbody>' +
                items.map(it =>
                  '<tr>' +
                    '<td style="font-size:12px">' + U.formatDateTime(it.Timestamp) + '</td>' +
                    '<td class="mono">' + U.escapeHtml(it.ID_Petugas || '-') + '</td>' +
                    '<td><span class="badge badge-muted">' +
                      U.escapeHtml(it.Aksi || '-') + '</span></td>' +
                    '<td>' + U.escapeHtml(it.Sheet_Target || '-') + '</td>' +
                    '<td class="mono">' + U.escapeHtml(it.ID_Record || '-') + '</td>' +
                    '<td>' + U.escapeHtml(it.Field_Changed || '-') + '</td>' +
                    '<td style="font-size:12px">' +
                      U.escapeHtml(String(it.Nilai_Lama || '').substring(0, 30)) +
                      ' → ' + U.escapeHtml(String(it.Nilai_Baru || '').substring(0, 30)) +
                    '</td>' +
                  '</tr>'
                ).join('') +
              '</tbody>' +
            '</table>' +
          '</div>' +
        '</div>' +
        '<div class="flex items-center justify-between mt-3 flex-wrap gap-2">' +
          '<button class="btn btn-secondary" id="audit-prev"' +
            (this._page === 0 ? ' disabled' : '') + '>' +
            U.icon('chevronLeft', 14) + ' Sebelumnya' +
          '</button>' +
          '<span class="text-muted" style="font-size:12px">' +
            'Halaman ' + (this._page + 1) + ' · ' +
            'Total ' + U.formatNumber(this._totalRecords) + ' entri' +
          '</span>' +
          '<button class="btn btn-secondary" id="audit-next"' +
            (!this._hasMore ? ' disabled' : '') + '>' +
            'Selanjutnya ' + U.icon('chevronRight', 14) +
          '</button>' +
        '</div>';

      target.innerHTML = html;
      const prev = U.$('#audit-prev');
      const next = U.$('#audit-next');
      if (prev) prev.addEventListener('click', () => { this._page--; this._load(); });
      if (next) next.addEventListener('click', () => { this._page++; this._load(); });
    } catch (err) {
      target.innerHTML = AdminApp._renderEmpty('Gagal', err.message, 'alertCircle');
    }
  }
};

/* ============================================================
   PAGE: SETTINGS
   ============================================================ */
const PageSettings = {
  async render(container) {
    const s = AdminApp.session;

    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title" style="font-size:var(--fs-xl);font-weight:700">Pengaturan</div>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">Profil Pengguna</div>' +
        '<div class="field"><label class="field-label">Nama</label>' +
          '<div>' + U.escapeHtml(s.nama) + '</div></div>' +
        '<div class="field"><label class="field-label">Username</label>' +
          '<div class="mono" style="font-family:ui-monospace,monospace">' +
            U.escapeHtml(s.username) + '</div></div>' +
        '<div class="field" style="margin-bottom:0">' +
          '<label class="field-label">Role</label>' +
          '<div><span class="badge badge-primary">' + U.escapeHtml(s.role) + '</span></div>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">Ubah PIN</div>' +
        '<div class="field">' +
          '<label class="field-label">PIN Lama</label>' +
          '<input type="password" class="input" id="set-old-pin" ' +
            'inputmode="numeric" maxlength="8" autocomplete="current-password">' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label">PIN Baru (min 4 digit)</label>' +
          '<input type="password" class="input" id="set-new-pin" ' +
            'inputmode="numeric" maxlength="8" autocomplete="new-password">' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label">Ulangi PIN Baru</label>' +
          '<input type="password" class="input" id="set-new-pin2" ' +
            'inputmode="numeric" maxlength="8" autocomplete="new-password">' +
        '</div>' +
        '<button class="btn btn-primary" id="btn-ubah-pin">Ubah PIN</button>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">Logo Puskesmas</div>' +
        '<p class="text-muted" style="font-size:13px;margin-bottom:12px">' +
          'Logo akan ditampilkan di header Kartu Stok. Maks 500 KB.' +
        '</p>' +
        '<div id="logo-preview" style="text-align:center;padding:16px;' +
          'background:var(--surface-2);border-radius:var(--r-md);margin-bottom:12px"></div>' +
        '<input type="file" id="logo-input" accept="image/*" style="display:none">' +
        '<div class="flex gap-2 flex-wrap">' +
          '<button class="btn btn-secondary" id="btn-pick-logo">Pilih File</button>' +
          '<button class="btn btn-ghost text-danger" id="btn-remove-logo">Hapus Logo</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">Aksi</div>' +
        '<button class="btn btn-danger" id="btn-logout">' +
          U.icon('logout', 16) + ' Keluar dari Aplikasi' +
        '</button>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">Informasi</div>' +
        '<div class="field"><label class="field-label">Versi Aplikasi</label>' +
          '<div>' + CONFIG.APP_VERSION + '</div></div>' +
        '<div class="field" style="margin-bottom:0">' +
          '<label class="field-label">Status Koneksi</label>' +
          '<div id="info-online"></div>' +
        '</div>' +
      '</div>';

    this._refreshLogo();
    this._refreshOnline();

    U.$('#btn-pick-logo').addEventListener('click', () => U.$('#logo-input').click());
    U.$('#logo-input').addEventListener('change', (e) => this._handleLogoUpload(e));
    U.$('#btn-remove-logo').addEventListener('click', () => {
      Store.setLogo('');
      this._refreshLogo();
      Toast.info('Logo dihapus');
    });
    U.$('#btn-ubah-pin').addEventListener('click', () => this._ubahPin());
    U.$('#btn-logout').addEventListener('click', () => {
      Modal.confirm('Keluar', 'Yakin ingin keluar dari aplikasi?',
        () => AdminApp.logout(), 'Ya, Keluar', true,
        { icon: 'danger', subtitle: 'Anda harus login ulang' });
    });
  },

  _refreshLogo() {
    const logo = Store.getLogo();
    const el = U.$('#logo-preview');
    if (!el) return;
    if (logo) {
      el.innerHTML = '<img src="' + logo + '" alt="Logo" ' +
                     'style="max-height:80px;display:inline-block">';
    } else {
      el.innerHTML = '<div class="text-muted">Belum ada logo</div>';
    }
  },

  _refreshOnline() {
    const el = U.$('#info-online');
    if (!el) return;
    el.innerHTML = navigator.onLine
      ? '<span class="badge badge-success">Terhubung</span>'
      : '<span class="badge badge-danger">Offline</span>';
  },

  _handleLogoUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500 * 1024) {
      Toast.error('File terlalu besar (maks 500 KB)');
      return;
    }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 400;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = h * maxDim / w; w = maxDim; }
          else { w = w * maxDim / h; h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        Store.setLogo(canvas.toDataURL('image/png'));
        PageSettings._refreshLogo();
        Toast.success('Logo diperbarui');
      };
      img.onerror = () => Toast.error('Gagal membaca gambar');
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  },

  async _ubahPin() {
    const oldPin = U.$('#set-old-pin').value;
    const newPin = U.$('#set-new-pin').value;
    const newPin2 = U.$('#set-new-pin2').value;

    if (!oldPin || !newPin || !newPin2) {
      Toast.error('Semua field wajib diisi');
      return;
    }
    if (newPin.length < 4) {
      Toast.error('PIN baru minimal 4 digit');
      return;
    }
    if (newPin !== newPin2) {
      Toast.error('PIN baru tidak sama');
      return;
    }

    const btn = U.$('#btn-ubah-pin');
    Btn.setLoading(btn, 'Menyimpan...');

    try {
      await Api.ubahPin({ old_pin: oldPin, new_pin: newPin });
      Toast.success('PIN berhasil diubah');
      U.$('#set-old-pin').value = '';
      U.$('#set-new-pin').value = '';
      U.$('#set-new-pin2').value = '';
      Btn.stopLoading(btn, 'Ubah PIN');
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
      Btn.stopLoading(btn, 'Ubah PIN');
    }
  }
};
