<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7377">
<meta name="description" content="Sistem Gudang Farmasi & BMHP Puskesmas Sanden">
<title>Sistem Gudang — Puskesmas Sanden</title>
<style>
:root {
  --primary: #0d7377; --primary-dark: #0a5d61; --primary-light: #14a3a8; --primary-bg: #e6f4f5;
  --danger: #d32f2f; --danger-bg: #ffebee;
  --success: #2e7d32; --success-bg: #e8f5e9;
  --warning: #ef6c00; --warning-bg: #fff3e0;
  --info: #1976d2; --info-bg: #e3f2fd;
  --bg: #f5f7fa; --surface: #ffffff; --surface-2: #f8fafc;
  --text: #1a202c; --text-muted: #64748b; --text-light: #94a3b8;
  --border: #e2e8f0; --border-strong: #cbd5e1;
  --space-xs: 4px; --space-sm: 8px; --space-md: 12px; --space-lg: 16px; --space-xl: 24px; --space-2xl: 32px;
  --font-sm: 13px; --font-base: 15px; --font-md: 16px; --font-lg: 18px; --font-xl: 22px; --font-2xl: 28px;
  --radius-sm: 6px; --radius-md: 10px; --radius-lg: 14px; --radius-full: 999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.10);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);
  --sidebar-w: 240px; --topbar-h: 56px; --bottomnav-h: 64px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: var(--font-base); line-height: 1.5; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--primary); text-decoration: none; }
img { max-width: 100%; display: block; }
ul, ol { list-style: none; }
table { border-collapse: collapse; width: 100%; }

/* LOGIN */
.login-screen {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0d7377 0%, #14a3a8 100%);
  padding: var(--space-lg); z-index: 1000;
}
.login-card {
  background: var(--surface); width: 100%; max-width: 400px;
  border-radius: var(--radius-lg); box-shadow: var(--shadow-xl);
  padding: var(--space-2xl) var(--space-xl);
}
.login-brand { text-align: center; margin-bottom: var(--space-xl); }
.login-logo {
  width: 72px; height: 72px; margin: 0 auto var(--space-md);
  background: var(--primary-bg); border-radius: var(--radius-full);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary); font-size: 32px; font-weight: 700;
}
.login-title { font-size: var(--font-xl); font-weight: 700; margin-bottom: 4px; }
.login-subtitle { font-size: var(--font-sm); color: var(--text-muted); }
.login-form .field { margin-bottom: var(--space-md); }
.login-pin-display {
  font-family: ui-monospace, monospace; font-size: 24px; letter-spacing: 8px;
  text-align: center; padding: var(--space-md);
  background: var(--surface-2); border: 2px solid var(--border);
  border-radius: var(--radius-md); min-height: 56px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text); user-select: none;
}
.login-pin-display.empty { color: var(--text-light); font-size: 14px; letter-spacing: 0; }
.login-keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-sm); margin-top: var(--space-md); }
.key-btn {
  aspect-ratio: 1.6; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius-md); font-size: var(--font-xl); font-weight: 600;
  color: var(--text); transition: background 0.15s, transform 0.05s;
  display: flex; align-items: center; justify-content: center;
}
.key-btn:active { background: var(--primary-bg); transform: scale(0.96); }
.key-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
.key-btn.primary:active { background: var(--primary-dark); }
.key-btn svg { width: 24px; height: 24px; }
.login-help { text-align: center; font-size: var(--font-sm); color: var(--text-muted); margin-top: var(--space-lg); }
.login-help strong { color: var(--text); }
.login-footer {
  text-align: center; font-size: 12px; color: var(--text-light);
  margin-top: var(--space-xl); display: flex; align-items: center; justify-content: center; gap: 6px;
}
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
.status-dot.offline { background: var(--danger); }

/* APP SHELL */
.app { display: none; min-height: 100vh; }
.app.active { display: block; }
.topbar {
  position: sticky; top: 0; z-index: 50; height: var(--topbar-h);
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: var(--space-md); padding: 0 var(--space-md);
}
.topbar-menu-btn {
  display: none; width: 40px; height: 40px;
  align-items: center; justify-content: center; border-radius: var(--radius-sm);
}
.topbar-menu-btn:hover { background: var(--surface-2); }
.topbar-brand { display: flex; align-items: center; gap: var(--space-sm); flex: 1; min-width: 0; }
.topbar-logo {
  width: 32px; height: 32px; background: var(--primary); color: white;
  border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
}
.topbar-title { font-weight: 600; font-size: var(--font-base); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.offline-badge {
  display: none; align-items: center; gap: 4px; padding: 4px 10px;
  background: var(--danger-bg); color: var(--danger); border-radius: var(--radius-full);
  font-size: 11px; font-weight: 600;
}
.offline-badge.visible { display: inline-flex; }
.topbar-user {
  display: flex; align-items: center; gap: var(--space-sm);
  padding: 6px 12px; border-radius: var(--radius-full);
  background: var(--surface-2); font-size: var(--font-sm); max-width: 240px;
}
.topbar-user .role-badge {
  font-size: 11px; padding: 2px 8px;
  background: var(--primary-bg); color: var(--primary-dark);
  border-radius: var(--radius-full); font-weight: 600;
}

.sidebar {
  position: fixed; top: var(--topbar-h); left: 0; bottom: 0;
  width: var(--sidebar-w); background: var(--surface);
  border-right: 1px solid var(--border); overflow-y: auto;
  padding: var(--space-md) 0; z-index: 40;
}
.sidebar-group { margin-bottom: var(--space-md); }
.sidebar-group-title {
  padding: 6px var(--space-lg); font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-light);
}
.sidebar-item {
  display: flex; align-items: center; gap: var(--space-md);
  padding: 10px var(--space-lg); color: var(--text); font-size: var(--font-sm);
  border-left: 3px solid transparent; transition: background 0.15s;
}
.sidebar-item:hover { background: var(--surface-2); }
.sidebar-item.active {
  background: var(--primary-bg); color: var(--primary-dark);
  border-left-color: var(--primary); font-weight: 600;
}
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-item .badge {
  margin-left: auto; background: var(--danger); color: white;
  font-size: 11px; padding: 2px 8px; border-radius: var(--radius-full); font-weight: 600;
}

.main {
  margin-left: var(--sidebar-w); padding: var(--space-xl);
  min-height: calc(100vh - var(--topbar-h));
}
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--space-lg); gap: var(--space-md); flex-wrap: wrap;
}
.page-title { font-size: var(--font-xl); font-weight: 700; }
.page-desc { color: var(--text-muted); font-size: var(--font-sm); margin-top: 2px; }

/* BUTTONS */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-sm);
  padding: 10px 16px; border-radius: var(--radius-md);
  font-size: var(--font-sm); font-weight: 600; border: 1px solid transparent;
  transition: all 0.15s; white-space: nowrap; min-height: 40px;
}
.btn svg { width: 16px; height: 16px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover:not(:disabled) { background: #b71c1c; }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn-block { width: 100%; }
.btn-lg { padding: 14px 20px; font-size: var(--font-md); min-height: 48px; }

/* FORMS */
.field { margin-bottom: var(--space-md); }
.field-label { display: block; font-size: var(--font-sm); font-weight: 600; margin-bottom: 6px; }
.field-label .required { color: var(--danger); }
.field-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
.input, .select, .textarea {
  width: 100%; padding: 10px 12px; font-size: var(--font-md);
  background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: var(--radius-md); transition: border-color 0.15s, box-shadow 0.15s;
  min-height: 44px;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-bg);
}
.input:disabled, .select:disabled { background: var(--surface-2); color: var(--text-muted); }
.textarea { min-height: 80px; resize: vertical; }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md); }
@media (max-width: 640px) { .field-row { grid-template-columns: 1fr; } }

/* CARDS */
.card {
  background: var(--surface); border-radius: var(--radius-lg);
  border: 1px solid var(--border); padding: var(--space-lg); margin-bottom: var(--space-lg);
}
.card-title {
  font-size: var(--font-md); font-weight: 700; margin-bottom: var(--space-md);
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm);
}
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--space-md); margin-bottom: var(--space-lg);
}
.stat-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: var(--space-lg);
}
.stat-icon {
  width: 40px; height: 40px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center; margin-bottom: var(--space-md);
}
.stat-icon.primary { background: var(--primary-bg); color: var(--primary); }
.stat-icon.danger { background: var(--danger-bg); color: var(--danger); }
.stat-icon.warning { background: var(--warning-bg); color: var(--warning); }
.stat-icon.success { background: var(--success-bg); color: var(--success); }
.stat-icon svg { width: 20px; height: 20px; }
.stat-value { font-size: var(--font-2xl); font-weight: 700; line-height: 1.1; }
.stat-label { font-size: var(--font-sm); color: var(--text-muted); margin-top: 4px; }

/* TABLES */
.table-wrap {
  background: var(--surface); border-radius: var(--radius-lg);
  border: 1px solid var(--border); overflow: hidden;
}
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data-table { min-width: 100%; font-size: var(--font-sm); }
.data-table thead { background: var(--surface-2); position: sticky; top: 0; }
.data-table th {
  text-align: left; padding: 12px 14px; font-weight: 600; font-size: 12px;
  text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-muted);
  border-bottom: 1px solid var(--border); white-space: nowrap;
}
.data-table td {
  padding: 12px 14px; border-bottom: 1px solid var(--border); vertical-align: middle;
}
.data-table tbody tr:hover { background: var(--surface-2); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table .col-actions { text-align: right; white-space: nowrap; }
.data-table .mono { font-family: ui-monospace, monospace; font-size: 13px; }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* BADGES */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 10px; border-radius: var(--radius-full);
  font-size: 12px; font-weight: 600; white-space: nowrap;
}
.badge-primary { background: var(--primary-bg); color: var(--primary-dark); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-muted { background: var(--surface-2); color: var(--text-muted); }

/* SCANNER */
.scanner-box {
  background: #000; border-radius: var(--radius-lg); overflow: hidden;
  position: relative; aspect-ratio: 4/3; max-height: 400px;
  display: flex; align-items: center; justify-content: center;
}
.scanner-box video { width: 100%; height: 100%; object-fit: cover; }
.scanner-placeholder { color: white; text-align: center; padding: var(--space-xl); }
.scanner-placeholder svg { width: 48px; height: 48px; opacity: 0.5; margin-bottom: var(--space-md); }
.scanner-frame {
  position: absolute; inset: 15%; border: 3px solid var(--primary-light);
  border-radius: var(--radius-md); box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
  pointer-events: none;
}
.scanner-controls {
  position: absolute; bottom: var(--space-md); left: 0; right: 0;
  display: flex; gap: var(--space-sm); justify-content: center; z-index: 2;
}
.scanner-controls button {
  background: rgba(0,0,0,0.6); color: white; padding: 8px 14px;
  border-radius: var(--radius-full); font-size: var(--font-sm);
  display: inline-flex; align-items: center; gap: 6px;
}
.scanner-controls button svg { width: 16px; height: 16px; }
.scanner-mode-badge {
  position: absolute; top: var(--space-md); left: var(--space-md);
  padding: 6px 12px; border-radius: var(--radius-full);
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.5px; z-index: 2;
}
.scanner-mode-badge.in { background: var(--success); color: white; }
.scanner-mode-badge.out { background: var(--warning); color: white; }
.scan-history { margin-top: var(--space-md); max-height: 200px; overflow-y: auto; }
.scan-history-item {
  display: flex; align-items: center; gap: var(--space-sm);
  padding: var(--space-sm) 0; border-bottom: 1px solid var(--border); font-size: var(--font-sm);
}
.scan-history-item:last-child { border-bottom: none; }
.scan-history-item .check { color: var(--success); }
.scan-history-item .time { margin-left: auto; color: var(--text-light); font-size: 12px; }

/* TOAST */
.toast-container {
  position: fixed; bottom: calc(var(--space-lg) + var(--safe-bottom));
  left: 50%; transform: translateX(-50%); z-index: 2000;
  display: flex; flex-direction: column-reverse; gap: var(--space-sm);
  align-items: center; pointer-events: none;
  max-width: calc(100vw - 32px); width: auto;
}
.toast {
  background: var(--text); color: white; padding: 12px 20px;
  border-radius: var(--radius-md); font-size: var(--font-sm);
  box-shadow: var(--shadow-lg); display: flex; align-items: center; gap: var(--space-sm);
  pointer-events: auto; animation: toastIn 0.2s ease-out; max-width: 400px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warning { background: var(--warning); }
.toast.info { background: var(--info); }
.toast svg { width: 18px; height: 18px; flex-shrink: 0; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1500;
  display: none; align-items: center; justify-content: center; padding: var(--space-lg);
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl); width: 100%; max-width: 500px;
  max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;
}
.modal-header {
  padding: var(--space-lg); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: var(--font-lg); font-weight: 700; }
.modal-close { width: 32px; height: 32px; border-radius: var(--radius-sm); color: var(--text-muted); }
.modal-close:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: var(--space-lg); overflow-y: auto; flex: 1; }
.modal-footer {
  padding: var(--space-lg); border-top: 1px solid var(--border);
  display: flex; gap: var(--space-sm); justify-content: flex-end;
}
@media (max-width: 640px) {
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal { max-width: none; width: 100%; max-height: 95vh; border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .modal-footer { flex-direction: column-reverse; }
  .modal-footer .btn { width: 100%; }
}

/* KARTU STOK */
.kartu-stok-preview {
  background: white; padding: 20px; max-width: 560px; margin: 0 auto;
  border: 1px solid var(--border); border-radius: var(--radius-md);
  font-family: "Times New Roman", serif; font-size: 12px; color: #000;
  box-shadow: var(--shadow-md);
}
.kartu-stok-header {
  text-align: center; border-bottom: 2px solid #000;
  padding-bottom: 8px; margin-bottom: 12px;
}
.kartu-stok-header h1 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.kartu-stok-header h2 { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.kartu-stok-header h3 { font-size: 12px; font-weight: 700; text-decoration: underline; margin-top: 8px; letter-spacing: 1px; }
.kartu-stok-info {
  display: grid; grid-template-columns: 90px 8px 1fr; gap: 2px;
  font-size: 11px; margin-bottom: 12px;
}
.kartu-stok-info .label { font-weight: 700; }
.kartu-stok-table {
  width: 100%; border-collapse: collapse; font-size: 10px; margin-bottom: 10px;
}
.kartu-stok-table th, .kartu-stok-table td {
  border: 1px solid #000; padding: 3px 5px; text-align: center; vertical-align: middle;
}
.kartu-stok-table th { background: #f0f0f0; font-weight: 700; }
.kartu-stok-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.kartu-stok-summary {
  display: grid; grid-template-columns: auto 1fr;
  gap: 4px 12px; font-size: 11px; margin: 12px 0;
  padding: 8px; background: #f8f8f8; border-radius: 4px;
}
.kartu-stok-summary .label { font-weight: 700; }
.kartu-stok-summary .value { text-align: right; }
.kartu-stok-sign { display: flex; justify-content: space-between; margin-top: 24px; font-size: 11px; }
.kartu-stok-sign .sign-box { text-align: center; }
.kartu-stok-sign .sign-space { height: 50px; }
.kartu-stok-sign .sign-line { border-top: 1px solid #000; padding-top: 3px; min-width: 120px; }
.kartu-stok-footnote { font-size: 9px; color: #666; text-align: right; margin-top: 8px; }

/* MONTH NAV */
.month-nav {
  display: flex; align-items: center; gap: var(--space-sm);
  padding: var(--space-md); background: var(--surface-2);
  border-radius: var(--radius-md); margin-bottom: var(--space-lg);
  justify-content: center;
}
.month-nav button {
  width: 36px; height: 36px; border-radius: var(--radius-md);
  display: flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--border);
}
.month-nav button:hover:not(:disabled) { background: var(--primary-bg); border-color: var(--primary); color: var(--primary); }
.month-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
.month-nav .current {
  font-weight: 700; font-size: var(--font-md); padding: 0 var(--space-lg);
  min-width: 180px; text-align: center;
}

/* OPNAME */
.opname-row input.stok-input {
  width: 100px; padding: 6px 10px; font-size: var(--font-md);
  border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
  text-align: right; font-variant-numeric: tabular-nums;
}
.opname-row input.stok-input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-bg); }
.opname-row input.stok-input.changed { background: var(--warning-bg); border-color: var(--warning); font-weight: 600; }
.opname-row .selisih-pos { color: var(--success); font-weight: 600; }
.opname-row .selisih-neg { color: var(--danger); font-weight: 600; }

/* EMPTY STATE */
.empty-state {
  text-align: center; padding: var(--space-2xl) var(--space-lg); color: var(--text-muted);
}
.empty-state svg { width: 48px; height: 48px; color: var(--text-light); margin-bottom: var(--space-md); }
.empty-state h3 { font-size: var(--font-md); color: var(--text); margin-bottom: 4px; }
.empty-state p { font-size: var(--font-sm); }

/* SPINNER */
.spinner {
  display: inline-block; width: 16px; height: 16px;
  border: 2px solid currentColor; border-right-color: transparent;

const Toast = {
  show(message, type, duration) {
    const container = U.$('#toast-container');
    // Hapus toast lama jika lebih dari MAX
    while (container.children.length >= CONFIG.MAX_TOAST) {
      container.removeChild(container.firstChild);
    }
    const el = document.createElement('div');
    el.className = 'toast ' + (type || 'info');
    const iconName = type === 'success' ? 'check' :
                    type === 'error' ? 'alertCircle' :
                    type === 'warning' ? 'alert' : 'info';
    el.innerHTML = U.icon(iconName, 18) + '<span>' + U.escapeHtml(message) + '</span>';
    container.appendChild(el);
    const dur = duration || (type === 'error' ? 5000 : 3000);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(10px)';
      el.style.transition = 'opacity 0.2s, transform 0.2s';
      setTimeout(() => el.remove(), 250);
    }, dur);
  },
  success(msg) { this.show(msg, 'success'); },
  error(msg) { this.show(msg, 'error', 6000); },
  warning(msg) { this.show(msg, 'warning', 4000); },
  info(msg) { this.show(msg, 'info'); }

/* ============================================================
   MODAL (dengan per-instance onClose)
   ============================================================ */
const Modal = {
  _currentOnClose: null,
  open(opts) {
    U.$('#modal-title').textContent = opts.title || '';
    const body = U.$('#modal-body');
    const footer = U.$('#modal-footer');
    body.innerHTML = '';
    footer.innerHTML = '';

    if (typeof opts.body === 'string') body.innerHTML = opts.body;
    else if (opts.body instanceof Node) body.appendChild(opts.body);

    (opts.actions || []).forEach(act => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (act.class || 'btn-secondary');
      btn.textContent = act.label;
      btn.addEventListener('click', () => {
        if (act.onClick) act.onClick();
        if (act.close !== false) Modal.close();
      });
      footer.appendChild(btn);
    });

    this._currentOnClose = opts.onClose || null;
    U.$('#modal-overlay').classList.add('active');
  },
  close() {
    U.$('#modal-overlay').classList.remove('active');
    const cb = this._currentOnClose;
    this._currentOnClose = null;
    if (cb) { try { cb(); } catch (e) { console.error(e); } }
  },
  confirm(title, message, onConfirm, confirmText, danger) {
    this.open({
      title: title,
      body: '<p>' + U.escapeHtml(message) + '</p>',
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        { label: confirmText || 'Ya, Lanjutkan',
          class: danger ? 'btn-danger' : 'btn-primary',
          onClick: onConfirm }
      ]
    });
  }
};

const Loading = {

/* ============================================================
   STORAGE
   ============================================================ */
const Store = {
  getSession() {
    try {
      const raw = sessionStorage.getItem('session');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  setSession(s) { sessionStorage.setItem('session', JSON.stringify(s)); },
  clearSession() { sessionStorage.removeItem('session'); },

  getMaster() {
    try {
      const raw = localStorage.getItem('master_data');
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed.expires && Date.now() > parsed.expires) {
        localStorage.removeItem('master_data');
        return null;
      }
      return parsed.data;
    } catch (e) { return null; }
  },
  setMaster(data) {
    try {
      localStorage.setItem('master_data', JSON.stringify({
        data: data, expires: Date.now() + CONFIG.MASTER_CACHE_TTL_MS
      }));
    } catch (e) {}
  },
  clearMaster() { localStorage.removeItem('master_data'); },

  getLogo() { return localStorage.getItem(CONFIG.LOGO_KEY) || ''; },
  setLogo(dataUrl) { localStorage.setItem(CONFIG.LOGO_KEY, dataUrl); },

  _dbPromise: null,
  _openDB() {
    if (this._dbPromise) return this._dbPromise;
    this._dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('gudang_queue', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('queue')) {
          db.createObjectStore('queue', { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
    return this._dbPromise;
  },
  async queueAdd(item) {
    try {
      const db = await this._openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('queue', 'readwrite');
        tx.objectStore('queue').add(item);
        tx.oncomplete = () => resolve(true);
        tx.onerror = e => reject(e.target.error);
      });
    } catch (e) { return false; }
  },
  async queueAll() {
    try {
      const db = await this._openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('queue', 'readonly');
        const req = tx.objectStore('queue').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = e => reject(e.target.error);
      });
    } catch (e) { return []; }
  },
  async queueRemove(id) {
    try {
      const db = await this._openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('queue', 'readwrite');
        tx.objectStore('queue').delete(id);
        tx.oncomplete = () => resolve(true);
        tx.onerror = e => reject(e.target.error);
      });
    } catch (e) { return false; }
  },
  async queueClear() {
    try {
      const db = await this._openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('queue', 'readwrite');
        tx.objectStore('queue').clear();
        tx.oncomplete = () => resolve(true);
        tx.onerror = e => reject(e.target.error);
      });
    } catch (e) { return false; }
  },
  async queueCount() {
    const all = await this.queueAll();
    return all.length;
  }
};

/* ============================================================
   API CLIENT
   ============================================================ */
class ApiError extends Error {
  constructor(code, message, raw) {
    super(message);
    this.code = code;
    this.raw = raw;
  }
}

const Api = {
  _buildRequest(action, payload, opts) {
    const session = Store.getSession();
    return {
      auth_token: CONFIG.API_KEY,
      session_token: (opts && opts.public) ? undefined : (session ? session.token : undefined),
      action: action,
      uuid: (opts && opts.noUuid) ? undefined : U.uuid(),
      timestamp_client: U.nowISO(),
      payload: payload || {}
    };
  },

  async _fetch(body, timeoutMs) {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), timeoutMs || CONFIG.REQUEST_TIMEOUT_MS);
    try {
      const res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
        signal: controller.signal,
        redirect: 'follow'
      });
      clearTimeout(tid);
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch (e) {
        throw new ApiError('SERVER_ERROR', 'Respons server tidak valid: ' + text.substring(0, 120));
      }
      return json;
    } catch (err) {
      clearTimeout(tid);
      if (err.name === 'AbortError') throw new ApiError('TIMEOUT', 'Request timeout. Coba lagi.');
      if (err instanceof ApiError) throw err;
      throw new ApiError('NETWORK', 'Koneksi gagal: ' + (err.message || err));
    }
  },

  async call(action, payload, opts) {
    opts = opts || {};
    const body = this._buildRequest(action, payload, opts);
    let lastError = null;

    for (let attempt = 0; attempt < CONFIG.RETRY_ATTEMPTS; attempt++) {
      if (attempt > 0) {
        const delay = Math.min(1000 * Math.pow(3, attempt - 1), 8000);
        await U.sleep(delay);
      }
      try {
        const res = await this._fetch(body);
        if (res.code === 200) return res;
        if (res.code === 401) {
          if (App.state.session) {
            Store.clearSession();
            App.state.session = null;
            Toast.error('Sesi berakhir. Silakan login ulang.');
            App.showLogin();
          }
          throw new ApiError(res.error_code || 'UNAUTHORIZED', res.message || 'Tidak berwenang');
        }
        if (res.code === 429) {
          lastError = new ApiError('RATE_LIMITED', res.message || 'Terlalu banyak permintaan');
          await U.sleep(5000);
          continue;
        }
        if (res.code >= 500 && attempt < CONFIG.RETRY_ATTEMPTS - 1) {
          lastError = new ApiError(res.error_code || 'SERVER_ERROR', res.message || 'Server error');
          continue;
        }
        throw new ApiError(res.error_code || 'ERROR', res.message || 'Terjadi kesalahan', res);
      } catch (err) {
        lastError = err;
        if (err.code === 'NETWORK' || err.code === 'TIMEOUT') {
          if (attempt < CONFIG.RETRY_ATTEMPTS - 1) continue;
        } else if (err.code !== 'RATE_LIMITED') {
          throw err;
        }
      }
    }
    throw lastError || new ApiError('UNKNOWN', 'Gagal setelah beberapa kali percobaan');
  },

  // Endpoints
  login(username, pin) { return this.call('login', { username, pin_plaintext: pin }, { public: true }); },
  logout() { return this.call('logout', {}); },
  whoAmI() { return this.call('whoAmI', {}); },
  getMasterData() { return this.call('getMasterData', {}); },
  getDashboardSummary() { return this.call('getDashboardSummary', {}); },
  getKartuStokBulanan(idBarang, bulan, tahun) {
    return this.call('getKartuStokBulanan', { id_barang: idBarang, bulan, tahun });
  },
  getExpiringItems(bulan) { return this.call('getExpiringItems', { bulan: bulan || 3 }); },
  simpanTransaksi(payload) { return this.call('simpanTransaksi', payload); },
  simpanOpnameBulk(payload) { return this.call('simpanOpnameBulk', payload); },
  editMasterData(payload) { return this.call('editMasterData', payload); },
  tambahMaster(payload) { return this.call('tambahMaster', payload); },
  hapusMaster(payload) { return this.call('hapusMaster', payload); },
  getAuditLog(payload) { return this.call('getAuditLog', payload); },
  ubahPin(payload) { return this.call('ubahPin', payload); },
  resetPin(idPetugas) { return this.call('resetPin', { id_petugas: idPetugas }); },
  getPendingApprovals() { return this.call('getPendingApprovals', {}); },
  approveTransaksi(idTrx, keputusan) {
    return this.call('approveTransaksi', { id_transaksi: idTrx, keputusan: keputusan });
  }
};

/* ============================================================
   QR SCANNER
   ============================================================ */
const QRScanner = {
  _stream: null, _videoEl: null, _rafId: null, _detector: null,
  _running: false, _lastText: '', _lastTime: 0, _onDetected: null,

  async start(videoEl, onDetected, onError) {
    this.stop();
    this._videoEl = videoEl;
    this._onDetected = onDetected;
    this._running = true;

    try {
      const constraints = {
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      };
      this._stream = await navigator.mediaDevices.getUserMedia(constraints);
      videoEl.srcObject = this._stream;
      videoEl.setAttribute('playsinline', '');
      videoEl.muted = true;
      await videoEl.play();

      if ('BarcodeDetector' in window) {
        try {
          this._detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13'] });
        } catch (e) { this._detector = null; }
      }

      if (!this._detector) {
        // Fallback: jika tidak ada BarcodeDetector, coba load html5-qrcode
        try {
          await this._loadHtml5Qrcode();
          if (window.Html5Qrcode) {
            // Minimal: scan via html5-qrcode (mirip native)
            this._html5Instance = new window.Html5Qrcode(videoEl.id || this._ensureId(videoEl));
            // Tidak mengimplementasi penuh; gunakan mode manual jika ini gagal
          }
        } catch (e) { /* silent — user tetap bisa pakai input manual */ }
      }

      this._loop();
    } catch (err) {
      if (onError) onError(err);
    }
  },

  _ensureId(el) {
    if (!el.id) el.id = 'scanner-video-' + Math.random().toString(36).substring(2, 8);
    return el.id;
  },

  _loadHtml5Qrcode() {
    return new Promise((resolve, reject) => {
      if (window.Html5Qrcode) return resolve(window.Html5Qrcode);
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
      script.onload = () => resolve(window.Html5Qrcode);
      script.onerror = () => reject(new Error('Gagal load html5-qrcode'));
      document.head.appendChild(script);
    });
  },

  async _loop() {
    if (!this._running) return;
    if (this._detector && this._videoEl && this._videoEl.readyState === 4) {
      try {
        const codes = await this._detector.detect(this._videoEl);
        if (codes && codes.length > 0) this._handle(codes[0].rawValue);
      } catch (e) { /* ignore */ }
    }
    this._rafId = requestAnimationFrame(() => this._loop());
  },

  _handle(text) {
    if (!text) return;
    const now = Date.now();
    if (text === this._lastText && (now - this._lastTime) < 2000) return;
    this._lastText = text;
    this._lastTime = now;
    if (this._onDetected) this._onDetected(text);
  },

  stop() {
    this._running = false;
    if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = null; }
    if (this._stream) {
      this._stream.getTracks().forEach(t => t.stop());
      this._stream = null;
    }
    if (this._videoEl) {
      try { this._videoEl.srcObject = null; } catch (e) {}
    }
    this._detector = null;
  },

  async toggleFlash() {
    if (!this._stream) return false;
    const track = this._stream.getVideoTracks()[0];
    if (!track) return false;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.torch) return false;
    const newTorch = !track.getSettings().torch;
    try {
      await track.applyConstraints({ advanced: [{ torch: newTorch }] });
      return newTorch;
    } catch (e) { return false; }
  }
};

  state: {

  },

      { id: 'master-rak', label: 'Data Lokasi Rak', icon: 'mapPin', roles: ['SuperAdmin','Apoteker'] },

    ]},
    { group: 'Tata Kelola', items: [
      { id: 'audit', label: 'Audit Log', icon: 'clipboard', roles: ['SuperAdmin','Apoteker'] },
      { id: 'settings', label: 'Pengaturan', icon: 'settings', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] }
    ]}
  ],

  BOTTOM_NAV: [
    { id: 'dashboard', label: 'Beranda', icon: 'dashboard', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] },
    { id: 'scan-in', label: 'Masuk', icon: 'arrowDown', roles: ['SuperAdmin','Apoteker','Gudang'] },
    { id: 'scan-out', label: 'Keluar', icon: 'arrowUp', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] },
    { id: 'kartu-stok', label: 'Kartu', icon: 'file', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] },
    { id: 'menu', label: 'Menu', icon: 'menu', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] }
  ],

  async init() {
    this.checkOnline();
    window.addEventListener('online', () => this.checkOnline());
    window.addEventListener('offline', () => this.checkOnline());

    const sess = Store.getSession();
    if (sess && sess.token) {
      this.state.session = sess;
      try {
        const res = await Api.whoAmI();
        if (res.code === 200) {
          this.state.session = Object.assign({}, sess, {
            nama: res.data.nama,
            role: res.data.role,
            username: res.data.username,
            wilayah_binaan: res.data.wilayah_binaan
          });
          Store.setSession(this.state.session);
          await this.showApp();
          await this.route(location.hash ? location.hash.substring(2) : 'dashboard');
          return;
        }
      } catch (err) { /* session invalid */ }
      Store.clearSession();
      this.state.session = null;
    }
    this.showLogin();
  },

  checkOnline() {
    this.state.online = navigator.onLine;
    const dot = U.$('#conn-dot');
    const txt = U.$('#conn-text');
    const badge = U.$('#offline-badge');
    if (dot) dot.classList.toggle('offline', !this.state.online);
    if (txt) txt.textContent = this.state.online ? 'Terhubung' : 'Offline';
    if (badge) badge.classList.toggle('visible', !this.state.online);
  },

  showLogin() {
    U.$('#login-screen').style.display = 'flex';
    U.$('#app').classList.remove('active');
    setTimeout(() => U.$('#login-username').focus(), 100);
  },

  async showApp() {
    U.$('#login-screen').style.display = 'none';
    U.$('#app').classList.add('active');
    this.renderShell();
    await this.loadMasterIfNeeded();
  },

  async loadMasterIfNeeded() {
    let master = Store.getMaster();
    if (!master) {
      try {
        const res = await Api.getMasterData();
        master = res.data;
        Store.setMaster(master);
      } catch (err) {
        Toast.error('Gagal memuat data master: ' + err.message);
        return;
      }
    }
    this.state.master = master;
  },

  async refreshMaster() {
    Store.clearMaster();
    this.state.master = null;
    await this.loadMasterIfNeeded();
  },

  renderShell() {
    const s = this.state.session;
    if (!s) return;
    U.$('#topbar-username').textContent = s.nama || s.username || '-';
    U.$('#topbar-role').textContent = s.role || '-';

    const sidebar = U.$('#sidebar');
    sidebar.innerHTML = '';
    this.MENU.forEach(group => {
      const visibleItems = group.items.filter(it => it.roles.indexOf(s.role) !== -1);
      if (visibleItems.length === 0) return;
      const g = document.createElement('div');
      g.className = 'sidebar-group';
      g.innerHTML = '<div class="sidebar-group-title">' + U.escapeHtml(group.group) + '</div>';
      visibleItems.forEach(it => {
        const a = document.createElement('a');
        a.className = 'sidebar-item';
        a.href = '#/' + it.id;
        a.dataset.route = it.id;
        a.innerHTML = U.icon(it.icon, 18) + '<span>' + U.escapeHtml(it.label) + '</span>';
        g.appendChild(a);
      });
      sidebar.appendChild(g);
    });

    const bn = U.$('#bottom-nav');
    bn.innerHTML = '';
    this.BOTTOM_NAV.forEach(it => {
      if (it.roles.indexOf(s.role) === -1) return;
      const a = document.createElement('a');
      a.className = 'bottom-nav-item';
      a.href = it.id === 'menu' ? '#' : '#/' + it.id;
      a.dataset.route = it.id;
      if (it.id === 'menu') a.dataset.action = 'menu';
      a.innerHTML = U.icon(it.icon, 22) + '<span>' + U.escapeHtml(it.label) + '</span>';
      bn.appendChild(a);
    });

    this.updateActiveNav();
  },

  updateActiveNav() {
    const route = this.state.currentRoute;
    U.$$('.sidebar-item').forEach(el => {
      el.classList.toggle('active', el.dataset.route === route);
    });
    U.$$('.bottom-nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.route === route);
    });
  },

  async route(route) {
    if (!this.state.session) { this.showLogin(); return; }
    this.state.currentRoute = route;
    this.updateActiveNav();
    U.$('#sidebar').classList.remove('open');
    U.$('#sidebar-backdrop').classList.remove('active');

    let pageTitle = 'Sistem Gudang';
    for (const g of this.MENU) {
      const it = g.items.find(i => i.id === route);
      if (it) { pageTitle = it.label; break; }
    }
    U.$('#topbar-title').textContent = pageTitle;

    const session = this.state.session;
    let allowed = false;
    for (const g of this.MENU) {
      const it = g.items.find(i => i.id === route);
      if (it && it.roles.indexOf(session.role) !== -1) { allowed = true; break; }
    }
    if (!allowed) {
      U.$('#main-content').innerHTML = this._renderEmpty('Akses Ditolak',
        'Anda tidak berwenang mengakses halaman ini.', 'alertCircle');
      return;
    }

    if (route !== 'scan-in' && route !== 'scan-out') QRScanner.stop();

    const main = U.$('#main-content');
    try {
      switch (route) {
        case 'dashboard':    await PageDashboard.render(main); break;
        case 'scan-in':      await PageScanIn.render(main); break;
        case 'scan-out':     await PageScanOut.render(main); break;
        case 'kartu-stok':   await PageKartuStok.render(main); break;
        case 'approval':     await PageApproval.render(main); break;
        case 'opname':       await PageOpname.render(main); break;
        case 'master-obat':     await PageMaster.render(main, 'Master_Obat'); break;
        case 'master-bmhp':     await PageMaster.render(main, 'Master_BMHP'); break;
        case 'master-supplier': await PageMaster.render(main, 'Ref_Supplier'); break;
        case 'master-unit':     await PageMaster.render(main, 'Ref_UnitInternal'); break;
        case 'master-rak':      await PageMaster.render(main, 'Ref_LokasiRak'); break;
        case 'master-petugas':  await PageMaster.render(main, 'Ref_Petugas'); break;
        case 'audit':        await PageAudit.render(main); break;
        case 'settings':     await PageSettings.render(main); break;
        default:
          main.innerHTML = this._renderEmpty('Halaman tidak ditemukan', '', 'alertCircle');
      }
    } catch (err) {
      console.error('[ROUTE_ERROR]', err);
      main.innerHTML = this._renderEmpty('Gagal Memuat',
        err.message || 'Terjadi kesalahan saat memuat halaman.', 'alertCircle');
    }

    window.scrollTo(0, 0);
  },

  _renderEmpty(title, desc, iconName) {
    return '<div class="empty-state">' + U.icon(iconName || 'info', 48) +
           '<h3>' + U.escapeHtml(title) + '</h3>' +
           (desc ? '<p>' + U.escapeHtml(desc) + '</p>' : '') + '</div>';
  },

  async logout() {
    try { await Api.logout(); } catch (e) {}
    Store.clearSession();
    Store.clearMaster();
    await Store.queueClear();
    // Bersihkan history scan in/out
    PageScanIn._history = [];
    PageScanOut._history = [];
    this.state.session = null;
    this.state.master = null;
    Toast.info('Anda telah keluar.');
    this.showLogin();
  }
};

    let summary = { total_item_kritis: 0, total_nilai_aset: 0, total_obat_mendekati_ed: 0, total_obat: 0, total_bmhp: 0 };

    try {
      const [resS, resE] = await Promise.all([
        Api.getDashboardSummary(),
        Api.getExpiringItems(3)
      ]);
      if (resS.code === 200) summary = resS.data || summary;
      if (resE.code === 200) expiring = resE.data || [];
    } catch (err) {
      container.innerHTML = App._renderEmpty('Gagal Memuat', err.message, 'alertCircle');
      return;
    }

    const session = App.state.session;
    const totalObat = Number(summary.total_obat) || 0;

    const html = '' +
      '<div class="page-header">' +
        '<div>' +
          '<div class="page-title">Selamat datang, ' + U.escapeHtml((session.nama || session.username).split(' ')[0]) + '</div>' +
          '<div class="page-desc">' + U.formatDateTime(new Date()) + '</div>' +
        '</div>' +
        '<button class="btn btn-secondary" id="btn-refresh">' + U.icon('refresh', 16) + ' Refresh</button>' +
      '</div>' +

      '<div class="stats-grid">' +
        this._statCard('primary', 'package', U.formatNumber(totalObat), 'Jenis Obat') +
        this._statCard('danger', 'alert', U.formatNumber(summary.total_item_kritis), 'Item Stok Kritis') +
        this._statCard('warning', 'alertCircle', U.formatNumber(summary.total_obat_mendekati_ed), 'Batch Mendekati ED') +
        this._statCard('success', 'trending', U.formatRupiah(summary.total_nilai_aset), 'Nilai Aset') +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">' +
          '<span>Obat Mendekati Kedaluwarsa (≤3 bulan)</span>' +
          '<span class="badge badge-warning">' + expiring.length + '</span>' +
        '</div>' +
        (expiring.length === 0
          ? '<div class="empty-state" style="padding:24px"><p>Tidak ada obat mendekati kedaluwarsa.</p></div>'
          : '<div class="table-scroll"><table class="data-table"><thead><tr>' +
            '<th>ID Obat</th><th>Batch</th><th>ED</th><th class="num">Sisa</th>' +
            '</tr></thead><tbody>' +
            expiring.slice(0, 10).map(it =>
              '<tr><td class="mono">' + U.escapeHtml(it.id_obat) + '</td>' +
              '<td class="mono">' + U.escapeHtml(it.no_batch) + '</td>' +
              '<td>' + U.escapeHtml(it.exp_date) + '</td>' +
              '<td class="num">' + U.formatNumber(it.sisa_stok) + '</td></tr>'
            ).join('') +
            '</tbody></table></div>'
        ) +
      '</div>';

    container.innerHTML = html;
    U.$('#btn-refresh', container).addEventListener('click', () => this.render(container));
  },

  _statCard(tone, iconName, value, label) {
    return '<div class="stat-card">' +
      '<div class="stat-icon ' + tone + '">' + U.icon(iconName, 20) + '</div>' +
      '<div class="stat-value">' + value + '</div>' +
      '<div class="stat-label">' + U.escapeHtml(label) + '</div>' +
    '</div>';
  }
};

    if (idBarang.indexOf('OBT-') !== 0 && idBarang.indexOf('BMP-') !== 0) {

      return;
    }
    const master = App.state.master;
    if (!master) { Toast.error('Data master belum dimuat'); return; }

    let item = null;
    if (idBarang.indexOf('OBT-') === 0) {
      item = (master.obat || []).find(o => o.ID_Obat === idBarang);
    } else {
      item = (master.bmhp || []).find(o => o.ID_BMHP === idBarang);
    }
    if (!item) { Toast.error('Barang tidak ditemukan di Master: ' + idBarang); return; }
    if (item.Status_Aktif === 'Nonaktif') { Toast.error('Barang dinonaktifkan: ' + idBarang); return; }

    this._selectedItem = item;
    this._renderForm();
  },

  _renderForm() {
    const item = this._selectedItem;
    const isObat = item.ID_Obat !== undefined;
    const idField = isObat ? 'ID_Obat' : 'ID_BMHP';
    const nameField = isObat ? 'Nama_Obat' : 'Nama_Barang';
    const master = App.state.master;

    const supplierOptions = (master.supplier || []).map(s =>
      '<option value="' + U.escapeHtml(s.ID_Supplier) + '">' + U.escapeHtml(s.Nama_Perusahaan) + '</option>'
    ).join('');

      '<div class="card">' +
        '<div class="card-title">' +
          '<span>' + U.icon('package', 18) + ' ' + U.escapeHtml(item[nameField]) + '</span>' +

          '<div class="text-muted">' + U.escapeHtml(item.Satuan || '-') + '</div></div>' +
        '</div>' +

        '<div class="card-title">Data Penerimaan</div>' +
        '<div class="field-row">' +
          '<div class="field">' +
            '<label class="field-label">Qty <span class="required">*</span></label>' +
            '<input type="number" class="input" id="f-qty" min="1" step="1" required autofocus>' +
          '</div>' +
          '<div class="field">' +
            '<label class="field-label">Sumber Dana <span class="required">*</span></label>' +

              '<input type="text" class="input" id="f-batch" placeholder="contoh: B2026-X9" required>' +
            '</div>' +

              '<label class="field-label">Exp. Date <span class="required">*</span></label>' +
              '<input type="date" class="input" id="f-ed" required>' +
            '</div>' +
          '</div>'
        : '') +

        (needVVM ? '' +
          '<div class="field">' +
            '<label class="field-label">Status VVM <span class="required">*</span></label>' +
            '<select class="select" id="f-vvm" required>' +
              '<option value="">— Pilih —</option>' +
              '<option value="A">A (Baik)</option>' +
              '<option value="B">B (Baik)</option>' +
              '<option value="C">C (Rusak — akan dikarantina)</option>' +

      e.preventDefault();
      this._submit();
    });

  async _submit() {
    if (this._submitting) return;
    this._submitting = true;

    const item = this._selectedItem;
    if (!item) { this._submitting = false; return; }
    const isObat = item.ID_Obat !== undefined;
    const idField = isObat ? 'ID_Obat' : 'ID_BMHP';

    const qty = Number(U.$('#f-qty').value);
    const sumber = U.$('#f-sumber').value;
    const supplier = U.$('#f-supplier').value;
    const dok = U.$('#f-dok').value.trim();
    const ket = U.$('#f-ket').value.trim();

    if (!qty || qty <= 0) { Toast.error('Qty harus > 0'); this._submitting = false; return; }
    if (!sumber) { Toast.error('Sumber Dana wajib'); this._submitting = false; return; }
    if (!supplier) { Toast.error('Supplier wajib'); this._submitting = false; return; }

    const payload = {
      id_barang: item[idField],
      tipe_mutasi: 'Masuk',
      qty: qty,
      sumber_dana: sumber,
      id_supplier: supplier,
      no_dokumen: dok,
      keterangan: ket
    };

    if (isObat) {
      const batch = U.$('#f-batch').value.trim();
      const ed = U.$('#f-ed').value;
      if (!batch) { Toast.error('No. Batch wajib'); this._submitting = false; return; }
      if (!ed) { Toast.error('Exp. Date wajib'); this._submitting = false; return; }
      payload.no_batch = batch;
      payload.exp_date = ed;
      const vvmEl = U.$('#f-vvm');
      if (vvmEl) {
        if (!vvmEl.value) { Toast.error('Status VVM wajib'); this._submitting = false; return; }
        payload.status_vvm = vvmEl.value;
      }
    }

    const btn = U.$('#btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Menyimpan...';

    try {
      const res = await Api.simpanTransaksi(payload);
      U.vibrate([50, 50, 50]);
      U.beepSuccess();
      Toast.success('Transaksi berhasil: ' + res.data.id_transaksi);

      this._history.unshift({
        id: item[idField],
        nama: item.Nama_Obat || item.Nama_Barang,
        qty: qty,
        time: new Date()
      });
      if (this._history.length > 10) this._history.pop();
      this._renderHistory();

      this._selectedItem = null;
      U.$('#form-area').innerHTML = '';
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = U.icon('check', 16) + ' Simpan';
      }
    } finally {
      this._submitting = false;
    }
  },

  _renderHistory() {
    const el = U.$('#scan-history');
    if (!el) return;
    if (this._history.length === 0) {
      el.innerHTML = '<div class="text-muted" style="font-size:13px;text-align:center;padding:12px">Belum ada scan.</div>';
      return;
    }
    el.innerHTML = this._history.map(h =>
      '<div class="scan-history-item">' +
        '<span class="check">' + U.icon('check', 16) + '</span>' +
        '<span><strong>' + U.escapeHtml(h.id) + '</strong> — ' + U.escapeHtml(h.nama) + ' (' + h.qty + ')</span>' +
        '<span class="time">' + h.time.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) + '</span>' +
      '</div>'
    ).join('');
  }
};

              '<option value="A">A (Baik)</option>' +
              '<option value="B">B (Baik)</option>' +
              '<option value="C">C (Rusak — karantina)</option>' +
              '<option value="D">D (Rusak — karantina)</option>' +
            '</select>' +
          '</div>'
        : '') +
        '<div class="field">' +
          '<label class="field-label">No. Dokumen (Resep/Amprahan)</label>' +
          '<input type="text" class="input" id="f-dok" placeholder="contoh: R/2026/09/001">' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label">Keterangan</label>' +
          '<textarea class="textarea" id="f-ket"></textarea>' +
        '</div>' +
        '<div class="flex gap-2 mt-3" style="flex-wrap:wrap">' +
          '<button type="button" class="btn btn-secondary" id="btn-cancel">Batal</button>' +
          '<button type="submit" class="btn btn-primary" id="btn-submit">' +
            U.icon('check', 16) + ' Simpan' +
          '</button>' +
        '</div>' +
      '</form>';

    U.$('#form-area').innerHTML = html;
    U.$('#btn-cancel').addEventListener('click', () => {
      this._selectedItem = null;
      U.$('#form-area').innerHTML = '';
    });
    U.$('#scan-form').addEventListener('submit', (e) => {
      e.preventDefault();
      this._submit();
    });
  },

  async _submit() {
    if (this._submitting) return;
    this._submitting = true;

    const item = this._selectedItem;
    if (!item) { this._submitting = false; return; }
    const isObat = item.ID_Obat !== undefined;
    const idField = isObat ? 'ID_Obat' : 'ID_BMHP';

    const qty = Number(U.$('#f-qty').value);
    const unit = U.$('#f-unit').value;
    const dok = U.$('#f-dok').value.trim();
    const ket = U.$('#f-ket').value.trim();

    if (!qty || qty <= 0) { Toast.error('Qty harus > 0'); this._submitting = false; return; }
    if (!unit) { Toast.error('Unit tujuan wajib'); this._submitting = false; return; }

    const payload = {
      id_barang: item[idField],
      tipe_mutasi: 'Keluar',
      qty: qty,
      id_unit: unit,
      no_dokumen: dok,
      keterangan: ket
    };
    if (isObat) {
      const vvmEl = U.$('#f-vvm');
      if (vvmEl && vvmEl.value) payload.status_vvm = vvmEl.value;
    }

    const btn = U.$('#btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Menyimpan...';

    try {
      const res = await Api.simpanTransaksi(payload);
      U.vibrate([50, 50, 50]);
      U.beepSuccess();
      const isPending = res.data && res.data.status_approval === 'Pending';
      Toast.success('Transaksi berhasil: ' + res.data.id_transaksi +
                    (isPending ? ' (menunggu approval)' : ''));

      this._history.unshift({
        id: item[idField], nama: item.Nama_Obat || item.Nama_Barang,
        qty: qty, time: new Date()
      });
      if (this._history.length > 10) this._history.pop();
      this._renderHistory();
      this._selectedItem = null;
      U.$('#form-area').innerHTML = '';
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
      if (err.code === 'STOK_KURANG') {
        // Emergency override dengan approval handling
        const isApprover = ['SuperAdmin','Apoteker'].indexOf(App.state.session.role) !== -1;
        const prompt = isApprover
          ? err.message + '\n\nLanjutkan sebagai pengeluaran darurat?'
          : err.message + '\n\nLanjutkan sebagai pengeluaran darurat?\n\n' +
            '(Pengeluaran ini akan menunggu approval Apoteker sebelum dihitung)';
        Modal.confirm(
          'Stok Tidak Mencukupi', prompt,
          async () => {
            payload.is_emergency = true;
            try {
              const res2 = await Api.simpanTransaksi(payload);
              const pending = res2.data && res2.data.status_approval === 'Pending';
              Toast.success('Pengeluaran darurat tersimpan: ' + res2.data.id_transaksi +
                            (pending ? ' (menunggu approval)' : ''));
              this._history.unshift({
                id: item[idField], nama: item.Nama_Obat || item.Nama_Barang,
                qty: qty, time: new Date()
              });
              if (this._history.length > 10) this._history.pop();
              this._renderHistory();
              this._selectedItem = null;
              U.$('#form-area').innerHTML = '';
            } catch (err2) {
              Toast.error('Gagal: ' + err2.message);
            }
          }, 'Ya, Darurat', true
        );
      }
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = U.icon('check', 16) + ' Simpan';
      }
    } finally {
      this._submitting = false;
    }
  },

  _renderHistory() {
    const el = U.$('#scan-history');
    if (!el) return;
    if (this._history.length === 0) {
      el.innerHTML = '<div class="text-muted" style="font-size:13px;text-align:center;padding:12px">Belum ada scan.</div>';
      return;
    }
    el.innerHTML = this._history.map(h =>
      '<div class="scan-history-item">' +
        '<span class="check">' + U.icon('check', 16) + '</span>' +
        '<span><strong>' + U.escapeHtml(h.id) + '</strong> — ' + U.escapeHtml(h.nama) + ' (' + h.qty + ')</span>' +
        '<span class="time">' + h.time.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) + '</span>' +
      '</div>'
    ).join('');
  }
};

const PageKartuStok = {
  _currentData: null,
  _selectedId: null,
  _selectedBulan: null,
  _selectedTahun: null,
  _clickHandler: null,

  async render(container) {
    const now = new Date();
    this._selectedBulan = now.getMonth() + 1;
    this._selectedTahun = now.getFullYear();

    container.innerHTML = '' +
      '<div class="page-header no-print">' +
        '<div><div class="page-title">Kartu Stok</div>' +
        '<div class="page-desc">Riwayat mutasi barang per bulan</div></div>' +
      '</div>' +
      '<div class="card no-print">' +
        '<div class="field-row">' +
          '<div class="field">' +
            '<label class="field-label">Barang <span class="required">*</span></label>' +
            '<input type="text" class="input" id="ks-item-search" placeholder="Cari nama atau kode..." autocomplete="off">' +
            '<div id="ks-item-suggestions" style="position:relative"></div>' +
            '<input type="hidden" id="ks-item-id">' +
          '</div>' +
          '<div class="field">' +
            '<label class="field-label">Tahun</label>' +
            '<select class="select" id="ks-tahun">' +
              Array.from({length:5}, (_, i) => now.getFullYear() - 2 + i).map(y =>
                '<option value="' + y + '"' + (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>'
              ).join('') +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-2 mt-2" style="flex-wrap:wrap">' +
          '<button class="btn btn-primary" id="ks-load">' + U.icon('search', 16) + ' Tampilkan</button>' +
        '</div>' +
      '</div>' +
      '<div id="ks-nav"></div>' +
      '<div id="ks-result"></div>';

    const searchEl = U.$('#ks-item-search');
    const suggestEl = U.$('#ks-item-suggestions');
    const idEl = U.$('#ks-item-id');

    const onSearch = U.debounce(() => {
      const q = searchEl.value.trim().toLowerCase();
      if (!q) { suggestEl.innerHTML = ''; return; }
      const master = App.state.master || {};
      const items = [];
      (master.obat || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (o.Nama_Obat.toLowerCase().indexOf(q) !== -1 || o.ID_Obat.toLowerCase().indexOf(q) !== -1) {
          items.push({ id: o.ID_Obat, nama: o.Nama_Obat, tipe: 'Obat' });
        }
      });
      (master.bmhp || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (o.Nama_Barang.toLowerCase().indexOf(q) !== -1 || o.ID_BMHP.toLowerCase().indexOf(q) !== -1) {
          items.push({ id: o.ID_BMHP, nama: o.Nama_Barang, tipe: 'BMHP' });
        }
      });

      suggestEl.innerHTML = items.slice(0, 8).map(it =>
        '<div class="sidebar-item" style="cursor:pointer;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--radius-sm);margin-top:2px" data-id="' + U.escapeHtml(it.id) + '" data-nama="' + U.escapeHtml(it.nama) + '">' +
          '<span>' + U.escapeHtml(it.nama) + '</span>' +
          '<span class="badge badge-muted" style="margin-left:auto">' + it.tipe + '</span>' +
        '</div>'
      ).join('');

      suggestEl.querySelectorAll('[data-id]').forEach(el => {
        el.addEventListener('click', () => {
          idEl.value = el.dataset.id;
          searchEl.value = el.dataset.nama + ' (' + el.dataset.id + ')';
          suggestEl.innerHTML = '';
        });
      });
    }, 200);

    searchEl.addEventListener('input', onSearch);

    // FIX K1: listener di container (bukan document) agar tidak memory leak
    if (this._clickHandler) container.removeEventListener('click', this._clickHandler);
    this._clickHandler = (e) => {
      if (!e.target.closest('#ks-item-suggestions') && e.target !== searchEl) {
        suggestEl.innerHTML = '';
      }
    };
    container.addEventListener('click', this._clickHandler);

    U.$('#ks-load').addEventListener('click', () => {
      const id = idEl.value;
      if (!id) { Toast.error('Pilih barang dulu'); return; }
      this._selectedId = id;
      this._selectedBulan = Number(U.$('#ks-bulan') ? U.$('#ks-bulan').value : this._selectedBulan) || this._selectedBulan;
      this._selectedTahun = Number(U.$('#ks-tahun').value) || this._selectedTahun;
      this._loadData(container);
    });
  },

  _renderMonthNav() {
    const navEl = U.$('#ks-nav');
    if (!navEl || !this._selectedId) { if (navEl) navEl.innerHTML = ''; return; }
    const nama = U.formatMonthName(this._selectedBulan);
    navEl.innerHTML = '' +
      '<div class="month-nav no-print">' +
        '<button id="ks-prev" aria-label="Bulan sebelumnya">' + U.icon('chevronLeft', 18) + '</button>' +
        '<div class="current">' + nama + ' ' + this._selectedTahun + '</div>' +
        '<button id="ks-next" aria-label="Bulan berikutnya">' + U.icon('chevronRight', 18) + '</button>' +
      '</div>';

    U.$('#ks-prev').addEventListener('click', () => {
      let b = this._selectedBulan - 1;
      let t = this._selectedTahun;
      if (b < 1) { b = 12; t--; }
      this._selectedBulan = b;
      this._selectedTahun = t;
      this._loadData(U.$('#main-content'));
    });
    U.$('#ks-next').addEventListener('click', () => {
      let b = this._selectedBulan + 1;
      let t = this._selectedTahun;
      if (b > 12) { b = 1; t++; }
      this._selectedBulan = b;
      this._selectedTahun = t;
      this._loadData(U.$('#main-content'));
    });
  },

  async _loadData(container) {
    if (!this._selectedId) return;

    const btn = U.$('#ks-load');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Memuat...';
    }

    try {
      const res = await Api.getKartuStokBulanan(
        this._selectedId, this._selectedBulan, this._selectedTahun);
      this._currentData = res.data;
      this._renderMonthNav();
      this._renderPreview(res.data);
    } catch (err) {
      Toast.error('Gagal memuat: ' + err.message);
      U.$('#ks-result').innerHTML = App._renderEmpty('Gagal memuat data', err.message, 'alertCircle');
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = U.icon('search', 16) + ' Tampilkan';
      }
    }
  },

  _renderPreview(data) {
    const bulanNama = U.formatMonthName(data.bulan).toUpperCase();
    const logo = Store.getLogo();

    let running = data.saldo_awal;
    const rows = (data.riwayat_mentah || []).map(r => {
      const isMasuk = r.Tipe_Mutasi === 'Masuk';
      const isKeluar = ['Keluar','Karantina','Retur_Supplier','Rusak'].indexOf(r.Tipe_Mutasi) !== -1;
      const qty = Number(r.Qty) || 0;
      if (isMasuk) running += qty;
      else if (isKeluar) running -= qty;
      const d = new Date(r.Timestamp);
      const tgl = isNaN(d.getTime()) ? '-' :
        String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
      return '<tr>' +
        '<td>' + tgl + '</td>' +
        '<td class="mono" style="font-size:9px">' + U.escapeHtml(String(r.ID_Transaksi || '').substring(0, 14)) + '</td>' +
        '<td class="mono">' + U.escapeHtml(r.No_Batch || '-') + '</td>' +
        '<td>' + (r.Exp_Date ? U.formatDate(r.Exp_Date) : '-') + '</td>' +
        '<td class="num">' + (isMasuk ? qty : '') + '</td>' +
        '<td class="num">' + (isKeluar ? qty : '') + '</td>' +
        '<td class="num">' + running + '</td>' +
        '<td></td>' +
      '</tr>';
    }).join('');

    const html = '' +
      '<div class="card no-print" style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="ks-print">' + U.icon('printer', 16) + ' Cetak</button>' +
        '<button class="btn btn-secondary" id="ks-xlsx">' + U.icon('download', 16) + ' Unduh XLSX</button>' +
      '</div>' +
      '<div id="print-area">' +
      '<div class="kartu-stok-preview">' +
        '<div class="kartu-stok-header">' +
          (logo ? '<img src="' + logo + '" style="height:40px;margin:0 auto 4px">' : '') +
          '<h1>PEMERINTAH KABUPATEN BANTUL</h1>' +
          '<h2>PUSKESMAS SANDEN</h2>' +
          '<h3>KARTU STOK BULANAN</h3>' +
        '</div>' +
        '<div class="kartu-stok-info">' +
          '<div class="label">Nama</div><div>:</div><div>' + U.escapeHtml(data.nama) + '</div>' +
          '<div class="label">Kode</div><div>:</div><div>' + U.escapeHtml(data.id_barang) + '</div>' +
          '<div class="label">Satuan</div><div>:</div><div>' + U.escapeHtml(data.satuan || '-') + '</div>' +
          '<div class="label">Rak</div><div>:</div><div>' + U.escapeHtml(data.rak || '-') + '</div>' +
          '<div class="label">Bulan</div><div>:</div><div><strong>' + bulanNama + ' ' + data.tahun + '</strong></div>' +
        '</div>' +
        '<table class="kartu-stok-table">' +
          '<thead><tr>' +
            '<th style="width:8%">Tgl</th>' +
            '<th style="width:18%">No Trx</th>' +
            '<th style="width:14%">Batch</th>' +
            '<th style="width:12%">ED</th>' +
            '<th style="width:10%">Masuk</th>' +
            '<th style="width:10%">Keluar</th>' +
            '<th style="width:10%">Sisa</th>' +
            '<th style="width:18%">Paraf</th>' +
          '</tr></thead>' +
          '<tbody>' +
            '<tr><td colspan="6" style="text-align:right"><strong>Saldo Awal</strong></td>' +
              '<td class="num"><strong>' + data.saldo_awal + '</strong></td><td></td></tr>' +
            (rows || '<tr><td colspan="8" style="text-align:center;padding:8px">Tidak ada transaksi bulan ini</td></tr>') +
            '<tr><td colspan="4" style="text-align:right"><strong>Total</strong></td>' +
              '<td class="num"><strong>' + data.total_in + '</strong></td>' +
              '<td class="num"><strong>' + data.total_out + '</strong></td>' +
              '<td class="num"><strong>' + data.saldo_akhir + '</strong></td><td></td></tr>' +
          '</tbody>' +
        '</table>' +
        '<div class="kartu-stok-summary">' +
          '<div class="label">Saldo Awal</div><div class="value">' + data.saldo_awal + '</div>' +
          '<div class="label">Total Masuk</div><div class="value">' + data.total_in + '</div>' +
          '<div class="label">Total Keluar</div><div class="value">' + data.total_out + '</div>' +
          '<div class="label">Saldo Akhir</div><div class="value"><strong>' + data.saldo_akhir + '</strong></div>' +
        '</div>' +
        '<div class="kartu-stok-sign">' +
          '<div class="sign-box">' +
            '<div>Petugas Gudang</div>' +
            '<div class="sign-space"></div>' +
            '<div class="sign-line">(................................)</div>' +
          '</div>' +
          '<div class="sign-box">' +
            '<div>Bantul, ' + U.formatDate(new Date()) + '</div>' +
            '<div>Apoteker PJ</div>' +
            '<div class="sign-space" style="height:32px"></div>' +
            '<div class="sign-line">(................................)</div>' +
          '</div>' +
        '</div>' +
        '<div class="kartu-stok-footnote">' +
          'Dicetak: ' + U.formatDateTime(new Date()) + ' · Sistem Gudang Puskesmas Sanden' +
        '</div>' +
      '</div>' +
      '</div>';

    U.$('#ks-result').innerHTML = html;
    U.$('#ks-print').addEventListener('click', () => window.print());
    U.$('#ks-xlsx').addEventListener('click', () => this._downloadXLSX(data));
  },

  _downloadXLSX(data) {
    this._ensureSheetJS().then(XLSX => {
      const wb = XLSX.utils.book_new();
      const info = [
        ['KARTU STOK — INFO BARANG'], [''],
        ['Nama', data.nama], ['Kode', data.id_barang],
        ['Satuan', data.satuan], ['Rak', data.rak],
        ['Bulan', U.formatMonthName(data.bulan) + ' ' + data.tahun], [''],
        ['Saldo Awal', data.saldo_awal],
        ['Total Masuk', data.total_in],
        ['Total Keluar', data.total_out],
        ['Saldo Akhir', data.saldo_akhir],
        [''], ['Dicetak', U.formatDateTime(new Date())]
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'Info');

      let saldo = data.saldo_awal;
      const riwayat = [['Tanggal', 'ID Transaksi', 'Tipe', 'Qty', 'Batch', 'ED', 'Masuk', 'Keluar', 'Saldo', 'Keterangan']];
      (data.riwayat_mentah || []).forEach(r => {
        const isMasuk = r.Tipe_Mutasi === 'Masuk';
        const isKeluar = ['Keluar','Karantina','Retur_Supplier','Rusak'].indexOf(r.Tipe_Mutasi) !== -1;
        const qty = Number(r.Qty) || 0;
        if (isMasuk) saldo += qty;
        else if (isKeluar) saldo -= qty;
        riwayat.push([
          U.formatDate(r.Timestamp), r.ID_Transaksi, r.Tipe_Mutasi, qty,
          r.No_Batch || '', r.Exp_Date ? U.formatDate(r.Exp_Date) : '',
          isMasuk ? qty : '', isKeluar ? qty : '', saldo, r.Keterangan || ''
        ]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(riwayat), 'Riwayat');
      const fname = 'KartuStok_' + data.id_barang + '_' + data.tahun + '-' +
                    String(data.bulan).padStart(2, '0') + '.xlsx';
      XLSX.writeFile(wb, fname);
      Toast.success('File XLSX berhasil diunduh');
    }).catch(err => Toast.error('Gagal memuat SheetJS: ' + err.message));
  },

  _ensureSheetJS() {
    return new Promise((resolve, reject) => {
      if (window.XLSX) return resolve(window.XLSX);
      const script = document.createElement('script');
      script.src = 'https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js';
      script.onload = () => resolve(window.XLSX);
      script.onerror = () => reject(new Error('Gagal load SheetJS'));
      document.head.appendChild(script);
    });
  }
};

          '</div>';

        if (items.some(it => it.keterangan)) {
          html += '<div class="card"><div class="card-title">Keterangan</div><ul style="font-size:13px;line-height:1.8">' +
            items.filter(it => it.keterangan).slice(0, 5).map(it =>
              '<li><strong>' + U.escapeHtml(it.id_transaksi) + ':</strong> ' + U.escapeHtml(it.keterangan) + '</li>'
            ).join('') + '</ul></div>';
        }
      }

      container.innerHTML = html;

      U.$('#btn-refresh').addEventListener('click', () => this.render(container));
      U.$$('[data-action]', container).forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.id;
          const action = btn.dataset.action;
          this._handleApproval(id, action, container);
        });
      });
    } catch (err) {
      container.innerHTML = App._renderEmpty('Gagal Memuat', err.message, 'alertCircle');
    }
  },

  _handleApproval(idTrx, action, container) {
    const keputusan = action === 'approve' ? 'Approved' : 'Rejected';
    const label = action === 'approve' ? 'setujui' : 'tolak';
    Modal.confirm(
      (action === 'approve' ? 'Setujui' : 'Tolak') + ' Transaksi',
      'Yakin ingin ' + label + ' transaksi ' + idTrx + '?',
      async () => {
        try {
          await Api.approveTransaksi(idTrx, keputusan);
          Toast.success('Transaksi ' + idTrx + ' telah di-' + keputusan);
          this.render(container);
        } catch (err) {
          Toast.error('Gagal: ' + err.message);
        }
      },
      action === 'approve' ? 'Ya, Setujui' : 'Ya, Tolak',
      action !== 'approve'
    );
  }
};
