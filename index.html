const PageOpname = {
  _entries: {},
  _submitting: false,

  async render(container) {
    this._entries = {};
    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div><div class="page-title">Stock Opname</div>' +
        '<div class="page-desc">Sinkronisasi stok fisik dengan sistem</div></div>' +
        '<button class="btn btn-primary" id="btn-submit-opname" disabled>' +
          U.icon('check', 16) + ' Simpan Opname' +
        '</button>' +
      '</div>' +
      '<div class="card">' +
        '<p class="text-muted" style="font-size:13px;margin-bottom:12px">' +
          'Masukkan stok fisik yang Anda hitung. Baris yang berbeda akan disorot oranye. ' +
          'Sistem akan menghitung selisih secara otomatis saat disimpan.' +
        '</p>' +
        '<div class="field">' +
          '<input class="input" id="opname-search" placeholder="Cari barang...">' +
        '</div>' +
      '</div>' +
      '<div id="opname-table-container"></div>';

    U.$('#btn-submit-opname').addEventListener('click', () => this._submit());
    U.$('#opname-search').addEventListener('input', U.debounce(() => this._renderTable(), 200));
    this._renderTable();
  },

  _renderTable() {
    const master = App.state.master || {};
    const q = (U.$('#opname-search') ? U.$('#opname-search').value : '').toLowerCase().trim();
    const items = [];

    (master.obat || []).forEach(o => {
      if (o.Status_Aktif === 'Nonaktif') return;
      items.push({ id: o.ID_Obat, nama: o.Nama_Obat, tipe: 'Obat', satuan: o.Satuan, rak: o.Lokasi_Rak });
    });
    (master.bmhp || []).forEach(o => {
      if (o.Status_Aktif === 'Nonaktif') return;
      items.push({ id: o.ID_BMHP, nama: o.Nama_Barang, tipe: 'BMHP', satuan: o.Satuan, rak: o.Lokasi_Rak });
    });

    const filtered = q
      ? items.filter(it => it.nama.toLowerCase().indexOf(q) !== -1 || it.id.toLowerCase().indexOf(q) !== -1)
      : items;

    if (filtered.length === 0) {
      U.$('#opname-table-container').innerHTML = App._renderEmpty('Tidak ada item', '', 'package');
      return;
    }

    const html = '<div class="table-wrap"><div class="table-scroll"><table class="data-table">' +
      '<thead><tr>' +
        '<th>Kode</th><th>Nama</th><th>Rak</th>' +
        '<th class="num">Stok Fisik</th><th>Status</th>' +
      '</tr></thead><tbody>' +
      filtered.map(it =>
        '<tr class="opname-row" data-id="' + U.escapeHtml(it.id) + '" data-nama="' + U.escapeHtml(it.nama) + '" data-satuan="' + U.escapeHtml(it.satuan || '') + '">' +
          '<td class="mono">' + U.escapeHtml(it.id) + '</td>' +
          '<td><div style="font-weight:600">' + U.escapeHtml(it.nama) + '</div>' +
            '<div class="text-muted" style="font-size:11px">' + U.escapeHtml(it.satuan || '-') + ' · ' + it.tipe + '</div></td>' +
          '<td class="mono">' + U.escapeHtml(it.rak || '-') + '</td>' +
          '<td class="num"><input type="number" class="stok-input" min="0" step="1" inputmode="numeric" placeholder="—"></td>' +
          '<td><span class="text-muted" style="font-size:12px">—</span></td>' +
        '</tr>'
      ).join('') +
      '</tbody></table></div></div>';

    U.$('#opname-table-container').innerHTML = html;

    U.$$('.opname-row .stok-input').forEach(input => {
      input.addEventListener('input', () => {
        const row = input.closest('.opname-row');
        const id = row.dataset.id;
        const val = input.value.trim();
        const statusEl = row.querySelector('td:last-child span');
        if (val === '' || isNaN(Number(val))) {
          input.classList.remove('changed');
          statusEl.textContent = '—';
          statusEl.className = 'text-muted';
          delete this._entries[id];
        } else {
          input.classList.add('changed');
          this._entries[id] = Number(val);
          statusEl.textContent = '✓ akan disimpan';
          statusEl.className = 'text-success';
        }
        this._updateSubmitButton();
      });
    });
  },

  _updateSubmitButton() {
    const count = Object.keys(this._entries).length;
    const btn = U.$('#btn-submit-opname');
    if (btn) {
      btn.disabled = count === 0;
      btn.innerHTML = U.icon('check', 16) + ' Simpan Opname (' + count + ')';
    }
  },

  async _submit() {
    if (this._submitting) return;
    const ids = Object.keys(this._entries);
    if (ids.length === 0) { Toast.error('Belum ada data'); return; }

    Modal.confirm(
      'Konfirmasi Opname',
      'Stok fisik akan dicatat untuk ' + ids.length + ' item. Sistem akan menghitung ' +
      'selisih dan membuat penyesuaian otomatis.\n\nLanjutkan?',
      async () => {
        this._submitting = true;
        Loading.show();
        try {
          // Frontend kirim { id_barang, stok_fisik, keterangan } saja
          // Backend hitung stok_sistem real-time
          const payload = ids.map(id => ({
            id_barang: id,
            stok_fisik: this._entries[id],
            keterangan: 'Opname via aplikasi'
          }));

          const res = await Api.simpanOpnameBulk(payload);
          Toast.success(res.message || 'Opname tersimpan');
          this._entries = {};
          this.render(U.$('#main-inner'));
        } catch (err) {
          Toast.error('Gagal: ' + err.message);
        } finally {
          Loading.hide();
          this._submitting = false;
        }
      }, 'Ya, Simpan', false
    );
  }
};

        if (o.Status_Aktif === 'Nonaktif') return;
        if (rak && o.Lokasi_Rak !== rak) return;
        if (q && o.Nama_Obat.toLowerCase().indexOf(q) === -1 && o.ID_Obat.toLowerCase().indexOf(q) === -1) return;
        items.push({
          id: o.ID_Obat, nama: o.Nama_Obat, rak: o.Lokasi_Rak,
          satuan: o.Satuan, tipe: 'Obat'
        });
      });
    }
    if (tipe !== 'obat') {
      (master.bmhp || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (rak && o.Lokasi_Rak !== rak) return;
        if (q && o.Nama_Barang.toLowerCase().indexOf(q) === -1 && o.ID_BMHP.toLowerCase().indexOf(q) === -1) return;
        items.push({
          id: o.ID_BMHP, nama: o.Nama_Barang, rak: o.Lokasi_Rak,
          satuan: o.Satuan, tipe: 'BMHP'
        });
      });
    }
    items.sort((a, b) => a.id.localeCompare(b.id));
    return items;
  },

  _renderCheckboxList() {
    const items = this._getFilteredItems();
    const list = U.$('#qr-checkbox-list');
    if (items.length === 0) {
      list.innerHTML = '<div class="empty-state" style="padding:24px"><p class="text-muted">Tidak ada item</p></div>';
      return;
    }
    list.innerHTML = items.map(it => {
      const checked = this._selected.has(it.id);
      return '' +
        '<label class="qr-check-item' + (checked ? ' checked' : '') + '" data-id="' + U.escapeHtml(it.id) + '">' +
          '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
          '<div class="info">' +
            '<div class="id">' + U.escapeHtml(it.id) + '</div>' +
            '<div class="name">' + U.escapeHtml(it.nama) + '</div>' +
            '<div class="rak">' + U.escapeHtml(it.rak || '-') + ' · ' + U.escapeHtml(it.satuan || '-') + ' · ' + it.tipe + '</div>' +
          '</div>' +
        '</label>';
    }).join('');

    U.$$('.qr-check-item', list).forEach(el => {
      const cb = el.querySelector('input[type="checkbox"]');
      el.addEventListener('click', (e) => {
        if (e.target.tagName === 'INPUT') return; // biarkan browser handle
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event('change'));
      });
      cb.addEventListener('change', () => {
        const id = el.dataset.id;
        if (cb.checked) this._selected.add(id);
        else this._selected.delete(id);
        el.classList.toggle('checked', cb.checked);
        this._refreshAfterSelection();
      });
    });
  },

  _selectAll() {
    const items = this._getFilteredItems();
    if (items.length > CONFIG.MAX_QR_PRINT) {
      Toast.warning('Maksimal ' + CONFIG.MAX_QR_PRINT + ' label per cetak. Hanya item pertama yang dipilih.');
    }
    const toSelect = items.slice(0, CONFIG.MAX_QR_PRINT);
    this._selected.clear();
    toSelect.forEach(it => this._selected.add(it.id));
    this._renderCheckboxList();
    this._refreshAfterSelection();
  },

  _selectInvert() {
    const items = this._getFilteredItems();
    const next = new Set();
    items.forEach(it => {
      if (!this._selected.has(it.id)) next.add(it.id);
    });
    this._selected = next;
    this._renderCheckboxList();
    this._refreshAfterSelection();
  },

  _refreshAfterSelection() {
    U.$('#qr-count-badge').textContent = this._selected.size + ' label';
    U.$('#qr-print').disabled = this._selected.size === 0;
    U.$('#qr-download').disabled = this._selected.size === 0;
    this._renderPreview();
  },

  async _renderPreview() {
    if (this._rendering) return;
    this._rendering = true;
    const preview = U.$('#qr-preview');
    const selectedIds = Array.from(this._selected);

    if (selectedIds.length === 0) {
      preview.innerHTML = '<div class="empty-state" style="padding:40px">' +
        U.icon('qr', 42) +
        '<h3>Belum ada label dipilih</h3>' +
        '<p>Pilih item di panel kiri untuk melihat preview.</p>' +
        '</div>';
      this._rendering = false;
      return;
    }

    if (selectedIds.length > CONFIG.MAX_QR_PRINT) {
      preview.innerHTML = App._renderEmpty('Terlalu banyak',
        'Maksimal ' + CONFIG.MAX_QR_PRINT + ' label per cetak.', 'alertCircle');
      this._rendering = false;
      return;
    }

    const master = App.state.master || {};
    const allItems = {};
    (master.obat || []).forEach(o => { allItems[o.ID_Obat] = { id: o.ID_Obat, nama: o.Nama_Obat, rak: o.Lokasi_Rak, satuan: o.Satuan }; });
    (master.bmhp || []).forEach(o => { allItems[o.ID_BMHP] = { id: o.ID_BMHP, nama: o.Nama_Barang, rak: o.Lokasi_Rak, satuan: o.Satuan }; });

    const items = selectedIds.map(id => allItems[id]).filter(Boolean);
    const perPage = this._mode === 'mode-24' ? 24 : 40;
    const pages = Math.ceil(items.length / perPage);

    preview.innerHTML = '<div class="text-center text-muted mb-2" style="font-size:12px">' +
      'Menghasilkan QR... (' + items.length + ' label, ' + pages + ' halaman)</div>';

    try {
      // Generate QR untuk setiap item (async, pakai cache)
      for (const it of items) {
        if (!this._qrCache[it.id]) {
          this._qrCache[it.id] = await generateQRDataURL(it.id, 220);
        }
      }

      // Bangun halaman
      let html = '';
      for (let p = 0; p < pages; p++) {
        const pageItems = items.slice(p * perPage, (p + 1) * perPage);
        html += '<div class="qr-page ' + this._mode + '">';
        pageItems.forEach(it => {
          const qrUrl = this._qrCache[it.id];
          html += '' +
            '<div class="qr-label ' + this._mode + '">' +
              '<div class="qr-img-wrap"><img src="' + qrUrl + '" alt="QR ' + U.escapeHtml(it.id) + '"></div>' +
              '<div class="label-text">' +
                '<div class="label-id">' + U.escapeHtml(it.id) + '</div>' +
                '<div class="label-name">' + U.escapeHtml(it.nama) + '</div>' +
                '<div class="label-meta">' + U.escapeHtml(it.satuan || '') +
                  (it.rak ? ' · ' + U.escapeHtml(it.rak) : '') + '</div>' +
              '</div>' +
            '</div>';
        });
        // Pad sisa halaman dengan label kosong (opsional, agar grid konsisten)
        // Tidak di-pad — biarkan sisa slot kosong
        html += '</div>';
      }

      preview.innerHTML = html;
    } catch (err) {
      preview.innerHTML = App._renderEmpty('Gagal generate QR', err.message, 'alertCircle');
    } finally {
      this._rendering = false;
    }
  },

  _downloadHTML() {
    const preview = U.$('#qr-preview');
    if (!preview) return;
    const html = '' +
      '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>QR Labels</title>' +
      '<style>' +
      'body{margin:0;font-family:system-ui,sans-serif;background:#f5f5f5}' +
      '.qr-page{background:white;width:210mm;min-height:297mm;padding:8mm;margin:0 auto 12px;' +
      'box-shadow:0 2px 8px rgba(0,0,0,0.1);display:grid;grid-template-columns:repeat(3,1fr);' +
      'grid-template-rows:repeat(8,33.9mm);gap:0;box-sizing:border-box}' +
      '.qr-page.mode-40{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(10,25.4mm)}' +
      '.qr-label{border:0.3mm dashed #ccc;padding:2mm;display:flex;align-items:center;gap:2mm;' +
      'overflow:hidden;box-sizing:border-box}' +
      '.qr-img-wrap{width:22mm;height:22mm;flex-shrink:0;display:flex;align-items:center;justify-content:center}' +
      '.qr-label.mode-40 .qr-img-wrap{width:18mm;height:18mm}' +
      '.qr-img-wrap img{width:100%;height:100%;image-rendering:pixelated}' +
      '.label-text{flex:1;min-width:0;line-height:1.15;overflow:hidden}' +
      '.label-id{font-size:11pt;font-weight:700;font-family:ui-monospace,monospace}' +
      '.qr-label.mode-40 .label-id{font-size:9pt}' +
      '.label-name{font-size:8pt;color:#222;display:-webkit-box;-webkit-line-clamp:2;' +
      '-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}' +
      '.qr-label.mode-40 .label-name{font-size:7pt;-webkit-line-clamp:1}' +
      '.label-meta{font-size:6.5pt;color:#666;margin-top:2px}' +
      '@media print{body{background:white}.qr-page{box-shadow:none;margin:0;page-break-after:always}' +
      '.qr-page:last-child{page-break-after:auto}@page{margin:0}}' +
      '</style></head><body>' +
      preview.innerHTML +
      '</body></html>';

    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'QR_Labels_' + new Date().toISOString().slice(0, 10) + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    Toast.success('File HTML berhasil diunduh. Buka di browser lalu cetak.');
  }
};

  async render(container, sheetName) {
    const cfg = this.CONFIG[sheetName];
    if (!cfg) { container.innerHTML = App._renderEmpty('Config tidak ditemukan'); return; }

    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div><div class="page-title">' + U.escapeHtml(cfg.title) + '</div></div>' +
        '<button class="btn btn-primary" id="btn-add">' + U.icon('plus', 16) + ' Tambah</button>' +
      '</div>' +
      '<div class="card card-tight">' +
        '<input class="input" id="master-search" placeholder="Cari...">' +
      '</div>' +
      '<div id="master-table-container"></div>';

    U.$('#btn-add').addEventListener('click', () => this._openForm(sheetName, null, container));
    U.$('#master-search').addEventListener('input', U.debounce(() => {
      this._renderTable(container, sheetName, U.$('#master-search').value);
    }, 200));
    this._renderTable(container, sheetName, '');
  },

  _renderTable(container, sheetName, query) {
    const cfg = this.CONFIG[sheetName];
    const master = App.state.master || {};
    let data = [];
    if (sheetName === 'Master_Obat') data = master.obat || [];
    else if (sheetName === 'Master_BMHP') data = master.bmhp || [];
    else if (sheetName === 'Ref_Supplier') data = master.supplier || [];
    else if (sheetName === 'Ref_UnitInternal') data = master.unit || [];
    else if (sheetName === 'Ref_LokasiRak') data = master.rak || [];
    else if (sheetName === 'Ref_Petugas') data = master.petugas || [];

    const q = (query || '').toLowerCase().trim();
    if (q) {
      data = data.filter(item =>
        cfg.columns.some(c => String(item[c.key] || '').toLowerCase().indexOf(q) !== -1));
    }

    if (data.length === 0) {
      U.$('#master-table-container').innerHTML = App._renderEmpty(
        'Tidak ada data',
        q ? 'Tidak ditemukan hasil untuk "' + q + '"' : 'Belum ada item.', 'package');
      return;
    }

    const html = '<div class="table-wrap"><div class="table-scroll"><table class="data-table">' +
      '<thead><tr>' +
        cfg.columns.map(c => '<th' + (c.num ? ' class="num"' : '') + '>' + U.escapeHtml(c.label) + '</th>').join('') +
        '<th class="col-actions">Aksi</th>' +
      '</tr></thead><tbody>' +
      data.map(item => {
        const tds = cfg.columns.map(c => {
          const val = item[c.key];
          let content = '';
          if (c.badge) {
            const cls = val === 'Aktif' ? 'badge-success' :
                       val === 'Nonaktif' ? 'badge-muted' :
                       val === 'SuperAdmin' ? 'badge-danger' :
                       val === 'Apoteker' ? 'badge-primary' :
                       val === 'Gudang' ? 'badge-warning' : 'badge-muted';
            content = '<span class="badge ' + cls + '">' + U.escapeHtml(val || '-') + '</span>';
          } else if (c.rp) content = U.formatRupiah(val);
          else if (c.num) content = U.formatNumber(val);
          else content = U.escapeHtml(val || '-');
          const cls = (c.mono ? 'mono ' : '') + (c.num ? 'num' : '');
          return '<td' + (cls ? ' class="' + cls.trim() + '"' : '') + '>' + content + '</td>';
        }).join('');

        const idVal = item[cfg.idField];
        const canDelete = item.Status_Aktif !== 'Nonaktif';
        const actions =
          '<button class="btn btn-ghost btn-sm" data-action="edit" data-id="' + U.escapeHtml(idVal) + '" title="Edit">' +
            U.icon('edit', 15) + '</button>' +
          (sheetName === 'Ref_Petugas'
            ? '<button class="btn btn-ghost btn-sm" data-action="resetpin" data-id="' + U.escapeHtml(idVal) + '" title="Reset PIN">' + U.icon('refresh', 15) + '</button>'
            : '') +
          (canDelete
            ? '<button class="btn btn-ghost btn-sm text-danger" data-action="delete" data-id="' + U.escapeHtml(idVal) + '" title="Nonaktifkan">' + U.icon('trash', 15) + '</button>'
            : '');

        return '<tr>' + tds + '<td class="col-actions">' + actions + '</td></tr>';
      }).join('') +
      '</tbody></table></div></div>';

    U.$('#master-table-container').innerHTML = html;
    U.$$('[data-action]', U.$('#master-table-container')).forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        const action = btn.dataset.action;
        const item = data.find(x => String(x[cfg.idField]) === String(id));
        if (action === 'edit') this._openForm(sheetName, item, container);
        else if (action === 'delete') this._confirmDelete(sheetName, item, container);
        else if (action === 'resetpin') this._resetPin(id, container);
      });
    });
  },

  _openForm(sheetName, item, container) {
    const cfg = this.CONFIG[sheetName];
    const isEdit = !!item;
    const master = App.state.master || {};
    const fields = cfg.formFields.filter(f => !(isEdit && f.addOnly));

    const fieldsHtml = fields.map(f => {
      const val = isEdit ? (item[f.key] || '') : '';
      let inputHtml = '';
      if (f.type === 'select') {
        let options = f.options || [];
        if (f.source === 'rak') options = (master.rak || []).map(r => r.ID_Rak);
        inputHtml = '<select class="select" name="' + f.key + '"' + (f.required ? ' required' : '') + '>' +
          '<option value="">— Pilih —</option>' +
          options.map(o => '<option value="' + U.escapeHtml(o) + '"' + (o === val ? ' selected' : '') + '>' +
            U.escapeHtml(o) + '</option>').join('') +
          '</select>';
      } else if (f.type === 'textarea') {
        inputHtml = '<textarea class="textarea" name="' + f.key + '"' + (f.required ? ' required' : '') + '>' +
          U.escapeHtml(val) + '</textarea>';
      } else {
        inputHtml = '<input type="' + f.type + '" class="input" name="' + f.key + '" value="' + U.escapeHtml(val) + '"' +
          (f.required ? ' required' : '') + (f.type === 'number' ? ' step="any"' : '') + '>';
      }
      return '<div class="field"><label class="field-label">' + U.escapeHtml(f.label) +
             (f.required ? ' <span class="required">*</span>' : '') + '</label>' + inputHtml + '</div>';
    }).join('');

    const formHtml = '<form id="master-form">' +
      (isEdit ? '<div class="field"><label class="field-label">' + U.escapeHtml(cfg.idField) + '</label>' +
        '<div class="mono">' + U.escapeHtml(item[cfg.idField]) + '</div></div>' : '') +
      fieldsHtml +
    '</form>';

    Modal.open({
      title: isEdit ? 'Edit ' + cfg.title : 'Tambah ' + cfg.title,
      body: formHtml,
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        { label: isEdit ? 'Simpan Perubahan' : 'Simpan', class: 'btn-primary', close: false,
          onClick: async () => {
            const form = U.$('#master-form');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            // Disable tombol via DOM (mencegah double-click)
            const btns = U.$$('#modal-footer .btn');
            btns.forEach(b => b.disabled = true);

            const values = {};
            fields.forEach(f => {
              const el = form.querySelector('[name="' + f.key + '"]');
              if (!el) return;
              let v = el.value;
              if (f.type === 'number') v = Number(v) || 0;
              values[f.key] = v;
            });
            if (sheetName === 'Ref_Petugas' && !isEdit) values.Status_Aktif = 'Aktif';

            try {
              let res;
              if (isEdit) {
                res = await Api.editMasterData({
                  sheet_target: sheetName, id_field: cfg.idField,
                  id_record: item[cfg.idField], changes: values
                });
              } else {
                res = await Api.tambahMaster({ sheet_target: sheetName, fields: values });
              }
              Modal.close();
              Toast.success(isEdit ? 'Data diperbarui.' : 'Data ditambahkan: ' + (res.data && res.data.id || ''));
              await App.refreshMaster();
              this.render(container, sheetName);
            } catch (err) {
              Toast.error('Gagal: ' + err.message);
              btns.forEach(b => b.disabled = false);
            }
          }
        }
      ]
    });
  },

  _confirmDelete(sheetName, item, container) {
    const cfg = this.CONFIG[sheetName];
    Modal.confirm('Nonaktifkan Item',
      'Item "' + (item[cfg.nameField] || item[cfg.idField]) + '" akan dinonaktifkan. Lanjutkan?',
      async () => {
        try {
          await Api.hapusMaster({
            sheet_target: sheetName, id_field: cfg.idField, id_record: item[cfg.idField]
          });
          Toast.success('Item dinonaktifkan.');
          await App.refreshMaster();
          this.render(container, sheetName);
        } catch (err) {
          Toast.error('Gagal: ' + err.message);
        }
      }, 'Ya, Nonaktifkan', true);
  },

  async _resetPin(idPetugas) {
    Modal.confirm('Reset PIN Petugas',
      'PIN baru akan di-generate acak untuk ' + idPetugas + '. Lanjutkan?',
      async () => {
        try {
          const res = await Api.resetPin(idPetugas);
          Modal.open({
            title: 'PIN Baru',
            body: '<p style="font-size:14px;margin-bottom:12px">Catat PIN baru berikut:</p>' +
                  '<div style="text-align:center;padding:16px;background:var(--primary-bg);border-radius:var(--r-md);font-size:24px;font-family:monospace;font-weight:700;letter-spacing:4px">' +
                  U.escapeHtml(res.data.new_pin) + '</div>',
            actions: [{ label: 'Tutup', class: 'btn-primary' }]
          });
        } catch (err) {
          Toast.error('Gagal reset PIN: ' + err.message);
        }
      }, 'Ya, Reset', true);
  }
};

/* ============================================================
   PAGE: AUDIT LOG (dengan server-side pagination)
   ============================================================ */
const PageAudit = {
  _page: 0,
  _perPage: 50,
  _hasMore: false,
  _totalRecords: 0,

  async render(container) {
    this._page = 0;
    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div><div class="page-title">Audit Log</div>' +
        '<div class="page-desc">Riwayat perubahan data master</div></div>' +
        '<button class="btn btn-secondary" id="btn-refresh">' + U.icon('refresh', 16) + ' Refresh</button>' +
      '</div>' +
      '<div id="audit-result"><div class="empty-state"><div class="spinner"></div></div></div>';

    U.$('#btn-refresh').addEventListener('click', () => { this._page = 0; this._load(); });
    this._load();
  },

  async _load() {
    try {
      const res = await Api.getAuditLog({
        limit: this._perPage,
        offset: this._page * this._perPage
      });
      const items = (res.data && res.data.items) || [];
      this._hasMore = res.data && res.data.has_more;
      this._totalRecords = res.data && res.data.total_records || 0;

      if (items.length === 0 && this._page === 0) {
        U.$('#audit-result').innerHTML = App._renderEmpty('Belum ada audit', '', 'clipboard');
        return;
      }

      const html = '<div class="table-wrap"><div class="table-scroll"><table class="data-table">' +
        '<thead><tr>' +
          '<th>Waktu</th><th>Petugas</th><th>Aksi</th><th>Target</th>' +
          '<th>Record</th><th>Field</th><th>Lama → Baru</th>' +
        '</tr></thead><tbody>' +
        items.map(it =>
          '<tr>' +
            '<td style="font-size:12px">' + U.formatDateTime(it.Timestamp) + '</td>' +
            '<td class="mono">' + U.escapeHtml(it.ID_Petugas || '-') + '</td>' +
            '<td><span class="badge badge-muted">' + U.escapeHtml(it.Aksi || '-') + '</span></td>' +
            '<td>' + U.escapeHtml(it.Sheet_Target || '-') + '</td>' +
            '<td class="mono">' + U.escapeHtml(it.ID_Record || '-') + '</td>' +
            '<td>' + U.escapeHtml(it.Field_Changed || '-') + '</td>' +
            '<td style="font-size:12px">' + U.escapeHtml(String(it.Nilai_Lama || '').substring(0, 30)) +
              ' → ' + U.escapeHtml(String(it.Nilai_Baru || '').substring(0, 30)) + '</td>' +
          '</tr>'
        ).join('') +
        '</tbody></table></div></div>' +
        '<div class="flex items-center justify-between mt-2 flex-wrap" style="gap:8px">' +
          '<button class="btn btn-secondary" id="audit-prev"' + (this._page === 0 ? ' disabled' : '') + '>' + U.icon('chevronLeft', 14) + ' Sebelumnya</button>' +
          '<span class="text-muted" style="font-size:12px">Halaman ' + (this._page + 1) +
            ' · Total ' + U.formatNumber(this._totalRecords) + ' entri</span>' +
          '<button class="btn btn-secondary" id="audit-next"' + (!this._hasMore ? ' disabled' : '') + '>Selanjutnya ' + U.icon('chevronRight', 14) + '</button>' +
        '</div>';

      U.$('#audit-result').innerHTML = html;
      U.$('#audit-prev').addEventListener('click', () => { this._page--; this._load(); });
      U.$('#audit-next').addEventListener('click', () => { this._page++; this._load(); });
    } catch (err) {
      U.$('#audit-result').innerHTML = App._renderEmpty('Gagal', err.message, 'alertCircle');
    }
  }
};

/* ============================================================
   PAGE: SETTINGS
   ============================================================ */
const PageSettings = {
  async render(container) {
    const session = App.state.session;
    container.innerHTML = '' +
      '<div class="page-header"><div><div class="page-title">Pengaturan</div></div></div>' +

      '<div class="card">' +
        '<div class="card-title">Profil Pengguna</div>' +
        '<div class="field"><label class="field-label">Nama</label><div>' + U.escapeHtml(session.nama) + '</div></div>' +
        '<div class="field"><label class="field-label">Username</label><div class="mono">' + U.escapeHtml(session.username) + '</div></div>' +
        '<div class="field"><label class="field-label">Role</label><div><span class="badge badge-primary">' + U.escapeHtml(session.role) + '</span></div></div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">Ubah PIN</div>' +
        '<div class="field"><label class="field-label">PIN Lama</label>' +
          '<input type="password" class="input" id="set-old-pin" inputmode="numeric" maxlength="8" autocomplete="current-password"></div>' +
        '<div class="field"><label class="field-label">PIN Baru (min 4 digit)</label>' +
          '<input type="password" class="input" id="set-new-pin" inputmode="numeric" maxlength="8" autocomplete="new-password"></div>' +
        '<div class="field"><label class="field-label">Ulangi PIN Baru</label>' +
          '<input type="password" class="input" id="set-new-pin2" inputmode="numeric" maxlength="8" autocomplete="new-password"></div>' +
        '<button class="btn btn-primary" id="btn-ubah-pin">Ubah PIN</button>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">Logo Puskesmas</div>' +
        '<p class="text-muted" style="font-size:13px;margin-bottom:12px">Logo ditampilkan di header Kartu Stok. Maks 500 KB.</p>' +
        '<div id="logo-preview" style="text-align:center;padding:16px;background:var(--surface-2);border-radius:var(--r-md);margin-bottom:12px"></div>' +
        '<input type="file" id="logo-input" accept="image/*" style="display:none">' +
        '<div class="flex gap-2 flex-wrap">' +
          '<button class="btn btn-secondary" id="btn-pick-logo">Pilih File</button>' +
          '<button class="btn btn-ghost text-danger" id="btn-remove-logo">Hapus Logo</button>' +
        '</div>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">Aksi</div>' +
        '<button class="btn btn-danger" id="btn-logout">' + U.icon('logout', 16) + ' Keluar dari Aplikasi</button>' +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">Info</div>' +
        '<div class="field"><label class="field-label">Versi Aplikasi</label><div>' + CONFIG.APP_VERSION + '</div></div>' +
        '<div class="field"><label class="field-label">Status Koneksi</label><div id="info-online"></div></div>' +
      '</div>';

    this._refreshLogo();
    this._refreshOnline();

    U.$('#btn-pick-logo').addEventListener('click', () => U.$('#logo-input').click());
    U.$('#logo-input').addEventListener('change', (e) => this._handleLogoUpload(e));
    U.$('#btn-remove-logo').addEventListener('click', () => {
      Store.setLogo(''); this._refreshLogo(); Toast.info('Logo dihapus');
    });
    U.$('#btn-ubah-pin').addEventListener('click', () => this._ubahPin());
    U.$('#btn-logout').addEventListener('click', () => {
      Modal.confirm('Keluar', 'Yakin ingin keluar dari aplikasi?',
        () => App.logout(), 'Ya, Keluar', true);
    });
  },

  _refreshLogo() {
    const logo = Store.getLogo();
    const el = U.$('#logo-preview');
    if (logo) el.innerHTML = '<img src="' + logo + '" style="max-height:80px;display:inline-block">';
    else el.innerHTML = '<div class="text-muted">Belum ada logo</div>';
  },

  _refreshOnline() {
    const el = U.$('#info-online');
    if (el) {
      el.innerHTML = App.state.online
        ? '<span class="badge badge-success">Terhubung</span>'
        : '<span class="badge badge-danger">Offline</span>';
    }
  },

  _handleLogoUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 500 * 1024) { Toast.error('File terlalu besar (max 500 KB)'); return; }
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 400;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = h * maxDim / w; w = maxDim; }
          else { w = w * maxDim / h; h = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        Store.setLogo(canvas.toDataURL('image/png'));
        this._refreshLogo();
        Toast.success('Logo diperbarui');
      };
      img.onerror = () => Toast.error('Gagal membaca gambar');
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  },

  async _ubahPin() {
    const oldPin = U.$('#set-old-pin').value;
    const newPin = U.$('#set-new-pin').value;
    const newPin2 = U.$('#set-new-pin2').value;
    if (!oldPin || !newPin || !newPin2) { Toast.error('Semua field wajib diisi'); return; }
    if (newPin.length < 4) { Toast.error('PIN baru minimal 4 digit'); return; }
    if (newPin !== newPin2) { Toast.error('PIN baru tidak sama'); return; }
    try {
      await Api.ubahPin({ old_pin: oldPin, new_pin: newPin });
      Toast.success('PIN berhasil diubah');
      U.$('#set-old-pin').value = '';
      U.$('#set-new-pin').value = '';
      U.$('#set-new-pin2').value = '';
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
    }
  }
};

/* ============================================================
   LOGIN FORM
   ============================================================ */
const LoginForm = {
  _pin: '',
  _maxPinLen: 8,

  init() {
    U.$$('#login-keypad .key-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.dataset.key;
        if (key === 'back') this._backspace();
        else if (key === 'enter') this._submit();
        else this._append(key);
      });
    });

    // Keydown global — hanya aktif saat fokus TIDAK di input/textarea
    document.addEventListener('keydown', (e) => {
      if (U.$('#login-screen').style.display === 'none') return;
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;
      if (e.key >= '0' && e.key <= '9') this._append(e.key);
      else if (e.key === 'Backspace') { e.preventDefault(); this._backspace(); }
      else if (e.key === 'Enter') { e.preventDefault(); this._submit(); }
    });

    // Enter di username: blur supaya PIN keypad aktif
    U.$('#login-username').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); U.vibrate(15); e.target.blur(); }
    });

    this._render();
  },

  _append(digit) {
    if (this._pin.length >= this._maxPinLen) return;
    this._pin += digit;
    U.vibrate(15);
    this._render();
  },

  _backspace() {
    this._pin = this._pin.slice(0, -1);
    this._render();
  },

  _render() {
    const el = U.$('#login-pin');
    if (this._pin.length === 0) {
      el.textContent = 'Masukkan PIN';
      el.classList.add('empty');
    } else {
      el.textContent = '●'.repeat(this._pin.length);
      el.classList.remove('empty');
    }
  },

  async _submit() {
    const username = U.$('#login-username').value.trim().toLowerCase();
    if (!username) { Toast.error('Username wajib diisi'); U.$('#login-username').focus(); return; }
    if (username.length < 4) { Toast.error('Username minimal 4 karakter'); return; }
    if (this._pin.length < 4) { Toast.error('PIN minimal 4 digit'); return; }

    const submitBtn = U.$('#login-submit');
    submitBtn.disabled = true;
    Loading.show();

    try {
      const res = await Api.login(username, this._pin);
      const session = {
        token: res.session_token,
        id_petugas: res.id_petugas,
        username: res.username,
        nama: res.nama,
        role: res.role,
        wilayah_binaan: res.wilayah_binaan || '',
        expiry: Date.now() + (res.expiry_sec || 21500) * 1000
      };
      Store.setSession(session);
      App.state.session = session;
      this._pin = '';
      this._render();
      U.$('#login-username').value = '';

      Toast.success('Selamat datang, ' + res.nama);
      await App.showApp();
      await App.route('dashboard');
    } catch (err) {
      U.vibrate([100, 50, 100]);
      U.beepError();
      Toast.error(err.message || 'Login gagal');
      this._pin = '';
      this._render();
    } finally {
      submitBtn.disabled = false;
      Loading.hide();
    }
  }
};

/* ============================================================
   GLOBAL LISTENERS
   ============================================================ */
function setupGlobalListeners() {
  U.$('#menu-btn').addEventListener('click', () => {
    U.$('#sidebar').classList.toggle('open');
    U.$('#sidebar-backdrop').classList.toggle('active');
  });
  U.$('#sidebar-backdrop').addEventListener('click', () => {
    U.$('#sidebar').classList.remove('open');
    U.$('#sidebar-backdrop').classList.remove('active');
  });
  document.addEventListener('click', (e) => {
    const item = e.target.closest('.bottom-nav-item');
    if (item && item.dataset.action === 'menu') {
      e.preventDefault();
      U.$('#sidebar').classList.toggle('open');
      U.$('#sidebar-backdrop').classList.toggle('active');
    }
  });
  U.$('#modal-close').addEventListener('click', () => Modal.close());
  U.$('#modal-overlay').addEventListener('click', (e) => {
    if (e.target === U.$('#modal-overlay')) Modal.close();
  });
  window.addEventListener('hashchange', () => {
    const route = location.hash ? location.hash.substring(2) : 'dashboard';
    if (route && App.state.session) App.route(route);
  });
  window.addEventListener('error', (e) => console.error('[GLOBAL_ERROR]', e.error || e.message));
  window.addEventListener('unhandledrejection', (e) => console.error('[UNHANDLED_PROMISE]', e.reason));
}

/* ============================================================
   BOOTSTRAP
   ============================================================ */
document.addEventListener('DOMContentLoaded', () => {
  LoginForm.init();
  setupGlobalListeners();
  App.init();
  console.log('[SISTEM_GUDANG] v' + CONFIG.APP_VERSION + ' booted');
});
</script>
