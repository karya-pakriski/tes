<style>
/* ============================================================
   INDEX v5.4.1 — FRESH MODERN THEME
   100% viewport, proporsional scrolling, clean & fast
   ============================================================ */

/* ---------- BOOT SPLASH ---------- */
.boot-splash {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 20% 20%, rgba(20, 163, 168, 0.4) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(13, 115, 119, 0.5) 0%, transparent 50%),
    linear-gradient(135deg, #0d7377 0%, #14a3a8 100%);
  z-index: 9999;
  transition: opacity 0.4s;
}
.boot-splash.hide { opacity: 0; pointer-events: none; }
.boot-splash-inner { text-align: center; color: white; padding: 20px; }
.boot-splash-logo {
  width: 84px; height: 84px; margin: 0 auto 20px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 800;
  letter-spacing: -1px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.2);
}
.boot-splash-text { font-size: 15px; opacity: 0.92; margin-bottom: 20px; font-weight: 500; }
.boot-splash-spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 2.5px solid rgba(255,255,255,0.25);
  border-top-color: white; border-radius: 50%;
  animation: bootspin 0.75s linear infinite;
}
@keyframes bootspin { to { transform: rotate(360deg); } }

/* ---------- 100% VIEWPORT LAYOUT ---------- */
html, body {
  height: 100%;
  overflow: hidden;
}
#app {
  height: 100vh;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
}

.app-shell {
  display: grid;
  grid-template-columns: 272px 1fr;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  background: var(--bg);
  transition: grid-template-columns 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}
.app-shell.sidebar-collapsed { grid-template-columns: 76px 1fr; }

/* ---------- SIDEBAR ---------- */
.sidebar {
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
  display: flex; flex-direction: column;
  background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
  border-right: 1px solid var(--border);
  position: relative;
  z-index: 40;
}
.sidebar-header {
  padding: 18px 18px 16px;
  padding-top: calc(18px + var(--safe-top));
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
  min-height: 68px;
}
.sidebar-logo {
  width: 40px; height: 40px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 13px;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(13,115,119,0.28);
  letter-spacing: -0.5px;
}
.sidebar-brand { flex: 1; min-width: 0; transition: opacity 0.15s; }
.sidebar-brand-title {
  font-weight: 700; font-size: 14px; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.2; letter-spacing: -0.2px;
}
.sidebar-brand-subtitle {
  font-size: 11.5px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 2px; font-weight: 500;
}
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 14px 12px 20px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  overscroll-behavior: contain;
}
.sidebar-nav::-webkit-scrollbar { width: 6px; }
.sidebar-nav::-webkit-scrollbar-thumb {
  background: var(--border-strong); border-radius: 3px;
  border: 2px solid transparent; background-clip: padding-box;
}
.sidebar-group { margin-bottom: 18px; }
.sidebar-group:last-child { margin-bottom: 0; }
.sidebar-group-title {
  padding: 6px 12px;
  font-size: 10.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.8px;
  color: var(--text-light);
  white-space: nowrap; overflow: hidden;
  margin-bottom: 4px;
}
.sidebar-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 12px;
  color: var(--text);
  font-size: 13.5px; font-weight: 500;
  border-radius: 10px;
  transition: background 0.15s, color 0.15s, transform 0.1s;
  cursor: pointer; text-decoration: none;
  white-space: nowrap; overflow: hidden;
  margin-bottom: 2px;
  position: relative;
}
.sidebar-item:hover {
  background: rgba(13, 115, 119, 0.06);
  color: var(--primary-dark);
}
.sidebar-item:active { transform: scale(0.98); }
.sidebar-item.active {
  background: linear-gradient(135deg, var(--primary-bg) 0%, #d9eef0 100%);
  color: var(--primary-dark);
  font-weight: 700;
  box-shadow: 0 1px 2px rgba(13,115,119,0.08);
}
.sidebar-item.active::before {
  content: '';
  position: absolute;
  left: 0; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px;
  background: var(--primary);
  border-radius: 0 3px 3px 0;
}
.sidebar-item svg {
  width: 18px; height: 18px; flex-shrink: 0;
  color: var(--text-muted);
  transition: color 0.15s;
}
.sidebar-item:hover svg,
.sidebar-item.active svg { color: var(--primary); }
.sidebar-item .item-label {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis;
}
.sidebar-item .item-badge {
  background: var(--danger); color: white;
  font-size: 10px; padding: 2px 7px;
  border-radius: 10px; font-weight: 700;
  flex-shrink: 0; min-width: 18px; text-align: center;
  line-height: 1.4;
}

.app-shell.sidebar-collapsed .sidebar-brand,
.app-shell.sidebar-collapsed .sidebar-group-title,
.app-shell.sidebar-collapsed .item-label,
.app-shell.sidebar-collapsed .item-badge { display: none; }
.app-shell.sidebar-collapsed .sidebar-item {
  justify-content: center;
  padding: 12px 0;
}
.app-shell.sidebar-collapsed .sidebar-header {
  justify-content: center;
  padding-left: 0; padding-right: 0;
}

.sidebar-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(15,23,42,0.5);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  z-index: 39;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.sidebar-backdrop.active { display: block; opacity: 1; }

@media (max-width: 900px) {
  .app-shell, .app-shell.sidebar-collapsed { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed; top: 0; left: 0; bottom: 0;
    width: 288px;
    transform: translateX(-100%);
    box-shadow: 0 24px 60px rgba(0,0,0,0.25);
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .sidebar.open { transform: translateX(0); }
  .app-shell.sidebar-collapsed .sidebar-brand,
  .app-shell.sidebar-collapsed .sidebar-group-title,
  .app-shell.sidebar-collapsed .item-label,
  .app-shell.sidebar-collapsed .item-badge { display: block; }
  .app-shell.sidebar-collapsed .sidebar-item {
    justify-content: flex-start;
    padding: 10px 12px;
  }
  .app-shell.sidebar-collapsed .sidebar-header {
    justify-content: flex-start;
    padding-left: 18px; padding-right: 18px;
  }
}

/* ---------- MAIN WRAPPER ---------- */
.main-wrapper {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  min-width: 0;
  overflow: hidden;
}

/* ---------- TOPBAR ---------- */
.app-topbar {
  flex-shrink: 0;
  height: 64px;
  padding-top: var(--safe-top);
  padding-left: calc(20px + var(--safe-left));
  padding-right: calc(20px + var(--safe-right));
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  z-index: 30;
}
.topbar-toggle {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); flex-shrink: 0;
  transition: background 0.15s, color 0.15s;
}
.topbar-toggle:hover {
  background: var(--surface-2);
  color: var(--text);
}
.topbar-breadcrumb { flex: 1; min-width: 0; }
.topbar-breadcrumb-title {
  font-weight: 700; font-size: 15px; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  line-height: 1.2; letter-spacing: -0.2px;
}
.topbar-breadcrumb-sub {
  font-size: 12px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 1px;
}
.topbar-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.btn-scanner {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  border-radius: 10px;
  font-size: 13px; font-weight: 600;
  transition: all 0.15s;
  min-height: 40px; text-decoration: none;
  box-shadow: 0 2px 8px rgba(13, 115, 119, 0.25);
  letter-spacing: -0.2px;
}
.btn-scanner:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(13, 115, 119, 0.35);
}
.btn-scanner:active { transform: translateY(0); }
.btn-scanner svg { width: 16px; height: 16px; }
.btn-scanner .label { display: inline; }
@media (max-width: 640px) {
  .btn-scanner .label { display: none; }
  .btn-scanner { padding: 9px 12px; }
}
.offline-badge {
  display: none; align-items: center; gap: 5px;
  padding: 5px 12px;
  background: var(--danger-bg); color: var(--danger);
  border-radius: 20px;
  font-size: 11px; font-weight: 700;
  flex-shrink: 0;
}
.offline-badge.visible { display: inline-flex; }

/* ---------- PAGE CONTAINER — SCROLLABLE ---------- */
.page-container {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 24px;
  padding-left: calc(24px + var(--safe-left));
  padding-right: calc(24px + var(--safe-right));
  padding-bottom: calc(40px + var(--safe-bottom));
  scroll-behavior: smooth;
  scrollbar-width: thin;
}
.page-container::-webkit-scrollbar { width: 8px; }
.page-container::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 4px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
.page-container::-webkit-scrollbar-thumb:hover {
  background: var(--text-light);
  background-clip: padding-box;
  border: 2px solid transparent;
}
.page-inner {
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}
@media (max-width: 640px) {
  .page-container {
    padding: 16px;
    padding-bottom: calc(28px + var(--safe-bottom));
  }
}

@keyframes pageIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.page-inner > * {
  animation: pageIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
}

/* ---------- PAGE HEADER ---------- */
.page-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 22px;
  flex-wrap: wrap;
}
.page-header-left { flex: 1; min-width: 0; }
.page-header-actions {
  display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
}
.page-title {
  font-size: 26px; font-weight: 800; color: var(--text);
  line-height: 1.12; letter-spacing: -0.6px;
}
.page-subtitle {
  font-size: 13.5px; color: var(--text-muted);
  margin-top: 6px; line-height: 1.5;
}
@media (max-width: 640px) {
  .page-header-actions { width: 100%; }
  .page-header-actions .btn { flex: 1; }
  .page-title { font-size: 22px; }
}

/* ---------- WELCOME BANNER ---------- */
.welcome-banner {
  background:
    radial-gradient(circle at 100% 0%, rgba(255,255,255,0.14) 0%, transparent 40%),
    radial-gradient(circle at 0% 100%, rgba(255,255,255,0.08) 0%, transparent 40%),
    linear-gradient(135deg, #0d7377 0%, #14a3a8 100%);
  color: white;
  border-radius: 20px;
  padding: 26px 28px;
  margin-bottom: 22px;
  display: flex; align-items: center; gap: 20px;
  flex-wrap: wrap;
  box-shadow: 0 10px 28px rgba(13,115,119,0.24);
  position: relative;
  overflow: hidden;
}
.welcome-text { position: relative; z-index: 1; flex: 1; min-width: 200px; }
.welcome-greeting {
  font-size: 13px; opacity: 0.85; margin-bottom: 4px;
  font-weight: 500; letter-spacing: 0.2px;
}
.welcome-name {
  font-size: 24px; font-weight: 800;
  line-height: 1.15; margin-bottom: 8px;
  letter-spacing: -0.5px;
}
.welcome-meta {
  font-size: 12.5px; opacity: 0.9;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
}
.welcome-meta-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 11px;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 20px;
  font-weight: 600;
  font-size: 11.5px;
  backdrop-filter: blur(6px);
}
.welcome-meta-pill svg { width: 12px; height: 12px; }

/* ---------- STATS GRID ---------- */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  display: flex; align-items: flex-start; gap: 14px;
  transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
  overflow: hidden;
}
.stat-card::after {
  content: '';
  position: absolute;
  top: 0; right: 0;
  width: 100px; height: 100px;
  background: radial-gradient(circle, currentColor 0%, transparent 70%);
  opacity: 0.05;
  border-radius: 50%;
  transform: translate(35%, -35%);
  pointer-events: none;
}
.stat-card:hover {
  box-shadow: 0 10px 24px rgba(0,0,0,0.07);
  border-color: var(--border-strong);
  transform: translateY(-3px);
}
.stat-icon {
  width: 50px; height: 50px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  position: relative; z-index: 1;
}
.stat-icon.primary { background: linear-gradient(135deg, #e6f4f5 0%, #cee9eb 100%); color: var(--primary); }
.stat-icon.danger { background: linear-gradient(135deg, #ffebee 0%, #ffcdd2 100%); color: var(--danger); }
.stat-icon.warning { background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%); color: var(--warning); }
.stat-icon.success { background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%); color: var(--success); }
.stat-icon.info { background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%); color: var(--info); }
.stat-icon svg { width: 24px; height: 24px; }
.stat-body { flex: 1; min-width: 0; position: relative; z-index: 1; }
.stat-value {
  font-size: 28px; font-weight: 800;
  line-height: 1.05; font-variant-numeric: tabular-nums;
  color: var(--text); word-break: break-word;
  letter-spacing: -0.7px;
}
.stat-label {
  font-size: 12.5px; color: var(--text-muted);
  margin-top: 5px; font-weight: 500;
}

/* ---------- ORDER CARD ---------- */
.order-stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}
.order-stat {
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  transition: all 0.18s;
}
.order-stat:hover { border-color: var(--border-strong); }
.order-stat-value {
  font-size: 24px; font-weight: 800;
  color: var(--text); line-height: 1;
  letter-spacing: -0.6px;
  font-variant-numeric: tabular-nums;
}
.order-stat-label {
  font-size: 11.5px; color: var(--text-muted);
  margin-top: 5px; font-weight: 500;
}

.order-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 12px;
  transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.order-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.2s;
}
.order-card:hover {
  border-color: var(--primary-light);
  box-shadow: 0 6px 20px rgba(13,115,119,0.1);
  transform: translateY(-2px);
}
.order-card:hover::before { background: var(--primary); }
.order-card-head {
  display: flex; justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.order-card-id {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px; font-weight: 700;
  color: var(--primary-dark);
  margin-bottom: 4px;
  letter-spacing: -0.2px;
}
.order-card-meta {
  font-size: 11.5px; color: var(--text-muted);
  display: flex; gap: 12px; flex-wrap: wrap;
}
.order-card-meta span {
  display: inline-flex; align-items: center; gap: 4px;
}
.order-card-meta strong { color: var(--text); font-weight: 600; }
.order-card-body {
  font-size: 12.5px; color: var(--text-muted);
  padding-top: 10px;
  border-top: 1px dashed var(--border);
  display: flex; justify-content: space-between;
  align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.order-card-body strong { color: var(--text); }

/* ---------- STATUS PILLS ---------- */
.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px;
  border-radius: 20px;
  font-size: 11.5px; font-weight: 700;
  letter-spacing: 0.2px;
  white-space: nowrap;
}
.status-pill::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}

/* ---------- TAB FILTER ---------- */
.tab-filter {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-bottom: 16px;
  padding-bottom: 4px;
  overflow-x: auto;
  scrollbar-width: thin;
}
.tab-filter::-webkit-scrollbar { height: 4px; }
.tab-filter::-webkit-scrollbar-thumb {
  background: var(--border-strong); border-radius: 2px;
}
.tab-filter-btn {
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 12.5px; font-weight: 600;
  background: var(--surface-2);
  color: var(--text-muted);
  border: 1px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
}
.tab-filter-btn:hover {
  background: var(--surface);
  color: var(--text);
  border-color: var(--border);
}
.tab-filter-btn.active {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  border-color: transparent;
  box-shadow: 0 3px 10px rgba(13,115,119,0.28);
}
.tab-filter-btn .tab-count {
  padding: 1px 7px;
  background: rgba(255,255,255,0.22);
  border-radius: 10px;
  font-size: 10.5px;
  font-weight: 700;
}
.tab-filter-btn:not(.active) .tab-count {
  background: var(--surface-3);
  color: var(--text-muted);
}

/* ---------- LAPORAN TABS ---------- */
.report-tabs {
  display: flex;
  gap: 4px;
  padding: 5px;
  background: var(--surface-2);
  border-radius: 12px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.report-tab {
  flex: 1;
  min-width: 120px;
  padding: 11px 16px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  background: transparent;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  cursor: pointer;
  border: none;
}
.report-tab:hover:not(.active) {
  background: rgba(255,255,255,0.6);
  color: var(--text);
}
.report-tab.active {
  background: var(--surface);
  color: var(--primary);
  box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  font-weight: 700;
}
.report-tab svg { width: 16px; height: 16px; }

/* ---------- ORDER DETAIL LIST ---------- */
.order-detail-list {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 4px 14px;
  max-height: 340px;
  overflow-y: auto;
  font-size: 13px;
  line-height: 1.6;
}
.order-detail-item {
  display: flex; justify-content: space-between;
  gap: 12px; padding: 10px 0;
  border-bottom: 1px dashed var(--border);
}
.order-detail-item:last-child { border-bottom: none; }
.order-detail-item .name { flex: 1; min-width: 0; }
.order-detail-item .name strong {
  color: var(--text); font-weight: 600;
  display: block; margin-bottom: 3px;
  font-size: 13px;
}
.order-detail-item .meta {
  font-size: 11px; color: var(--text-muted);
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
}
.order-detail-item .qty {
  font-weight: 700; color: var(--primary-dark);
  flex-shrink: 0;
  font-size: 15px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.order-detail-item .qty small {
  display: block;
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  margin-top: 2px;
}
.order-detail-item .stok-info {
  font-size: 10.5px; color: var(--warning);
  margin-top: 3px;
  display: flex; align-items: center; gap: 4px;
}
.order-detail-item .stok-info svg { width: 11px; height: 11px; }

/* ---------- MODAL HELPERS ---------- */
.detail-section {
  padding: 12px 14px;
  background: var(--surface-2);
  border-radius: 12px;
  margin-bottom: 14px;
}
.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 7px 0;
  font-size: 13px;
}
.detail-row + .detail-row { border-top: 1px dashed var(--border); }
.detail-label { color: var(--text-muted); font-size: 12.5px; }
.detail-value {
  font-weight: 600;
  color: var(--text);
  text-align: right;
}

/* ---------- AUTOCOMPLETE ---------- */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: absolute; top: 100%; left: 0; right: 0;
  margin-top: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.12);
  max-height: 300px; overflow-y: auto;
  z-index: 50;
  padding: 4px;
}
.autocomplete-list:empty { display: none; }
.autocomplete-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 12px; cursor: pointer;
  border-radius: 8px;
  font-size: 13px; text-align: left; width: 100%;
  background: none; color: var(--text);
  transition: background 0.1s;
}
.autocomplete-item:hover { background: var(--primary-bg-soft); }
.autocomplete-item .ac-id {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 11px; color: var(--primary-dark);
  font-weight: 700; flex-shrink: 0;
}
.autocomplete-item .ac-name {
  flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.autocomplete-empty {
  padding: 16px; text-align: center;
  color: var(--text-muted); font-size: 12px;
}

/* ---------- EMPTY STATE ---------- */
.empty-state {
  text-align: center;
  padding: 56px 24px;
  color: var(--text-muted);
}
.empty-state svg {
  width: 52px; height: 52px;
  color: var(--text-light);
  margin: 0 auto 16px;
  opacity: 0.7;
}
.empty-state h3 {
  font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 6px;
}
.empty-state p { font-size: 13px; max-width: 320px; margin: 0 auto; }

/* ---------- MONTH NAV ---------- */
.month-nav {
  display: flex; align-items: center; gap: 8px;
  padding: 12px;
  background: var(--surface-2);
  border-radius: 14px;
  margin-bottom: 14px;
  justify-content: center;
}
.month-nav button {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  transition: all 0.15s;
  cursor: pointer;
}
.month-nav button:hover:not(:disabled) {
  background: var(--primary-bg);
  border-color: var(--primary);
  color: var(--primary);
  transform: translateY(-1px);
}
.month-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
.month-nav .current {
  font-weight: 700; font-size: 14px;
  padding: 0 16px; min-width: 180px;
  text-align: center;
  letter-spacing: -0.2px;
}

/* ---------- CARD ---------- */
.card {
  background: var(--surface);
  border-radius: 16px;
  border: 1px solid var(--border);
  padding: 20px;
  margin-bottom: 16px;
  transition: border-color 0.18s;
}
.card:hover { border-color: var(--border-strong); }
.card-tight { padding: 14px; }
.card-title {
  font-size: 15px; font-weight: 700;
  margin-bottom: 16px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; flex-wrap: wrap;
  letter-spacing: -0.2px;
}
.card-title > span:first-child { color: var(--text); }

/* ---------- KARTU STOK PREVIEW ---------- */
.kartu-stok-preview {
  background: white;
  padding: 14px;
  max-width: 720px;
  margin: 0 auto;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-family: "Times New Roman", Times, serif;
  font-size: 12px;
  color: #000;
  box-shadow: 0 10px 28px rgba(0,0,0,0.08);
}
.kartu-stok-header {
  text-align: center;
  border-bottom: 2px solid #000;
  padding-bottom: 8px; margin-bottom: 10px;
}
.kartu-stok-header img { height: 44px; margin: 0 auto 4px; }
.kartu-stok-header h1 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.kartu-stok-header h2 { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.kartu-stok-header h3 {
  font-size: 12px; font-weight: 700;
  text-decoration: underline; margin-top: 8px; letter-spacing: 1px;
}
.kartu-stok-info {
  display: grid; grid-template-columns: 90px 8px 1fr;
  gap: 2px; font-size: 11px; margin-bottom: 10px;
}
.kartu-stok-info .label { font-weight: 700; }
.kartu-stok-table {
  width: 100%; border-collapse: collapse;
  font-size: 10px; margin-bottom: 10px;
}
.kartu-stok-table th, .kartu-stok-table td {
  border: 1px solid #000; padding: 3px 5px;
  text-align: center; vertical-align: middle;
}
.kartu-stok-table th { background: #f0f0f0; font-weight: 700; }
.kartu-stok-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.kartu-stok-table td.ket {
  text-align: left;
  font-size: 9px;
  max-width: 140px;
  word-break: break-word;
  line-height: 1.2;
}
.kartu-stok-summary {
  display: grid; grid-template-columns: auto 1fr;
  gap: 4px 12px; font-size: 11px;
  margin: 10px 0; padding: 8px;
  background: #f8f8f8; border-radius: 4px;
}
.kartu-stok-summary .label { font-weight: 700; }
.kartu-stok-summary .value { text-align: right; }
.kartu-stok-sign {
  display: flex; justify-content: space-between;
  margin-top: 20px; font-size: 11px;
}
.kartu-stok-sign .sign-box { text-align: center; }
.kartu-stok-sign .sign-space { height: 44px; }
.kartu-stok-sign .sign-line {
  border-top: 1px solid #000;
  padding-top: 3px; min-width: 110px;
}
.kartu-stok-footnote {
  font-size: 9px; color: #666;
  text-align: right; margin-top: 6px;
}

/* ============================================================
   PRINT OVERRIDE — v5.4.1
   Fix blank page: core.css set .app-shell { display:none } di print
   yang menyembunyikan seluruh konten. Override di sini karena
   file ini dimuat setelah core.css.
   ============================================================ */
@media print {
  /* Reset html/body */
  html, body {
    overflow: visible !important;
    height: auto !important;
    background: white !important;
  }

  /* Sembunyikan UI, TAPI jangan .app-shell */
  .sidebar,
  .app-topbar,
  .sidebar-backdrop,
  .no-print,
  .toast-container,
  .loading-overlay,
  .modal-overlay {
    display: none !important;
  }

  /* Reset wrapper agar semua konten bisa mengalir untuk print */
  .app-shell {
    display: block !important;
    grid-template-columns: none !important;
    height: auto !important;
    overflow: visible !important;
    background: white !important;
  }
  .main-wrapper {
    display: block !important;
    height: auto !important;
    overflow: visible !important;
  }
  .page-container {
    display: block !important;
    height: auto !important;
    overflow: visible !important;
    padding: 0 !important;
    max-width: none !important;
  }
  .page-inner {
    display: block !important;
    max-width: none !important;
  }
  .page-inner > * {
    animation: none !important;
  }

  /* Kartu stok preview — bersih tanpa shadow/border container */
  .kartu-stok-preview {
    box-shadow: none !important;
    border: none !important;
    max-width: none !important;
    padding: 8mm !important;
    margin: 0 !important;
    page-break-inside: auto !important;
  }

  /* Table header repeat di setiap halaman */
  .kartu-stok-table thead {
    display: table-header-group;
  }

  /* Baris tidak boleh terpotong antar halaman */
  .kartu-stok-table tr {
    page-break-inside: avoid;
  }

  @page {
    margin: 10mm;
    size: A4 portrait;
  }
}
</style>

<script defer>
'use strict';

/* ============================================================
   INDEX v5.4.1
   Tidak redeclare U/Api/Store/Toast/Modal/Btn/FormError/CS/
   LibLoader/LoginForm/AuthGuard — semua dari core.js.
   ============================================================ */

/* ============================================================
   HELPER
   ============================================================ */
const Helper = {
  loader(text) {
    return '<div class="inline-loading">' +
      '<span class="spinner"></span>' +
      '<span>' + U.escapeHtml(text || 'Memuat...') + '</span>' +
    '</div>';
  },
  loaderSm(text) {
    return '<span class="inline-loading-sm">' +
      '<span class="spinner"></span>' +
      U.escapeHtml(text || '') +
    '</span>';
  },
  skeletonTable(cols, rows) {
    const c = cols || 5, r = rows || 5;
    const headCells = Array(c).fill(0).map((_, i) =>
      '<th><div class="skeleton" style="width:' + (60 + (i * 7) % 40) + 'px;height:10px;margin:0"></div></th>'
    ).join('');
    const bodyRows = Array(r).fill(0).map(() =>
      '<tr>' + Array(c).fill(0).map(() =>
        '<td><div class="skeleton" style="width:100%;height:12px;margin:0"></div></td>'
      ).join('') + '</tr>'
    ).join('');
    return '<div class="table-wrap"><div class="table-scroll">' +
      '<table class="data-table"><thead><tr>' + headCells + '</tr></thead>' +
      '<tbody>' + bodyRows + '</tbody></table></div></div>';
  },
  skeletonCards(count) {
    return Array(count || 4).fill(0).map(() =>
      '<div class="stat-card">' +
        '<div class="skeleton" style="width:50px;height:50px;border-radius:14px;flex-shrink:0"></div>' +
        '<div class="stat-body">' +
          '<div class="skeleton" style="width:60%;height:24px;margin-bottom:6px"></div>' +
          '<div class="skeleton" style="width:40%;height:12px;margin:0"></div>' +
        '</div>' +
      '</div>'
    ).join('');
  },
  emptyState(title, desc, iconName) {
    return '<div class="empty-state">' + U.icon(iconName || 'info', 52) +
      '<h3>' + U.escapeHtml(title) + '</h3>' +
      (desc ? '<p>' + U.escapeHtml(desc) + '</p>' : '') +
    '</div>';
  },
  emptyInline(text) {
    return '<div class="text-muted text-center" style="padding:24px;font-size:13px">' +
      U.escapeHtml(text) + '</div>';
  },
  statCard(tone, iconName, value, label) {
    return '<div class="stat-card">' +
      '<div class="stat-icon ' + tone + '">' + U.icon(iconName, 24) + '</div>' +
      '<div class="stat-body">' +
        '<div class="stat-value">' + value + '</div>' +
        '<div class="stat-label">' + U.escapeHtml(label) + '</div>' +
      '</div>' +
    '</div>';
  }
};

/* ============================================================
   MENU
   ============================================================ */
const MENU = [
  { group: 'Operasional', items: [
    { id: 'dashboard', label: 'Dashboard', icon: 'dashboard',
      roles: ['SuperAdmin', 'Apoteker', 'Gudang', 'Bidan_Desa'] },
    { id: 'pesanan-ruang', label: 'Pesanan Ruang', icon: 'package',
      roles: ['SuperAdmin', 'Apoteker', 'Gudang'] },
    { id: 'approval', label: 'Menunggu Approval', icon: 'check',
      roles: ['SuperAdmin', 'Apoteker'] },
    { id: 'opname', label: 'Stock Opname', icon: 'clipboard',
      roles: ['SuperAdmin', 'Apoteker', 'Gudang'] }
  ]},
  { group: 'Laporan', items: [
    { id: 'laporan', label: 'Laporan', icon: 'trending',
      roles: ['SuperAdmin', 'Apoteker', 'Gudang', 'Bidan_Desa'] },
    { id: 'kartu-stok', label: 'Kartu Stok', icon: 'file',
      roles: ['SuperAdmin', 'Apoteker', 'Gudang', 'Bidan_Desa'] },
    { id: 'cetak-qr', label: 'Cetak QR', icon: 'qr',
      roles: ['SuperAdmin', 'Apoteker', 'Gudang'] }
  ]},
  { group: 'Master Data', items: [
    { id: 'master-obat', label: 'Data Obat', icon: 'pills',
      roles: ['SuperAdmin', 'Apoteker'] },
    { id: 'master-bmhp', label: 'Data BMHP', icon: 'box',
      roles: ['SuperAdmin', 'Apoteker'] },
    { id: 'master-atk', label: 'Data ATK', icon: 'package',
      roles: ['SuperAdmin', 'Apoteker'] },
    { id: 'master-supplier', label: 'Data Supplier', icon: 'truck',
      roles: ['SuperAdmin', 'Apoteker'] },
    { id: 'master-unit', label: 'Data Unit', icon: 'building',
      roles: ['SuperAdmin'] },
    { id: 'master-rak', label: 'Data Rak', icon: 'mapPin',
      roles: ['SuperAdmin', 'Apoteker'] },
    { id: 'master-ruang', label: 'Data Ruang', icon: 'home',
      roles: ['SuperAdmin', 'Apoteker'] },
    { id: 'master-petugas', label: 'Data Petugas', icon: 'users',
      roles: ['SuperAdmin'] }
  ]},
  { group: 'Tata Kelola', items: [
    { id: 'audit', label: 'Audit Log', icon: 'clipboard',
      roles: ['SuperAdmin', 'Apoteker'] },
    { id: 'settings', label: 'Pengaturan', icon: 'settings',
      roles: ['SuperAdmin', 'Apoteker', 'Gudang', 'Bidan_Desa'] }
  ]}
];

/* ============================================================
   ADMIN APP
   ============================================================ */
const AdminApp = {
  session: null,
  master: null,
  masterLoading: false,
  currentRoute: null,
  sidebarCollapsed: false,
  approvalCount: 0,
  pesananBaruCount: 0,
  _suppressHashChange: false,
  _routeRenderId: 0,
  _masterListeners: [],
  _masterLoadPromise: null,
  _shellListeners: null,

  async init() {
    dbg('AdminApp v5.4.1 init');
    const session = Store.getSession();

    if (session && session.token) {
      try {
        const res = await Api.whoAmI();
        if (res && res.code === 200 && res.data) {
          if (res.data.role === 'Scanner') {
            location.replace('scan.html');
            return;
          }
          if (res.data.role === 'Ruang') {
            location.replace('pesan.html');
            return;
          }
          this.session = {
            token: session.token,
            id_petugas: res.data.id_petugas,
            username: res.data.username,
            nama: res.data.nama,
            role: res.data.role,
            wilayah_binaan: res.data.wilayah_binaan || '',
            expiry: res.data.expiry
          };
          Store.setSession(this.session);

          // v5.4: shell dulu, master background
          this._hideBootSplash();
          this._initShell();
          this.route(location.hash ? location.hash.substring(2) : 'dashboard');

          this._loadMaster()
            .then(() => this._notifyMasterLoaded())
            .catch(err => dbgWarn('BG master load gagal:', err.message));
          return;
        }
      } catch (err) {
        dbgWarn('whoAmI gagal:', err.message);
        Store.clearSession();
      }
    }

    this._hideBootSplash();
    this._showLogin();
  },

  _hideBootSplash() {
    const el = document.getElementById('boot-splash');
    if (!el) return;
    el.classList.add('hide');
    setTimeout(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 400);
  },

  /* ---------- MASTER LOAD ---------- */
  async _loadMaster() {
    // v5.4: guard anti-concurrent
    if (this._masterLoadPromise) return this._masterLoadPromise;

    const cached = Store.getMaster();
    if (cached) {
      dbg('Master dari cache lokal');
      this.master = cached;
      return Promise.resolve();
    }

    this.masterLoading = true;
    this._masterLoadPromise = (async () => {
      try {
        const res = await Api.getMasterData();
        this.master = res.data;
        Store.setMaster(this.master);
        dbg('Master loaded dari server');
      } catch (err) {
        dbgWarn('Gagal load master:', err.message);
        Toast.warning('Data master belum termuat.');
        this.master = {
          obat: [], bmhp: [], atk: [], supplier: [],
          unit: [], rak: [], petugas: [], ruang: []
        };
      } finally {
        this.masterLoading = false;
        this._masterLoadPromise = null;
      }
    })();

    return this._masterLoadPromise;
  },

  async refreshMaster() {
    Store.clearMaster();
    this.master = null;
    this._masterLoadPromise = null;
    await this._loadMaster();
  },

  /**
   * v5.4: pub/sub untuk page yang butuh master data.
   */
  onMasterLoaded(callback) {
    if (this.master && !this.masterLoading) {
      try { callback(this.master); }
      catch (e) { dbgErr('onMasterLoaded sync:', e); }
      return;
    }
    this._masterListeners.push(callback);
  },

  _notifyMasterLoaded() {
    const cbs = this._masterListeners.slice();
    this._masterListeners = [];
    cbs.forEach(cb => {
      try { cb(this.master); }
      catch (e) { dbgErr('master listener:', e); }
    });
  },

  /* ---------- LOGIN ---------- */
  _showLogin() {
    const root = U.$('#app');
    LoginForm.mount(root, (session) => {
      // v5.4 FIX: callback NON-async — shell HARUS render segera,
      // jangan tunggu master load (bisa timeout 20s+ dan user stuck di login).
      if (session.role === 'Scanner') {
        Toast.info('Mengalihkan ke Scanner...');
        setTimeout(() => location.replace('scan.html'), 500);
        return;
      }
      if (session.role === 'Ruang') {
        Toast.info('Mengalihkan ke halaman Pesan Barang...');
        setTimeout(() => location.replace('pesan.html'), 500);
        return;
      }
      this.session = session;

      // 1) Render shell + route SEGERA (login form hilang dalam <50ms)
      this._initShell();
      this.route('dashboard');

      // 2) v5.4.1: welcome toast DIPINDAH ke sini (layer dulu, baru toast)
      // karena core.js dipanggil dengan welcomeToast: false
      Toast.success('Selamat datang, ' + session.nama);

      // 3) Master load di BACKGROUND (tidak blocking UI)
      this._loadMaster()
        .then(() => this._notifyMasterLoaded())
        .catch(err => dbgWarn('BG master load gagal:', err.message));
    }, {
      variant: 'split',
      // v5.4.1: matikan welcome toast di core.js, kita handle sendiri
      welcomeToast: false
    });
  },

  /* ---------- SHELL ---------- */
  _initShell() {
    const root = U.$('#app');
    root.innerHTML = this._renderShell();
    this._attachShellListeners();
    this._updateBadges();
    this._checkOnline();
  },

  _renderShell() {
    const s = this.session;
    return '' +
      '<div class="app-shell" id="app-shell">' +
        '<div class="sidebar-backdrop" id="sidebar-backdrop"></div>' +
        '<aside class="sidebar" id="sidebar">' +
          '<div class="sidebar-header">' +
            '<div class="sidebar-logo">PKM</div>' +
            '<div class="sidebar-brand">' +
              '<div class="sidebar-brand-title">Sistem Gudang</div>' +
              '<div class="sidebar-brand-subtitle">Puskesmas Sanden</div>' +
            '</div>' +
          '</div>' +
          '<nav class="sidebar-nav" id="sidebar-nav">' +
            this._renderMenu(s.role) +
          '</nav>' +
        '</aside>' +
        '<div class="main-wrapper">' +
          '<header class="app-topbar">' +
            '<button class="topbar-toggle" id="toggle-sidebar" title="Toggle Sidebar" aria-label="Toggle Sidebar">' +
              U.icon('menu', 20) +
            '</button>' +
            '<div class="topbar-breadcrumb">' +
              '<div class="topbar-breadcrumb-title" id="breadcrumb-title">Dashboard</div>' +
              '<div class="topbar-breadcrumb-sub" id="breadcrumb-sub">' +
                U.escapeHtml(s.nama) + ' · ' + U.escapeHtml(s.role) +
              '</div>' +
            '</div>' +
            '<div class="offline-badge" id="offline-badge">' +
              U.icon('wifiOff', 12) + ' Offline' +
            '</div>' +
            '<div class="topbar-actions">' +
              '<a class="btn-scanner" href="scan.html" title="Buka Scanner">' +
                U.icon('qr', 16) +
                '<span class="label">Scanner</span>' +
              '</a>' +
              '<button class="app-icon-btn danger" id="btn-logout-topbar" title="Keluar">' +
                U.icon('logout', 20) +
              '</button>' +
            '</div>' +
          '</header>' +
          '<main class="page-container" id="page-container">' +
            '<div class="page-inner" id="page-inner"></div>' +
          '</main>' +
        '</div>' +
      '</div>';
  },

  _renderMenu(role) {
    return MENU.map(group => {
      const items = group.items.filter(it => it.roles.indexOf(role) !== -1);
      if (items.length === 0) return '';
      return '' +
        '<div class="sidebar-group">' +
          '<div class="sidebar-group-title">' + U.escapeHtml(group.group) + '</div>' +
          items.map(it =>
            '<a class="sidebar-item" href="#/' + it.id + '" data-route="' + it.id + '">' +
              U.icon(it.icon, 18) +
              '<span class="item-label">' + U.escapeHtml(it.label) + '</span>' +
              (it.id === 'approval'
                ? '<span class="item-badge" id="approval-badge" style="display:none">0</span>'
                : '') +
              (it.id === 'pesanan-ruang'
                ? '<span class="item-badge" id="pesanan-badge" style="display:none">0</span>'
                : '') +
            '</a>'
          ).join('') +
        '</div>';
    }).join('');
  },

  _attachShellListeners() {
    // v5.4: detach listener lama dulu supaya tidak duplikat saat re-init shell
    if (this._shellListeners) {
      const old = this._shellListeners;
      if (old.hashchange) window.removeEventListener('hashchange', old.hashchange);
      if (old.online) {
        window.removeEventListener('online', old.online);
        window.removeEventListener('offline', old.online);
      }
      this._shellListeners = null;
    }

    const toggleBtn = U.$('#toggle-sidebar');
    if (toggleBtn) {
      toggleBtn.addEventListener('click', () => {
        const shell = U.$('#app-shell');
        const sidebar = U.$('#sidebar');
        const backdrop = U.$('#sidebar-backdrop');
        if (window.innerWidth <= 900) {
          sidebar.classList.toggle('open');
          backdrop.classList.toggle('active');
        } else {
          shell.classList.toggle('sidebar-collapsed');
          this.sidebarCollapsed = shell.classList.contains('sidebar-collapsed');
        }
      });
    }

    const backdrop = U.$('#sidebar-backdrop');
    if (backdrop) {
      backdrop.addEventListener('click', () => {
        U.$('#sidebar').classList.remove('open');
        backdrop.classList.remove('active');
      });
    }

    const logoutBtn = U.$('#btn-logout-topbar');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        Modal.confirm('Keluar', 'Yakin ingin keluar dari aplikasi?',
          () => this.logout(), 'Ya, Keluar', true,
          { icon: 'danger', subtitle: 'Anda harus login ulang' });
      });
    }

    U.$$('.sidebar-item').forEach(el => {
      el.addEventListener('click', () => {
        if (window.innerWidth <= 900) {
          U.$('#sidebar').classList.remove('open');
          U.$('#sidebar-backdrop').classList.remove('active');
        }
      });
    });

    const hashchangeHandler = () => {
      if (this._suppressHashChange) return;
      const route = location.hash ? location.hash.substring(2) : 'dashboard';
      if (this.session) this.route(route);
    };
    window.addEventListener('hashchange', hashchangeHandler);

    const onlineHandler = () => this._checkOnline();
    window.addEventListener('online', onlineHandler);
    window.addEventListener('offline', onlineHandler);

    this._shellListeners = { hashchange: hashchangeHandler, online: onlineHandler };
  },

  _checkOnline() {
    const online = navigator.onLine;
    const badge = U.$('#offline-badge');
    if (badge) badge.classList.toggle('visible', !online);
  },

  /* ---------- BADGES (v5.4: parallel) ---------- */
  async _updateBadges() {
    if (!this.session) return;
    const role = this.session.role;
    const tasks = [];

    if (role === 'SuperAdmin' || role === 'Apoteker') {
      tasks.push(this._badgeApproval());
    }
    if (role === 'SuperAdmin' || role === 'Apoteker' || role === 'Gudang') {
      tasks.push(this._badgePesananBaru());
    }

    await Promise.allSettled(tasks);
  },

  async _badgeApproval() {
    try {
      const res = await Api.getPendingApprovals();
      const total = (res.data && res.data.total) || 0;
      this.approvalCount = total;
      const badge = U.$('#approval-badge');
      if (badge) {
        if (total > 0) {
          badge.textContent = total;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      }
    } catch (err) {
      dbgWarn('Approval badge error:', err.message);
    }
  },

  async _badgePesananBaru() {
    try {
      const res = await Api.getPesananMasuk({ status: 'Baru', limit: 300 });
      const items = (res.data && res.data.items) || [];
      const total = items.length;
      this.pesananBaruCount = total;
      const badge = U.$('#pesanan-badge');
      if (badge) {
        if (total > 0) {
          badge.textContent = total;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      }
    } catch (err) {
      dbgWarn('Pesanan badge error:', err.message);
    }
  },

  _updateActiveNav(route) {
    U.$$('.sidebar-item').forEach(el => {
      el.classList.toggle('active', el.dataset.route === route);
    });
  },

  _updateBreadcrumb(title, subtitle) {
    const t = U.$('#breadcrumb-title');
    const s = U.$('#breadcrumb-sub');
    if (t) t.textContent = title;
    if (s) s.textContent = subtitle;
  },

  /* ---------- ROUTE ---------- */
  async route(route) {
    if (!this.session) return;

    let found = null, foundGroup = null;
    for (const g of MENU) {
      const it = g.items.find(i => i.id === route);
      if (it) { found = it; foundGroup = g.group; break; }
    }
    if (!found) { this._renderNotFound(); return; }
    if (found.roles.indexOf(this.session.role) === -1) {
      this._renderForbidden();
      return;
    }

    this.currentRoute = route;
    this._updateActiveNav(route);
    this._updateBreadcrumb(found.label, foundGroup + ' · ' + this.session.nama);

    if (location.hash.substring(2) !== route) {
      this._suppressHashChange = true;
      location.hash = '#/' + route;
      setTimeout(() => { this._suppressHashChange = false; }, 0);
    }

    const pageInner = U.$('#page-inner');
    const pageContainer = U.$('#page-container');
    pageInner.innerHTML = this._renderSkeleton();
    if (pageContainer) pageContainer.scrollTop = 0;

    const myId = ++this._routeRenderId;

    try {
      switch (route) {
        case 'dashboard':       await PageDashboard.render(pageInner, myId); break;
        case 'pesanan-ruang':   await PagePesananRuang.render(pageInner, myId); break;
        case 'approval':        await PageApproval.render(pageInner, myId); break;
        case 'opname':          await PageOpname.render(pageInner, myId); break;
        case 'laporan':         await PageLaporan.render(pageInner, myId); break;
        case 'kartu-stok':      await PageKartuStok.render(pageInner, myId); break;
        case 'cetak-qr':        await PageCetakQR.render(pageInner, myId); break;
        case 'master-obat':     await PageMaster.render(pageInner, 'Master_Obat', myId); break;
        case 'master-bmhp':     await PageMaster.render(pageInner, 'Master_BMHP', myId); break;
        case 'master-atk':      await PageMaster.render(pageInner, 'Master_ATK', myId); break;
        case 'master-supplier': await PageMaster.render(pageInner, 'Ref_Supplier', myId); break;
        case 'master-unit':     await PageMaster.render(pageInner, 'Ref_UnitInternal', myId); break;
        case 'master-rak':      await PageMaster.render(pageInner, 'Ref_LokasiRak', myId); break;
        case 'master-ruang':    await PageMaster.render(pageInner, 'Ref_Ruang', myId); break;
        case 'master-petugas':  await PageMaster.render(pageInner, 'Ref_Petugas', myId); break;
        case 'audit':           await PageAudit.render(pageInner, myId); break;
        case 'settings':        await PageSettings.render(pageInner, myId); break;
        default:
          pageInner.innerHTML = Helper.emptyState('Halaman tidak ditemukan', '', 'alertCircle');
      }
    } catch (err) {
      dbgErr('Route error:', err);
      if (myId === this._routeRenderId) {
        pageInner.innerHTML = Helper.emptyState('Gagal Memuat',
          err.message || 'Terjadi kesalahan.', 'alertCircle');
      }
    }
  },

  _renderSkeleton() {
    return '' +
      '<div class="skeleton" style="height:30px;width:200px;margin-bottom:24px"></div>' +
      '<div class="stats-grid" style="margin-bottom:16px">' +
        Helper.skeletonCards(4) +
      '</div>' +
      '<div class="skeleton" style="height:260px;border-radius:16px"></div>';
  },

  _renderNotFound() {
    U.$('#page-inner').innerHTML = Helper.emptyState(
      'Halaman tidak ditemukan', 'Periksa URL atau kembali ke Dashboard.', 'alertCircle');
  },

  _renderForbidden() {
    U.$('#page-inner').innerHTML = Helper.emptyState(
      'Akses Ditolak', 'Anda tidak berwenang mengakses halaman ini.', 'alertCircle');
  },

  async logout() {
    try { await Api.logout(); } catch (e) { /* silent */ }
    Store.clearSession();
    Store.clearMaster();
    this.session = null;
    this.master = null;
    this._masterListeners = [];
    this._masterLoadPromise = null;
    Toast.info('Anda telah keluar.');
    this._showLogin();
  }
};

/* ============================================================
   PAGE: DASHBOARD
   ============================================================ */
const PageDashboard = {
  async render(container, renderId) {
    container.innerHTML = this._renderSkeleton();

    let summary = {
      total_item_kritis: 0, total_nilai_aset: 0, total_obat_mendekati_ed: 0,
      total_obat: 0, total_bmhp: 0, total_atk: 0
    };
    let expiring = [];

    try {
      const [resS, resE] = await Promise.allSettled([
        Api.getDashboardSummary(),
        Api.getExpiringItems(3)
      ]);
      if (renderId !== AdminApp._routeRenderId) return;
      if (resS.status === 'fulfilled' && resS.value && resS.value.code === 200) {
        summary = resS.value.data || summary;
      }
      if (resE.status === 'fulfilled' && resE.value && resE.value.code === 200) {
        expiring = resE.value.data || [];
      }
    } catch (err) {
      if (renderId !== AdminApp._routeRenderId) return;
      container.innerHTML = Helper.emptyState('Gagal Memuat', err.message, 'alertCircle');
      return;
    }

    if (renderId !== AdminApp._routeRenderId) return;

    container.innerHTML =
      this._renderHeader() +
      this._renderWelcome() +
      '<div class="stats-grid">' +
        Helper.statCard('primary', 'pills', U.formatNumber(summary.total_obat || 0), 'Jenis Obat') +
        Helper.statCard('info', 'box', U.formatNumber(summary.total_bmhp || 0), 'Item BMHP') +
        Helper.statCard('warning', 'package', U.formatNumber(summary.total_atk || 0), 'Item ATK') +
        Helper.statCard('danger', 'alert', U.formatNumber(summary.total_item_kritis), 'Stok Kritis') +
        Helper.statCard('warning', 'alertCircle', U.formatNumber(summary.total_obat_mendekati_ed), 'Batch Dekat ED') +
        Helper.statCard('success', 'trending', U.formatRupiah(summary.total_nilai_aset), 'Nilai Aset') +
      '</div>' +
      '<div class="card">' +
        '<div class="card-title">' +
          '<span>Obat Mendekati Kedaluwarsa (≤ 3 bulan)</span>' +
          '<span class="badge badge-warning">' + expiring.length + ' batch</span>' +
        '</div>' +
        (expiring.length === 0
          ? Helper.emptyState('Tidak ada obat mendekati kedaluwarsa',
              'Semua batch masih jauh dari tanggal ED.', 'check')
          : this._expiringTable(expiring)) +
      '</div>';

    const refreshBtn = U.$('#btn-refresh');
    if (refreshBtn) refreshBtn.addEventListener('click', () =>
      this.render(container, ++AdminApp._routeRenderId));
  },

  _renderSkeleton() {
    return '' +
      '<div class="skeleton" style="height:110px;border-radius:20px;margin-bottom:22px"></div>' +
      '<div class="stats-grid">' + Helper.skeletonCards(6) + '</div>' +
      '<div class="skeleton" style="height:220px;border-radius:16px"></div>';
  },

  _renderHeader() {
    return '' +
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title">Dashboard</div>' +
          '<div class="page-subtitle">Ringkasan sistem gudang · ' +
            U.formatDateTime(new Date()) + '</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          '<button class="btn btn-secondary" id="btn-refresh">' +
            U.icon('refresh', 16) + ' Refresh' +
          '</button>' +
        '</div>' +
      '</div>';
  },

  _renderWelcome() {
    const s = AdminApp.session;
    const hour = new Date().getHours();
    const greeting = hour < 11 ? 'Selamat pagi' :
                     hour < 15 ? 'Selamat siang' :
                     hour < 18 ? 'Selamat sore' : 'Selamat malam';
    const tanggal = new Date().toLocaleDateString('id-ID', {
      weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
    });
    return '' +
      '<div class="welcome-banner">' +
        '<div class="welcome-text">' +
          '<div class="welcome-greeting">' + greeting + ',</div>' +
          '<div class="welcome-name">' + U.escapeHtml(s.nama) + '</div>' +
          '<div class="welcome-meta">' +
            '<span class="welcome-meta-pill">' +
              U.icon('users', 12) + U.escapeHtml(s.role) +
            '</span>' +
            '<span class="welcome-meta-pill">' +
              U.icon('calendar', 12) + U.escapeHtml(tanggal) +
            '</span>' +
          '</div>' +
        '</div>' +
      '</div>';
  },

  _expiringTable(items) {
    return '' +
      '<div class="table-wrap"><div class="table-scroll">' +
        '<table class="data-table">' +
          '<thead><tr>' +
            '<th>ID Obat</th><th>Batch</th><th>Exp. Date</th><th class="num">Sisa</th>' +
          '</tr></thead>' +
          '<tbody>' +
            items.slice(0, 10).map(it =>
              '<tr>' +
                '<td class="mono">' + U.escapeHtml(it.id_obat) + '</td>' +
                '<td class="mono">' + U.escapeHtml(it.no_batch) + '</td>' +
                '<td>' + U.formatDate(it.exp_date) + '</td>' +
                '<td class="num">' + U.formatNumber(it.sisa_stok) + '</td>' +
              '</tr>'
            ).join('') +
            (items.length > 10
              ? '<tr><td colspan="4" class="text-muted text-center" ' +
                'style="padding:12px;font-size:12px">... dan ' +
                (items.length - 10) + ' batch lainnya</td></tr>'
              : '') +
          '</tbody>' +
        '</table>' +
      '</div></div>';
  }
};

/* ============================================================
   PAGE: PESANAN RUANG (v5.4: pagination + getPesananDetail + requestID)
   ============================================================ */
const PagePesananRuang = {
  _items: [],
  _filter: 'Baru',
  _search: '',
  _container: null,
  _renderId: 0,
  _offset: 0,
  _limit: 100,
  _hasMore: false,
  _loadingMore: false,
  _detailRequestId: 0,

  async render(container, renderId) {
    this._container = container;
    this._renderId = renderId;
    this._filter = 'Baru';
    this._search = '';
    this._items = [];
    this._offset = 0;
    this._hasMore = false;

    container.innerHTML = this._renderSkeleton();
    await this._load(true);
  },

  _renderSkeleton() {
    return '' +
      '<div class="skeleton" style="height:30px;width:220px;margin-bottom:24px"></div>' +
      '<div class="order-stats">' +
        Array(4).fill(0).map(() =>
          '<div class="skeleton" style="height:76px;border-radius:14px"></div>'
        ).join('') +
      '</div>' +
      '<div class="skeleton" style="height:46px;border-radius:12px;margin-bottom:16px"></div>' +
      Array(3).fill(0).map(() =>
        '<div class="skeleton" style="height:130px;border-radius:16px;margin-bottom:12px"></div>'
      ).join('');
  },

  async _load(initial) {
    if (initial) {
      this._items = [];
      this._offset = 0;
    }
    try {
      const res = await Api.getPesananMasuk({ limit: this._limit, offset: this._offset });
      if (this._renderId !== AdminApp._routeRenderId) return;
      const newItems = (res.data && res.data.items) || [];
      this._hasMore = !!(res.data && res.data.has_more);
      if (initial) this._items = newItems;
      else this._items = this._items.concat(newItems);
      this._offset = this._items.length;
      if (initial) this._renderFull();
      else this._renderList();
    } catch (err) {
      if (this._renderId !== AdminApp._routeRenderId) return;
      if (initial) {
        this._container.innerHTML = Helper.emptyState('Gagal memuat', err.message, 'alertCircle');
      } else {
        Toast.error('Gagal memuat lebih banyak: ' + err.message);
      }
    } finally {
      this._loadingMore = false;
    }
  },

  _renderFull() {
    const counts = { Baru: 0, Diproses: 0, Selesai: 0, Ditolak: 0, Gagal: 0 };
    this._items.forEach(it => {
      if (counts[it.status] !== undefined) counts[it.status]++;
    });
    const total = this._items.length;

    this._container.innerHTML = '' +
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title">Pesanan Ruang</div>' +
          '<div class="page-subtitle">Permintaan ATK / BMHP dari ruang-ruang Puskesmas</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          '<button class="btn btn-secondary" id="btn-refresh">' +
            U.icon('refresh', 16) + ' Refresh' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div class="order-stats">' +
        this._statMini('Baru', counts.Baru) +
        this._statMini('Diproses', counts.Diproses) +
        this._statMini('Selesai', counts.Selesai) +
        this._statMini('Total', total) +
      '</div>' +
      '<div class="tab-filter" id="tab-filter">' +
        this._tabBtn('Baru', 'Baru', counts.Baru) +
        this._tabBtn('Diproses', 'Diproses', counts.Diproses) +
        this._tabBtn('Selesai', 'Selesai', counts.Selesai) +
        this._tabBtn('Ditolak', 'Ditolak', counts.Ditolak) +
        this._tabBtn('Gagal', 'Gagal', counts.Gagal) +
        this._tabBtn('', 'Semua', total) +
      '</div>' +
      '<div class="card card-tight" style="margin-bottom:14px">' +
        '<input type="text" class="input" id="pr-search" ' +
          'placeholder="Cari ID pesanan / ruang / pemesan..." autocomplete="off">' +
      '</div>' +
      '<div id="pr-list"></div>' +
      '<div id="pr-loadmore-wrap" style="margin-top:16px"></div>';

    this._attachListeners();
    this._renderList();
  },

  _statMini(label, value) {
    return '<div class="order-stat">' +
      '<div class="order-stat-value">' + value + '</div>' +
      '<div class="order-stat-label">' + U.escapeHtml(label) + '</div>' +
    '</div>';
  },

  _tabBtn(value, label, count) {
    const active = this._filter === value ? ' active' : '';
    return '<button type="button" class="tab-filter-btn' + active + '" ' +
      'data-filter="' + U.escapeHtml(value) + '">' +
      U.escapeHtml(label) +
      '<span class="tab-count">' + count + '</span>' +
    '</button>';
  },

  _attachListeners() {
    const refreshBtn = U.$('#btn-refresh');
    if (refreshBtn) {
      refreshBtn.addEventListener('click', () => {
        this._container.innerHTML = this._renderSkeleton();
        this._load(true);
      });
    }

    const searchEl = U.$('#pr-search');
    if (searchEl) {
      searchEl.value = this._search;
      searchEl.addEventListener('input', U.debounce(() => {
        this._search = searchEl.value.toLowerCase().trim();
        this._renderList();
      }, 200));
    }

    U.$$('#tab-filter .tab-filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        this._filter = btn.dataset.filter;
        U.$$('#tab-filter .tab-filter-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.filter === this._filter);
        });
        this._renderList();
      });
    });
  },

  _renderList() {
    const target = U.$('#pr-list');
    if (!target) return;

    let items = this._items;
    if (this._filter) items = items.filter(it => it.status === this._filter);
    if (this._search) {
      const q = this._search;
      items = items.filter(it =>
        String(it.id_pesanan || '').toLowerCase().indexOf(q) !== -1 ||
        String(it.nama_ruang || '').toLowerCase().indexOf(q) !== -1 ||
        String(it.pemesan || '').toLowerCase().indexOf(q) !== -1
      );
    }

    if (items.length === 0) {
      const emptyMsg = this._search
        ? 'Tidak ditemukan untuk "' + this._search + '"'
        : (this._filter
            ? 'Tidak ada pesanan dengan status "' + this._filter + '"'
            : 'Belum ada pesanan masuk');
      target.innerHTML = '<div class="card">' +
        Helper.emptyState(emptyMsg, '', 'package') + '</div>';
      this._renderLoadMore();
      return;
    }

    target.innerHTML = items.map(it => this._renderOrderCard(it)).join('');

    U.$$('.order-card').forEach(card => {
      card.addEventListener('click', () => this._openDetail(card.dataset.id));
    });

    this._renderLoadMore();
  },

  _renderLoadMore() {
    const wrap = U.$('#pr-loadmore-wrap');
    if (!wrap) return;
    if (!this._hasMore) { wrap.innerHTML = ''; return; }
    wrap.innerHTML = '<button class="btn btn-secondary btn-block" id="btn-loadmore">' +
      U.icon('chevronDown', 16) + ' Muat Lebih Banyak' +
    '</button>';
    const btn = U.$('#btn-loadmore');
    if (btn) {
      btn.addEventListener('click', async () => {
        if (this._loadingMore) return;
        this._loadingMore = true;
        Btn.setLoading(btn, 'Memuat...');
        await this._load(false);
      });
    }
  },

  _renderOrderCard(it) {
    const statusPill = this._statusPill(it.status);
    const timeAgo = this._formatTimeAgo(it.timestamp);
    return '' +
      '<div class="order-card" data-id="' + U.escapeHtml(it.id_pesanan) + '">' +
        '<div class="order-card-head">' +
          '<div>' +
            '<div class="order-card-id">' + U.escapeHtml(it.id_pesanan) + '</div>' +
            '<div class="order-card-meta">' +
              '<span>' + U.icon('home', 11) + ' ' +
                U.escapeHtml(it.nama_ruang || '-') + '</span>' +
              '<span>' + U.icon('users', 11) + ' ' +
                U.escapeHtml(it.pemesan || '-') + '</span>' +
            '</div>' +
          '</div>' +
          '<div>' + statusPill + '</div>' +
        '</div>' +
        '<div class="order-card-body">' +
          '<span><strong>' + (it.total_item || 0) + '</strong> item' +
            (it.keterangan
              ? ' · <span style="color:var(--text-muted)">' +
                U.escapeHtml(it.keterangan.substring(0, 60)) +
                (it.keterangan.length > 60 ? '…' : '') + '</span>'
              : '') +
          '</span>' +
          '<span style="font-size:11.5px;color:var(--text-light)">' +
            U.icon('calendar', 11) + ' ' + timeAgo +
          '</span>' +
        '</div>' +
      '</div>';
  },

  _statusPill(status) {
    const map = {
      'Baru':      { bg: 'var(--warning-bg)', color: 'var(--warning-dark, var(--warning))' },
      'Diproses':  { bg: 'var(--info-bg)', color: 'var(--info)' },
      'Selesai':   { bg: 'var(--success-bg)', color: 'var(--success)' },
      'Ditolak':   { bg: 'var(--danger-bg)', color: 'var(--danger)' },
      'Gagal':     { bg: 'var(--surface-2)', color: 'var(--text-muted)' }
    };
    const c = map[status] || map['Baru'];
    return '<span class="status-pill" style="background:' + c.bg +
      ';color:' + c.color + '">' + U.escapeHtml(status) + '</span>';
  },

  _formatTimeAgo(ts) {
    if (!ts) return '-';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '-';
    const diff = Date.now() - d.getTime();
    const min = Math.floor(diff / 60000);
    if (min < 1) return 'Baru saja';
    if (min < 60) return min + ' menit lalu';
    const jam = Math.floor(min / 60);
    if (jam < 24) return jam + ' jam lalu';
    const hari = Math.floor(jam / 24);
    if (hari < 7) return hari + ' hari lalu';
    return U.formatDate(ts);
  },

  async _openDetail(idPesanan) {
    const it = this._items.find(x => x.id_pesanan === idPesanan);
    if (!it) return;

    const myRequestId = ++this._detailRequestId;

    Modal.open({
      title: 'Detail Pesanan',
      icon: 'primary',
      subtitle: idPesanan + ' · ' + (it.nama_ruang || '-'),
      body: '<div id="order-detail-container">' +
              Helper.loader('Memuat detail item...') +
            '</div>',
      actions: [
        { label: 'Tutup', class: 'btn-secondary' }
      ]
    });

    let detail = null;
    try {
      const res = await Api.getPesananDetail(idPesanan);
      if (myRequestId !== this._detailRequestId) return;
      detail = res.data;
    } catch (err) {
      if (myRequestId !== this._detailRequestId) return;
      const el = U.$('#order-detail-container');
      if (el) el.innerHTML = Helper.emptyState('Gagal memuat detail',
        err.message, 'alertCircle');
      return;
    }

    const container = U.$('#order-detail-container');
    if (!container) return;

    const items = detail.items || [];
    const itemsHtml = items.length === 0
      ? '<div class="text-muted text-center" style="padding:20px;font-size:12.5px">' +
        'Detail item tidak tersedia.</div>'
      : '<div class="order-detail-list">' +
        items.map(item => {
          const stok = item.stok_saat_pesan;
          const kurang = stok !== null && stok !== undefined && item.qty > stok;
          return '' +
            '<div class="order-detail-item">' +
              '<div class="name">' +
                '<strong>' + U.escapeHtml(item.nama_barang || '-') + '</strong>' +
                '<div class="meta">' +
                  U.escapeHtml(item.kode_barang || '') +
                  (item.tipe ? ' · ' + U.escapeHtml(item.tipe) : '') +
                  (item.catatan ? ' · ' + U.escapeHtml(item.catatan) : '') +
                '</div>' +
                (kurang
                  ? '<div class="stok-info">' +
                    U.icon('alert', 11) + ' Stok saat pesan: ' + stok +
                    '</div>'
                  : '') +
              '</div>' +
              '<div class="qty">' + item.qty +
                '<small>' + U.escapeHtml(item.satuan || '') + '</small>' +
              '</div>' +
            '</div>';
        }).join('') +
      '</div>';

    const detailInfo =
      '<div class="detail-section">' +
        '<div class="detail-row">' +
          '<div class="detail-label">Status</div>' +
          '<div class="detail-value">' + this._statusPill(detail.status) + '</div>' +
        '</div>' +
        '<div class="detail-row">' +
          '<div class="detail-label">Waktu Pesan</div>' +
          '<div class="detail-value">' + U.formatDateTime(detail.timestamp) + '</div>' +
        '</div>' +
        '<div class="detail-row">' +
          '<div class="detail-label">Ruang</div>' +
          '<div class="detail-value">' + U.escapeHtml(detail.nama_ruang || '-') + '</div>' +
        '</div>' +
        '<div class="detail-row">' +
          '<div class="detail-label">Pemesan</div>' +
          '<div class="detail-value">' + U.escapeHtml(detail.pemesan || '-') + '</div>' +
        '</div>' +
        '<div class="detail-row">' +
          '<div class="detail-label">Total Item</div>' +
          '<div class="detail-value">' + (detail.total_item || 0) + ' item</div>' +
        '</div>' +
        (detail.petugas_proses
          ? '<div class="detail-row">' +
            '<div class="detail-label">Diproses oleh</div>' +
            '<div class="detail-value">' + U.escapeHtml(detail.petugas_proses) + '</div>' +
            '</div>'
          : '') +
      '</div>' +
      (detail.keterangan
        ? '<div style="margin-bottom:14px;padding:12px 14px;background:var(--surface-2);' +
          'border-radius:12px;font-size:13px;line-height:1.5">' +
          '<strong style="display:block;margin-bottom:4px;font-size:12px;color:var(--text-muted)">' +
          'Catatan:</strong>' + U.escapeHtml(detail.keterangan) + '</div>'
        : '') +
      '<div style="font-size:12.5px;font-weight:700;margin-bottom:8px">' +
        'Item (' + items.length + '):</div>' +
      itemsHtml;

    container.innerHTML = detailInfo;

    const footer = U.$('#modal-footer');
    if (footer) {
      footer.innerHTML = '';
      const self = this;

      if (detail.status === 'Baru') {
        const rejectBtn = document.createElement('button');
        rejectBtn.className = 'btn btn-danger';
        rejectBtn.innerHTML = U.icon('x', 16) + ' Tolak';
        rejectBtn.addEventListener('click', () => self._confirmReject(detail.id_pesanan));
        footer.appendChild(rejectBtn);

        const processBtn = document.createElement('button');
        processBtn.className = 'btn btn-primary';
        processBtn.innerHTML = U.icon('check', 16) + ' Proses';
        processBtn.addEventListener('click', () => self._updateStatus(detail.id_pesanan, 'Diproses'));
        footer.appendChild(processBtn);
      } else if (detail.status === 'Diproses') {
        const doneBtn = document.createElement('button');
        doneBtn.className = 'btn btn-primary';
        doneBtn.innerHTML = U.icon('check', 16) + ' Selesai';
        doneBtn.addEventListener('click', () => self._updateStatus(detail.id_pesanan, 'Selesai'));
        footer.appendChild(doneBtn);
      }

      const closeBtn = document.createElement('button');
      closeBtn.className = 'btn btn-secondary';
      closeBtn.textContent = 'Tutup';
      closeBtn.addEventListener('click', () => Modal.close());
      footer.appendChild(closeBtn);
    }
  },

  _confirmReject(idPesanan) {
    Modal.close();
    setTimeout(() => {
      Modal.confirm(
        'Tolak Pesanan',
        'Yakin ingin menolak pesanan ' + idPesanan + '?\n\n' +
        'Status akan diubah menjadi "Ditolak".',
        () => this._updateStatus(idPesanan, 'Ditolak'),
        'Ya, Tolak',
        true,
        { icon: 'danger', subtitle: 'Ruang tidak akan menerima barang ini' }
      );
    }, 220);
  },

  async _updateStatus(idPesanan, newStatus) {
    Modal.close();
    try {
      await Api.updateStatusPesanan(idPesanan, newStatus);
      Toast.success('Status: ' + newStatus);
      AdminApp._updateBadges();
      await this._load(true);
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
    }
  }
};

      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title">Menunggu Persetujuan</div>' +
          '<div class="page-subtitle">Transaksi Narkotika/Psikotropika dan pengeluaran darurat</div>' +

          '<button class="btn btn-secondary" id="btn-refresh">' +

  _emptyState() {
    return '<div class="card">' +
      Helper.emptyState('Tidak ada transaksi menunggu',

    '</div>';
  },

  _table(items) {
    return '' +
      '<div class="table-wrap"><div class="table-scroll">' +
        '<table class="data-table">' +
          '<thead><tr>' +
            '<th>Waktu</th><th>No Transaksi</th><th>Item</th>' +
            '<th>Golongan</th><th class="num">Qty</th><th>Tipe</th>' +
            '<th>Petugas</th><th class="col-actions">Aksi</th>' +
          '</tr></thead>' +
          '<tbody>' +
            items.map(it =>
              '<tr>' +
                '<td style="font-size:12px">' + U.formatDateTime(it.timestamp) + '</td>' +
                '<td class="mono">' + U.escapeHtml(it.id_transaksi) + '</td>' +
                '<td>' +
                  '<div style="font-weight:600">' + U.escapeHtml(it.nama_obat) + '</div>' +
                  '<div class="text-muted" style="font-size:11px">' +
                    U.escapeHtml(it.id_obat) + '</div>' +
                '</td>' +
                '<td><span class="badge ' +
                  (it.golongan === 'Narkotika' ? 'badge-danger' : 'badge-warning') + '">' +
                  U.escapeHtml(it.golongan) + '</span></td>' +
                '<td class="num">' + U.formatNumber(it.qty) + '</td>' +
                '<td>' + U.escapeHtml(it.tipe_mutasi) + '</td>' +
                '<td class="mono">' + U.escapeHtml(it.petugas) + '</td>' +
                '<td class="col-actions">' +
                  '<button class="btn btn-primary btn-sm" data-approve="' +
                    U.escapeHtml(it.id_transaksi) + '">Setujui</button> ' +
                  '<button class="btn btn-danger btn-sm" data-reject="' +
