<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d7377">
<meta name="description" content="Sistem Gudang Farmasi & BMHP Puskesmas Sanden">
<title>Sistem Gudang — Puskesmas Sanden</title>
<style>
/* ============================================================
   DESIGN TOKENS — proportional with clamp()
   ============================================================ */
:root {
  --primary: #0d7377;
  --primary-dark: #0a5d61;
  --primary-light: #14a3a8;
  --primary-bg: #e6f4f5;
  --danger: #d32f2f; --danger-bg: #ffebee;
  --success: #2e7d32; --success-bg: #e8f5e9;
  --warning: #ef6c00; --warning-bg: #fff3e0;
  --info: #1976d2; --info-bg: #e3f2fd;

  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --text: #1a202c;
  --text-muted: #64748b;
  --text-light: #94a3b8;
  --border: #e2e8f0;
  --border-strong: #cbd5e1;

  /* Fluid spacing scale */
  --sp-1: clamp(4px, 0.5vw, 6px);
  --sp-2: clamp(8px, 1vw, 12px);
  --sp-3: clamp(12px, 1.5vw, 18px);
  --sp-4: clamp(16px, 2vw, 24px);
  --sp-5: clamp(24px, 3vw, 36px);
  --sp-6: clamp(32px, 4vw, 48px);

  /* Fluid typography */
  --fs-xs: clamp(11px, 0.8vw, 12px);
  --fs-sm: clamp(12px, 0.9vw, 13px);
  --fs-base: clamp(14px, 1vw, 15px);
  --fs-md: clamp(15px, 1.1vw, 16px);
  --fs-lg: clamp(17px, 1.4vw, 19px);
  --fs-xl: clamp(20px, 1.8vw, 24px);
  --fs-2xl: clamp(26px, 2.5vw, 32px);

  --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-full: 999px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.10);
  --shadow-xl: 0 16px 48px rgba(0,0,0,0.16);

  /* Proportional layout */
  --sidebar-w: clamp(200px, 16vw, 260px);
  --topbar-h: clamp(52px, 7vh, 60px);
  --bottomnav-h: 62px;
  --content-max: 1400px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

/* ============================================================
   RESET
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: var(--fs-base);
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
a { color: var(--primary); text-decoration: none; }
img { max-width: 100%; display: block; }
ul, ol { list-style: none; }
table { border-collapse: collapse; width: 100%; }

/* ============================================================
   LOGIN
   ============================================================ */
.login-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0d7377 0%, #14a3a8 100%);
  padding: var(--sp-4); z-index: 1000;
}
.login-card {
  background: var(--surface);
  width: 100%; max-width: 420px;
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-xl);
  padding: clamp(24px, 4vw, 40px) clamp(20px, 3vw, 32px);
}
.login-brand { text-align: center; margin-bottom: var(--sp-5); }
.login-logo {
  width: clamp(64px, 8vw, 80px);
  height: clamp(64px, 8vw, 80px);
  margin: 0 auto var(--sp-3);
  background: var(--primary-bg);
  border-radius: var(--r-full);
  display: flex; align-items: center; justify-content: center;
  color: var(--primary);
  font-size: clamp(24px, 3vw, 30px);
  font-weight: 700;
}
.login-title { font-size: var(--fs-xl); font-weight: 700; margin-bottom: 4px; }
.login-subtitle { font-size: var(--fs-sm); color: var(--text-muted); }
.login-form .field { margin-bottom: var(--sp-3); }
.login-pin-display {
  font-family: ui-monospace, monospace;
  font-size: clamp(20px, 2.2vw, 26px);
  letter-spacing: 8px;
  text-align: center;
  padding: var(--sp-3);
  background: var(--surface-2);
  border: 2px solid var(--border);
  border-radius: var(--r-md);
  min-height: clamp(48px, 6vh, 60px);
  display: flex; align-items: center; justify-content: center;
  user-select: none;
}
.login-pin-display.empty { color: var(--text-light); font-size: var(--fs-sm); letter-spacing: 0; }
.login-keypad {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--sp-2);
  margin-top: var(--sp-3);
}
.key-btn {
  aspect-ratio: 1.6;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-size: var(--fs-xl);
  font-weight: 600;
  color: var(--text);
  transition: background 0.15s, transform 0.05s;
  display: flex; align-items: center; justify-content: center;
}
.key-btn:active { background: var(--primary-bg); transform: scale(0.96); }
.key-btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
.key-btn.primary:active { background: var(--primary-dark); }
.key-btn svg { width: 22px; height: 22px; }
.login-help { text-align: center; font-size: var(--fs-sm); color: var(--text-muted); margin-top: var(--sp-4); }
.login-help strong { color: var(--text); }
.login-footer {
  text-align: center; font-size: var(--fs-xs); color: var(--text-light);
  margin-top: var(--sp-5);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
.status-dot.offline { background: var(--danger); }

/* ============================================================
   APP SHELL — Proportional
   ============================================================ */
.app { display: none; min-height: 100vh; }
.app.active { display: block; }

.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  height: var(--topbar-h);
  padding-top: var(--safe-top);
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: var(--sp-2);
  padding-left: var(--sp-3);
  padding-right: var(--sp-3);
}
.topbar-menu-btn {
  display: none;
  width: 40px; height: 40px;
  align-items: center; justify-content: center;
  border-radius: var(--r-sm);
  flex-shrink: 0;
}
.topbar-menu-btn:hover { background: var(--surface-2); }
.topbar-brand {
  display: flex; align-items: center; gap: var(--sp-2);
  flex: 1; min-width: 0;
}
.topbar-logo {
  width: clamp(28px, 3vw, 34px);
  height: clamp(28px, 3vw, 34px);
  background: var(--primary); color: white;
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: var(--fs-sm);
  flex-shrink: 0;
}
.topbar-title {
  font-weight: 600; font-size: var(--fs-base);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.offline-badge {
  display: none; align-items: center; gap: 4px;
  padding: 4px 10px;
  background: var(--danger-bg); color: var(--danger);
  border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: 600;
  flex-shrink: 0;
}
.offline-badge.visible { display: inline-flex; }
.topbar-user {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px;
  border-radius: var(--r-full);
  background: var(--surface-2);
  font-size: var(--fs-sm);
  max-width: clamp(140px, 20vw, 240px);
  flex-shrink: 0;
}
.topbar-user .user-name {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 140px;
}
.topbar-user .role-badge {
  font-size: var(--fs-xs); padding: 2px 8px;
  background: var(--primary-bg); color: var(--primary-dark);
  border-radius: var(--r-full); font-weight: 600;
  white-space: nowrap;
}

/* SIDEBAR — Proportional width */
.sidebar {
  position: fixed;
  top: var(--topbar-h);
  left: 0;
  bottom: 0;
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--sp-3) 0;
  z-index: 40;
  scrollbar-width: thin;
}
.sidebar::-webkit-scrollbar { width: 6px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
.sidebar-group { margin-bottom: var(--sp-3); }
.sidebar-group-title {
  padding: 6px clamp(12px, 1.5vw, 20px);
  font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-light);
}
.sidebar-item {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 9px clamp(12px, 1.5vw, 20px);
  color: var(--text);
  font-size: var(--fs-sm);
  border-left: 3px solid transparent;
  transition: background 0.15s;
  cursor: pointer;
}
.sidebar-item:hover { background: var(--surface-2); }
.sidebar-item.active {
  background: var(--primary-bg);
  color: var(--primary-dark);
  border-left-color: var(--primary);
  font-weight: 600;
}
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-item .badge {
  margin-left: auto;
  background: var(--danger); color: white;
  font-size: 10px; padding: 2px 8px;
  border-radius: var(--r-full); font-weight: 600;
}

/* MAIN — Proportional padding + max width */
.main {
  margin-left: var(--sidebar-w);
  padding: var(--sp-4);
  padding-top: calc(var(--topbar-h) + var(--sp-4));
  min-height: 100vh;
}
.main-inner {
  max-width: var(--content-max);
  margin: 0 auto;
  width: 100%;
}
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: var(--sp-4);
  gap: var(--sp-3);
  flex-wrap: wrap;
}
.page-title { font-size: var(--fs-xl); font-weight: 700; line-height: 1.2; }
.page-desc { color: var(--text-muted); font-size: var(--fs-sm); margin-top: 2px; }

/* ============================================================
   BUTTONS
   ============================================================ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 9px 14px;
  border-radius: var(--r-md);
  font-size: var(--fs-sm);
  font-weight: 600;
  border: 1px solid transparent;
  transition: all 0.15s;
  white-space: nowrap;
  min-height: 40px;
  flex-shrink: 0;
}
.btn svg { width: 16px; height: 16px; flex-shrink: 0; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
.btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover:not(:disabled) { background: #b71c1c; }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }
.btn-block { width: 100%; }
.btn-lg { padding: 12px 20px; font-size: var(--fs-md); min-height: 48px; }
.btn-sm { padding: 5px 10px; font-size: var(--fs-xs); min-height: 30px; }

/* ============================================================
   FORMS
   ============================================================ */
.field { margin-bottom: var(--sp-3); }
.field-label {
  display: block;
  font-size: var(--fs-sm);
  font-weight: 600;
  margin-bottom: 5px;
}
.field-label .required { color: var(--danger); }
.field-hint { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 4px; }
.input, .select, .textarea {
  width: 100%;
  padding: 9px 12px;
  font-size: var(--fs-md);
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-md);
  transition: border-color 0.15s, box-shadow 0.15s;
  min-height: 42px;
}
.input:focus, .select:focus, .textarea:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-bg);
}
.input:disabled, .select:disabled { background: var(--surface-2); color: var(--text-muted); }
.textarea { min-height: 80px; resize: vertical; }
.field-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-3);
}
@media (max-width: 640px) { .field-row { grid-template-columns: 1fr; } }

/* ============================================================
   CARDS
   ============================================================ */
.card {
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  padding: var(--sp-4);
  margin-bottom: var(--sp-3);
}
.card-tight { padding: var(--sp-3); }
.card-title {
  font-size: var(--fs-md); font-weight: 700;
  margin-bottom: var(--sp-3);
  display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2);
  flex-wrap: wrap;
}

/* STATS — Fluid grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr));
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
}
.stat-icon {
  width: 36px; height: 36px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: var(--sp-2);
}
.stat-icon.primary { background: var(--primary-bg); color: var(--primary); }
.stat-icon.danger { background: var(--danger-bg); color: var(--danger); }
.stat-icon.warning { background: var(--warning-bg); color: var(--warning); }
.stat-icon.success { background: var(--success-bg); color: var(--success); }
.stat-icon svg { width: 18px; height: 18px; }
.stat-value { font-size: var(--fs-2xl); font-weight: 700; line-height: 1.1; }
.stat-label { font-size: var(--fs-xs); color: var(--text-muted); margin-top: 4px; }

/* ============================================================
   TABLES — Proportional
   ============================================================ */
.table-wrap {
  background: var(--surface);
  border-radius: var(--r-lg);
  border: 1px solid var(--border);
  overflow: hidden;
}
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.data-table { min-width: 100%; font-size: var(--fs-sm); }
.data-table thead { background: var(--surface-2); position: sticky; top: 0; z-index: 1; }
.data-table th {
  text-align: left;
  padding: 10px 12px;
  font-weight: 600;
  font-size: var(--fs-xs);
  text-transform: uppercase;
  letter-spacing: 0.3px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.data-table tbody tr:hover { background: var(--surface-2); }
.data-table tbody tr:last-child td { border-bottom: none; }
.data-table .col-actions { text-align: right; white-space: nowrap; width: 1%; }
.data-table .mono { font-family: ui-monospace, monospace; font-size: var(--fs-xs); }
.data-table .num { text-align: right; font-variant-numeric: tabular-nums; }

/* ============================================================
   BADGES
   ============================================================ */
.badge {
  display: inline-flex; align-items: center;
  padding: 3px 8px;
  border-radius: var(--r-full);
  font-size: var(--fs-xs);
  font-weight: 600;
  white-space: nowrap;
}
.badge-primary { background: var(--primary-bg); color: var(--primary-dark); }
.badge-danger { background: var(--danger-bg); color: var(--danger); }
.badge-success { background: var(--success-bg); color: var(--success); }
.badge-warning { background: var(--warning-bg); color: var(--warning); }
.badge-muted { background: var(--surface-2); color: var(--text-muted); }

/* ============================================================
   SCANNER
   ============================================================ */
.scanner-box {
  background: #000;
  border-radius: var(--r-lg);
  overflow: hidden;
  position: relative;
  aspect-ratio: 4/3;
  max-height: clamp(280px, 45vh, 400px);
  display: flex; align-items: center; justify-content: center;
  margin-bottom: var(--sp-2);
}
.scanner-box video { width: 100%; height: 100%; object-fit: cover; }
.scanner-placeholder { color: white; text-align: center; padding: var(--sp-4); }
.scanner-placeholder svg { width: 42px; height: 42px; opacity: 0.5; margin-bottom: var(--sp-2); }
.scanner-frame {
  position: absolute; inset: 15%;
  border: 3px solid var(--primary-light);
  border-radius: var(--r-md);
  box-shadow: 0 0 0 9999px rgba(0,0,0,0.35);
  pointer-events: none;
}
.scanner-controls {
  position: absolute; bottom: var(--sp-3); left: 0; right: 0;
  display: flex; gap: var(--sp-2); justify-content: center; z-index: 2;
}
.scanner-controls button {
  background: rgba(0,0,0,0.6); color: white;
  padding: 7px 12px;
  border-radius: var(--r-full);
  font-size: var(--fs-sm);
  display: inline-flex; align-items: center; gap: 5px;
}
.scanner-controls button svg { width: 15px; height: 15px; }
.scanner-mode-badge {
  position: absolute; top: var(--sp-3); left: var(--sp-3);
  padding: 5px 10px;
  border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  z-index: 2;
}
.scanner-mode-badge.in { background: var(--success); color: white; }
.scanner-mode-badge.out { background: var(--warning); color: white; }

.scan-history { margin-top: var(--sp-2); max-height: 180px; overflow-y: auto; }
.scan-history-item {
  display: flex; align-items: center; gap: var(--sp-2);
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm);
}
.scan-history-item:last-child { border-bottom: none; }
.scan-history-item .check { color: var(--success); flex-shrink: 0; }
.scan-history-item .text { flex: 1; min-width: 0; }
.scan-history-item .text strong { font-family: ui-monospace, monospace; }
.scan-history-item .time { color: var(--text-light); font-size: var(--fs-xs); flex-shrink: 0; }

/* ============================================================
   TOAST
   ============================================================ */
.toast-container {
  position: fixed;
  bottom: calc(var(--sp-4) + var(--safe-bottom));
  left: 50%; transform: translateX(-50%);
  z-index: 2000;
  display: flex; flex-direction: column-reverse; gap: var(--sp-2);
  align-items: center;
  pointer-events: none;
  max-width: calc(100vw - 32px);
}
.toast {
  background: var(--text); color: white;
  padding: 10px 16px;
  border-radius: var(--r-md);
  font-size: var(--fs-sm);
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: var(--sp-2);
  pointer-events: auto;
  animation: toastIn 0.2s ease-out;
  max-width: 400px;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.warning { background: var(--warning); }
.toast.info { background: var(--info); }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 1500;
  display: none; align-items: center; justify-content: center;
  padding: var(--sp-4);
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--surface);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-xl);
  width: 100%; max-width: 540px;
  max-height: 90vh;
  overflow: hidden;
  display: flex; flex-direction: column;
}
.modal-header {
  padding: var(--sp-3) var(--sp-4);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.modal-title { font-size: var(--fs-lg); font-weight: 700; }
.modal-close {
  width: 32px; height: 32px;
  border-radius: var(--r-sm);
  color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
}
.modal-close:hover { background: var(--surface-2); color: var(--text); }
.modal-body { padding: var(--sp-4); overflow-y: auto; flex: 1; }
.modal-footer {
  padding: var(--sp-3) var(--sp-4);
  border-top: 1px solid var(--border);
  display: flex; gap: var(--sp-2); justify-content: flex-end;
}
@media (max-width: 640px) {
  .modal-overlay { padding: 0; align-items: flex-end; }
  .modal { max-width: none; width: 100%; max-height: 92vh; border-radius: var(--r-lg) var(--r-lg) 0 0; }
  .modal-footer { flex-direction: column-reverse; }
  .modal-footer .btn { width: 100%; }
}

/* ============================================================
   EMPTY / LOADING
   ============================================================ */
.empty-state {
  text-align: center;
  padding: var(--sp-5) var(--sp-3);
  color: var(--text-muted);
}

const U = {
  $(sel, ctx) { return (ctx || document).querySelector(sel); },

  escapeHtml(str) {
    if (str === null || str === undefined) return '';

    if (!ts) return '';

    return local.getFullYear() + '-' + pad(local.getMonth() + 1) + '-' + pad(local.getDate()) +

/* ============================================================
   TOAST
   ============================================================ */
const Toast = {
  show(message, type, duration) {
    const container = U.$('#toast-container');
    while (container.children.length >= CONFIG.MAX_TOAST) {
      container.removeChild(container.firstChild);
    }
    const el = document.createElement('div');
    el.className = 'toast ' + (type || 'info');
    const iconName = type === 'success' ? 'check' :
                    type === 'error' ? 'alertCircle' :
                    type === 'warning' ? 'alert' : 'info';
    el.innerHTML = U.icon(iconName, 16) + '<span>' + U.escapeHtml(message) + '</span>';
    container.appendChild(el);
    const dur = duration || (type === 'error' ? 5000 : 3000);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(10px)';
      el.style.transition = 'opacity 0.2s, transform 0.2s';
      setTimeout(() => el.remove(), 250);
    }, dur);
  },
  success(msg) { this.show(msg, 'success'); },
  error(msg) { this.show(msg, 'error', 6000); },
  warning(msg) { this.show(msg, 'warning', 4000); },
  info(msg) { this.show(msg, 'info'); }
};

/* ============================================================
   MODAL
   ============================================================ */
const Modal = {
  _currentOnClose: null,
  open(opts) {
    U.$('#modal-title').textContent = opts.title || '';
    const body = U.$('#modal-body');
    const footer = U.$('#modal-footer');
    body.innerHTML = '';
    footer.innerHTML = '';

    if (typeof opts.body === 'string') body.innerHTML = opts.body;
    else if (opts.body instanceof Node) body.appendChild(opts.body);

    (opts.actions || []).forEach(act => {
      const btn = document.createElement('button');
      btn.className = 'btn ' + (act.class || 'btn-secondary');
      btn.textContent = act.label;
      btn.addEventListener('click', () => {
        if (act.onClick) act.onClick();
        if (act.close !== false) Modal.close();
      });
      footer.appendChild(btn);
    });

    this._currentOnClose = opts.onClose || null;
    U.$('#modal-overlay').classList.add('active');
  },
  close() {
    U.$('#modal-overlay').classList.remove('active');
    const cb = this._currentOnClose;
    this._currentOnClose = null;
    if (cb) { try { cb(); } catch (e) { console.error(e); } }
  },
  confirm(title, message, onConfirm, confirmText, danger) {
    this.open({
      title,
      body: '<p>' + U.escapeHtml(message) + '</p>',
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        { label: confirmText || 'Ya, Lanjutkan',
          class: danger ? 'btn-danger' : 'btn-primary',
          onClick: onConfirm }
      ]
    });
  }
};

const Store = {
  getSession() {
    try {
      const raw = sessionStorage.getItem('session');
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  },
  setSession(s) { sessionStorage.setItem('session', JSON.stringify(s)); },
  clearSession() { sessionStorage.removeItem('session'); },

  getMaster() {
    try {
      const raw = localStorage.getItem('master_data');
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed.expires && Date.now() > parsed.expires) {
        localStorage.removeItem('master_data');
        return null;
      }
      return parsed.data;
    } catch (e) { return null; }
  },
  setMaster(data) {
    try {
      localStorage.setItem('master_data', JSON.stringify({
        data, expires: Date.now() + CONFIG.MASTER_CACHE_TTL_MS
      }));
    } catch (e) {}
  },
  clearMaster() { localStorage.removeItem('master_data'); },

  getLogo() { return localStorage.getItem(CONFIG.LOGO_KEY) || ''; },
  setLogo(dataUrl) { localStorage.setItem(CONFIG.LOGO_KEY, dataUrl); },

  _dbPromise: null,
  _openDB() {
    if (this._dbPromise) return this._dbPromise;
    this._dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open('gudang_queue', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('queue')) {
          db.createObjectStore('queue', { keyPath: 'id', autoIncrement: true });
        }
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = e => reject(e.target.error);
    });
    return this._dbPromise;
  },
  async queueAdd(item) {
    try {
      const db = await this._openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('queue', 'readwrite');
        tx.objectStore('queue').add(item);
        tx.oncomplete = () => resolve(true);
        tx.onerror = e => reject(e.target.error);
      });
    } catch (e) { return false; }
  },
  async queueAll() {
    try {
      const db = await this._openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('queue', 'readonly');
        const req = tx.objectStore('queue').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = e => reject(e.target.error);
      });
    } catch (e) { return []; }
  },
  async queueClear() {
    try {
      const db = await this._openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('queue', 'readwrite');
        tx.objectStore('queue').clear();
        tx.oncomplete = () => resolve(true);
        tx.onerror = e => reject(e.target.error);
      });
    } catch (e) { return false; }
  }
};

/* ============================================================
   API CLIENT
   ============================================================ */
class ApiError extends Error {
  constructor(code, message, raw) {
    super(message);
    this.code = code;
    this.raw = raw;
  }
}

const Api = {
  _buildRequest(action, payload, opts) {
    const session = Store.getSession();
    return {
      auth_token: CONFIG.API_KEY,
      session_token: (opts && opts.public) ? undefined : (session ? session.token : undefined),
      action,
      uuid: (opts && opts.noUuid) ? undefined : U.uuid(),
      timestamp_client: U.nowISO(),
      payload: payload || {}
    };
  },

  async _fetch(body, timeoutMs) {
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), timeoutMs || CONFIG.REQUEST_TIMEOUT_MS);
    try {
      const res = await fetch(CONFIG.API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
        signal: controller.signal,
        redirect: 'follow'
      });
      clearTimeout(tid);
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); }
      catch (e) {
        throw new ApiError('SERVER_ERROR', 'Respons server tidak valid: ' + text.substring(0, 120));
      }
      return json;
    } catch (err) {
      clearTimeout(tid);
      if (err.name === 'AbortError') throw new ApiError('TIMEOUT', 'Request timeout. Coba lagi.');
      if (err instanceof ApiError) throw err;
      throw new ApiError('NETWORK', 'Koneksi gagal: ' + (err.message || err));
    }
  },

  async call(action, payload, opts) {
    opts = opts || {};
    const body = this._buildRequest(action, payload, opts);
    let lastError = null;

    for (let attempt = 0; attempt < CONFIG.RETRY_ATTEMPTS; attempt++) {
      if (attempt > 0) {
        const delay = Math.min(1000 * Math.pow(3, attempt - 1), 8000);
        await U.sleep(delay);
      }
      try {
        const res = await this._fetch(body);
        if (res.code === 200) return res;
        if (res.code === 401) {
          if (App.state.session) {
            Store.clearSession();
            App.state.session = null;
            Toast.error('Sesi berakhir. Silakan login ulang.');
            App.showLogin();
          }
          throw new ApiError(res.error_code || 'UNAUTHORIZED', res.message || 'Tidak berwenang');
        }
        if (res.code === 429) {
          lastError = new ApiError('RATE_LIMITED', res.message || 'Terlalu banyak permintaan');
          await U.sleep(5000);
          continue;
        }
        if (res.code >= 500 && attempt < CONFIG.RETRY_ATTEMPTS - 1) {
          lastError = new ApiError(res.error_code || 'SERVER_ERROR', res.message || 'Server error');
          continue;
        }
        throw new ApiError(res.error_code || 'ERROR', res.message || 'Terjadi kesalahan', res);
      } catch (err) {
        lastError = err;
        if (err.code === 'NETWORK' || err.code === 'TIMEOUT') {
          if (attempt < CONFIG.RETRY_ATTEMPTS - 1) continue;
        } else if (err.code !== 'RATE_LIMITED') {
          throw err;
        }
      }
    }
    throw lastError || new ApiError('UNKNOWN', 'Gagal setelah beberapa kali percobaan');
  },

  // Endpoints
  login(username, pin) { return this.call('login', { username, pin_plaintext: pin }, { public: true }); },
  logout() { return this.call('logout', {}); },
  whoAmI() { return this.call('whoAmI', {}); },
  getMasterData() { return this.call('getMasterData', {}); },
  getDashboardSummary() { return this.call('getDashboardSummary', {}); },
  getKartuStokBulanan(idBarang, bulan, tahun) {
    return this.call('getKartuStokBulanan', { id_barang: idBarang, bulan, tahun });
  },
  getAvailableBatches(idBarang) {
    return this.call('getAvailableBatches', { id_barang: idBarang });
  },
  getExpiringItems(bulan) { return this.call('getExpiringItems', { bulan: bulan || 3 }); },
  simpanTransaksi(payload) { return this.call('simpanTransaksi', payload); },
  simpanOpnameBulk(payload) { return this.call('simpanOpnameBulk', payload); },
  editMasterData(payload) { return this.call('editMasterData', payload); },
  tambahMaster(payload) { return this.call('tambahMaster', payload); },
  hapusMaster(payload) { return this.call('hapusMaster', payload); },
  getAuditLog(payload) { return this.call('getAuditLog', payload); },
  ubahPin(payload) { return this.call('ubahPin', payload); },
  resetPin(idPetugas) { return this.call('resetPin', { id_petugas: idPetugas }); },
  getPendingApprovals() { return this.call('getPendingApprovals', {}); },
  approveTransaksi(idTrx, keputusan) {
    return this.call('approveTransaksi', { id_transaksi: idTrx, keputusan });
  }
};

/* ============================================================
   QR SCANNER
   ============================================================ */
const QRScanner = {
  _stream: null, _videoEl: null, _rafId: null, _detector: null,
  _running: false, _lastText: '', _lastTime: 0, _onDetected: null,

  async start(videoEl, onDetected, onError) {
    this.stop();
    this._videoEl = videoEl;
    this._onDetected = onDetected;
    this._running = true;

    try {
      const constraints = {
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
      };
      this._stream = await navigator.mediaDevices.getUserMedia(constraints);
      videoEl.srcObject = this._stream;
      videoEl.setAttribute('playsinline', '');
      videoEl.muted = true;
      await videoEl.play();

      if ('BarcodeDetector' in window) {
        try {
          this._detector = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13'] });
        } catch (e) { this._detector = null; }
      }

      this._loop();
    } catch (err) {
      if (onError) onError(err);
    }
  },

  async _loop() {
    if (!this._running) return;
    if (this._detector && this._videoEl && this._videoEl.readyState === 4) {
      try {
        const codes = await this._detector.detect(this._videoEl);
        if (codes && codes.length > 0) this._handle(codes[0].rawValue);
      } catch (e) { /* ignore */ }
    }
    this._rafId = requestAnimationFrame(() => this._loop());
  },

  _handle(text) {
    if (!text) return;
    const now = Date.now();
    if (text === this._lastText && (now - this._lastTime) < 2000) return;
    this._lastText = text;
    this._lastTime = now;
    if (this._onDetected) this._onDetected(text);
  },

  stop() {
    this._running = false;
    if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = null; }
    if (this._stream) {
      this._stream.getTracks().forEach(t => t.stop());
      this._stream = null;
    }
    if (this._videoEl) {
      try { this._videoEl.srcObject = null; } catch (e) {}
    }
    this._detector = null;
  },

  async toggleFlash() {
    if (!this._stream) return false;
    const track = this._stream.getVideoTracks()[0];
    if (!track) return false;
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (!caps.torch) return false;
    const newTorch = !track.getSettings().torch;
    try {
      await track.applyConstraints({ advanced: [{ torch: newTorch }] });
      return newTorch;
    } catch (e) { return false; }
  }
};

/* ============================================================
   QR LIBRARY LOADER (lazy)
   ============================================================ */
let _qrLibPromise = null;
function loadQRLibrary() {
  if (_qrLibPromise) return _qrLibPromise;
  _qrLibPromise = new Promise((resolve, reject) => {
    if (window.QRCode) return resolve(window.QRCode);
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
    script.onload = () => resolve(window.QRCode);
    script.onerror = () => reject(new Error('Gagal memuat library QR'));
    document.head.appendChild(script);
  });
  return _qrLibPromise;
}

async function generateQRDataURL(text, size) {
  const lib = await loadQRLibrary();
  return new Promise((resolve, reject) => {
    lib.toDataURL(text, {
      width: size || 300,
      margin: 1,
      errorCorrectionLevel: 'M',
      color: { dark: '#000000', light: '#ffffff' }
    }, (err, url) => {
      if (err) reject(err);
      else resolve(url);
    });
  });
}

      { id: 'kartu-stok', label: 'Kartu Stok', icon: 'file', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] },
      { id: 'approval', label: 'Menunggu Approval', icon: 'check', roles: ['SuperAdmin','Apoteker'] }
    ]},
    { group: 'Cetak', items: [
      { id: 'cetak-qr', label: 'Cetak QR Code', icon: 'qr', roles: ['SuperAdmin','Apoteker','Gudang'] }
    ]},
    { group: 'Master Data', items: [
      { id: 'master-obat', label: 'Data Obat', icon: 'pills', roles: ['SuperAdmin','Apoteker'] },
      { id: 'master-bmhp', label: 'Data BMHP', icon: 'box', roles: ['SuperAdmin','Apoteker'] },
      { id: 'master-supplier', label: 'Data Supplier', icon: 'truck', roles: ['SuperAdmin','Apoteker'] },
      { id: 'master-unit', label: 'Data Unit', icon: 'building', roles: ['SuperAdmin'] },
      { id: 'master-rak', label: 'Data Lokasi Rak', icon: 'mapPin', roles: ['SuperAdmin','Apoteker'] },
      { id: 'master-petugas', label: 'Data Petugas', icon: 'users', roles: ['SuperAdmin'] }
    ]},
    { group: 'Tata Kelola', items: [
      { id: 'audit', label: 'Audit Log', icon: 'clipboard', roles: ['SuperAdmin','Apoteker'] },
      { id: 'settings', label: 'Pengaturan', icon: 'settings', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] }
    ]}
  ],

  BOTTOM_NAV: [
    { id: 'dashboard', label: 'Beranda', icon: 'dashboard', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] },
    { id: 'scan-in', label: 'Masuk', icon: 'arrowDown', roles: ['SuperAdmin','Apoteker','Gudang'] },
    { id: 'scan-out', label: 'Keluar', icon: 'arrowUp', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] },
    { id: 'kartu-stok', label: 'Kartu', icon: 'file', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] },
    { id: 'menu', label: 'Menu', icon: 'menu', roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] }
  ],

  async init() {
    this.checkOnline();
    window.addEventListener('online', () => this.checkOnline());
    window.addEventListener('offline', () => this.checkOnline());

    const sess = Store.getSession();
    if (sess && sess.token) {
      this.state.session = sess;
      try {
        const res = await Api.whoAmI();
        if (res.code === 200) {
          this.state.session = Object.assign({}, sess, {
            nama: res.data.nama, role: res.data.role,
            username: res.data.username, wilayah_binaan: res.data.wilayah_binaan
          });
          Store.setSession(this.state.session);
          await this.showApp();
          await this.route(location.hash ? location.hash.substring(2) : 'dashboard');
          return;
        }
      } catch (err) { /* session invalid */ }
      Store.clearSession();
      this.state.session = null;
    }
    this.showLogin();
  },

  checkOnline() {
    this.state.online = navigator.onLine;
    const dot = U.$('#conn-dot');
    const txt = U.$('#conn-text');
    const badge = U.$('#offline-badge');
    if (dot) dot.classList.toggle('offline', !this.state.online);
    if (txt) txt.textContent = this.state.online ? 'Terhubung' : 'Offline';
    if (badge) badge.classList.toggle('visible', !this.state.online);
  },

  showLogin() {
    U.$('#login-screen').style.display = 'flex';
    U.$('#app').classList.remove('active');
    setTimeout(() => U.$('#login-username').focus(), 100);
  },

  async showApp() {
    U.$('#login-screen').style.display = 'none';
    U.$('#app').classList.add('active');
    this.renderShell();
    await this.loadMasterIfNeeded();
  },

  async loadMasterIfNeeded() {
    let master = Store.getMaster();
    if (!master) {
      try {
        const res = await Api.getMasterData();
        master = res.data;
        Store.setMaster(master);
      } catch (err) {
        Toast.error('Gagal memuat data master: ' + err.message);
        return;
      }
    }
    this.state.master = master;
  },

  async refreshMaster() {
    Store.clearMaster();
    this.state.master = null;
    await this.loadMasterIfNeeded();
  },

  renderShell() {
    const s = this.state.session;
    if (!s) return;
    U.$('#topbar-username').textContent = s.nama || s.username || '-';
    U.$('#topbar-role').textContent = s.role || '-';

    const sidebar = U.$('#sidebar');
    sidebar.innerHTML = '';
    this.MENU.forEach(group => {
      const visibleItems = group.items.filter(it => it.roles.indexOf(s.role) !== -1);
      if (visibleItems.length === 0) return;
      const g = document.createElement('div');
      g.className = 'sidebar-group';
      g.innerHTML = '<div class="sidebar-group-title">' + U.escapeHtml(group.group) + '</div>';
      visibleItems.forEach(it => {
        const a = document.createElement('a');
        a.className = 'sidebar-item';
        a.href = '#/' + it.id;
        a.dataset.route = it.id;
        a.innerHTML = U.icon(it.icon, 18) + '<span>' + U.escapeHtml(it.label) + '</span>';
        g.appendChild(a);
      });
      sidebar.appendChild(g);
    });

    const bn = U.$('#bottom-nav');
    bn.innerHTML = '';
    this.BOTTOM_NAV.forEach(it => {
      if (it.roles.indexOf(s.role) === -1) return;
      const a = document.createElement('a');
      a.className = 'bottom-nav-item';
      a.href = it.id === 'menu' ? '#' : '#/' + it.id;
      a.dataset.route = it.id;
      if (it.id === 'menu') a.dataset.action = 'menu';
      a.innerHTML = U.icon(it.icon, 20) + '<span>' + U.escapeHtml(it.label) + '</span>';
      bn.appendChild(a);
    });

    this.updateActiveNav();
  },

  updateActiveNav() {
    const route = this.state.currentRoute;
    U.$$('.sidebar-item').forEach(el => {
      el.classList.toggle('active', el.dataset.route === route);
    });
    U.$$('.bottom-nav-item').forEach(el => {
      el.classList.toggle('active', el.dataset.route === route);
    });
  },

  async route(route) {
    if (!this.state.session) { this.showLogin(); return; }
    this.state.currentRoute = route;
    this.updateActiveNav();
    U.$('#sidebar').classList.remove('open');
    U.$('#sidebar-backdrop').classList.remove('active');

    let pageTitle = 'Sistem Gudang';
    for (const g of this.MENU) {
      const it = g.items.find(i => i.id === route);
      if (it) { pageTitle = it.label; break; }
    }
    U.$('#topbar-title').textContent = pageTitle;

    const session = this.state.session;
    let allowed = false;
    for (const g of this.MENU) {
      const it = g.items.find(i => i.id === route);
      if (it && it.roles.indexOf(session.role) !== -1) { allowed = true; break; }
    }
    if (!allowed) {
      U.$('#main-inner').innerHTML = this._renderEmpty('Akses Ditolak',
        'Anda tidak berwenang mengakses halaman ini.', 'alertCircle');
      return;
    }

    if (route !== 'scan-in' && route !== 'scan-out') QRScanner.stop();

    const main = U.$('#main-inner');
    try {
      switch (route) {
        case 'dashboard':    await PageDashboard.render(main); break;
        case 'scan-in':      await PageScanIn.render(main); break;
        case 'scan-out':     await PageScanOut.render(main); break;
        case 'kartu-stok':   await PageKartuStok.render(main); break;
        case 'approval':     await PageApproval.render(main); break;
        case 'opname':       await PageOpname.render(main); break;
        case 'cetak-qr':     await PageCetakQR.render(main); break;
        case 'master-obat':     await PageMaster.render(main, 'Master_Obat'); break;
        case 'master-bmhp':     await PageMaster.render(main, 'Master_BMHP'); break;
        case 'master-supplier': await PageMaster.render(main, 'Ref_Supplier'); break;
        case 'master-unit':     await PageMaster.render(main, 'Ref_UnitInternal'); break;
        case 'master-rak':      await PageMaster.render(main, 'Ref_LokasiRak'); break;
        case 'master-petugas':  await PageMaster.render(main, 'Ref_Petugas'); break;
        case 'audit':        await PageAudit.render(main); break;
        case 'settings':     await PageSettings.render(main); break;
        default:
          main.innerHTML = this._renderEmpty('Halaman tidak ditemukan', '', 'alertCircle');
      }
    } catch (err) {
      console.error('[ROUTE_ERROR]', err);
      main.innerHTML = this._renderEmpty('Gagal Memuat',
        err.message || 'Terjadi kesalahan saat memuat halaman.', 'alertCircle');
    }

    window.scrollTo(0, 0);
  },

  _renderEmpty(title, desc, iconName) {
    return '<div class="empty-state">' + U.icon(iconName || 'info', 42) +
           '<h3>' + U.escapeHtml(title) + '</h3>' +
           (desc ? '<p>' + U.escapeHtml(desc) + '</p>' : '') + '</div>';
  },

  async logout() {
    try { await Api.logout(); } catch (e) {}
    Store.clearSession();
    Store.clearMaster();
    await Store.queueClear();
    PageScanIn._history = [];
    PageScanOut._history = [];
    this.state.session = null;
    this.state.master = null;
    Toast.info('Anda telah keluar.');
    this.showLogin();
  }
};

/* ============================================================
   PAGE: SCAN IN
   ============================================================ */
const PageScanIn = {
  _selectedItem: null,
  _history: [],
  _submitting: false,

  async render(container) {
    this._selectedItem = null;
    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div><div class="page-title">Scan Masuk</div>' +
        '<div class="page-desc">Penerimaan barang dari supplier</div></div>' +
      '</div>' +

      '<div class="card no-print">' +
        '<div class="scanner-box">' +
          '<div class="scanner-placeholder" id="scanner-placeholder">' +
            U.icon('camera', 42) + '<p style="margin-top:8px">Kamera belum aktif</p>' +
          '</div>' +
          '<video id="scanner-video-in" style="display:none" playsinline muted></video>' +
          '<div class="scanner-frame" id="scanner-frame" style="display:none"></div>' +
          '<div class="scanner-mode-badge in" id="mode-badge" style="display:none">MASUK</div>' +
          '<div class="scanner-controls" id="scanner-controls" style="display:none">' +
            '<button id="btn-flash">' + U.icon('zap', 15) + ' Flash</button>' +
            '<button id="btn-stop">' + U.icon('x', 15) + ' Stop</button>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-2 flex-wrap">' +
          '<button class="btn btn-primary" id="btn-start-scan">' + U.icon('camera', 16) + ' Mulai Scan</button>' +
          '<button class="btn btn-secondary" id="btn-manual">' + U.icon('keyboard', 16) + ' Input Manual</button>' +
        '</div>' +
        '<div class="scan-history" id="scan-history"></div>' +
      '</div>' +

      '<div id="form-area"></div>';

    U.$('#btn-start-scan').addEventListener('click', () => this._startScan());
    U.$('#btn-manual').addEventListener('click', () => this._showManualInput());
    U.$('#btn-stop').addEventListener('click', () => this._stopScan());
    U.$('#btn-flash').addEventListener('click', async () => {
      const on = await QRScanner.toggleFlash();
      Toast.info(on ? 'Flash aktif' : 'Flash mati');
    });

    this._renderHistory();
  },

  async _startScan() {
    const video = U.$('#scanner-video-in');
    const placeholder = U.$('#scanner-placeholder');
    const frame = U.$('#scanner-frame');
    const badge = U.$('#mode-badge');
    const controls = U.$('#scanner-controls');

    video.style.display = 'block';
    placeholder.style.display = 'none';
    frame.style.display = 'block';
    badge.style.display = 'block';
    controls.style.display = 'flex';

    await QRScanner.start(video, (text) => {
      U.vibrate(50); U.beepSuccess();
      this._stopScan();
      this._handleScan(text);
    }, (err) => {
      Toast.error('Kamera tidak bisa diakses: ' + err.message);
      this._stopScan();
    });
  },

  _stopScan() {
    QRScanner.stop();
    const v = U.$('#scanner-video-in');
    if (v) v.style.display = 'none';
    const p = U.$('#scanner-placeholder');
    if (p) p.style.display = 'flex';
    ['#scanner-frame','#mode-badge','#scanner-controls'].forEach(s => {
      const el = U.$(s); if (el) el.style.display = 'none';
    });
  },

  _showManualInput() {
    Modal.open({
      title: 'Input ID Barang',
      body: '<div class="field"><label class="field-label">ID Barang <span class="required">*</span></label>' +
            '<input class="input" id="manual-id" placeholder="contoh: OBT-0001" autofocus autocomplete="off"></div>',
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        { label: 'Lanjut', class: 'btn-primary', close: false,
          onClick: () => {
            const val = U.$('#manual-id').value.trim().toUpperCase();
            if (!val) { Toast.error('ID wajib diisi'); return; }
            if (!/^(OBT|BMP)-\d+$/.test(val)) {
              Toast.error('Format ID tidak valid'); return;
            }
            Modal.close();
            this._handleScan(val);
          }
        }
      ]
    });
    setTimeout(() => U.$('#manual-id').focus(), 100);
  },

  async _handleScan(idBarang) {
    if (!idBarang) return;
    if (idBarang.indexOf('OBT-') !== 0 && idBarang.indexOf('BMP-') !== 0) {
      Toast.error('QR tidak valid: harus diawali OBT- atau BMP-');
      return;
    }
    const master = App.state.master;
    if (!master) { Toast.error('Data master belum dimuat'); return; }

    let item = null;
    if (idBarang.indexOf('OBT-') === 0) {
      item = (master.obat || []).find(o => o.ID_Obat === idBarang);
    } else {
      item = (master.bmhp || []).find(o => o.ID_BMHP === idBarang);
    }
    if (!item) { Toast.error('Barang tidak ditemukan: ' + idBarang); return; }
    if (item.Status_Aktif === 'Nonaktif') { Toast.error('Barang dinonaktifkan'); return; }

    this._selectedItem = item;
    this._renderForm();
  },

  _renderForm() {
    const item = this._selectedItem;
    const isObat = item.ID_Obat !== undefined;
    const idField = isObat ? 'ID_Obat' : 'ID_BMHP';
    const nameField = isObat ? 'Nama_Obat' : 'Nama_Barang';
    const master = App.state.master;

    const supplierOptions = (master.supplier || []).map(s =>
      '<option value="' + U.escapeHtml(s.ID_Supplier) + '">' + U.escapeHtml(s.Nama_Perusahaan) + '</option>'
    ).join('');
    const sumberDanaOptions = ['JKN','BOK','APBD','Dropping_Dinkes'].map(s =>
      '<option value="' + s + '">' + s + '</option>'
    ).join('');

    const needBatch = isObat;
    const needVVM = isObat && String(item.Wajib_VVM) === 'Ya';

    const html = '' +
      '<div class="card">' +
        '<div class="card-title">' +
          '<span>' + U.icon('package', 18) + ' ' + U.escapeHtml(item[nameField]) + '</span>' +
          '<span class="badge badge-primary">' + U.escapeHtml(item[idField]) + '</span>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label class="field-label">Kategori</label>' +
          '<div class="text-muted">' + U.escapeHtml(item.Kategori || '-') + '</div></div>' +
          '<div class="field"><label class="field-label">Satuan</label>' +
          '<div class="text-muted">' + U.escapeHtml(item.Satuan || '-') + '</div></div>' +
        '</div>' +
      '</div>' +

      '<form class="card" id="scan-form">' +
        '<div class="card-title">Data Penerimaan</div>' +
        '<div class="field-row">' +
          '<div class="field">' +
            '<label class="field-label">Qty <span class="required">*</span></label>' +
            '<input type="number" class="input" id="f-qty" min="1" step="1" required autofocus>' +
          '</div>' +
          '<div class="field">' +
            '<label class="field-label">Sumber Dana <span class="required">*</span></label>' +
            '<select class="select" id="f-sumber" required>' +
              '<option value="">— Pilih —</option>' + sumberDanaOptions +
            '</select>' +
          '</div>' +
        '</div>' +

        (needBatch ? '' +
          '<div class="field-row">' +
            '<div class="field">' +
              '<label class="field-label">No. Batch <span class="required">*</span></label>' +
              '<input type="text" class="input" id="f-batch" placeholder="contoh: B2026-X9" required>' +
            '</div>' +
            '<div class="field">' +
              '<label class="field-label">Exp. Date <span class="required">*</span></label>' +
              '<input type="date" class="input" id="f-ed" required>' +
            '</div>' +
          '</div>'
        : '') +

        (needVVM ? '' +
          '<div class="field">' +
            '<label class="field-label">Status VVM <span class="required">*</span></label>' +
            '<select class="select" id="f-vvm" required>' +
              '<option value="">— Pilih —</option>' +
              '<option value="A">A (Baik)</option>' +
              '<option value="B">B (Baik)</option>' +
              '<option value="C">C (Rusak — dikarantina)</option>' +
              '<option value="D">D (Rusak — dikarantina)</option>' +
            '</select>' +
          '</div>'
        : '') +

        '<div class="field">' +
          '<label class="field-label">Supplier <span class="required">*</span></label>' +
          '<select class="select" id="f-supplier" required>' +
            '<option value="">— Pilih —</option>' + supplierOptions +
          '</select>' +
        '</div>' +

        '<div class="field">' +
          '<label class="field-label">No. Dokumen (Faktur/SJ/PO)</label>' +
          '<input type="text" class="input" id="f-dok" placeholder="contoh: INV-2026/09/12">' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label">Keterangan</label>' +
          '<textarea class="textarea" id="f-ket" placeholder="opsional"></textarea>' +
        '</div>' +

        '<div class="flex gap-2 mt-2 flex-wrap">' +
          '<button type="button" class="btn btn-secondary" id="btn-cancel">Batal</button>' +
          '<button type="submit" class="btn btn-primary" id="btn-submit">' +
            U.icon('check', 16) + ' Simpan' +
          '</button>' +
        '</div>' +
      '</form>';

    U.$('#form-area').innerHTML = html;
    U.$('#btn-cancel').addEventListener('click', () => {
      this._selectedItem = null;
      U.$('#form-area').innerHTML = '';
    });
    U.$('#scan-form').addEventListener('submit', (e) => {
      e.preventDefault();
      this._submit();
    });
  },

  async _submit() {
    if (this._submitting) return;
    this._submitting = true;

    const item = this._selectedItem;
    if (!item) { this._submitting = false; return; }
    const isObat = item.ID_Obat !== undefined;
    const idField = isObat ? 'ID_Obat' : 'ID_BMHP';

    const qty = Number(U.$('#f-qty').value);
    const sumber = U.$('#f-sumber').value;
    const supplier = U.$('#f-supplier').value;
    const dok = U.$('#f-dok').value.trim();
    const ket = U.$('#f-ket').value.trim();

    if (!qty || qty <= 0) { Toast.error('Qty harus > 0'); this._submitting = false; return; }
    if (!sumber) { Toast.error('Sumber Dana wajib'); this._submitting = false; return; }
    if (!supplier) { Toast.error('Supplier wajib'); this._submitting = false; return; }

    const payload = {
      id_barang: item[idField],
      tipe_mutasi: 'Masuk',
      qty, sumber_dana: sumber,
      id_supplier: supplier,
      no_dokumen: dok,
      keterangan: ket
    };

    if (isObat) {
      const batch = U.$('#f-batch').value.trim();
      const ed = U.$('#f-ed').value;
      if (!batch) { Toast.error('No. Batch wajib'); this._submitting = false; return; }
      if (!ed) { Toast.error('Exp. Date wajib'); this._submitting = false; return; }
      payload.no_batch = batch;
      payload.exp_date = ed;
      const vvmEl = U.$('#f-vvm');
      if (vvmEl) {
        if (!vvmEl.value) { Toast.error('Status VVM wajib'); this._submitting = false; return; }
        payload.status_vvm = vvmEl.value;
      }
    }

    const btn = U.$('#btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Menyimpan...';

    try {
      const res = await Api.simpanTransaksi(payload);
      U.vibrate([50, 50, 50]);
      U.beepSuccess();
      Toast.success('Transaksi berhasil: ' + res.data.id_transaksi);

      this._history.unshift({
        id: item[idField], nama: item.Nama_Obat || item.Nama_Barang,
        qty, time: new Date()
      });
      if (this._history.length > 10) this._history.pop();
      this._renderHistory();
      this._selectedItem = null;
      U.$('#form-area').innerHTML = '';
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = U.icon('check', 16) + ' Simpan';
      }
    } finally {
      this._submitting = false;
    }
  },

  _renderHistory() {
    const el = U.$('#scan-history');
    if (!el) return;
    if (this._history.length === 0) {
      el.innerHTML = '<div class="text-muted text-center" style="font-size:12px;padding:8px">Belum ada scan.</div>';
      return;
    }
    el.innerHTML = this._history.map(h =>
      '<div class="scan-history-item">' +
        '<span class="check">' + U.icon('check', 15) + '</span>' +
        '<span class="text"><strong>' + U.escapeHtml(h.id) + '</strong> — ' + U.escapeHtml(h.nama) + ' (' + h.qty + ')</span>' +
        '<span class="time">' + h.time.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) + '</span>' +
      '</div>'
    ).join('');
  }
};

/* ============================================================
   PAGE: SCAN OUT (dengan Batch FEFO dropdown)
   ============================================================ */
const PageScanOut = {
  _selectedItem: null,
  _availableBatches: [],
  _history: [],
  _submitting: false,

  async render(container) {
    this._selectedItem = null;
    this._availableBatches = [];
    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div><div class="page-title">Scan Keluar</div>' +
        '<div class="page-desc">Pengeluaran barang ke unit/poli</div></div>' +
      '</div>' +
      '<div class="card no-print">' +
        '<div class="scanner-box">' +
          '<div class="scanner-placeholder" id="scanner-placeholder">' +
            U.icon('camera', 42) + '<p style="margin-top:8px">Kamera belum aktif</p>' +
          '</div>' +
          '<video id="scanner-video-out" style="display:none" playsinline muted></video>' +
          '<div class="scanner-frame" id="scanner-frame" style="display:none"></div>' +
          '<div class="scanner-mode-badge out" id="mode-badge" style="display:none">KELUAR</div>' +
          '<div class="scanner-controls" id="scanner-controls" style="display:none">' +
            '<button id="btn-flash">' + U.icon('zap', 15) + ' Flash</button>' +
            '<button id="btn-stop">' + U.icon('x', 15) + ' Stop</button>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-2 flex-wrap">' +
          '<button class="btn btn-primary" id="btn-start-scan">' + U.icon('camera', 16) + ' Mulai Scan</button>' +
          '<button class="btn btn-secondary" id="btn-manual">' + U.icon('keyboard', 16) + ' Input Manual</button>' +
        '</div>' +
        '<div class="scan-history" id="scan-history"></div>' +
      '</div>' +
      '<div id="form-area"></div>';

    U.$('#btn-start-scan').addEventListener('click', () => this._startScan());
    U.$('#btn-manual').addEventListener('click', () => this._showManualInput());
    U.$('#btn-stop').addEventListener('click', () => this._stopScan());
    U.$('#btn-flash').addEventListener('click', async () => {
      const on = await QRScanner.toggleFlash();
      Toast.info(on ? 'Flash aktif' : 'Flash mati');
    });
    this._renderHistory();
  },

  async _startScan() {
    const video = U.$('#scanner-video-out');
    U.$('#scanner-placeholder').style.display = 'none';
    video.style.display = 'block';
    U.$('#scanner-frame').style.display = 'block';
    U.$('#mode-badge').style.display = 'block';
    U.$('#scanner-controls').style.display = 'flex';
    await QRScanner.start(video, (text) => {
      U.vibrate(50); U.beepSuccess(); this._stopScan(); this._handleScan(text);
    }, (err) => { Toast.error('Kamera: ' + err.message); this._stopScan(); });
  },

  _stopScan() {
    QRScanner.stop();
    const v = U.$('#scanner-video-out');
    if (v) v.style.display = 'none';
    const p = U.$('#scanner-placeholder');
    if (p) p.style.display = 'flex';
    ['#scanner-frame','#mode-badge','#scanner-controls'].forEach(s => {
      const el = U.$(s); if (el) el.style.display = 'none';
    });
  },

  _showManualInput() {
    Modal.open({
      title: 'Input ID Barang',
      body: '<div class="field"><label class="field-label">ID Barang <span class="required">*</span></label>' +
            '<input class="input" id="manual-id" placeholder="contoh: OBT-0001" autofocus autocomplete="off"></div>',
      actions: [
        { label: 'Batal', class: 'btn-secondary' },
        { label: 'Lanjut', class: 'btn-primary', close: false,
          onClick: () => {
            const val = U.$('#manual-id').value.trim().toUpperCase();
            if (!val) { Toast.error('ID wajib diisi'); return; }
            if (!/^(OBT|BMP)-\d+$/.test(val)) { Toast.error('Format ID tidak valid'); return; }
            Modal.close();
            this._handleScan(val);
          }
        }
      ]
    });
    setTimeout(() => U.$('#manual-id').focus(), 100);
  },

  async _handleScan(idBarang) {
    if (!idBarang) return;
    if (idBarang.indexOf('OBT-') !== 0 && idBarang.indexOf('BMP-') !== 0) {
      Toast.error('QR tidak valid'); return;
    }
    const master = App.state.master;
    if (!master) { Toast.error('Data master belum dimuat'); return; }

    let item = null;
    if (idBarang.indexOf('OBT-') === 0) item = (master.obat || []).find(o => o.ID_Obat === idBarang);
    else item = (master.bmhp || []).find(o => o.ID_BMHP === idBarang);
    if (!item) { Toast.error('Barang tidak ditemukan: ' + idBarang); return; }
    if (item.Status_Aktif === 'Nonaktif') { Toast.error('Barang dinonaktifkan'); return; }

    this._selectedItem = item;
    this._availableBatches = [];

    // Untuk Obat: ambil daftar batch FEFO
    if (idBarang.indexOf('OBT-') === 0) {
      try {
        const res = await Api.getAvailableBatches(idBarang);
        this._availableBatches = (res.data && res.data.batches) || [];
      } catch (err) {
        Toast.warning('Gagal memuat batch: ' + err.message);
      }
      if (this._availableBatches.length === 0) {
        Toast.warning('Tidak ada batch dengan stok tersedia untuk item ini.');
      }
    }

    this._renderForm();
  },

  _renderForm() {
    const item = this._selectedItem;
    const isObat = item.ID_Obat !== undefined;
    const idField = isObat ? 'ID_Obat' : 'ID_BMHP';
    const nameField = isObat ? 'Nama_Obat' : 'Nama_Barang';
    const master = App.state.master;
    const unitOptions = (master.unit || []).map(u =>
      '<option value="' + U.escapeHtml(u.ID_Unit) + '">' + U.escapeHtml(u.Nama_Unit) + '</option>'
    ).join('');
    const needVVM = isObat && String(item.Wajib_VVM) === 'Ya';

    // Batch FEFO dropdown (hanya untuk Obat)
    let batchSection = '';
    if (isObat) {
      if (this._availableBatches.length === 0) {
        batchSection = '' +
          '<div class="field">' +
            '<label class="field-label">No. Batch <span class="required">*</span></label>' +
            '<div class="input" style="background:var(--warning-bg);border-color:var(--warning);color:var(--warning);font-weight:600;display:flex;align-items:center">' +
              U.icon('alert', 16) + '<span style="margin-left:6px">Tidak ada batch tersedia. Lakukan penerimaan dulu.</span>' +
            '</div>' +
          '</div>';
      } else {
        const batchOptions = this._availableBatches.map((b, idx) => {
          const edInfo = b.exp_date
            ? 'ED ' + b.exp_date + (b.days_to_ed !== null ? ' (' + b.days_to_ed + ' hr)' : '')
            : 'tanpa ED';
          const suggest = idx === 0 ? ' ⭐ Disarankan FEFO' : '';
          const warn = b.status_ed === 'expired' ? ' ⚠️ KEDALUWARSA' :
                       b.status_ed === 'near_expired' ? ' ⚠️ ED DEKAT' : '';
          return '<option value="' + U.escapeHtml(b.no_batch) + '"' +
                 (b.status_ed === 'expired' ? ' disabled' : '') + '>' +
                 U.escapeHtml(b.no_batch) + ' — sisa ' + b.sisa_stok + ' — ' + edInfo + suggest + warn +
                 '</option>';
        }).join('');

        batchSection = '' +
          '<div class="field">' +
            '<label class="field-label">Pilih Batch (FEFO) <span class="required">*</span></label>' +
            '<select class="select" id="f-batch-out" required>' +
              '<option value="">— Pilih batch yang Anda ambil —</option>' +
              batchOptions +
            '</select>' +
            '<div class="field-hint">Batch teratas adalah yang paling mendekati ED (FEFO). ' +
              'Pastikan Anda memilih batch yang benar-benar diambil dari rak.</div>' +
          '</div>';
      }
    }

    const html = '' +
      '<div class="card">' +
        '<div class="card-title">' +
          '<span>' + U.icon('package', 18) + ' ' + U.escapeHtml(item[nameField]) + '</span>' +
          '<span class="badge badge-primary">' + U.escapeHtml(item[idField]) + '</span>' +
        '</div>' +
        '<div class="field-row">' +
          '<div class="field"><label class="field-label">Kategori</label>' +
          '<div class="text-muted">' + U.escapeHtml(item.Kategori || '-') + '</div></div>' +
          '<div class="field"><label class="field-label">Satuan</label>' +
          '<div class="text-muted">' + U.escapeHtml(item.Satuan || '-') + '</div></div>' +
        '</div>' +
        '<div class="field"><label class="field-label">Lokasi Rak</label>' +
        '<div class="text-muted">' + U.escapeHtml(item.Lokasi_Rak || '-') + '</div></div>' +
      '</div>' +

      '<form class="card" id="scan-form">' +
        '<div class="card-title">Data Pengeluaran</div>' +
        '<div class="field-row">' +
          '<div class="field">' +
            '<label class="field-label">Qty <span class="required">*</span></label>' +
            '<input type="number" class="input" id="f-qty" min="1" step="1" required autofocus>' +
          '</div>' +
          '<div class="field">' +
            '<label class="field-label">Unit Tujuan <span class="required">*</span></label>' +
            '<select class="select" id="f-unit" required>' +
              '<option value="">— Pilih —</option>' + unitOptions +
            '</select>' +
          '</div>' +
        '</div>' +

        batchSection +

        (needVVM ? '' +
          '<div class="field">' +
            '<label class="field-label">Status VVM <span class="required">*</span></label>' +
            '<select class="select" id="f-vvm" required>' +
              '<option value="">— Pilih —</option>' +
              '<option value="A">A (Baik)</option>' +
              '<option value="B">B (Baik)</option>' +
              '<option value="C">C (Rusak — karantina)</option>' +
              '<option value="D">D (Rusak — karantina)</option>' +
            '</select>' +
          '</div>'
        : '') +

        '<div class="field">' +
          '<label class="field-label">No. Dokumen (Resep/Amprahan)</label>' +
          '<input type="text" class="input" id="f-dok" placeholder="contoh: R/2026/09/001">' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label">Keterangan</label>' +
          '<textarea class="textarea" id="f-ket"></textarea>' +
        '</div>' +

        '<div class="flex gap-2 mt-2 flex-wrap">' +
          '<button type="button" class="btn btn-secondary" id="btn-cancel">Batal</button>' +
          '<button type="submit" class="btn btn-primary" id="btn-submit">' +
            U.icon('check', 16) + ' Simpan' +
          '</button>' +
        '</div>' +
      '</form>';

    U.$('#form-area').innerHTML = html;
    U.$('#btn-cancel').addEventListener('click', () => {
      this._selectedItem = null;
      U.$('#form-area').innerHTML = '';
    });
    U.$('#scan-form').addEventListener('submit', (e) => {
      e.preventDefault();
      this._submit();
    });
  },

  async _submit() {
    if (this._submitting) return;
    this._submitting = true;

    const item = this._selectedItem;
    if (!item) { this._submitting = false; return; }
    const isObat = item.ID_Obat !== undefined;
    const idField = isObat ? 'ID_Obat' : 'ID_BMHP';

    const qty = Number(U.$('#f-qty').value);
    const unit = U.$('#f-unit').value;
    const dok = U.$('#f-dok').value.trim();
    const ket = U.$('#f-ket').value.trim();

    if (!qty || qty <= 0) { Toast.error('Qty harus > 0'); this._submitting = false; return; }
    if (!unit) { Toast.error('Unit tujuan wajib'); this._submitting = false; return; }

    const payload = {
      id_barang: item[idField],
      tipe_mutasi: 'Keluar',
      qty, id_unit: unit,
      no_dokumen: dok,
      keterangan: ket
    };

    if (isObat) {
      const batchEl = U.$('#f-batch-out');
      if (!batchEl || !batchEl.value) {
        Toast.error('Pilih batch yang diambil secara fisik');
        this._submitting = false;
        return;
      }
      payload.no_batch = batchEl.value;
      const vvmEl = U.$('#f-vvm');
      if (vvmEl && vvmEl.value) payload.status_vvm = vvmEl.value;
    }

    const btn = U.$('#btn-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Menyimpan...';

    try {
      const res = await Api.simpanTransaksi(payload);
      U.vibrate([50, 50, 50]);
      U.beepSuccess();
      const isPending = res.data && res.data.status_approval === 'Pending';
      Toast.success('Transaksi berhasil: ' + res.data.id_transaksi +
                    (isPending ? ' (menunggu approval)' : ''));

      this._history.unshift({
        id: item[idField], nama: item.Nama_Obat || item.Nama_Barang,
        qty, time: new Date()
      });
      if (this._history.length > 10) this._history.pop();
      this._renderHistory();
      this._selectedItem = null;
      this._availableBatches = [];
      U.$('#form-area').innerHTML = '';
    } catch (err) {
      Toast.error('Gagal: ' + err.message);
      if (err.code === 'STOK_KURANG' || err.code === 'STOK_BATCH_KURANG') {
        const isApprover = ['SuperAdmin','Apoteker'].indexOf(App.state.session.role) !== -1;
        const prompt = err.message + '\n\n' +
          (isApprover
            ? 'Lanjutkan sebagai pengeluaran darurat?'
            : 'Lanjutkan sebagai pengeluaran darurat?\n\n(Pengeluaran ini akan menunggu approval Apoteker.)');
        Modal.confirm('Stok Tidak Mencukupi', prompt,
          async () => {
            payload.is_emergency = true;
            try {
              const res2 = await Api.simpanTransaksi(payload);
              const pending = res2.data && res2.data.status_approval === 'Pending';
              Toast.success('Pengeluaran darurat tersimpan: ' + res2.data.id_transaksi +
                            (pending ? ' (menunggu approval)' : ''));
              this._history.unshift({
                id: item[idField], nama: item.Nama_Obat || item.Nama_Barang,
                qty, time: new Date()
              });
              if (this._history.length > 10) this._history.pop();
              this._renderHistory();
              this._selectedItem = null;
              this._availableBatches = [];
              U.$('#form-area').innerHTML = '';
            } catch (err2) {
              Toast.error('Gagal: ' + err2.message);
            }
          }, 'Ya, Darurat', true
        );
      }
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = U.icon('check', 16) + ' Simpan';
      }
    } finally {
      this._submitting = false;
    }
  },

  _renderHistory() {
    const el = U.$('#scan-history');
    if (!el) return;
    if (this._history.length === 0) {
      el.innerHTML = '<div class="text-muted text-center" style="font-size:12px;padding:8px">Belum ada scan.</div>';
      return;
    }
    el.innerHTML = this._history.map(h =>
      '<div class="scan-history-item">' +
        '<span class="check">' + U.icon('check', 15) + '</span>' +
        '<span class="text"><strong>' + U.escapeHtml(h.id) + '</strong> — ' + U.escapeHtml(h.nama) + ' (' + h.qty + ')</span>' +
        '<span class="time">' + h.time.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'}) + '</span>' +
      '</div>'
    ).join('');
  }
};

/* ============================================================
   PAGE: KARTU STOK
   ============================================================ */
const PageKartuStok = {
  _currentData: null,
  _selectedId: null,
  _selectedBulan: null,
  _selectedTahun: null,
  _clickHandler: null,

  async render(container) {
    const now = new Date();
    this._selectedBulan = now.getMonth() + 1;
    this._selectedTahun = now.getFullYear();

    container.innerHTML = '' +
      '<div class="page-header no-print">' +
        '<div><div class="page-title">Kartu Stok</div>' +
        '<div class="page-desc">Riwayat mutasi barang per bulan</div></div>' +
      '</div>' +
      '<div class="card no-print">' +
        '<div class="field-row">' +
          '<div class="field">' +
            '<label class="field-label">Barang <span class="required">*</span></label>' +
            '<input type="text" class="input" id="ks-item-search" placeholder="Cari nama atau kode..." autocomplete="off">' +
            '<div id="ks-item-suggestions" style="position:relative"></div>' +
            '<input type="hidden" id="ks-item-id">' +
          '</div>' +
          '<div class="field">' +
            '<label class="field-label">Tahun</label>' +
            '<select class="select" id="ks-tahun">' +
              Array.from({length:5}, (_, i) => now.getFullYear() - 2 + i).map(y =>
                '<option value="' + y + '"' + (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>'
              ).join('') +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-2 mt-2 flex-wrap">' +
          '<button class="btn btn-primary" id="ks-load">' + U.icon('search', 16) + ' Tampilkan</button>' +
        '</div>' +
      '</div>' +
      '<div id="ks-nav"></div>' +
      '<div id="ks-result"></div>';

    const searchEl = U.$('#ks-item-search');
    const suggestEl = U.$('#ks-item-suggestions');
    const idEl = U.$('#ks-item-id');

    const onSearch = U.debounce(() => {
      const q = searchEl.value.trim().toLowerCase();
      if (!q) { suggestEl.innerHTML = ''; return; }
      const master = App.state.master || {};
      const items = [];
      (master.obat || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (o.Nama_Obat.toLowerCase().indexOf(q) !== -1 || o.ID_Obat.toLowerCase().indexOf(q) !== -1) {
          items.push({ id: o.ID_Obat, nama: o.Nama_Obat, tipe: 'Obat' });
        }
      });
      (master.bmhp || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (o.Nama_Barang.toLowerCase().indexOf(q) !== -1 || o.ID_BMHP.toLowerCase().indexOf(q) !== -1) {
          items.push({ id: o.ID_BMHP, nama: o.Nama_Barang, tipe: 'BMHP' });
        }
      });
      suggestEl.innerHTML = items.slice(0, 8).map(it =>
        '<div class="sidebar-item" style="cursor:pointer;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:var(--r-sm);margin-top:2px" data-id="' + U.escapeHtml(it.id) + '" data-nama="' + U.escapeHtml(it.nama) + '">' +
          '<span>' + U.escapeHtml(it.nama) + '</span>' +
          '<span class="badge badge-muted" style="margin-left:auto">' + it.tipe + '</span>' +
        '</div>'
      ).join('');
      suggestEl.querySelectorAll('[data-id]').forEach(el => {
        el.addEventListener('click', () => {
          idEl.value = el.dataset.id;
          searchEl.value = el.dataset.nama + ' (' + el.dataset.id + ')';
          suggestEl.innerHTML = '';
        });
      });
    }, 200);

    searchEl.addEventListener('input', onSearch);

    if (this._clickHandler) container.removeEventListener('click', this._clickHandler);
    this._clickHandler = (e) => {
      if (!e.target.closest('#ks-item-suggestions') && e.target !== searchEl) {
        suggestEl.innerHTML = '';
      }
    };
    container.addEventListener('click', this._clickHandler);

    U.$('#ks-load').addEventListener('click', () => {
      const id = idEl.value;
      if (!id) { Toast.error('Pilih barang dulu'); return; }
      this._selectedId = id;
      this._selectedTahun = Number(U.$('#ks-tahun').value) || this._selectedTahun;
      this._loadData();
    });
  },

  _renderMonthNav() {
    const navEl = U.$('#ks-nav');
    if (!navEl || !this._selectedId) { if (navEl) navEl.innerHTML = ''; return; }
    const nama = U.formatMonthName(this._selectedBulan);
    navEl.innerHTML = '' +
      '<div class="month-nav no-print">' +
        '<button id="ks-prev" aria-label="Bulan sebelumnya">' + U.icon('chevronLeft', 18) + '</button>' +
        '<div class="current">' + nama + ' ' + this._selectedTahun + '</div>' +
        '<button id="ks-next" aria-label="Bulan berikutnya">' + U.icon('chevronRight', 18) + '</button>' +
      '</div>';

    U.$('#ks-prev').addEventListener('click', () => {
      let b = this._selectedBulan - 1;
      let t = this._selectedTahun;
      if (b < 1) { b = 12; t--; }
      this._selectedBulan = b;
      this._selectedTahun = t;
      this._loadData();
    });
    U.$('#ks-next').addEventListener('click', () => {
      let b = this._selectedBulan + 1;
      let t = this._selectedTahun;
      if (b > 12) { b = 1; t++; }
      this._selectedBulan = b;
      this._selectedTahun = t;
      this._loadData();
    });
  },

  async _loadData() {
    if (!this._selectedId) return;
    const btn = U.$('#ks-load');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Memuat...';
    }
    try {
      const res = await Api.getKartuStokBulanan(
        this._selectedId, this._selectedBulan, this._selectedTahun);
      this._currentData = res.data;
      this._renderMonthNav();
      this._renderPreview(res.data);
    } catch (err) {
      Toast.error('Gagal memuat: ' + err.message);
      U.$('#ks-result').innerHTML = App._renderEmpty('Gagal memuat data', err.message, 'alertCircle');
    } finally {
      if (btn) {
        btn.disabled = false;

            '<div class="sign-line">(................................)</div></div>' +
        '</div>' +

    U.$('#ks-xlsx').addEventListener('click', () => this._downloadXLSX(data));
  },

  _downloadXLSX(data) {
    this._ensureSheetJS().then(XLSX => {
      const wb = XLSX.utils.book_new();
      const info = [
        ['KARTU STOK — INFO BARANG'], [''],
        ['Nama', data.nama], ['Kode', data.id_barang],
        ['Satuan', data.satuan], ['Rak', data.rak],
        ['Bulan', U.formatMonthName(data.bulan) + ' ' + data.tahun], [''],
        ['Saldo Awal', data.saldo_awal],
        ['Total Masuk', data.total_in],
        ['Total Keluar', data.total_out],
        ['Saldo Akhir', data.saldo_akhir],
        [''], ['Dicetak', U.formatDateTime(new Date())]
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'Info');
      let saldo = data.saldo_awal;
      const riwayat = [['Tanggal', 'ID Transaksi', 'Tipe', 'Qty', 'Batch', 'ED', 'Masuk', 'Keluar', 'Saldo', 'Keterangan']];
      (data.riwayat_mentah || []).forEach(r => {
        const isMasuk = r.Tipe_Mutasi === 'Masuk';
        const isKeluar = ['Keluar','Karantina','Retur_Supplier','Rusak'].indexOf(r.Tipe_Mutasi) !== -1;
        const qty = Number(r.Qty) || 0;
        if (isMasuk) saldo += qty;
        else if (isKeluar) saldo -= qty;
        riwayat.push([
          U.formatDate(r.Timestamp), r.ID_Transaksi, r.Tipe_Mutasi, qty,
          r.No_Batch || '', r.Exp_Date ? U.formatDate(r.Exp_Date) : '',
          isMasuk ? qty : '', isKeluar ? qty : '', saldo, r.Keterangan || ''
        ]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(riwayat), 'Riwayat');
      const fname = 'KartuStok_' + data.id_barang + '_' + data.tahun + '-' +
                    String(data.bulan).padStart(2, '0') + '.xlsx';
      XLSX.writeFile(wb, fname);
      Toast.success('File XLSX berhasil diunduh');
    }).catch(err => Toast.error('Gagal memuat SheetJS: ' + err.message));
  },

  _ensureSheetJS() {
    return new Promise((resolve, reject) => {
      if (window.XLSX) return resolve(window.XLSX);
      const script = document.createElement('script');
      script.src = 'https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js';
      script.onload = () => resolve(window.XLSX);
      script.onerror = () => reject(new Error('Gagal load SheetJS'));
      document.head.appendChild(script);
    });
  }
};

   PAGE: STOCK OPNAME (fixed — server-side stok_sistem)
