<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d7377">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Sistem Gudang Puskesmas Sanden — Admin Panel">
<title>Sistem Gudang — Puskesmas Sanden</title>

<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleapis.com" crossorigin>
<link rel="preconnect" href="https://cdn.sheetjs.com" crossorigin>

<link rel="stylesheet" href="shared/core.css">

<style>
/* ============================================================
   BOOT SPLASH
   ============================================================ */
.boot-splash {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, #0d7377 0%, #14a3a8 100%);
  z-index: 9999;
  transition: opacity 0.3s;
}
.boot-splash.hide { opacity: 0; pointer-events: none; }
.boot-splash-inner { text-align: center; color: white; padding: 20px; }
.boot-splash-logo {
  width: 72px; height: 72px; margin: 0 auto 18px;
  background: rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; font-weight: 700;
}
.boot-splash-text { font-size: 15px; opacity: 0.9; margin-bottom: 16px; }
.boot-splash-spinner {
  display: inline-block;
  width: 22px; height: 22px;
  border: 2.5px solid rgba(255, 255, 255, 0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: bootspin 0.8s linear infinite;
}
@keyframes bootspin { to { transform: rotate(360deg); } }

/* ============================================================
   APP SHELL — Grid layout
   ============================================================ */
.app-shell {
  display: grid;
  grid-template-columns: var(--sidebar-w, 240px) 1fr;
  min-height: 100dvh;
  background: var(--bg);
}
.app-shell.sidebar-collapsed {
  grid-template-columns: 68px 1fr;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  height: 100dvh;
  position: sticky;
  top: 0;
  z-index: 40;
  transition: width 0.25s ease, transform 0.25s ease;
  overflow: hidden;
}
.sidebar-header {
  padding: var(--sp-3);
  padding-top: calc(var(--sp-3) + var(--safe-top));
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-shrink: 0;
  min-height: var(--topbar-h);
}
.sidebar-logo {
  width: 36px; height: 36px;
  background: var(--primary);
  color: white;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: var(--fs-sm);
  flex-shrink: 0;
}
.sidebar-brand {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  transition: opacity 0.15s;
}
.sidebar-brand-title {
  font-weight: 700; font-size: var(--fs-base);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-brand-subtitle {
  font-size: var(--fs-xs);
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: var(--sp-2) 0;
  -webkit-overflow-scrolling: touch;
}
.sidebar-group {
  margin-bottom: var(--sp-2);
}
.sidebar-group-title {
  padding: 8px var(--sp-3);
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-light);
  white-space: nowrap;
  overflow: hidden;
}
.sidebar-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 10px var(--sp-3);
  color: var(--text);
  font-size: var(--fs-sm);
  border-left: 3px solid transparent;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
  cursor: pointer;
  white-space: nowrap;
  overflow: hidden;
  text-decoration: none;
}
.sidebar-item:hover { background: var(--surface-2); }
.sidebar-item.active {
  background: var(--primary-bg);
  color: var(--primary-dark);
  border-left-color: var(--primary);
  font-weight: 600;
}
.sidebar-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.sidebar-item .item-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
}
.sidebar-item .item-badge {
  background: var(--danger); color: white;
  font-size: 10px; padding: 2px 7px;
  border-radius: var(--r-full); font-weight: 700;
  flex-shrink: 0;
}

/* Collapsed sidebar */
.app-shell.sidebar-collapsed .sidebar-brand,
.app-shell.sidebar-collapsed .sidebar-group-title,
.app-shell.sidebar-collapsed .item-label,
.app-shell.sidebar-collapsed .item-badge {
  opacity: 0;
  pointer-events: none;
  width: 0;
}
.app-shell.sidebar-collapsed .sidebar-item {
  justify-content: center;
  padding: 12px 0;
}

/* Mobile sidebar — drawer */
.sidebar-backdrop {
  display: none;
  position: fixed; inset: 0;
  background: rgba(15, 23, 42, 0.5);
  backdrop-filter: blur(2px);
  z-index: 39;
}
.sidebar-backdrop.active { display: block; }

@media (max-width: 900px) {
  .app-shell,
  .app-shell.sidebar-collapsed {
    grid-template-columns: 1fr;
  }
  .sidebar {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    width: 280px;
    transform: translateX(-100%);
    box-shadow: var(--shadow-xl);
  }
  .sidebar.open { transform: translateX(0); }
  .app-shell.sidebar-collapsed .sidebar-brand,
  .app-shell.sidebar-collapsed .sidebar-group-title,
  .app-shell.sidebar-collapsed .item-label,
  .app-shell.sidebar-collapsed .item-badge {
    opacity: 1;
    pointer-events: auto;
    width: auto;
  }
  .app-shell.sidebar-collapsed .sidebar-item {
    justify-content: flex-start;
    padding: 10px var(--sp-3);
  }
}

/* ============================================================
   MAIN AREA
   ============================================================ */
.main-wrapper {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 100dvh;
}

.app-topbar {
  height: var(--topbar-h);
  padding-top: var(--safe-top);
  padding-left: calc(var(--sp-3) + var(--safe-left));
  padding-right: calc(var(--sp-3) + var(--safe-right));
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: var(--sp-2);
  z-index: 30;
  position: sticky; top: 0;
  flex-shrink: 0;
}
.topbar-toggle {
  width: 40px; height: 40px;
  border-radius: var(--r-sm);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted);
  flex-shrink: 0;
}
.topbar-toggle:hover { background: var(--surface-2); color: var(--text); }
.topbar-breadcrumb {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.topbar-breadcrumb-title {
  font-weight: 700;
  font-size: var(--fs-md);
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.2;
}
.topbar-breadcrumb-sub {
  font-size: var(--fs-xs);
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 2px;
  flex-shrink: 0;
}

/* Scanner button (highlight) */
.btn-scanner {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  background: var(--primary);
  color: white;
  border-radius: var(--r-md);
  font-size: var(--fs-sm);
  font-weight: 600;
  transition: background 0.15s;
  min-height: 40px;
  text-decoration: none;
}
.btn-scanner:hover { background: var(--primary-dark); }
.btn-scanner svg { width: 16px; height: 16px; }
.btn-scanner .label { display: inline; }
@media (max-width: 640px) {
  .btn-scanner .label { display: none; }
  .btn-scanner { padding: 8px 10px; }
}

/* Offline indicator */
.offline-badge {
  display: none;
  align-items: center;
  gap: 4px;
  padding: 4px 10px;
  background: var(--danger-bg);
  color: var(--danger);
  border-radius: var(--r-full);
  font-size: var(--fs-xs);
  font-weight: 600;
  flex-shrink: 0;
}
.offline-badge.visible { display: inline-flex; }

/* ============================================================
   PAGE CONTAINER
   ============================================================ */
.page-container {
  flex: 1;
  padding: var(--sp-4);
  padding-left: calc(var(--sp-4) + var(--safe-left));
  padding-right: calc(var(--sp-4) + var(--safe-right));
  padding-bottom: calc(var(--sp-4) + var(--safe-bottom));
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
}
@media (max-width: 640px) {
  .page-container { padding: var(--sp-3); padding-bottom: calc(var(--sp-3) + var(--safe-bottom)); }
}

/* ============================================================
   PAGE HEADER
   ============================================================ */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  flex-wrap: wrap;
}
.page-header-left { flex: 1; min-width: 0; }
.page-header-actions { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
@media (max-width: 640px) {
  .page-header-actions { width: 100%; }
  .page-header-actions .btn { flex: 1; }
}

/* ============================================================
   STATS CARDS
   ============================================================ */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-lg);
  padding: var(--sp-3);
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
  transition: box-shadow 0.15s, border-color 0.15s;
}
.stat-card:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
.stat-icon {
  width: 44px; height: 44px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.stat-icon.primary { background: var(--primary-bg); color: var(--primary); }
.stat-icon.danger { background: var(--danger-bg); color: var(--danger); }
.stat-icon.warning { background: var(--warning-bg); color: var(--warning); }
.stat-icon.success { background: var(--success-bg); color: var(--success); }
.stat-icon.info { background: var(--info-bg); color: var(--info); }
.stat-icon svg { width: 22px; height: 22px; }
.stat-body { flex: 1; min-width: 0; }
.stat-value {
  font-size: var(--fs-2xl);
  font-weight: 800;
  line-height: 1.1;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.stat-label {
  font-size: var(--fs-sm);
  color: var(--text-muted);
  margin-top: 2px;
}

/* ============================================================
   KARTU STOK PREVIEW (A5)
   ============================================================ */
.kartu-stok-preview {
  background: white;
  padding: 12px;
  max-width: 580px;
  margin: 0 auto;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  font-family: "Times New Roman", Times, serif;
  font-size: 12px;
  color: #000;
  box-shadow: var(--shadow-md);
}
.kartu-stok-header {
  text-align: center;
  border-bottom: 2px solid #000;
  padding-bottom: 8px;
  margin-bottom: 10px;
}
.kartu-stok-header img { height: 40px; margin: 0 auto 4px; }
.kartu-stok-header h1 { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
.kartu-stok-header h2 { font-size: 12px; font-weight: 600; margin-bottom: 4px; }
.kartu-stok-header h3 {
  font-size: 12px; font-weight: 700;
  text-decoration: underline;
  margin-top: 8px;
  letter-spacing: 1px;
}
.kartu-stok-info {
  display: grid;
  grid-template-columns: 90px 8px 1fr;
  gap: 2px;
  font-size: 11px;
  margin-bottom: 10px;
}
.kartu-stok-info .label { font-weight: 700; }
.kartu-stok-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 10px;
  margin-bottom: 10px;
}
.kartu-stok-table th,
.kartu-stok-table td {
  border: 1px solid #000;
  padding: 3px 5px;
  text-align: center;
  vertical-align: middle;
}
.kartu-stok-table th { background: #f0f0f0; font-weight: 700; }
.kartu-stok-table td.num { text-align: right; font-variant-numeric: tabular-nums; }
.kartu-stok-summary {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 4px 12px;
  font-size: 11px;
  margin: 10px 0;
  padding: 8px;
  background: #f8f8f8;
  border-radius: 4px;
}
.kartu-stok-summary .label { font-weight: 700; }
.kartu-stok-summary .value { text-align: right; }
.kartu-stok-sign {
  display: flex;
  justify-content: space-between;
  margin-top: 20px;
  font-size: 11px;
}
.kartu-stok-sign .sign-box { text-align: center; }
.kartu-stok-sign .sign-space { height: 44px; }
.kartu-stok-sign .sign-line {
  border-top: 1px solid #000;
  padding-top: 3px;
  min-width: 110px;
}
.kartu-stok-footnote {
  font-size: 9px;
  color: #666;
  text-align: right;
  margin-top: 6px;
}

/* ============================================================
   MONTH NAV
   ============================================================ */
.month-nav {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: var(--sp-2);
  background: var(--surface-2);
  border-radius: var(--r-md);
  margin-bottom: var(--sp-3);
  justify-content: center;
}
.month-nav button {
  width: 38px; height: 38px;
  border-radius: var(--r-md);
  display: flex; align-items: center; justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  transition: all 0.15s;
}
.month-nav button:hover:not(:disabled) {
  background: var(--primary-bg);
  border-color: var(--primary);
  color: var(--primary);
}
.month-nav button:disabled { opacity: 0.4; cursor: not-allowed; }
.month-nav .current {
  font-weight: 700;
  font-size: var(--fs-md);
  padding: 0 var(--sp-3);
  min-width: 180px;
  text-align: center;
}

/* ============================================================
   AUTOCOMPLETE SUGGESTIONS
   ============================================================ */
.autocomplete-wrap { position: relative; }
.autocomplete-list {
  position: absolute;
  top: 100%; left: 0; right: 0;
  margin-top: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  box-shadow: var(--shadow-lg);
  max-height: 280px;
  overflow-y: auto;
  z-index: 50;
}
.autocomplete-list:empty { display: none; }
.autocomplete-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 10px 12px;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
  font-size: var(--fs-sm);
  text-align: left;
  width: 100%;
  background: none;
  color: var(--text);
}
.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item:hover { background: var(--primary-bg-soft); }
.autocomplete-item .ac-id {
  font-family: ui-monospace, monospace;
  font-size: var(--fs-xs);
  color: var(--primary-dark);
  font-weight: 700;
  flex-shrink: 0;
}
.autocomplete-item .ac-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* ============================================================
   QR PRINT
   ============================================================ */
.qr-layout {
  display: grid;
  grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
  gap: var(--sp-3);
  align-items: start;
}
@media (max-width: 900px) {
  .qr-layout { grid-template-columns: 1fr; }
}
.qr-checkbox-list {
  max-height: clamp(300px, 60vh, 700px);
  overflow-y: auto;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  background: var(--surface);
}
.qr-check-item {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
  text-align: left;
  width: 100%;
  background: none;
  color: var(--text);
}
.qr-check-item:last-child { border-bottom: none; }
.qr-check-item:hover { background: var(--surface-2); }
.qr-check-item.checked { background: var(--primary-bg); }
.qr-check-item input[type="checkbox"] {
  width: 18px; height: 18px;
  accent-color: var(--primary);
  flex-shrink: 0;
  cursor: pointer;
}
.qr-check-item .info { flex: 1; min-width: 0; }
.qr-check-item .info .id {
  font-family: ui-monospace, monospace;
  font-size: var(--fs-xs);
  font-weight: 700;
  color: var(--primary-dark);
}
.qr-check-item .info .name {
  font-size: var(--fs-sm);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.qr-check-item .info .meta {
  font-size: 10px;
  color: var(--text-light);
}
.qr-preview-area {
  background: var(--surface-2);
  padding: var(--sp-3);
  border-radius: var(--r-md);
  min-height: 300px;
  overflow-x: auto;
}
.qr-page {
  background: white;
  width: 210mm;
  min-height: 297mm;
  padding: 8mm;
  margin: 0 auto var(--sp-3);
  box-shadow: var(--shadow-md);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(8, 33.9mm);
  gap: 0;
  box-sizing: border-box;
}
.qr-page.mode-40 {
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: repeat(10, 25.4mm);
}
.qr-label {
  border: 0.3mm dashed #ccc;
  padding: 2mm;
  display: flex;
  align-items: center;
  gap: 2mm;
  overflow: hidden;
  box-sizing: border-box;
  page-break-inside: avoid;
  break-inside: avoid;
}
.qr-label .qr-img-wrap {
  width: 22mm;
  height: 22mm;
  flex-shrink: 0;
  background: white;
  display: flex;
  align-items: center;
  justify-content: center;
}
.qr-label.mode-40 .qr-img-wrap { width: 18mm; height: 18mm; }
.qr-label .qr-img-wrap img {
  width: 100%;
  height: 100%;
  image-rendering: pixelated;
}
.qr-label .label-text {
  flex: 1;
  min-width: 0;
  font-family: system-ui, sans-serif;
  line-height: 1.15;
  overflow: hidden;
}
.qr-label .label-id {
  font-size: 11pt;
  font-weight: 700;
  font-family: ui-monospace, monospace;
  letter-spacing: -0.3px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.qr-label.mode-40 .label-id { font-size: 9pt; }
.qr-label .label-name {
  font-size: 8pt;
  color: #222;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  margin-top: 1px;
}
.qr-label.mode-40 .label-name { font-size: 7pt; -webkit-line-clamp: 1; }
.qr-label .label-meta {
  font-size: 6.5pt;
  color: #666;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ============================================================
   OPNAME ROW
   ============================================================ */
.opname-input {
  width: 110px;
  padding: 8px 12px;
  font-size: var(--fs-md);
  border: 1px solid var(--border-strong);
  border-radius: var(--r-sm);
  text-align: right;
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}
.opname-input:focus {
  outline: none;
  border-color: var(--primary);
  box-shadow: 0 0 0 2px var(--primary-bg);
}
.opname-input.changed {
  background: var(--warning-bg);
  border-color: var(--warning);
}

/* ============================================================
   PRINT @media
   ============================================================ */
@media print {
  body { background: white; }
  .app-shell,
  .sidebar,
  .app-topbar,
  .sidebar-backdrop,
  .no-print,
  .toast-container,
  .loading-overlay,
  .modal-overlay { display: none !important; }
  .page-container {
    padding: 0 !important;
    max-width: none;
  }
  .kartu-stok-preview {
    box-shadow: none;
    border: none;
    max-width: none;
    padding: 8mm;
    page-break-inside: avoid;
  }
  .qr-page {
    box-shadow: none;
    margin: 0;
    padding: 8mm;
    page-break-after: always;
    break-after: page;
    width: 210mm;
    height: 297mm;
  }
  .qr-page:last-child { page-break-after: auto; }
  .qr-label { border-color: #e5e5e5; }
  @page { margin: 0; }
}
</style>
</head>
<body>

<div class="boot-splash" id="boot-splash">
  <div class="boot-splash-inner">
    <div class="boot-splash-logo">PKM</div>
    <div class="boot-splash-text">Memuat sistem...</div>
    <div class="boot-splash-spinner"></div>
  </div>
</div>

<div id="app"></div>

<div class="toast-container" id="toast-container"></div>
<div class="loading-overlay" id="loading-overlay"><div class="spinner"></div></div>
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="shared/core.js" defer></script>

<script defer>
'use strict';

/* ============================================================
   MENU DEFINITION
   ============================================================ */
const MENU = [
  { group: 'Operasional', items: [
    { id: 'dashboard', label: 'Dashboard', icon: 'dashboard',
      roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] },
    { id: 'approval', label: 'Menunggu Approval', icon: 'check',
      roles: ['SuperAdmin','Apoteker'] },
    { id: 'opname', label: 'Stock Opname', icon: 'clipboard',
      roles: ['SuperAdmin','Apoteker','Gudang'] }
  ]},
  { group: 'Laporan', items: [
    { id: 'kartu-stok', label: 'Kartu Stok', icon: 'file',
      roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] },
    { id: 'cetak-qr', label: 'Cetak QR', icon: 'qr',
      roles: ['SuperAdmin','Apoteker','Gudang'] }
  ]},
  { group: 'Master Data', items: [
    { id: 'master-obat', label: 'Data Obat', icon: 'pills',
      roles: ['SuperAdmin','Apoteker'] },
    { id: 'master-bmhp', label: 'Data BMHP', icon: 'box',
      roles: ['SuperAdmin','Apoteker'] },
    { id: 'master-atk', label: 'Data ATK', icon: 'package',
      roles: ['SuperAdmin','Apoteker'] },
    { id: 'master-supplier', label: 'Data Supplier', icon: 'truck',
      roles: ['SuperAdmin','Apoteker'] },
    { id: 'master-unit', label: 'Data Unit', icon: 'building',
      roles: ['SuperAdmin'] },
    { id: 'master-rak', label: 'Data Rak', icon: 'mapPin',
      roles: ['SuperAdmin','Apoteker'] },
    { id: 'master-petugas', label: 'Data Petugas', icon: 'users',
      roles: ['SuperAdmin'] }
  ]},
  { group: 'Tata Kelola', items: [
    { id: 'audit', label: 'Audit Log', icon: 'clipboard',
      roles: ['SuperAdmin','Apoteker'] },
    { id: 'settings', label: 'Pengaturan', icon: 'settings',
      roles: ['SuperAdmin','Apoteker','Gudang','Bidan_Desa'] }
  ]}
];

/* ============================================================
   ADMIN APP
   ============================================================ */
const AdminApp = {
  session: null,
  master: null,
  currentRoute: null,
  sidebarCollapsed: false,
  approvalCount: 0,

  // ============================================================
  // INIT
  // ============================================================
  async init() {
    dbg('AdminApp init');
    const session = Store.getSession();

    if (session && session.token) {
      dbg('Ada session, verifikasi...');
      try {
        const res = await Api.whoAmI();
        if (res && res.code === 200) {
          if (res.data.role === 'Scanner') {
            dbg('Role Scanner — redirect ke scan.html');
            location.replace('scan.html');
            return;
          }
          this.session = {
            token: session.token,
            id_petugas: res.data.id_petugas,
            username: res.data.username,
            nama: res.data.nama,
            role: res.data.role,
            wilayah_binaan: res.data.wilayah_binaan || '',
            expiry: res.data.expiry
          };
          Store.setSession(this.session);
          await this._loadMaster();
          this._hideBootSplash();
          this._initShell();
          this.route(location.hash ? location.hash.substring(2) : 'dashboard');
          return;
        }
      } catch (err) {
        dbgWarn('whoAmI gagal:', err.message);
        Store.clearSession();
      }
    }

    this._hideBootSplash();
    this._showLogin();
  },

  _hideBootSplash() {
    const splash = document.getElementById('boot-splash');
    if (!splash) return;
    splash.classList.add('hide');
    setTimeout(() => {
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }, 300);
  },

  async _loadMaster() {
    let master = Store.getMaster();
    if (master) {
      dbg('Master dari cache');
      this.master = master;
      return;
    }
    dbg('Fetch master...');
    try {
      const res = await Api.getMasterData();
      master = res.data;
      Store.setMaster(master);
      this.master = master;
      dbg('Master loaded');
    } catch (err) {
      dbgWarn('Gagal load master:', err.message);
      Toast.warning('Data master belum termuat.');
      this.master = { obat: [], bmhp: [], atk: [], supplier: [], unit: [], rak: [], petugas: [] };
    }
  },

  async refreshMaster() {
    Store.clearMaster();
    this.master = null;
    await this._loadMaster();
  },

  // ============================================================
  // LOGIN
  // ============================================================
  _showLogin() {
    const root = U.$('#app');
    LoginForm.mount(root, async (session) => {
      if (session.role === 'Scanner') {
        Toast.info('Mengalihkan ke Scanner...');
        setTimeout(() => location.replace('scan.html'), 500);
        return;
      }
      this.session = session;
      await this._loadMaster();
      this._initShell();
      this.route('dashboard');
    }, { variant: 'split' });
  },

  // ============================================================
  // SHELL
  // ============================================================
  _initShell() {
    const root = U.$('#app');
    root.innerHTML = this._renderShell();
    this._attachShellListeners();
    this._updateApprovalBadge();
    this._checkOnline();
  },

  _renderShell() {
    const s = this.session;
    return '' +
      '<div class="app-shell" id="app-shell">' +
        '<div class="sidebar-backdrop" id="sidebar-backdrop"></div>' +
        '<aside class="sidebar" id="sidebar">' +
          '<div class="sidebar-header">' +
            '<div class="sidebar-logo">PKM</div>' +
            '<div class="sidebar-brand">' +
              '<div class="sidebar-brand-title">Sistem Gudang</div>' +
              '<div class="sidebar-brand-subtitle">Puskesmas Sanden</div>' +
            '</div>' +
          '</div>' +
          '<nav class="sidebar-nav" id="sidebar-nav">' +
            this._renderMenu(s.role) +
          '</nav>' +
        '</aside>' +
        '<div class="main-wrapper">' +
          '<header class="app-topbar">' +
            '<button class="topbar-toggle" id="toggle-sidebar" title="Toggle Sidebar">' +
              U.icon('menu', 20) +
            '</button>' +
            '<div class="topbar-breadcrumb">' +
              '<div class="topbar-breadcrumb-title" id="breadcrumb-title">Dashboard</div>' +
              '<div class="topbar-breadcrumb-sub" id="breadcrumb-sub">' +
                U.escapeHtml(s.nama) + ' · ' + U.escapeHtml(s.role) +
              '</div>' +
            '</div>' +
            '<div class="offline-badge" id="offline-badge">' +
              U.icon('wifiOff', 12) + ' Offline' +
            '</div>' +
            '<div class="topbar-actions">' +
              '<a class="btn-scanner" href="scan.html" title="Buka Scanner">' +
                U.icon('qr', 16) +
                '<span class="label">Scanner</span>' +
              '</a>' +
              '<button class="app-icon-btn danger" id="btn-logout" title="Keluar">' +
                U.icon('logout', 20) +
              '</button>' +
            '</div>' +
          '</header>' +
          '<main class="page-container" id="page-container"></main>' +
        '</div>' +
      '</div>';
  },

  _renderMenu(role) {
    return MENU.map(group => {
      const items = group.items.filter(it => it.roles.indexOf(role) !== -1);
      if (items.length === 0) return '';
      return '' +
        '<div class="sidebar-group">' +
          '<div class="sidebar-group-title">' + U.escapeHtml(group.group) + '</div>' +
          items.map(it =>
            '<a class="sidebar-item" href="#/' + it.id + '" data-route="' + it.id + '">' +
              U.icon(it.icon, 18) +
              '<span class="item-label">' + U.escapeHtml(it.label) + '</span>' +
              (it.id === 'approval'
                ? '<span class="item-badge" id="approval-badge" style="display:none">0</span>'
                : '') +
            '</a>'
          ).join('') +
        '</div>';
    }).join('');
  },

  _attachShellListeners() {
    U.$('#toggle-sidebar').addEventListener('click', () => {
      const shell = U.$('#app-shell');
      const sidebar = U.$('#sidebar');
      const backdrop = U.$('#sidebar-backdrop');
      if (window.innerWidth <= 900) {
        sidebar.classList.toggle('open');
        backdrop.classList.toggle('active');
      } else {
        shell.classList.toggle('sidebar-collapsed');
        this.sidebarCollapsed = shell.classList.contains('sidebar-collapsed');
      }
    });

    U.$('#sidebar-backdrop').addEventListener('click', () => {
      U.$('#sidebar').classList.remove('open');
      U.$('#sidebar-backdrop').classList.remove('active');
    });

    U.$('#btn-logout').addEventListener('click', () => {
      Modal.confirm('Keluar', 'Yakin ingin keluar dari aplikasi?',
        () => this.logout(), 'Ya, Keluar', true,
        { icon: 'danger', subtitle: 'Anda harus login ulang' });
    });

    U.$$('.sidebar-item').forEach(el => {
      el.addEventListener('click', () => {
        if (window.innerWidth <= 900) {
          U.$('#sidebar').classList.remove('open');
          U.$('#sidebar-backdrop').classList.remove('active');
        }
      });
    });

    window.addEventListener('hashchange', () => {
      const route = location.hash ? location.hash.substring(2) : 'dashboard';
      if (this.session) this.route(route);
    });

    this._onlineHandler = () => this._checkOnline();
    window.addEventListener('online', this._onlineHandler);
    window.addEventListener('offline', this._onlineHandler);
  },

  _checkOnline() {
    const online = navigator.onLine;
    const badge = U.$('#offline-badge');
    if (badge) badge.classList.toggle('visible', !online);
  },

  async _updateApprovalBadge() {
    if (['SuperAdmin','Apoteker'].indexOf(this.session.role) === -1) return;
    try {
      const res = await Api.getPendingApprovals();
      const total = (res.data && res.data.total) || 0;
      this.approvalCount = total;
      const badge = U.$('#approval-badge');
      if (badge) {
        if (total > 0) {
          badge.textContent = total;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      }
    } catch (err) {
      dbgWarn('Approval badge error:', err.message);
    }
  },

  _updateActiveNav(route) {
    U.$$('.sidebar-item').forEach(el => {
      el.classList.toggle('active', el.dataset.route === route);
    });
  },

  _updateBreadcrumb(title, subtitle) {
    const t = U.$('#breadcrumb-title');
    const s = U.$('#breadcrumb-sub');
    if (t) t.textContent = title;
    if (s) s.textContent = subtitle;
  },

  async route(route) {
    if (!this.session) return;

    // Role guard
    let found = null;
    let foundGroup = null;
    for (const g of MENU) {
      const it = g.items.find(i => i.id === route);
      if (it) { found = it; foundGroup = g.group; break; }
    }
    if (!found) {
      this._renderNotFound();
      return;
    }
    if (found.roles.indexOf(this.session.role) === -1) {
      this._renderForbidden();
      return;
    }

    this.currentRoute = route;
    this._updateActiveNav(route);
    this._updateBreadcrumb(found.label, foundGroup + ' · ' + this.session.nama);

    if (location.hash.substring(2) !== route) {
      location.hash = '#/' + route;
    }

    const container = U.$('#page-container');
    container.innerHTML = this._renderSkeleton();

    try {
      switch (route) {
        case 'dashboard':     await PageDashboard.render(container); break;
        case 'approval':      await PageApproval.render(container); break;
        case 'opname':        await PageOpname.render(container); break;
        case 'kartu-stok':    await PageKartuStok.render(container); break;
        case 'cetak-qr':      await PageCetakQR.render(container); break;
        case 'master-obat':   await PageMaster.render(container, 'Master_Obat'); break;
        case 'master-bmhp':   await PageMaster.render(container, 'Master_BMHP'); break;
        case 'master-atk':    await PageMaster.render(container, 'Master_ATK'); break;
        case 'master-supplier': await PageMaster.render(container, 'Ref_Supplier'); break;
        case 'master-unit':   await PageMaster.render(container, 'Ref_UnitInternal'); break;
        case 'master-rak':    await PageMaster.render(container, 'Ref_LokasiRak'); break;
        case 'master-petugas': await PageMaster.render(container, 'Ref_Petugas'); break;
        case 'audit':         await PageAudit.render(container); break;
        case 'settings':      await PageSettings.render(container); break;
        default:
          container.innerHTML = App._renderEmpty('Halaman tidak ditemukan', '', 'alertCircle');
      }
    } catch (err) {
      dbgErr('Route error:', err);
      container.innerHTML = this._renderEmpty('Gagal Memuat',
        err.message || 'Terjadi kesalahan.', 'alertCircle');
    }
  },

  _renderSkeleton() {
    return '' +
      '<div class="skeleton skeleton-line short" style="height:28px;margin-bottom:20px"></div>' +
      '<div class="stats-grid" style="margin-bottom:16px">' +
        '<div class="skeleton skeleton-card"></div>' +
        '<div class="skeleton skeleton-card"></div>' +
        '<div class="skeleton skeleton-card"></div>' +
        '<div class="skeleton skeleton-card"></div>' +
      '</div>' +
      '<div class="skeleton skeleton-card" style="height:200px"></div>';
  },

  _renderNotFound() {
    U.$('#page-container').innerHTML = this._renderEmpty(
      'Halaman tidak ditemukan', 'Periksa URL atau kembali ke Dashboard.', 'alertCircle');
  },

  _renderForbidden() {
    U.$('#page-container').innerHTML = this._renderEmpty(
      'Akses Ditolak', 'Anda tidak berwenang mengakses halaman ini.', 'alertCircle');
  },

  _renderEmpty(title, desc, iconName) {
    return '<div class="empty-state">' + U.icon(iconName || 'info', 42) +
           '<h3>' + U.escapeHtml(title) + '</h3>' +
           (desc ? '<p>' + U.escapeHtml(desc) + '</p>' : '') + '</div>';
  },

  async logout() {
    try { await Api.logout(); } catch (e) { /* silent */ }
    Store.clearSession();
    Store.clearMaster();
    this.session = null;
    this.master = null;
    Toast.info('Anda telah keluar.');
    this._showLogin();
  }
};

/* ============================================================
   PAGE: DASHBOARD
   ============================================================ */
const PageDashboard = {
  async render(container) {
    let summary = {
      total_item_kritis: 0, total_nilai_aset: 0, total_obat_mendekati_ed: 0,
      total_obat: 0, total_bmhp: 0, total_atk: 0
    };
    let expiring = [];

    try {
      const [resS, resE] = await Promise.all([
        Api.getDashboardSummary(),
        Api.getExpiringItems(3)
      ]);
      if (resS.code === 200) summary = resS.data || summary;
      if (resE.code === 200) expiring = resE.data || [];
    } catch (err) {
      container.innerHTML = AdminApp._renderEmpty('Gagal Memuat', err.message, 'alertCircle');
      return;
    }

    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title" style="font-size:var(--fs-xl);font-weight:700">Dashboard</div>' +
          '<div class="text-muted" style="font-size:var(--fs-sm);margin-top:2px">' +
            U.formatDateTime(new Date()) +
          '</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          '<button class="btn btn-secondary" id="btn-refresh">' +
            U.icon('refresh', 16) + ' Refresh' +
          '</button>' +
        '</div>' +
      '</div>' +

      '<div class="stats-grid">' +
        this._statCard('primary', 'pills', summary.total_obat || 0, 'Jenis Obat') +
        this._statCard('info', 'box', summary.total_bmhp || 0, 'Item BMHP') +
        this._statCard('warning', 'package', summary.total_atk || 0, 'Item ATK') +
        this._statCard('danger', 'alert', summary.total_item_kritis, 'Stok Kritis') +
        this._statCard('warning', 'alertCircle', summary.total_obat_mendekati_ed, 'Batch Mendekati ED') +
        this._statCard('success', 'trending', U.formatRupiah(summary.total_nilai_aset), 'Nilai Aset') +
      '</div>' +

      '<div class="card">' +
        '<div class="card-title">' +
          '<span>Obat Mendekati Kedaluwarsa (≤3 bulan)</span>' +
          '<span class="badge badge-warning">' + expiring.length + '</span>' +
        '</div>' +
        (expiring.length === 0
          ? this._emptyInline('Tidak ada obat mendekati kedaluwarsa.')
          : this._expiringTable(expiring)
        ) +
      '</div>';

    U.$('#btn-refresh').addEventListener('click', () => this.render(container));
  },

  _statCard(tone, iconName, value, label) {
    return '' +
      '<div class="stat-card">' +
        '<div class="stat-icon ' + tone + '">' + U.icon(iconName, 22) + '</div>' +
        '<div class="stat-body">' +
          '<div class="stat-value">' + value + '</div>' +
          '<div class="stat-label">' + U.escapeHtml(label) + '</div>' +
        '</div>' +
      '</div>';
  },

  _emptyInline(text) {
    return '<div class="text-muted text-center" style="padding:24px;font-size:var(--fs-sm)">' +
      U.escapeHtml(text) + '</div>';
  },

  _expiringTable(items) {
    return '' +
      '<div class="table-wrap">' +
        '<div class="table-scroll">' +
          '<table class="data-table">' +
            '<thead><tr>' +
              '<th>ID Obat</th>' +
              '<th>Batch</th>' +
              '<th>Exp. Date</th>' +
              '<th class="num">Sisa</th>' +
            '</tr></thead>' +
            '<tbody>' +
              items.slice(0, 10).map(it =>
                '<tr>' +
                  '<td class="mono">' + U.escapeHtml(it.id_obat) + '</td>' +
                  '<td class="mono">' + U.escapeHtml(it.no_batch) + '</td>' +
                  '<td>' + U.escapeHtml(it.exp_date) + '</td>' +
                  '<td class="num">' + U.formatNumber(it.sisa_stok) + '</td>' +
                '</tr>'
              ).join('') +
            '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>';
  }
};

/* ============================================================
   PAGE: APPROVAL
   ============================================================ */
const PageApproval = {
  async render(container) {
    let items = [];
    try {
      const res = await Api.getPendingApprovals();
      items = (res.data && res.data.items) || [];
    } catch (err) {
      container.innerHTML = AdminApp._renderEmpty('Gagal Memuat', err.message, 'alertCircle');
      return;
    }

    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title" style="font-size:var(--fs-xl);font-weight:700">Menunggu Persetujuan</div>' +
          '<div class="text-muted" style="font-size:var(--fs-sm);margin-top:2px">' +
            'Transaksi Narkotika/Psikotropika dan pengeluaran darurat' +
          '</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          '<button class="btn btn-secondary" id="btn-refresh">' +
            U.icon('refresh', 16) + ' Refresh' +
          '</button>' +
        '</div>' +
      '</div>' +
      (items.length === 0 ? this._emptyState() : this._table(items));

    const refreshBtn = U.$('#btn-refresh');
    if (refreshBtn) refreshBtn.addEventListener('click', () => this.render(container));

    U.$$('[data-approve]', container).forEach(btn => {
      btn.addEventListener('click', () => {
        this._handleApprove(btn.dataset.approve, 'Approved', container);
      });
    });
    U.$$('[data-reject]', container).forEach(btn => {
      btn.addEventListener('click', () => {
        this._handleApprove(btn.dataset.reject, 'Rejected', container);
      });
    });
  },

  _emptyState() {
    return '' +
      '<div class="card">' +
        '<div class="empty-state">' +
          U.icon('check', 48) +
          '<h3>Tidak ada transaksi menunggu</h3>' +
          '<p>Semua transaksi sudah disetujui atau ditolak.</p>' +
        '</div>' +
      '</div>';
  },

  _table(items) {
    return '' +
      '<div class="table-wrap">' +
        '<div class="table-scroll">' +
          '<table class="data-table">' +
            '<thead><tr>' +
              '<th>Waktu</th>' +
              '<th>No Transaksi</th>' +
              '<th>Item</th>' +
              '<th>Golongan</th>' +
              '<th class="num">Qty</th>' +
              '<th>Tipe</th>' +
              '<th>Petugas</th>' +
              '<th class="col-actions">Aksi</th>' +
            '</tr></thead>' +
            '<tbody>' +
              items.map(it =>
                '<tr>' +
                  '<td style="font-size:12px">' + U.formatDateTime(it.timestamp) + '</td>' +
                  '<td class="mono">' + U.escapeHtml(it.id_transaksi) + '</td>' +
                  '<td>' +
                    '<div style="font-weight:600">' + U.escapeHtml(it.nama_obat) + '</div>' +
                    '<div class="text-muted" style="font-size:11px">' + U.escapeHtml(it.id_obat) + '</div>' +
                  '</td>' +
                  '<td><span class="badge ' +
                    (it.golongan === 'Narkotika' ? 'badge-danger' : 'badge-warning') + '">' +
                    U.escapeHtml(it.golongan) + '</span></td>' +
                  '<td class="num">' + U.formatNumber(it.qty) + '</td>' +
                  '<td>' + U.escapeHtml(it.tipe_mutasi) + '</td>' +
                  '<td class="mono">' + U.escapeHtml(it.petugas) + '</td>' +
                  '<td class="col-actions">' +
                    '<button class="btn btn-primary btn-sm" data-approve="' + U.escapeHtml(it.id_transaksi) + '">' +
                      'Setujui' +
                    '</button> ' +
                    '<button class="btn btn-danger btn-sm" data-reject="' + U.escapeHtml(it.id_transaksi) + '">' +
                      'Tolak' +
                    '</button>' +
                  '</td>' +
                '</tr>'
              ).join('') +
            '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>';
  },

  _handleApprove(idTrx, keputusan, container) {
    const isApprove = keputusan === 'Approved';
    Modal.confirm(
      isApprove ? 'Setujui Transaksi' : 'Tolak Transaksi',
      'Yakin ingin ' + (isApprove ? 'menyetujui' : 'menolak') + ' transaksi ' + idTrx + '?',
      async () => {
        try {
          await Api.approveTransaksi(idTrx, keputusan);
          Toast.success('Transaksi ' + idTrx + ' telah di-' + keputusan);
          AdminApp._updateApprovalBadge();
          this.render(container);
        } catch (err) {
          Toast.error('Gagal: ' + err.message);
        }
      },
      isApprove ? 'Ya, Setujui' : 'Ya, Tolak',
      !isApprove,
      {
        icon: isApprove ? 'success' : 'danger',
        subtitle: isApprove ? 'Stok akan langsung berkurang' : 'Transaksi dibatalkan'
      }
    );
  }
};

/* ============================================================
   PAGE: OPNAME
   ============================================================ */
const PageOpname = {
  _entries: {},
  _submitting: false,
  _filter: '',
  _search: '',

  async render(container) {
    this._entries = {};
    this._filter = '';
    this._search = '';

    container.innerHTML = '' +
      '<div class="page-header">' +
        '<div class="page-header-left">' +
          '<div class="page-title" style="font-size:var(--fs-xl);font-weight:700">Stock Opname</div>' +
          '<div class="text-muted" style="font-size:var(--fs-sm);margin-top:2px">' +
            'Sinkronisasi stok fisik dengan sistem' +
          '</div>' +
        '</div>' +
        '<div class="page-header-actions">' +
          '<button class="btn btn-primary" id="btn-submit-opname" disabled>' +
            U.icon('check', 16) + ' Simpan Opname' +
          '</button>' +
        '</div>' +
      '</div>' +

      '<div class="card card-tight">' +
        '<div class="field-row">' +
          '<div class="field" style="margin-bottom:0">' +
            '<input type="text" class="input" id="opname-search" placeholder="Cari nama atau kode...">' +
          '</div>' +
          '<div class="field" style="margin-bottom:0">' +
            '<select class="select" id="opname-filter">' +
              '<option value="">Semua Jenis</option>' +
              '<option value="obat">Hanya Obat</option>' +
              '<option value="bmhp">Hanya BMHP</option>' +
              '<option value="atk">Hanya ATK</option>' +
            '</select>' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="card" style="padding:0">' +
        '<div class="text-muted" style="font-size:12px;padding:12px 16px;border-bottom:1px solid var(--border)">' +
          'Masukkan stok fisik yang Anda hitung. Baris yang berbeda akan disorot. ' +
          'Sistem menghitung selisih otomatis saat disimpan.' +
        '</div>' +
        '<div id="opname-table-container"></div>' +
      '</div>';

    U.$('#btn-submit-opname').addEventListener('click', () => this._submit(container));
    U.$('#opname-search').addEventListener('input', U.debounce(() => {
      this._search = U.$('#opname-search').value;
      this._renderTable(container);
    }, 200));
    U.$('#opname-filter').addEventListener('change', () => {
      this._filter = U.$('#opname-filter').value;
      this._renderTable(container);
    });

    this._renderTable(container);
  },

  _renderTable(container) {
    const master = AdminApp.master || {};
    const items = [];
    const search = (this._search || '').toLowerCase().trim();
    const filter = this._filter;

    if (filter !== 'bmhp' && filter !== 'atk') {
      (master.obat || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        items.push({ id: o.ID_Obat, nama: o.Nama_Obat, tipe: 'Obat',
                     satuan: o.Satuan, rak: o.Lokasi_Rak });
      });
    }
    if (filter !== 'obat' && filter !== 'atk') {
      (master.bmhp || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        items.push({ id: o.ID_BMHP, nama: o.Nama_Barang, tipe: 'BMHP',
                     satuan: o.Satuan, rak: o.Lokasi_Rak });
      });
    }
    if (filter !== 'obat' && filter !== 'bmhp') {
      (master.atk || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        items.push({ id: o.ID_ATK, nama: o.Nama_Barang, tipe: 'ATK',
                     satuan: o.Satuan, rak: o.Lokasi_Rak });
      });
    }

    const filtered = search
      ? items.filter(it => it.nama.toLowerCase().indexOf(search) !== -1 ||
                            it.id.toLowerCase().indexOf(search) !== -1)
      : items;

    const target = U.$('#opname-table-container');
    if (filtered.length === 0) {
      target.innerHTML = AdminApp._renderEmpty('Tidak ada item', '', 'package');
      return;
    }

    target.innerHTML = '' +
      '<div class="table-scroll">' +
        '<table class="data-table">' +
          '<thead><tr>' +
            '<th>Kode</th>' +
            '<th>Nama</th>' +
            '<th>Rak</th>' +
            '<th class="num">Stok Fisik</th>' +
            '<th>Status</th>' +
          '</tr></thead>' +
          '<tbody>' +
            filtered.slice(0, 500).map(it =>
              '<tr data-id="' + U.escapeHtml(it.id) + '">' +
                '<td class="mono">' + U.escapeHtml(it.id) + '</td>' +
                '<td>' +
                  '<div style="font-weight:600">' + U.escapeHtml(it.nama) + '</div>' +
                  '<div class="text-muted" style="font-size:11px">' +
                    U.escapeHtml(it.satuan || '-') + ' · ' + it.tipe +
                  '</div>' +
                '</td>' +
                '<td class="mono">' + U.escapeHtml(it.rak || '-') + '</td>' +
                '<td class="num">' +
                  '<input type="number" class="opname-input" min="0" step="1" ' +
                    'inputmode="numeric" placeholder="—" data-barang="' + U.escapeHtml(it.id) + '">' +
                '</td>' +
                '<td><span class="text-muted" style="font-size:12px">—</span></td>' +
              '</tr>'
            ).join('') +
          '</tbody>' +
        '</table>' +
      '</div>';

    U.$$('.opname-input', target).forEach(input => {
      if (this._entries[input.dataset.barang] !== undefined) {
        input.value = this._entries[input.dataset.barang];
        input.classList.add('changed');
        const row = input.closest('tr');
        const statusEl = row.querySelector('td:last-child span');
        statusEl.textContent = '✓ akan disimpan';
        statusEl.className = 'text-success';
      }
      input.addEventListener('input', () => {
        const id = input.dataset.barang;
        const val = input.value.trim();
        const row = input.closest('tr');
        const statusEl = row.querySelector('td:last-child span');
        if (val === '' || isNaN(Number(val)) || Number(val) < 0) {
          input.classList.remove('changed');
          statusEl.textContent = '—';
          statusEl.className = 'text-muted';
          delete this._entries[id];
        } else {
          input.classList.add('changed');
          this._entries[id] = Number(val);
          statusEl.textContent = '✓ akan disimpan';
          statusEl.className = 'text-success';
        }
        this._updateSubmitButton();
      });
    });

    this._updateSubmitButton();
  },

  _updateSubmitButton() {
    const count = Object.keys(this._entries).length;
    const btn = U.$('#btn-submit-opname');
    if (btn) {
      btn.disabled = count === 0;
      btn.innerHTML = U.icon('check', 16) + ' Simpan Opname (' + count + ')';
    }
  },

  async _submit(container) {
    if (this._submitting) return;
    const ids = Object.keys(this._entries);
    if (ids.length === 0) {
      Toast.error('Belum ada data untuk disimpan');
      return;
    }

    Modal.confirm(
      'Konfirmasi Opname',
      'Stok fisik akan dicatat untuk ' + ids.length + ' item. Sistem akan menghitung ' +
      'selisih dan membuat penyesuaian otomatis.\n\nLanjutkan?',
      async () => {
        this._submitting = true;
        Loading.show();
        try {
          const payload = ids.map(id => ({
            id_barang: id,
            stok_fisik: this._entries[id],
            keterangan: 'Opname via aplikasi'
          }));

          const res = await Api.simpanOpnameBulk(payload);
          Toast.success(res.message || 'Opname tersimpan');
          this._entries = {};
          this.render(container);
        } catch (err) {
          Toast.error('Gagal: ' + err.message);
        } finally {
          Loading.hide();
          this._submitting = false;
        }
      },
      'Ya, Simpan', false,
      { icon: 'primary', subtitle: 'Tindakan ini mengubah stok sistem' }
    );
  }
};

const PageKartuStok = {
  _currentData: null,
  _selectedId: null,
  _selectedBulan: null,
  _selectedTahun: null,
  _searchHandler: null,

  async render(container) {
    const now = new Date();
    this._selectedBulan = now.getMonth() + 1;
    this._selectedTahun = now.getFullYear();

    container.innerHTML = '' +

        '<div class="page-header-left">' +
          '<div class="page-title" style="font-size:var(--fs-xl);font-weight:700">Kartu Stok</div>' +
          '<div class="text-muted" style="font-size:var(--fs-sm);margin-top:2px">' +
            'Riwayat mutasi barang per bulan' +
          '</div>' +
        '</div>' +
      '</div>' +

      '<div class="card no-print">' +
        '<div class="field-row">' +
          '<div class="field" style="margin-bottom:0">' +
            '<label class="field-label">Barang <span class="required">*</span></label>' +
            '<div class="autocomplete-wrap">' +
              '<input type="text" class="input" id="ks-search" ' +
                'placeholder="Cari nama atau kode..." autocomplete="off">' +
              '<div class="autocomplete-list" id="ks-suggestions"></div>' +
            '</div>' +
            '<input type="hidden" id="ks-id">' +
          '</div>' +
          '<div class="field" style="margin-bottom:0">' +
            '<label class="field-label">Tahun</label>' +
            '<select class="select" id="ks-tahun">' +

                '<option value="' + y + '"' +
                  (y === now.getFullYear() ? ' selected' : '') + '>' + y + '</option>'
              ).join('') +
            '</select>' +
          '</div>' +
        '</div>' +
        '<div class="flex gap-2 mt-2 flex-wrap">' +
          '<button class="btn btn-primary" id="ks-load">' +
            U.icon('search', 16) + ' Tampilkan' +
          '</button>' +
        '</div>' +
      '</div>' +
      '<div id="ks-nav"></div>' +
      '<div id="ks-result"></div>';

    this._attachSearch(container);
    U.$('#ks-load').addEventListener('click', () => {
      const id = U.$('#ks-id').value;
      if (!id) { Toast.error('Pilih barang dulu'); return; }
      this._selectedId = id;
      this._selectedTahun = Number(U.$('#ks-tahun').value) || this._selectedTahun;
      this._loadData(container);
    });
  },

  _attachSearch(container) {
    const searchEl = U.$('#ks-search');
    const suggestEl = U.$('#ks-suggestions');
    const idEl = U.$('#ks-id');

    if (this._searchHandler) searchEl.removeEventListener('input', this._searchHandler);

    this._searchHandler = U.debounce(() => {
      const q = searchEl.value.trim().toLowerCase();
      if (!q) { suggestEl.innerHTML = ''; return; }
      const master = AdminApp.master || {};
      const items = [];

      (master.obat || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (o.Nama_Obat.toLowerCase().indexOf(q) !== -1 ||
            o.ID_Obat.toLowerCase().indexOf(q) !== -1) {
          items.push({ id: o.ID_Obat, nama: o.Nama_Obat, tipe: 'Obat' });
        }
      });
      (master.bmhp || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (o.Nama_Barang.toLowerCase().indexOf(q) !== -1 ||
            o.ID_BMHP.toLowerCase().indexOf(q) !== -1) {
          items.push({ id: o.ID_BMHP, nama: o.Nama_Barang, tipe: 'BMHP' });
        }
      });
      (master.atk || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (o.Nama_Barang.toLowerCase().indexOf(q) !== -1 ||
            o.ID_ATK.toLowerCase().indexOf(q) !== -1) {
          items.push({ id: o.ID_ATK, nama: o.Nama_Barang, tipe: 'ATK' });
        }
      });

      suggestEl.innerHTML = items.slice(0, 10).map(it =>
        '<button type="button" class="autocomplete-item" ' +
          'data-id="' + U.escapeHtml(it.id) + '" data-nama="' + U.escapeHtml(it.nama) + '">' +
          '<span class="ac-id">' + U.escapeHtml(it.id) + '</span>' +
          '<span class="ac-name">' + U.escapeHtml(it.nama) + '</span>' +
          '<span class="badge badge-muted">' + it.tipe + '</span>' +
        '</button>'
      ).join('');

      U.$$('.autocomplete-item', suggestEl).forEach(el => {
        el.addEventListener('click', () => {
          idEl.value = el.dataset.id;
          searchEl.value = el.dataset.nama + ' (' + el.dataset.id + ')';
          suggestEl.innerHTML = '';
        });
      });
    }, 200);

    searchEl.addEventListener('input', this._searchHandler);

    const clickHandler = (e) => {
      if (!e.target.closest('#ks-suggestions') && e.target !== searchEl) {
        suggestEl.innerHTML = '';
      }
    };
    if (this._clickHandler) container.removeEventListener('click', this._clickHandler);
    this._clickHandler = clickHandler;
    container.addEventListener('click', clickHandler);
  },

  _renderMonthNav() {
    const navEl = U.$('#ks-nav');
    if (!navEl || !this._selectedId) {
      if (navEl) navEl.innerHTML = '';
      return;
    }
    const nama = U.formatMonthName(this._selectedBulan);
    navEl.innerHTML = '' +
      '<div class="month-nav no-print">' +
        '<button id="ks-prev" aria-label="Bulan sebelumnya">' +
          U.icon('chevronLeft', 18) +
        '</button>' +
        '<div class="current">' + nama + ' ' + this._selectedTahun + '</div>' +
        '<button id="ks-next" aria-label="Bulan berikutnya">' +
          U.icon('chevronRight', 18) +
        '</button>' +
      '</div>';

    U.$('#ks-prev').addEventListener('click', () => {
      let b = this._selectedBulan - 1;
      let t = this._selectedTahun;
      if (b < 1) { b = 12; t--; }
      this._selectedBulan = b;
      this._selectedTahun = t;
      this._loadData(U.$('#page-container'));
    });
    U.$('#ks-next').addEventListener('click', () => {
      let b = this._selectedBulan + 1;
      let t = this._selectedTahun;
      if (b > 12) { b = 1; t++; }
      this._selectedBulan = b;
      this._selectedTahun = t;
      this._loadData(U.$('#page-container'));
    });
  },

  async _loadData(container) {
    if (!this._selectedId) return;
    const btn = U.$('#ks-load');
    if (btn) Btn.setLoading(btn, 'Memuat...');

    try {
      const res = await Api.getKartuStokBulanan(
        this._selectedId, this._selectedBulan, this._selectedTahun);
      this._currentData = res.data;
      this._renderMonthNav();
      this._renderPreview(res.data);
    } catch (err) {
      Toast.error('Gagal memuat: ' + err.message);
      U.$('#ks-result').innerHTML = AdminApp._renderEmpty(
        'Gagal memuat data', err.message, 'alertCircle');
    } finally {
      if (btn) Btn.stopLoading(btn, 'Tampilkan', 'search');
    }
  },

  _renderPreview(data) {
    const bulanNama = U.formatMonthName(data.bulan).toUpperCase();
    const logo = Store.getLogo();

    let running = data.saldo_awal;
    const rows = (data.riwayat_mentah || []).map(r => {
      const isMasuk = r.Tipe_Mutasi === 'Masuk';
      const isKeluar = ['Keluar','Karantina','Retur_Supplier','Rusak'].indexOf(r.Tipe_Mutasi) !== -1;
      const qty = Number(r.Qty) || 0;
      if (isMasuk) running += qty;
      else if (isKeluar) running -= qty;
      const d = new Date(r.Timestamp);
      const tgl = isNaN(d.getTime()) ? '-' :
        String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0');
      return '' +
        '<tr>' +
          '<td>' + tgl + '</td>' +
          '<td class="mono">' + U.escapeHtml(String(r.ID_Transaksi || '').substring(0, 14)) + '</td>' +
          '<td class="mono">' + U.escapeHtml(r.No_Batch || '-') + '</td>' +
          '<td>' + (r.Exp_Date ? U.formatDate(r.Exp_Date) : '-') + '</td>' +
          '<td class="num">' + (isMasuk ? qty : '') + '</td>' +
          '<td class="num">' + (isKeluar ? qty : '') + '</td>' +
          '<td class="num">' + running + '</td>' +
          '<td></td>' +
        '</tr>';
    }).join('');

    const html = '' +
      '<div class="card no-print" style="display:flex;gap:8px;flex-wrap:wrap">' +
        '<button class="btn btn-primary" id="ks-print">' +
          U.icon('printer', 16) + ' Cetak' +
        '</button>' +
        '<button class="btn btn-secondary" id="ks-xlsx">' +
          U.icon('download', 16) + ' Unduh XLSX' +
        '</button>' +
      '</div>' +
      '<div id="print-area">' +
        '<div class="kartu-stok-preview">' +
          '<div class="kartu-stok-header">' +
            (logo ? '<img src="' + logo + '" alt="Logo">' : '') +
            '<h1>PEMERINTAH KABUPATEN BANTUL</h1>' +
            '<h2>PUSKESMAS SANDEN</h2>' +
            '<h3>KARTU STOK BULANAN</h3>' +
          '</div>' +
          '<div class="kartu-stok-info">' +
            '<div class="label">Nama</div><div>:</div><div>' + U.escapeHtml(data.nama) + '</div>' +
            '<div class="label">Kode</div><div>:</div><div>' + U.escapeHtml(data.id_barang) + '</div>' +
            '<div class="label">Satuan</div><div>:</div><div>' + U.escapeHtml(data.satuan || '-') + '</div>' +
            '<div class="label">Rak</div><div>:</div><div>' + U.escapeHtml(data.rak || '-') + '</div>' +
            '<div class="label">Bulan</div><div>:</div><div><strong>' + bulanNama + ' ' + data.tahun + '</strong></div>' +
          '</div>' +
          '<table class="kartu-stok-table">' +
            '<thead><tr>' +
              '<th style="width:8%">Tgl</th>' +
              '<th style="width:20%">No Trx</th>' +
              '<th style="width:14%">Batch</th>' +
              '<th style="width:12%">ED</th>' +
              '<th style="width:9%">Masuk</th>' +
              '<th style="width:9%">Keluar</th>' +
              '<th style="width:9%">Sisa</th>' +
              '<th style="width:19%">Paraf</th>' +
            '</tr></thead>' +
            '<tbody>' +
              '<tr>' +
                '<td colspan="6" style="text-align:right"><strong>Saldo Awal</strong></td>' +
                '<td class="num"><strong>' + data.saldo_awal + '</strong></td>' +
                '<td></td>' +
              '</tr>' +
              (rows || '<tr><td colspan="8" style="text-align:center;padding:8px">Tidak ada transaksi bulan ini</td></tr>') +
              '<tr>' +
                '<td colspan="4" style="text-align:right"><strong>Total</strong></td>' +
                '<td class="num"><strong>' + data.total_in + '</strong></td>' +
                '<td class="num"><strong>' + data.total_out + '</strong></td>' +
                '<td class="num"><strong>' + data.saldo_akhir + '</strong></td>' +
                '<td></td>' +
              '</tr>' +
            '</tbody>' +
          '</table>' +
          '<div class="kartu-stok-summary">' +
            '<div class="label">Saldo Awal</div><div class="value">' + data.saldo_awal + '</div>' +
            '<div class="label">Total Masuk</div><div class="value">' + data.total_in + '</div>' +
            '<div class="label">Total Keluar</div><div class="value">' + data.total_out + '</div>' +
            '<div class="label">Saldo Akhir</div><div class="value"><strong>' + data.saldo_akhir + '</strong></div>' +
          '</div>' +
          '<div class="kartu-stok-sign">' +
            '<div class="sign-box">' +
              '<div>Petugas Gudang</div>' +
              '<div class="sign-space"></div>' +
              '<div class="sign-line">(................................)</div>' +
            '</div>' +
            '<div class="sign-box">' +
              '<div>Bantul, ' + U.formatDate(new Date()) + '</div>' +
              '<div>Apoteker PJ</div>' +
              '<div class="sign-space" style="height:28px"></div>' +
              '<div class="sign-line">(................................)</div>' +
            '</div>' +
          '</div>' +
          '<div class="kartu-stok-footnote">' +
            'Dicetak: ' + U.formatDateTime(new Date()) + ' · Sistem Gudang Puskesmas Sanden' +
          '</div>' +
        '</div>' +
      '</div>';

    U.$('#ks-result').innerHTML = html;
    U.$('#ks-print').addEventListener('click', () => window.print());
    U.$('#ks-xlsx').addEventListener('click', () => this._downloadXLSX(data));
  },

  _downloadXLSX(data) {
    this._ensureSheetJS().then(XLSX => {
      const wb = XLSX.utils.book_new();
      const info = [
        ['KARTU STOK — INFO BARANG'], [''],
        ['Nama', data.nama], ['Kode', data.id_barang],
        ['Satuan', data.satuan], ['Rak', data.rak],
        ['Bulan', U.formatMonthName(data.bulan) + ' ' + data.tahun], [''],
        ['Saldo Awal', data.saldo_awal],
        ['Total Masuk', data.total_in],
        ['Total Keluar', data.total_out],
        ['Saldo Akhir', data.saldo_akhir],
        [''], ['Dicetak', U.formatDateTime(new Date())]
      ];
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(info), 'Info');

      let saldo = data.saldo_awal;
      const riwayat = [[
        'Tanggal', 'ID Transaksi', 'Tipe', 'Qty', 'Batch', 'ED',
        'Masuk', 'Keluar', 'Saldo', 'Keterangan'
      ]];
      (data.riwayat_mentah || []).forEach(r => {
        const isMasuk = r.Tipe_Mutasi === 'Masuk';
        const isKeluar = ['Keluar','Karantina','Retur_Supplier','Rusak'].indexOf(r.Tipe_Mutasi) !== -1;
        const qty = Number(r.Qty) || 0;
        if (isMasuk) saldo += qty;
        else if (isKeluar) saldo -= qty;
        riwayat.push([
          U.formatDate(r.Timestamp), r.ID_Transaksi, r.Tipe_Mutasi, qty,
          r.No_Batch || '', r.Exp_Date ? U.formatDate(r.Exp_Date) : '',
          isMasuk ? qty : '', isKeluar ? qty : '', saldo, r.Keterangan || ''
        ]);
      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(riwayat), 'Riwayat');

      const fname = 'KartuStok_' + data.id_barang + '_' + data.tahun + '-' +
                    String(data.bulan).padStart(2, '0') + '.xlsx';
      XLSX.writeFile(wb, fname);
      Toast.success('File XLSX berhasil diunduh');
    }).catch(err => Toast.error('Gagal memuat SheetJS: ' + err.message));
  },

  _ensureSheetJS() {
    return new Promise((resolve, reject) => {
      if (window.XLSX) return resolve(window.XLSX);
      const script = document.createElement('script');
      script.src = 'https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js';
      script.onload = () => resolve(window.XLSX);
      script.onerror = () => reject(new Error('Gagal load SheetJS'));
      document.head.appendChild(script);
    });
  }
};

const PageCetakQR = {

            '</div>' +
            '<div class="field" style="margin-bottom:0">' +
              '<label class="field-label">Cari</label>' +
              '<input class="input" id="qr-filter-search" placeholder="Nama atau kode...">' +
            '</div>' +
            '<div class="flex gap-2 flex-wrap mt-3">' +
              '<button class="btn btn-secondary btn-sm" id="qr-select-all">Pilih Semua</button>' +
              '<button class="btn btn-secondary btn-sm" id="qr-select-none">Kosongkan</button>' +
              '<button class="btn btn-secondary btn-sm" id="qr-select-invert">Invert</button>' +
            '</div>' +
          '</div>' +
          '<div class="card card-tight" style="padding:0">' +
            '<div class="qr-checkbox-list" id="qr-checkbox-list"></div>' +
          '</div>' +
        '</div>' +

        '<div>' +
          '<div class="card card-tight">' +
            '<div class="card-title" style="margin-bottom:12px">' +
              '<span>Preview</span>' +
              '<span class="badge badge-primary" id="qr-count-badge">0 label</span>' +
            '</div>' +
            '<div class="flex gap-3 flex-wrap mb-3" style="font-size:var(--fs-sm)">' +
              '<label style="display:flex;align-items:center;gap:6px;cursor:pointer">' +
                '<input type="radio" name="qr-mode" value="mode-24" checked> ' +
                '24 label (3×8)' +
              '</label>' +
              '<label style="display:flex;align-items:center;gap:6px;cursor:pointer">' +
                '<input type="radio" name="qr-mode" value="mode-40"> ' +
                '40 label (4×10)' +
              '</label>' +
            '</div>' +
            '<div class="flex gap-2 flex-wrap">' +
              '<button class="btn btn-primary" id="qr-print" disabled>' +
                U.icon('printer', 16) + ' Cetak' +
              '</button>' +
              '<button class="btn btn-secondary" id="qr-download" disabled>' +
                U.icon('download', 16) + ' Unduh HTML' +
              '</button>' +
            '</div>' +
          '</div>' +
          '<div class="card card-tight" style="padding:0">' +
            '<div class="qr-preview-area" id="qr-preview"></div>' +
          '</div>' +
        '</div>' +
      '</div>';

    this._populateRakFilter();
    this._attachListeners(container);
    this._renderCheckboxList(container);
    this._renderPreview();
  },

  _populateRakFilter() {
    const master = AdminApp.master || {};
    const raks = master.rak || [];
    const sel = U.$('#qr-filter-rak');
    if (!sel) return;
    raks.forEach(r => {
      const opt = document.createElement('option');
      opt.value = r.ID_Rak;
      opt.textContent = r.Nama_Rak + ' (' + r.ID_Rak + ')';
      sel.appendChild(opt);
    });
  },

  _attachListeners(container) {
    U.$('#qr-filter-tipe').addEventListener('change', () => this._renderCheckboxList(container));
    U.$('#qr-filter-rak').addEventListener('change', () => this._renderCheckboxList(container));
    U.$('#qr-filter-search').addEventListener('input', U.debounce(() => {
      this._renderCheckboxList(container);
    }, 200));

    U.$('#qr-select-all').addEventListener('click', () => {
      const items = this._getFilteredItems();
      if (items.length > 100) {
        Toast.warning('Maksimal 100 label per cetak. Hanya item pertama yang dipilih.');
      }
      this._selected.clear();
      items.slice(0, 100).forEach(it => this._selected.add(it.id));
      this._renderCheckboxList(container);
      this._refreshAfterSelection();
    });

    U.$('#qr-select-none').addEventListener('click', () => {
      this._selected.clear();
      this._renderCheckboxList(container);
      this._refreshAfterSelection();
    });

    U.$('#qr-select-invert').addEventListener('click', () => {
      const items = this._getFilteredItems();
      const next = new Set();
      items.forEach(it => {
        if (!this._selected.has(it.id)) next.add(it.id);
      });
      this._selected = next;
      this._renderCheckboxList(container);
      this._refreshAfterSelection();
    });

    U.$('#qr-print').addEventListener('click', () => window.print());
    U.$('#qr-download').addEventListener('click', () => this._downloadHTML());

    U.$$('input[name="qr-mode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        this._mode = e.target.value;
        this._renderPreview();
      });
    });
  },

  _getFilteredItems() {
    const master = AdminApp.master || {};
    const tipe = U.$('#qr-filter-tipe').value;
    const rak = U.$('#qr-filter-rak').value;
    const q = (U.$('#qr-filter-search').value || '').toLowerCase().trim();

    const items = [];
    if (tipe !== 'bmhp' && tipe !== 'atk') {
      (master.obat || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (rak && o.Lokasi_Rak !== rak) return;
        if (q && o.Nama_Obat.toLowerCase().indexOf(q) === -1 &&
            o.ID_Obat.toLowerCase().indexOf(q) === -1) return;
        items.push({ id: o.ID_Obat, nama: o.Nama_Obat, rak: o.Lokasi_Rak,
                     satuan: o.Satuan, tipe: 'Obat' });
      });
    }
    if (tipe !== 'obat' && tipe !== 'atk') {
      (master.bmhp || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (rak && o.Lokasi_Rak !== rak) return;
        if (q && o.Nama_Barang.toLowerCase().indexOf(q) === -1 &&
            o.ID_BMHP.toLowerCase().indexOf(q) === -1) return;
        items.push({ id: o.ID_BMHP, nama: o.Nama_Barang, rak: o.Lokasi_Rak,
                     satuan: o.Satuan, tipe: 'BMHP' });
      });
    }
    if (tipe !== 'obat' && tipe !== 'bmhp') {
      (master.atk || []).forEach(o => {
        if (o.Status_Aktif === 'Nonaktif') return;
        if (rak && o.Lokasi_Rak !== rak) return;
        if (q && o.Nama_Barang.toLowerCase().indexOf(q) === -1 &&
            o.ID_ATK.toLowerCase().indexOf(q) === -1) return;
        items.push({ id: o.ID_ATK, nama: o.Nama_Barang, rak: o.Lokasi_Rak,
                     satuan: o.Satuan, tipe: 'ATK' });
      });
    }
    items.sort((a, b) => a.id.localeCompare(b.id));
    return items;
  },

  _renderCheckboxList(container) {
    const items = this._getFilteredItems();
    const list = U.$('#qr-checkbox-list');
    if (!list) return;

    if (items.length === 0) {
      list.innerHTML = '<div class="text-muted text-center" style="padding:24px;font-size:13px">' +
        'Tidak ada item</div>';
      return;
    }

    list.innerHTML = items.map(it => {
      const checked = this._selected.has(it.id);
      return '' +
        '<label class="qr-check-item' + (checked ? ' checked' : '') + '" ' +
          'data-id="' + U.escapeHtml(it.id) + '">' +
          '<input type="checkbox"' + (checked ? ' checked' : '') + '>' +
          '<div class="info">' +
            '<div class="id">' + U.escapeHtml(it.id) + '</div>' +
            '<div class="name">' + U.escapeHtml(it.nama) + '</div>' +
            '<div class="meta">' + U.escapeHtml(it.rak || '-') + ' · ' +
              U.escapeHtml(it.satuan || '-') + ' · ' + it.tipe + '</div>' +
          '</div>' +
        '</label>';
    }).join('');

    const self = this;
    U.$$('.qr-check-item', list).forEach(el => {
      const cb = el.querySelector('input[type="checkbox"]');
      el.addEventListener('click', (e) => {
        if (e.target.tagName === 'INPUT') return;
        cb.checked = !cb.checked;
        cb.dispatchEvent(new Event('change'));
      });
      cb.addEventListener('change', () => {
        const id = el.dataset.id;
        if (cb.checked) self._selected.add(id);
        else self._selected.delete(id);
        el.classList.toggle('checked', cb.checked);
        self._refreshAfterSelection();
      });
    });
  },

  _refreshAfterSelection() {
    U.$('#qr-count-badge').textContent = this._selected.size + ' label';
    U.$('#qr-print').disabled = this._selected.size === 0;
    U.$('#qr-download').disabled = this._selected.size === 0;
    this._renderPreview();
  },

  async _renderPreview() {
    if (this._rendering) return;
    this._rendering = true;

    const preview = U.$('#qr-preview');
    const selectedIds = Array.from(this._selected);

    if (selectedIds.length === 0) {
      preview.innerHTML = '<div class="empty-state" style="padding:40px">' +
        U.icon('qr', 42) +
        '<h3>Belum ada label dipilih</h3>' +
        '<p>Pilih item di panel kiri untuk melihat preview.</p>' +
      '</div>';
      this._rendering = false;
      return;
    }

    const master = AdminApp.master || {};
    const allItems = {};
    (master.obat || []).forEach(o => {
      allItems[o.ID_Obat] = { id: o.ID_Obat, nama: o.Nama_Obat,
                              rak: o.Lokasi_Rak, satuan: o.Satuan };
    });
    (master.bmhp || []).forEach(o => {
      allItems[o.ID_BMHP] = { id: o.ID_BMHP, nama: o.Nama_Barang,
                              rak: o.Lokasi_Rak, satuan: o.Satuan };
    });
    (master.atk || []).forEach(o => {
      allItems[o.ID_ATK] = { id: o.ID_ATK, nama: o.Nama_Barang,
                             rak: o.Lokasi_Rak, satuan: o.Satuan };
    });

    const items = selectedIds.map(id => allItems[id]).filter(Boolean);
    const perPage = this._mode === 'mode-24' ? 24 : 40;
    const pages = Math.ceil(items.length / perPage);

    preview.innerHTML = '<div class="text-center text-muted mb-2" style="font-size:12px">' +
      'Menghasilkan QR... (' + items.length + ' label, ' + pages + ' halaman)</div>';

    try {
      for (const it of items) {
        if (!this._qrCache[it.id]) {
          this._qrCache[it.id] = await this._generateQR(it.id, 220);
        }
      }

      let html = '';
      for (let p = 0; p < pages; p++) {
        const pageItems = items.slice(p * perPage, (p + 1) * perPage);
        html += '<div class="qr-page ' + this._mode + '">';
        pageItems.forEach(it => {
          const qrUrl = this._qrCache[it.id];
          html += '' +
            '<div class="qr-label ' + this._mode + '">' +
              '<div class="qr-img-wrap">' +
                '<img src="' + qrUrl + '" alt="QR ' + U.escapeHtml(it.id) + '">' +
              '</div>' +
              '<div class="label-text">' +
                '<div class="label-id">' + U.escapeHtml(it.id) + '</div>' +
                '<div class="label-name">' + U.escapeHtml(it.nama) + '</div>' +
                '<div class="label-meta">' + U.escapeHtml(it.satuan || '') +
                  (it.rak ? ' · ' + U.escapeHtml(it.rak) : '') + '</div>' +
              '</div>' +
            '</div>';
        });
        html += '</div>';
      }
      preview.innerHTML = html;
    } catch (err) {
      preview.innerHTML = AdminApp._renderEmpty('Gagal generate QR', err.message, 'alertCircle');
    } finally {
      this._rendering = false;
    }
  },

  _generateQR(text, size) {
    return new Promise((resolve, reject) => {
      const loadLib = () => {
        if (window.QRCode) return Promise.resolve(window.QRCode);
        return new Promise((res, rej) => {
          const script = document.createElement('script');
          script.src = 'https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js';
          script.onload = () => res(window.QRCode);
          script.onerror = () => rej(new Error('Gagal load library QR'));
          document.head.appendChild(script);
        });
      };
      loadLib().then(lib => {
        lib.toDataURL(text, {
          width: size || 220,
          margin: 1,
          errorCorrectionLevel: 'M',
          color: { dark: '#000000', light: '#ffffff' }
        }, (err, url) => {
          if (err) reject(err);
          else resolve(url);
        });
      }).catch(reject);
    });
  },

  _downloadHTML() {
    const preview = U.$('#qr-preview');
    if (!preview) return;
    const html = '' +
      '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>QR Labels</title>' +
      '<style>' +
      'body{margin:0;font-family:system-ui,sans-serif;background:#f5f5f5}' +
      '.qr-page{background:white;width:210mm;min-height:297mm;padding:8mm;margin:0 auto 12px;' +
      'box-shadow:0 2px 8px rgba(0,0,0,0.1);display:grid;grid-template-columns:repeat(3,1fr);' +
      'grid-template-rows:repeat(8,33.9mm);gap:0;box-sizing:border-box}' +
      '.qr-page.mode-40{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(10,25.4mm)}' +
      '.qr-label{border:0.3mm dashed #ccc;padding:2mm;display:flex;align-items:center;gap:2mm;' +
      'overflow:hidden;box-sizing:border-box}' +
      '.qr-img-wrap{width:22mm;height:22mm;flex-shrink:0;display:flex;align-items:center;justify-content:center}' +
      '.qr-label.mode-40 .qr-img-wrap{width:18mm;height:18mm}' +
      '.qr-img-wrap img{width:100%;height:100%;image-rendering:pixelated}' +
      '.label-text{flex:1;min-width:0;line-height:1.15;overflow:hidden}' +
      '.label-id{font-size:11pt;font-weight:700;font-family:ui-monospace,monospace}' +
      '.qr-label.mode-40 .label-id{font-size:9pt}' +
      '.label-name{font-size:8pt;color:#222;display:-webkit-box;-webkit-line-clamp:2;' +
      '-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}' +
      '.qr-label.mode-40 .label-name{font-size:7pt;-webkit-line-clamp:1}' +
      '.label-meta{font-size:6.5pt;color:#666;margin-top:2px}' +
      '@media print{body{background:white}.qr-page{box-shadow:none;margin:0;page-break-after:always}' +
      '.qr-page:last-child{page-break-after:auto}@page{margin:0}}' +
      '</style></head><body>' +
      preview.innerHTML +
      '</body></html>';

    const blob = new Blob([html], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'QR_Labels_' + new Date().toISOString().slice(0, 10) + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    Toast.success('File HTML berhasil diunduh. Buka di browser lalu cetak.');
  }
};
