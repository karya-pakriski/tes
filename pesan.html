<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0d7377">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Pesan Barang — Puskesmas Sanden">
<title>Pesan Barang — Puskesmas Sanden</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://script.googleapis.com" crossorigin>

<style>
/* ============================================================
   PESAN v5.5.1 — FRESH MODERN
   100% viewport (height fixed) + scrolling proporsional
   ============================================================ */

/* ---------- BOOT SPLASH ---------- */
.boot-splash {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background:
    radial-gradient(circle at 20% 20%, rgba(20, 163, 168, 0.4) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(13, 115, 119, 0.5) 0%, transparent 50%),
    linear-gradient(135deg, #0d7377 0%, #14a3a8 100%);
  z-index: 9999;
  transition: opacity 0.4s;
}
.boot-splash.hide { opacity: 0; pointer-events: none; }
.boot-splash-inner { text-align: center; color: white; padding: 20px; }
.boot-splash-logo {
  width: 84px; height: 84px; margin: 0 auto 20px;
  background: rgba(255,255,255,0.18);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.25);
  border-radius: 22px;
  display: flex; align-items: center; justify-content: center;
  font-size: 32px; font-weight: 800;
  letter-spacing: -1px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.2);
}
.boot-splash-text { font-size: 15px; opacity: 0.92; margin-bottom: 20px; font-weight: 500; }
.boot-splash-spinner {
  display: inline-block; width: 24px; height: 24px;
  border: 2.5px solid rgba(255,255,255,0.25);
  border-top-color: white; border-radius: 50%;
  animation: bootspin 0.75s linear infinite;
}
@keyframes bootspin { to { transform: rotate(360deg); } }

/* ---------- 100% VIEWPORT LAYOUT (v5.5.1 FIX) ---------- */
html, body {
  height: 100%;
  overflow: hidden;
}
#pesan-root {
  height: 100vh;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
}

/* ---------- LOGIN ---------- */
.login-ruang {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  padding-top: calc(20px + var(--safe-top));
  padding-bottom: calc(20px + var(--safe-bottom));
  background:
    radial-gradient(circle at 15% 15%, rgba(20, 163, 168, 0.4) 0%, transparent 45%),
    radial-gradient(circle at 85% 85%, rgba(13, 115, 119, 0.5) 0%, transparent 45%),
    linear-gradient(135deg, #0d7377 0%, #14a3a8 100%);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.login-ruang-card {
  background: var(--surface);
  width: 100%;
  max-width: 420px;
  border-radius: 24px;
  padding: 36px 28px 28px;
  box-shadow: 0 24px 60px rgba(0,0,0,0.22);
  animation: cardIn 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px) scale(0.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.login-ruang-logo {
  width: 68px; height: 68px;
  margin: 0 auto 18px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  border-radius: 20px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; font-weight: 800;
  letter-spacing: -1px;
  box-shadow: 0 8px 24px rgba(13,115,119,0.32);
}
.login-ruang-title {
  font-size: 24px; font-weight: 800;
  text-align: center;
  margin-bottom: 6px;
  letter-spacing: -0.5px;
  color: var(--text);
}
.login-ruang-subtitle {
  font-size: 13.5px; color: var(--text-muted);
  text-align: center;
  margin-bottom: 28px;
  line-height: 1.5;
}
.login-ruang-footer {
  text-align: center;
  font-size: 11.5px;
  color: var(--text-light);
  margin-top: 20px;
  padding-top: 18px;
  border-top: 1px dashed var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.pj-hint {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px;
  background: var(--primary-bg-soft);
  border: 1px dashed var(--primary-light);
  border-radius: 12px;
  font-size: 12.5px;
  color: var(--primary-dark);
  margin-top: 10px;
  margin-bottom: var(--sp-3);
  line-height: 1.4;
  animation: fadeIn 0.25s ease-out;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.pj-hint svg { width: 14px; height: 14px; flex-shrink: 0; }
.pj-hint strong { color: var(--primary-dark); font-weight: 700; }

.ruang-error-block {
  padding: 12px 0;
  color: var(--danger);
  font-size: 13px;
  line-height: 1.5;
}
.ruang-error-block button {
  color: var(--primary);
  text-decoration: underline;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  font-size: 13px;
  margin-top: 6px;
  font-weight: 600;
}

/* ---------- APP LAYOUT (100dvh, scrolling proporsional) ---------- */
.pesan-app {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  width: 100%;
  overflow: hidden;
  background: var(--bg);
}

.pesan-topbar {
  flex-shrink: 0;
  height: 62px;
  padding-top: var(--safe-top);
  padding-left: calc(16px + var(--safe-left));
  padding-right: calc(16px + var(--safe-right));
  background: rgba(255, 255, 255, 0.9);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  z-index: 20;
}
.pesan-topbar-logo {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white; border-radius: 11px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 12px;
  flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(13,115,119,0.28);
  letter-spacing: -0.3px;
}
.pesan-topbar-info { flex: 1; min-width: 0; }
.pesan-topbar-title {
  font-weight: 700; font-size: 14px;
  color: var(--text);
  line-height: 1.2;
  letter-spacing: -0.2px;
}
.pesan-topbar-sub {
  font-size: 11.5px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-top: 1px;
}

.pesan-tabbar {
  flex-shrink: 0;
  padding: 10px 16px 8px;
  background: var(--bg);
}
.pesan-tabbar-inner {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
  padding: 4px;
  background: var(--surface-2);
  border-radius: 12px;
}
.pesan-tabbar-btn {
  position: relative;
  padding: 10px 12px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  background: transparent;
  border: none;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.pesan-tabbar-btn svg { width: 15px; height: 15px; }
.pesan-tabbar-btn.active {
  background: var(--surface);
  color: var(--primary);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  font-weight: 700;
}
.pesan-tabbar-count {
  display: inline-flex;
  align-items: center; justify-content: center;
  min-width: 18px; height: 18px;
  padding: 0 6px;
  background: var(--danger);
  color: white;
  border-radius: 9px;
  font-size: 10px;
  font-weight: 700;
  line-height: 1;
}

.pesan-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding: 4px 16px 20px;
  padding-left: calc(16px + var(--safe-left));
  padding-right: calc(16px + var(--safe-right));
  scroll-behavior: smooth;
  scrollbar-width: thin;
}
.pesan-content::-webkit-scrollbar { width: 8px; }
.pesan-content::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: 4px;
  border: 2px solid transparent;
  background-clip: padding-box;
}
.pesan-content-inner {
  max-width: 720px;
  margin: 0 auto;
  width: 100%;
}
@keyframes contentIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
.pesan-content-inner > * {
  animation: contentIn 0.25s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.pesan-cart {
  flex-shrink: 0;
  padding: 12px 16px;
  padding-bottom: calc(12px + var(--safe-bottom));
  padding-left: calc(16px + var(--safe-left));
  padding-right: calc(16px + var(--safe-right));
  background: var(--surface);
  border-top: 1px solid var(--border);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
  display: none;
  z-index: 15;
}
.pesan-cart.visible { display: block; }
.pesan-cart-inner {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  gap: 12px;
}
.pesan-cart-info { flex: 1; min-width: 0; }
.pesan-cart-count {
  font-size: 11.5px;
  color: var(--text-muted);
  margin-bottom: 2px;
}
.pesan-cart-total {
  font-size: 17px;
  font-weight: 800;
  color: var(--primary-dark);
  letter-spacing: -0.3px;
}
.pesan-cart-submit {
  flex-shrink: 0;
  min-height: 48px;
  padding: 12px 22px;
  font-size: 14px;
  font-weight: 700;
  border-radius: 12px;
}

/* ---------- WELCOME ---------- */
.welcome { padding: 14px 0 16px; }
.welcome-greet { font-size: var(--fs-sm); color: var(--text-muted); margin-bottom: 2px; }
.welcome-name {
  font-size: var(--fs-xl); font-weight: 700;
  line-height: 1.2; word-break: break-word;
  letter-spacing: -0.3px;
}
.welcome-room {
  display: inline-block; margin-top: 8px;
  padding: 4px 12px;
  background: var(--primary-bg); color: var(--primary-dark);
  border-radius: var(--r-full);
  font-size: var(--fs-xs); font-weight: 600;
}

/* ---------- SEARCH ---------- */
.search-wrap { position: relative; }
.search-results {
  position: absolute;
  top: calc(100% + 6px);
  left: 0; right: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.12);
  max-height: 360px;
  overflow-y: auto;
  z-index: 100;
  padding: 6px;
  animation: dropdownIn 0.16s ease-out;
}
@keyframes dropdownIn {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.search-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px;
  border-radius: 10px;
  width: 100%; text-align: left;
  background: none; border: none; cursor: pointer;
  color: var(--text);
  transition: background 0.12s;
}
.search-item:hover { background: var(--primary-bg-soft); }
.search-item-main { flex: 1; min-width: 0; }
.search-item-name {
  font-weight: 600; font-size: 13.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 2px;
}
.search-item-meta {
  font-size: 11.5px; color: var(--text-muted);
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 6px;
}
.search-item-meta strong {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  color: var(--primary-dark);
  font-weight: 700;
}
.search-stok-badge {
  display: inline-flex;
  align-items: center;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.1px;
}
.search-stok-badge.ok { background: var(--success-bg); color: var(--success); }
.search-stok-badge.low { background: var(--warning-bg); color: var(--warning); }
.search-stok-badge.empty { background: var(--danger-bg); color: var(--danger); }
.search-empty {
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* ---------- CART LIST ---------- */
.cart-empty {
  text-align: center;
  padding: 56px 24px;
  color: var(--text-muted);
}
.cart-empty svg {
  width: 48px; height: 48px; color: var(--text-light);
  margin: 0 auto 14px;
  opacity: 0.6;
}
.cart-empty h3 {
  font-size: 15px; color: var(--text);
  margin-bottom: 6px; font-weight: 700;
}
.cart-empty p { font-size: 13px; }

.cart-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.cart-item {
  display: flex; gap: 12px;
  padding: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  align-items: center;
  transition: border-color 0.15s;
}
.cart-item:hover { border-color: var(--border-strong); }
.cart-item-info { flex: 1; min-width: 0; }
.cart-item-name {
  font-weight: 600; font-size: 13.5px;
  margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cart-item-meta {
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  word-break: break-word;
}
.cart-item-warning {
  display: flex; align-items: flex-start;
  gap: 6px;
  margin-top: 8px;
  padding: 7px 10px;
  background: var(--warning-bg);
  border-left: 3px solid var(--warning);
  border-radius: 8px;
  font-size: 11.5px;
  color: var(--warning-dark, var(--warning));
  font-weight: 600;
  line-height: 1.35;
}
.cart-item-warning svg { width: 12px; height: 12px; flex-shrink: 0; margin-top: 1px; }
.cart-item-actions {
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
}

.qty-ctrl {
  display: flex; align-items: center;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  overflow: hidden;
  background: var(--surface);
}
.qty-ctrl button {
  width: 34px; height: 38px;
  display: flex; align-items: center; justify-content: center;
  color: var(--primary); font-size: 18px; font-weight: 700;
  background: transparent;
  border: none;
  cursor: pointer;
  transition: background 0.15s;
  line-height: 1;
}
.qty-ctrl button:hover { background: var(--primary-bg); }
.qty-ctrl input {
  width: 50px; height: 38px;
  border: none; text-align: center;
  font-size: 15px; font-weight: 700;
  background: var(--surface-2);
  color: var(--text);
  outline: none;
  -moz-appearance: textfield;
  appearance: textfield;
  font-variant-numeric: tabular-nums;
}
.qty-ctrl input::-webkit-outer-spin-button,
.qty-ctrl input::-webkit-inner-spin-button {
  -webkit-appearance: none; margin: 0;
}
.cart-del {
  width: 36px; height: 36px;
  border-radius: 9px;
  color: var(--danger);
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.15s;
}
.cart-del:hover { background: var(--danger-bg); }
.cart-del svg { width: 16px; height: 16px; }

/* ---------- NOTE ---------- */
.note-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 16px;
  margin-top: 16px;
}
.note-card .field { margin-bottom: 0; }

/* ---------- RIWAYAT ---------- */
.riwayat-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  gap: 10px;
}
.riwayat-title {
  font-size: 13px;
  color: var(--text-muted);
  font-weight: 500;
}
.riwayat-card {
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  margin-bottom: 12px;
  transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
  cursor: pointer;
  position: relative;
  overflow: hidden;
}
.riwayat-card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: transparent;
  transition: background 0.2s;
}
.riwayat-card:hover {
  border-color: var(--primary-light);
  box-shadow: 0 8px 24px rgba(13,115,119,0.1);
  transform: translateY(-2px);
}
.riwayat-card:hover::before { background: var(--primary); }
.riwayat-card:active { transform: translateY(0); }

.riwayat-card-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
  flex-wrap: wrap;
}
.riwayat-card-id {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--primary-dark);
  letter-spacing: -0.2px;
  margin-bottom: 3px;
}
.riwayat-card-date {
  font-size: 11.5px;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.riwayat-card-date svg { width: 11px; height: 11px; }
.riwayat-card-body {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  padding-top: 10px;
  border-top: 1px dashed var(--border);
  font-size: 12.5px;
  color: var(--text-muted);
  flex-wrap: wrap;
}
.riwayat-card-body strong { color: var(--text); font-weight: 600; }
.riwayat-card-hint {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--primary);
  font-weight: 600;
  font-size: 12px;
}
.riwayat-card-hint svg { width: 13px; height: 13px; }

.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border-radius: 20px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.2px;
  white-space: nowrap;
}
.status-pill::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: currentColor;
}
.status-baru { background: var(--warning-bg); color: var(--warning-dark, var(--warning)); }
.status-diproses { background: var(--info-bg); color: var(--info); }
.status-selesai { background: var(--success-bg); color: var(--success); }
.status-ditolak { background: var(--danger-bg); color: var(--danger); }
.status-gagal { background: var(--surface-2); color: var(--text-muted); }

/* ---------- MODAL DETAIL ---------- */
.detail-section {
  padding: 12px 14px;
  background: var(--surface-2);
  border-radius: 12px;
  margin-bottom: 14px;
}
.detail-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 7px 0;
  font-size: 13px;
}
.detail-row + .detail-row { border-top: 1px dashed var(--border); }
.detail-label { font-size: 12.5px; color: var(--text-muted); }
.detail-value {
  font-weight: 600;
  color: var(--text);
  text-align: right;
  font-size: 13px;
}
.detail-items {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 4px 14px;
  max-height: 340px;
  overflow-y: auto;
}
.detail-item {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 11px 0;
  border-bottom: 1px dashed var(--border);
}
.detail-item:last-child { border-bottom: none; }
.detail-item-left { flex: 1; min-width: 0; }
.detail-item-name {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 3px;
  word-break: break-word;
}
.detail-item-meta {
  font-size: 11px;
  color: var(--text-muted);
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
}
.detail-item-warn {
  font-size: 11px;
  color: var(--warning);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.detail-item-warn svg { width: 11px; height: 11px; flex-shrink: 0; }
.detail-item-qty {
  font-weight: 700;
  color: var(--primary-dark);
  font-size: 15px;
  flex-shrink: 0;
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.detail-item-qty span {
  display: block;
  font-size: 10px;
  font-weight: 500;
  color: var(--text-muted);
  margin-top: 2px;
}
.detail-note {
  font-size: 13px;
  color: var(--text);
  padding: 12px 14px;
  background: var(--surface-2);
  border-radius: 12px;
  line-height: 1.55;
  margin-bottom: 14px;
}
.detail-hint {
  padding: 11px 14px;

<body>

<div class="boot-splash" id="boot-splash">
  <div class="boot-splash-inner">
    <div class="boot-splash-logo">PKM</div>
    <div class="boot-splash-text">Memuat...</div>
    <div class="boot-splash-spinner"></div>
  </div>
</div>

<div id="pesan-root"></div>

<div class="toast-container" id="toast-container"></div>
<!-- v5.5.1: loading-overlay dihapus — pakai .busy / inline loader -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal"></div>
</div>

<script src="shared/core.js" defer></script>

<script defer>
'use strict';

/* ============================================================
   PESAN v5.5.1 — Pesan Barang Ruang
   Tidak redeclare U/Api/Store/Toast/Modal/Btn/FormError/CS/
   LibLoader/LoginForm/AuthGuard — dari core.js.
   ============================================================ */

/* ---------- HELPER ---------- */
const H = {
  loader(text) {
    return '<div class="inline-loading">' +
      '<span class="spinner"></span>' +
      '<span>' + U.escapeHtml(text || 'Memuat...') + '</span>' +
    '</div>';
  },
  loaderSm(text) {
    return '<span class="inline-loading-sm">' +
      '<span class="spinner"></span>' +
      U.escapeHtml(text || '') +
    '</span>';
  },
  empty(title, desc, icon) {
    return '<div class="empty-state">' + U.icon(icon || 'info', 48) +
      '<h3>' + U.escapeHtml(title) + '</h3>' +
      (desc ? '<p>' + U.escapeHtml(desc) + '</p>' : '') + '</div>';
  }
};

/* ============================================================
   RUANG STORE
   ============================================================ */
const RUANG_SESSION_KEY = 'pkm_ruang_session';
const RUANG_CACHE_KEY = 'pkm_ruang_list';
const RUANG_CACHE_TTL_MS = 86400000;

const RuangStore = {
  get() {
    try {
      const raw = localStorage.getItem(RUANG_SESSION_KEY);
      if (!raw) return null;
      const s = JSON.parse(raw);
      if (s.expiry && Date.now() > s.expiry) {
        localStorage.removeItem(RUANG_SESSION_KEY);
        return null;
      }
      return s;
    } catch (e) { return null; }
  },
  set(s) {
    try { localStorage.setItem(RUANG_SESSION_KEY, JSON.stringify(s)); return true; }
    catch (e) { return false; }
  },
  clear() {
    try { localStorage.removeItem(RUANG_SESSION_KEY); } catch (e) {}
  }
};

const RuangCache = {
  get() {
    try {
      const raw = localStorage.getItem(RUANG_CACHE_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (parsed.expires && Date.now() > parsed.expires) {
        localStorage.removeItem(RUANG_CACHE_KEY);
        return null;
      }
      return Array.isArray(parsed.items) ? parsed.items : null;
    } catch (e) { return null; }
  },
  set(items) {
    try {
      localStorage.setItem(RUANG_CACHE_KEY, JSON.stringify({
        items: items, expires: Date.now() + RUANG_CACHE_TTL_MS
      }));
    } catch (e) {}
  }
};

/* ============================================================
   SNAPSHOT PESANAN
   ============================================================ */
const SnapshotStore = {
  KEY: 'pkm_psn_snapshots',
  MAX: 50,
  _cache: null,

  _load() {
    if (this._cache) return this._cache;
    try {
      const raw = localStorage.getItem(this.KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      this._cache = (parsed && typeof parsed === 'object' && !Array.isArray(parsed))
        ? parsed : {};
    } catch (e) {
      this._cache = {};
    }
    return this._cache;
  },

  _save() {
    try {
      const keys = Object.keys(this._cache);
      if (keys.length > this.MAX) {
        const sorted = keys
          .map(k => ({ k, t: (this._cache[k] && this._cache[k].waktu) || 0 }))
          .sort((a, b) => b.t - a.t);
        const keep = sorted.slice(0, this.MAX).map(x => x.k);
        const next = {};
        keep.forEach(k => { next[k] = this._cache[k]; });
        this._cache = next;
      }
      localStorage.setItem(this.KEY, JSON.stringify(this._cache));
    } catch (e) { dbgWarn('Snapshot save error:', e); }
  },

  set(idPesanan, snapshot) {
    if (!idPesanan) return;
    const map = this._load();
    map[idPesanan] = snapshot;
    this._save();
  },

  get(idPesanan) {
    if (!idPesanan) return null;
    return this._load()[idPesanan] || null;
  }
};

/* ============================================================
   OVERRIDE Api._buildRequest — pakai session ruang
   ============================================================ */
function installRuangApiOverride() {
  if (typeof Api === 'undefined') {
    dbgErr('Api tidak tersedia — core.js gagal dimuat?');
    return false;
  }
  Api._buildRequest = function(action, payload, opts) {
    const ruangSession = RuangStore.get();
    return {
      auth_token: CONFIG.API_KEY,
      session_token: (opts && opts.public) ? undefined : (ruangSession ? ruangSession.token : undefined),
      action: action,
      uuid: (opts && opts.noUuid) ? undefined : U.uuid(),
      timestamp_client: U.nowISO(),
      payload: payload || {}
    };
  };
  return true;
}

/* ============================================================
   PESAN API
   ============================================================ */
const PesanApi = {
  getRuangList() {
    return Api.call('getRuangList', {}, { public: true });
  },
  loginRuang(kode, pin) {
    return Api.call('loginRuang',
      { kode_ruang: kode, pin_plaintext: pin },
      { public: true });
  },
  getBarangUntukPesan() {
    return Api.call('getBarangUntukPesan', {});
  },
  kirimPesanan(payload) {
    return Api.call('kirimPesanan', payload);
  },
  getPesananSaya(limit) {
    return Api.call('getPesananSaya', { limit: limit || 30 });
  }
};

/* ============================================================
   PESAN APP
   ============================================================ */
const PesanApp = {
  session: null,
  ruangList: [],
  barangList: [],
  barangLoading: false,
  cart: {},
  currentTab: 'pesan',
  catatan: '',
  submitting: false,
  _loggingIn: false,      // v5.5.1: guard double-submit login
  _riwayatItems: [],
  _pendingCount: 0,
  _renderId: 0,
  _detailRequestId: 0,
  _searchClickHandler: null,

  /* -------------------------------------------------- INIT */
  async init() {
    dbg('PesanApp v5.5.1 init');
    const stored = RuangStore.get();

    if (stored && stored.token) {
      try {
        const res = await Api.whoAmI();
        if (res && res.code === 200 && res.data && res.data.role === 'Ruang') {
          this.session = {
            token: stored.token,
            role: 'Ruang',
            id_petugas: res.data.id_petugas,
            username: res.data.username,
            nama: res.data.nama,
            kode_ruang: res.data.kode_ruang,
            nama_ruang: res.data.nama_ruang,
            pj: res.data.pj || '',
            expiry: res.data.expiry
          };
          RuangStore.set(this.session);
          this._hideBoot();
          await this.showMain();
          return;
        }
      } catch (err) {
        dbgWarn('whoAmI gagal:', err.message);
      }
      RuangStore.clear();
    }

    await this._ensureRuangList();
    this._hideBoot();
    this.showLogin();
  },

  _hideBoot() {
    const el = document.getElementById('boot-splash');
    if (!el) return;
    el.classList.add('hide');
    setTimeout(() => {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 400);
  },

  async _fetchRuangList() {
    const res = await PesanApi.getRuangList();
    const items = (res.data && res.data.items) || [];
    this.ruangList = items;
    RuangCache.set(items);
    return items;
  },

  async _ensureRuangList() {
    const cached = RuangCache.get();
    if (cached && cached.length > 0) {
      this.ruangList = cached;
      dbg('Ruang list dari cache: ' + cached.length);
      // Refresh di background
      this._fetchRuangList().catch(err => dbgWarn('BG refresh ruang gagal:', err.message));
      return cached;
    }
    try {
      const items = await Promise.race([
        this._fetchRuangList(),
        new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 10000))
      ]);
      return items;
    } catch (err) {
      dbgWarn('Gagal fetch ruang list:', err.message);
      this.ruangList = [];
      return [];
    }
  },

  /* -------------------------------------------------- API ERROR */
  _handleApiError(err) {
    if (err && (err.code === 'UNAUTHORIZED' || err.code === 'UNAUTHORIZED_TOKEN')) {
      RuangStore.clear();
      this.session = null;
      this.cart = {};
      Toast.warning('Sesi berakhir. Silakan login ulang.');
      this.showLogin();
      return true;
    }
    return false;
  },

  /* -------------------------------------------------- LOGIN */
  showLogin() {
    this.session = null;
    this.cart = {};
    this.catatan = '';
    this.currentTab = 'pesan';
    this._loggingIn = false;

    const root = U.$('#pesan-root');
    root.innerHTML = this._renderLogin();
    this._populateRuangDropdown();

    const form = U.$('#form-login-ruang');
    if (form) {
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        this._doLogin();
      });
    }
    setTimeout(() => {
      const pinEl = U.$('#login-pin');
      if (pinEl) pinEl.focus();
    }, 250);
  },

  _renderLogin() {
    const hasRuang = this.ruangList.length > 0;
    const errorBlock = hasRuang
      ? ''
      : '<div class="ruang-error-block">' +
        'Gagal memuat daftar ruang. Periksa koneksi internet Anda.<br>' +
        '<button type="button" id="btn-reload-ruang">Coba lagi</button>' +
        '</div>';

    return '' +
      '<div class="login-ruang">' +
        '<div class="login-ruang-card">' +
          '<div class="login-ruang-logo">PKM</div>' +
          '<div class="login-ruang-title">Pesan Barang</div>' +
          '<div class="login-ruang-subtitle">Puskesmas Sanden, Bantul</div>' +
          '<form class="login-form" id="form-login-ruang" autocomplete="off">' +
            '<div class="field">' +
              '<label class="field-label">Ruang <span class="required">*</span></label>' +
              '<div id="login-ruang-wrap"></div>' +
              errorBlock +
              '<div class="pj-hint" id="pj-hint" style="display:none"></div>' +
            '</div>' +
            '<div class="field">' +
              '<label class="field-label">PIN <span class="required">*</span></label>' +
              '<input type="password" class="input" id="login-pin" ' +
                'inputmode="numeric" maxlength="8" placeholder="••••" ' +
                'autocomplete="current-password" required>' +
              '<div class="field-hint">Tanya admin jika lupa PIN.</div>' +
            '</div>' +
            '<button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login">' +
              U.icon('check', 18) + ' Masuk' +
            '</button>' +
          '</form>' +
          '<div class="login-ruang-footer">' +
            '<span>v' + CONFIG.APP_VERSION + ' · Pesan Barang</span>' +
          '</div>' +
        '</div>' +
      '</div>';
  },

  _populateRuangDropdown() {
    const wrap = U.$('#login-ruang-wrap');
    if (!wrap) return;

    if (this.ruangList.length === 0) {
      wrap.innerHTML = '<div style="padding:12px;background:var(--surface-2);' +
        'border-radius:12px;color:var(--text-muted);font-size:13px">' +
        'Tidak ada ruang aktif</div>';
      const reloadBtn = U.$('#btn-reload-ruang');
      if (reloadBtn) {
        reloadBtn.addEventListener('click', () => this._reloadRuangList());
      }
      return;
    }

    const select = document.createElement('select');
    select.className = 'select';
    select.id = 'login-ruang';
    select.innerHTML = '<option value="">— Pilih Ruang —</option>' +
      this.ruangList.map(r =>
        '<option value="' + U.escapeHtml(r.kode) + '">' +
          U.escapeHtml(r.kode + ' · ' + r.nama) +
        '</option>'
      ).join('');

    wrap.innerHTML = '';
    wrap.appendChild(select);

    // CS auto-enhance via MutationObserver core.js — panggil manual sebagai safety
    if (typeof CS !== 'undefined' && CS.enhance) CS.enhance(select);

    const self = this;
    select.addEventListener('change', () => {
      const r = self.ruangList.find(x => x.kode === select.value);
      const pjHint = U.$('#pj-hint');
      if (!pjHint) return;
      if (r && r.pj) {
        pjHint.style.display = 'flex';
        pjHint.innerHTML = U.icon('users', 14) +
          '<span>PJ: <strong>' + U.escapeHtml(r.pj) + '</strong></span>';
      } else {
        pjHint.style.display = 'none';
      }
    });
  },

  async _reloadRuangList() {
    const wrap = U.$('#login-ruang-wrap');
    if (wrap) {
      wrap.innerHTML = '<div style="padding:12px 0">' +
        H.loaderSm('Memuat ulang ruang...') + '</div>';
    }
    try {
      await this._fetchRuangList();
      this.showLogin();
    } catch (err) {
      Toast.error('Gagal memuat ruang: ' + err.message);
      this.showLogin();
    }
  },

  async _doLogin() {
    // v5.5.1: guard anti double-submit
    if (this._loggingIn) { dbgWarn('Login sedang proses, abaikan'); return; }
    this._loggingIn = true;

    const select = U.$('#login-ruang');
    const pinEl = U.$('#login-pin');
    const btn = U.$('#btn-login');

    const kode = select ? select.value : '';
    const pin = pinEl ? pinEl.value : '';

    if (!kode) {
      Toast.error('Pilih ruang dulu');
      this._loggingIn = false;
      return;
    }
    if (!pin || pin.length < 4) {
      Toast.error('PIN minimal 4 digit');
      this._loggingIn = false;
      return;
    }

    Btn.setLoading(btn, 'Memeriksa...');
    try {
      const res = await PesanApi.loginRuang(kode, pin);
      if (!res || res.code !== 200) {
        throw new Error((res && res.message) || 'Login gagal');
      }

      const session = {
        token: res.session_token,
        role: 'Ruang',
        kode_ruang: res.kode_ruang,
        nama_ruang: res.nama_ruang,
        pj: res.pj || '',
        nama: res.pj || res.nama_ruang,
        expiry: Date.now() + (res.expiry_sec || 21500) * 1000
      };
      RuangStore.set(session);
      this.session = session;

      U.beepSuccess();
      Toast.success('Selamat datang, ' + (res.pj || res.nama_ruang));

      await this.showMain();
    } catch (err) {
      dbgWarn('Login ruang gagal:', err.message);
      U.vibrate([100, 50, 100]);
      U.beepError();
      Toast.error(err.message || 'Login gagal');
      if (pinEl) pinEl.value = '';
      Btn.stopLoading(btn, 'Masuk', 'check');
    } finally {
      this._loggingIn = false;
    }
  },

  /* -------------------------------------------------- MAIN */
  async showMain() {
    const root = U.$('#pesan-root');
    root.innerHTML = this._renderMain();
    this._attachMainListeners();

    this.currentTab = 'pesan';
    this.cart = {};
    this.catatan = '';
    this._riwayatItems = [];
    this._pendingCount = 0;

    this.barangLoading = true;
    this._renderTab();

    // Fetch barang di background (tidak blocking UI)
    try {
      const res = await PesanApi.getBarangUntukPesan();
      this.barangList = (res.data && res.data.items) || [];
    } catch (err) {
      dbgWarn('Gagal load barang:', err.message);
      if (this._handleApiError(err)) return;
      Toast.warning('Daftar barang belum termuat.');
    } finally {
      this.barangLoading = false;
      if (this.currentTab === 'pesan') this._renderTab();
    }

    // Fetch pending count di background
    this._refreshPendingCount();
  },

  _renderMain() {
    const s = this.session;
    return '' +
      '<div class="pesan-app">' +
        '<header class="pesan-topbar">' +
          '<div class="pesan-topbar-logo">PKM</div>' +
          '<div class="pesan-topbar-info">' +
            '<div class="pesan-topbar-title">Pesan Barang</div>' +
            '<div class="pesan-topbar-sub">' +
              U.escapeHtml(s.nama_ruang || '') +
              (s.pj ? ' · PJ: ' + U.escapeHtml(s.pj) : '') +
            '</div>' +
          '</div>' +
          '<button class="app-icon-btn danger" id="btn-logout" title="Keluar">' +
            U.icon('logout', 20) +
          '</button>' +
        '</header>' +
        '<div class="pesan-tabbar">' +
          '<div class="pesan-tabbar-inner">' +
            '<button class="pesan-tabbar-btn active" data-tab="pesan">' +
              U.icon('package', 14) +
              '<span>Pesan Barang</span>' +
            '</button>' +
            '<button class="pesan-tabbar-btn" data-tab="riwayat">' +
              U.icon('clipboard', 14) +
              '<span>Riwayat</span>' +
              '<span class="pesan-tabbar-count" id="tab-count-riwayat" ' +
                'style="display:none">0</span>' +
            '</button>' +
          '</div>' +
        '</div>' +
        '<main class="pesan-content" id="pesan-content">' +
          '<div class="pesan-content-inner" id="pesan-content-inner"></div>' +
        '</main>' +
        '<div class="pesan-cart" id="pesan-cart">' +
          '<div class="pesan-cart-inner">' +
            '<div class="pesan-cart-info">' +
              '<div class="pesan-cart-count" id="cart-bar-count">0 item</div>' +
              '<div class="pesan-cart-total" id="cart-bar-total">0 pcs</div>' +
            '</div>' +
            '<button class="btn btn-primary pesan-cart-submit" id="btn-kirim" disabled>' +
              U.icon('check', 16) + ' Kirim Pesanan' +
            '</button>' +
          '</div>' +
        '</div>' +
      '</div>';
  },

  _attachMainListeners() {
    const logoutBtn = U.$('#btn-logout');
    if (logoutBtn) {
      logoutBtn.addEventListener('click', () => {
        Modal.confirm('Keluar', 'Yakin ingin keluar dari aplikasi?',
          () => this.logout(), 'Ya, Keluar', true,
          { icon: 'danger', subtitle: 'Anda harus login ulang' });
      });
    }

    // v5.5.1: btn-kirim pakai event delegation (1x attach, aman re-render)
    const cartBar = U.$('#pesan-cart');
    if (cartBar && !cartBar._bound) {
      cartBar._bound = true;
      cartBar.addEventListener('click', (e) => {
        const btn = e.target.closest('#btn-kirim');
        if (!btn) return;
        e.preventDefault();
        this._confirmKirim();
      });
    }

    U.$$('.pesan-tabbar-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const t = btn.dataset.tab;
        if (t === this.currentTab) return;
        this.currentTab = t;
        U.$$('.pesan-tabbar-btn').forEach(b =>
          b.classList.toggle('active', b === btn));
        this._renderTab();
        const content = U.$('#pesan-content');
        if (content) content.scrollTop = 0;
      });
    });
  },

  _switchTab(tab) {
    this.currentTab = tab;
    U.$$('.pesan-tabbar-btn').forEach(b =>
      b.classList.toggle('active', b.dataset.tab === tab));
    this._renderTab();
    const content = U.$('#pesan-content');
    if (content) content.scrollTop = 0;
  },

  _renderTab() {
    const inner = U.$('#pesan-content-inner');
    const cartBar = U.$('#pesan-cart');
    if (!inner) return;

    if (this.currentTab === 'pesan') {
      if (cartBar) cartBar.classList.add('visible');
      this._renderPesanTab(inner);
    } else {
      if (cartBar) cartBar.classList.remove('visible');
      this._renderRiwayatTab(inner);
    }
  },

  /* -------------------------------------------------- TAB: PESAN */
  _renderPesanTab(inner) {
    const cartCount = Object.keys(this.cart).length;

    const searchPlaceholder = this.barangLoading
      ? 'Memuat daftar barang...'
      : 'Cari nama atau kode barang...';
    const searchDisabled = this.barangLoading ? ' disabled' : '';

    inner.innerHTML =
      '<div class="welcome">' +
        '<div class="welcome-greet">Selamat datang,</div>' +
        '<div class="welcome-name">' +
          U.escapeHtml(this.session.pj || this.session.nama || '-') + '</div>' +
        '<span class="welcome-room">' +
          U.escapeHtml(this.session.nama_ruang || '') + '</span>' +
      '</div>' +
      '<div style="display:flex;gap:8px;margin-bottom:14px">' +
        '<div class="search-wrap" style="flex:1">' +
          '<input type="text" class="input" id="barang-search" ' +
            'placeholder="' + U.escapeHtml(searchPlaceholder) + '" ' +
            'autocomplete="off" autocapitalize="none"' + searchDisabled + '>' +
          '<div class="search-results" id="search-results" style="display:none"></div>' +
        '</div>' +
        '<button type="button" class="btn btn-secondary" id="btn-refresh-stok" ' +
          'title="Refresh stok" style="width:48px;min-height:46px;padding:0">' +
          U.icon('refresh', 18) +
        '</button>' +
      '</div>' +
      '<div id="cart-area"></div>' +
      '<div class="note-card">' +
        '<div class="field">' +
          '<label class="field-label">Catatan (opsional)</label>' +
          '<textarea class="textarea" id="pesan-ket" rows="2" ' +
            'placeholder="Mis. untuk kegiatan posyandu..." maxlength="500">' +
            U.escapeHtml(this.catatan) +
          '</textarea>' +
        '</div>' +
      '</div>';

    this._renderCart();
    this._attachSearch();
    this._attachCatatan();
    this._updateCartBar();

    const btnRefresh = U.$('#btn-refresh-stok');
    if (btnRefresh) {
      btnRefresh.addEventListener('click', () => this._refreshBarang(btnRefresh));
    }
  },

  async _refreshBarang(btn) {
    if (this.barangLoading) return;
    this.barangLoading = true;
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" ' +
        'style="width:16px;height:16px;border-width:2.5px"></span>';
    }

    try {
      const res = await PesanApi.getBarangUntukPesan();
      this.barangList = (res.data && res.data.items) || [];

      // Update stok di cart kalau ada
      const byKode = {};
      this.barangList.forEach(b => { byKode[b.kode] = b; });
      Object.keys(this.cart).forEach(kode => {
        if (byKode[kode]) {
          this.cart[kode].stok_tersedia = Number(byKode[kode].stok_tersedia) || 0;
        }
      });

      Toast.success('Stok diperbarui');
      this._renderCart();
    } catch (err) {
      dbgWarn('Refresh stok gagal:', err.message);
      if (this._handleApiError(err)) return;
      Toast.error('Gagal refresh: ' + err.message);
    } finally {
      this.barangLoading = false;
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = U.icon('refresh', 18);
      }
    }
  },

  _attachCatatan() {
    const el = U.$('#pesan-ket');
    if (!el) return;
    el.addEventListener('input', () => { this.catatan = el.value; });
  },

  _attachSearch() {
    const input = U.$('#barang-search');
    const results = U.$('#search-results');
    if (!input || !results) return;

    const closeResults = () => {
      results.style.display = 'none';
      results.innerHTML = '';
    };

    const handler = U.debounce(() => {
      const q = input.value.trim().toLowerCase();
      if (!q) { closeResults(); return; }

      results.style.display = 'block';

      if (this.barangLoading) {
        results.innerHTML = '<div class="search-empty">' +
          H.loaderSm('Memuat...') + '</div>';
        return;
      }
      if (!this.barangList.length) {
        results.innerHTML =
          '<div class="search-empty">Daftar barang belum termuat. Coba refresh.</div>';
        return;
      }

      const found = this.barangList.filter(b =>
        b.nama.toLowerCase().indexOf(q) !== -1 ||
        b.kode.toLowerCase().indexOf(q) !== -1
      ).slice(0, 30);

      if (found.length === 0) {
        results.innerHTML = '<div class="search-empty">Tidak ditemukan</div>';
        return;
      }

      results.innerHTML = found.map(b => {
        const inCart = !!this.cart[b.kode];
        const stok = Number(b.stok_tersedia) || 0;
        const stokCls = stok === 0 ? 'empty' : stok <= 5 ? 'low' : 'ok';
        return '' +
          '<button type="button" class="search-item" data-kode="' +
            U.escapeHtml(b.kode) + '">' +
            '<div class="search-item-main">' +
              '<div class="search-item-name">' + U.escapeHtml(b.nama) + '</div>' +
              '<div class="search-item-meta">' +
                '<strong>' + U.escapeHtml(b.kode) + '</strong>' +
                '<span>·</span>' +
                '<span>' + U.escapeHtml(b.tipe) + '</span>' +
                (b.satuan ? '<span>·</span><span>' + U.escapeHtml(b.satuan) + '</span>' : '') +
                '<span class="search-stok-badge ' + stokCls + '">Sisa ' +
                  U.formatNumber(stok) + '</span>' +
              '</div>' +
            '</div>' +
            '<span class="badge ' + (inCart ? 'badge-success' : 'badge-primary') + '">' +
              (inCart ? U.icon('check', 12) + ' Ada' : U.icon('plus', 12) + ' Tambah') +
            '</span>' +
          '</button>';
      }).join('');

      U.$$('.search-item', results).forEach(item => {
        item.addEventListener('click', () => {
          this._addToCart(item.dataset.kode);
          input.value = '';
          closeResults();
          input.focus();
        });
      });
    }, 180);

    input.addEventListener('input', handler);

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        input.value = '';
        closeResults();
      }
    });

    const clickHandler = (e) => {
      if (!e.target.closest('.search-wrap')) closeResults();
    };
    if (this._searchClickHandler) {
      document.removeEventListener('click', this._searchClickHandler);
    }
    this._searchClickHandler = clickHandler;
    document.addEventListener('click', clickHandler);
  },

  _addToCart(kode) {
    if (this.cart[kode]) {
      Toast.info('Sudah ada di keranjang');
      return;
    }
    if (this.barangLoading) {
      Toast.warning('Sedang memuat daftar barang, coba sebentar lagi');
      return;
    }
    const b = this.barangList.find(x => x.kode === kode);
    if (!b) {
      Toast.error('Barang tidak ditemukan di daftar');
      return;
    }

    const itemCount = Object.keys(this.cart).length;
    if (itemCount >= 20) {
      Toast.error('Maksimal 20 item per pesanan');
      return;
    }

    this.cart[kode] = {
      kode: b.kode,
      nama: b.nama,
      tipe: b.tipe,
      satuan: b.satuan || '',
      qty: 1,
      stok_tersedia: Number(b.stok_tersedia) || 0
    };

    U.vibrate(15);
    this._renderCart();
    this._updateCartBar();

    // Refresh dropdown kalau masih terbuka
    const results = U.$('#search-results');
    if (results && results.style.display === 'block') {
      const input = U.$('#barang-search');
      if (input && input.value.trim()) {
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
  },

  _renderCart() {
    const area = U.$('#cart-area');
    if (!area) return;
    const items = Object.values(this.cart);

    if (items.length === 0) {
      area.innerHTML = H.empty('Keranjang kosong',
        'Cari barang di atas untuk menambahkan.', 'package');
      return;
    }

    area.innerHTML = '<div class="cart-list">' + items.map(it => {
      const stok = Number(it.stok_tersedia) || 0;
      const kurang = it.qty > stok;
      const warnHtml = kurang
        ? '<div class="cart-item-warning">' + U.icon('alert', 12) +
          '<span>Minta ' + it.qty + ', stok tinggal ' + stok +
          '. Gudang akan konfirmasi.</span></div>'
        : '';
      return '' +
        '<div class="cart-item" data-kode="' + U.escapeHtml(it.kode) + '">' +
          '<div class="cart-item-info">' +
            '<div class="cart-item-name">' + U.escapeHtml(it.nama) + '</div>' +
            '<div class="cart-item-meta">' +
              U.escapeHtml(it.kode) + ' · ' + U.escapeHtml(it.tipe) +
              (it.satuan ? ' · ' + U.escapeHtml(it.satuan) : '') +
              ' · Sisa ' + U.formatNumber(stok) +
            '</div>' +
            warnHtml +
          '</div>' +
          '<div class="cart-item-actions">' +
            '<div class="qty-ctrl">' +
              '<button type="button" data-act="dec" data-kode="' +
                U.escapeHtml(it.kode) + '" aria-label="Kurangi">−</button>' +
              '<input type="number" min="1" max="1000" step="1" ' +
                'value="' + it.qty + '" data-act="set" data-kode="' +
                U.escapeHtml(it.kode) + '" inputmode="numeric">' +
              '<button type="button" data-act="inc" data-kode="' +
                U.escapeHtml(it.kode) + '" aria-label="Tambah">+</button>' +
            '</div>' +
            '<button type="button" class="cart-del" data-act="del" data-kode="' +
              U.escapeHtml(it.kode) + '" title="Hapus" aria-label="Hapus">' +
              U.icon('trash', 16) +
            '</button>' +
          '</div>' +
        '</div>';
    }).join('') + '</div>';

    U.$$('[data-act]', area).forEach(el => {
      const kode = el.dataset.kode;
      const act = el.dataset.act;

      if (act === 'inc') {
        el.addEventListener('click', () => this._changeQty(kode, 1));
      } else if (act === 'dec') {
        el.addEventListener('click', () => this._changeQty(kode, -1));
      } else if (act === 'del') {
        el.addEventListener('click', () => this._removeFromCart(kode));
      } else if (act === 'set') {
        el.addEventListener('change', () => {
          let v = Number(el.value);
          if (!isFinite(v) || v < 1) v = 1;
          if (v > 1000) { v = 1000; Toast.warning('Maks 1000'); }
          v = Math.floor(v);
          this.cart[kode].qty = v;
          el.value = v;
          this._renderCart();
          this._updateCartBar();
        });
        el.addEventListener('blur', () => {
          const cur = this.cart[kode];
          if (cur && String(el.value) !== String(cur.qty)) {
            el.value = cur.qty;
          }
        });
      }
    });
  },

  _changeQty(kode, delta) {
    if (!this.cart[kode]) return;
    const newQty = this.cart[kode].qty + delta;
    if (newQty < 1) { this._removeFromCart(kode); return; }
    if (newQty > 1000) { Toast.warning('Maks 1000'); return; }
    this.cart[kode].qty = newQty;
    this._renderCart();
    this._updateCartBar();
  },

  _removeFromCart(kode) {
    delete this.cart[kode];
    this._renderCart();
    this._updateCartBar();
  },

  _updateCartBar() {
    const count = Object.keys(this.cart).length;
    const total = Object.values(this.cart).reduce((a, b) => a + b.qty, 0);

    const barCount = U.$('#cart-bar-count');
    const barTotal = U.$('#cart-bar-total');
    const btnKirim = U.$('#btn-kirim');

    if (barCount) barCount.textContent = count + ' item';
    if (barTotal) barTotal.textContent = total + ' pcs';
    if (btnKirim) btnKirim.disabled = count === 0;
  },

  /* -------------------------------------------------- TAB: RIWAYAT */
  async _renderRiwayatTab(inner) {
    const myId = ++this._renderId;
    inner.innerHTML = H.loader('Memuat riwayat...');

    try {
      const res = await PesanApi.getPesananSaya(30);
      if (myId !== this._renderId) return;
      const items = (res.data && res.data.items) || [];
      this._riwayatItems = items;

      this._pendingCount = items.filter(it =>
        it.status === 'Baru' || it.status === 'Diproses').length;
      this._updateTabBadge();

      if (items.length === 0) {
        inner.innerHTML = H.empty('Belum ada pesanan',
          'Pesanan yang Anda kirim akan muncul di sini.', 'clipboard');
        return;
      }

      inner.innerHTML =
        '<div class="riwayat-header" style="margin-top:14px">' +
          '<div class="riwayat-title">' + items.length + ' pesanan terakhir</div>' +
          '<button class="btn btn-secondary btn-sm" id="btn-refresh-riwayat">' +
            U.icon('refresh', 14) + ' Refresh' +
          '</button>' +
        '</div>' +
        items.map(it => this._renderRiwayatCard(it)).join('');

      const refreshBtn = U.$('#btn-refresh-riwayat');
      if (refreshBtn) {
        refreshBtn.addEventListener('click', () => this._renderRiwayatTab(inner));
      }

      U.$$('[data-riwayat-id]', inner).forEach(card => {
        card.addEventListener('click', () => {
          this._openRiwayatDetail(card.dataset.riwayatId);
        });
      });
    } catch (err) {
      if (myId !== this._renderId) return;
      if (this._handleApiError(err)) return;
      inner.innerHTML = H.empty('Gagal memuat', err.message, 'alertCircle');
    }
  },

  _renderRiwayatCard(it) {
    const statusCls = this._statusCls(it.status);
    const timeAgo = this._formatTimeAgo(it.timestamp);

    return '' +
      '<div class="riwayat-card" data-riwayat-id="' + U.escapeHtml(it.id_pesanan) + '">' +
        '<div class="riwayat-card-head">' +
          '<div style="min-width:0;flex:1">' +
            '<div class="riwayat-card-id">' + U.escapeHtml(it.id_pesanan) + '</div>' +
            '<div class="riwayat-card-date">' +
              U.icon('calendar', 11) + ' ' + timeAgo +
            '</div>' +
          '</div>' +
          '<span class="status-pill ' + statusCls + '">' +
            U.escapeHtml(it.status) + '</span>' +
        '</div>' +
        '<div class="riwayat-card-body">' +
          '<span><strong>' + it.total_item + '</strong> item' +
            (it.keterangan
              ? ' · <span>' + U.escapeHtml(it.keterangan.substring(0, 40)) +
                (it.keterangan.length > 40 ? '…' : '') + '</span>'
              : '') +
          '</span>' +
          '<span class="riwayat-card-hint">' +
            'Lihat detail ' + U.icon('chevronRight', 12) +
          '</span>' +
        '</div>' +
      '</div>';
  },

  _statusCls(status) {
    if (status === 'Baru') return 'status-baru';
    if (status === 'Diproses') return 'status-diproses';
    if (status === 'Selesai') return 'status-selesai';
    if (status === 'Ditolak') return 'status-ditolak';
    if (status === 'Gagal') return 'status-gagal';
    return 'status-baru';
  },

  _statusInfo(status) {
    const map = {
      'Baru': { cls: 'status-baru', modalIcon: 'warning',
        hint: 'Menunggu diproses gudang. Barang akan segera disiapkan.' },
      'Diproses': { cls: 'status-diproses', modalIcon: 'info',
        hint: 'Sedang disiapkan oleh gudang.' },
      'Selesai': { cls: 'status-selesai', modalIcon: 'success',
        hint: 'Pesanan sudah selesai diproses.' },
      'Ditolak': { cls: 'status-ditolak', modalIcon: 'danger',
        hint: 'Pesanan ditolak. Silakan hubungi gudang untuk informasi lebih lanjut.' },
      'Gagal': { cls: 'status-gagal', modalIcon: 'warning',
        hint: 'Pesanan gagal dicatat. Silakan coba kirim ulang atau hubungi admin.' }
    };
    return map[status] || map['Baru'];
  },

  _formatTimeAgo(ts) {
    if (!ts) return '-';
    const d = new Date(ts);
    if (isNaN(d.getTime())) return '-';
    const diff = Date.now() - d.getTime();
    const min = Math.floor(diff / 60000);
    if (min < 1) return 'Baru saja';
    if (min < 60) return min + ' menit lalu';
    const jam = Math.floor(min / 60);
    if (jam < 24) return jam + ' jam lalu';
    const hari = Math.floor(jam / 24);
    if (hari < 7) return hari + ' hari lalu';
    return U.formatDate(ts);
  },

  _openRiwayatDetail(idPesanan) {
    const it = (this._riwayatItems || []).find(x => x.id_pesanan === idPesanan);
    if (!it) return;

    const snap = SnapshotStore.get(idPesanan);
    const statusInfo = this._statusInfo(it.status);

    let itemsHtml = '';
    if (snap && Array.isArray(snap.items) && snap.items.length > 0) {
      itemsHtml = snap.items.map(item => {
        const stok = Number(item.stok_tersedia) || 0;
        const kurang = item.qty > stok;
        return '' +
          '<div class="detail-item">' +
            '<div class="detail-item-left">' +
              '<div class="detail-item-name">' + U.escapeHtml(item.nama) + '</div>' +
              '<div class="detail-item-meta">' +
                U.escapeHtml(item.kode) + ' · ' + U.escapeHtml(item.tipe) +
              '</div>' +
              (kurang
                ? '<div class="detail-item-warn">' +
                  U.icon('alert', 11) +
                  '<span>Stok saat pesan: ' + stok + '</span></div>'
                : '') +
            '</div>' +
            '<div class="detail-item-qty">' + item.qty +
              '<span>' + U.escapeHtml(item.satuan || '') + '</span>' +
            '</div>' +
          '</div>';
      }).join('');
    } else {
      itemsHtml = '<div class="detail-empty">' +
        'Detail item tidak tersedia.<br>' +
        '<span style="font-size:11px">Mungkin pesanan ini dibuat dari perangkat lain.</span>' +
        '</div>';
    }

    const body = '' +
      '<div class="detail-section">' +
        '<div class="detail-row">' +
          '<div class="detail-label">Status</div>' +
          '<div class="detail-value">' +
            '<span class="status-pill ' + statusInfo.cls + '">' +
              U.escapeHtml(it.status) + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="detail-row">' +
          '<div class="detail-label">Waktu</div>' +
          '<div class="detail-value">' + U.formatDateTime(it.timestamp) + '</div>' +
        '</div>' +
        '<div class="detail-row">' +
          '<div class="detail-label">Total Item</div>' +
          '<div class="detail-value">' + it.total_item + ' item</div>' +
        '</div>' +
        '<div class="detail-row">' +
          '<div class="detail-label">Ruang</div>' +
          '<div class="detail-value">' + U.escapeHtml(this.session.nama_ruang) + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="detail-hint">' +
        U.icon('info', 14) + '<span>' + U.escapeHtml(statusInfo.hint) + '</span>' +
      '</div>' +
      (snap && snap.catatan
        ? '<div style="margin-bottom:14px">' +
          '<div style="font-size:12.5px;font-weight:700;margin-bottom:6px;color:var(--text-muted)">Catatan:</div>' +
          '<div class="detail-note">' + U.escapeHtml(snap.catatan) + '</div>' +
          '</div>'
        : '') +
      '<div style="font-size:12.5px;font-weight:700;margin-bottom:8px;color:var(--text-muted)">Item:</div>' +
      '<div class="detail-items">' + itemsHtml + '</div>';

    Modal.open({
      title: 'Detail Pesanan',
      icon: statusInfo.modalIcon,
      subtitle: idPesanan,
      body: body,
      actions: [{ label: 'Tutup', class: 'btn-primary' }]
    });
  },

  _updateTabBadge() {
    const badge = U.$('#tab-count-riwayat');
    if (!badge) return;
    if (this._pendingCount > 0) {
      badge.textContent = this._pendingCount;
      badge.style.display = 'inline-flex';
    } else {
      badge.style.display = 'none';
    }
  },

  async _refreshPendingCount() {
    try {
      const res = await PesanApi.getPesananSaya(30);
      const items = (res.data && res.data.items) || [];
      this._pendingCount = items.filter(it =>
        it.status === 'Baru' || it.status === 'Diproses').length;
      this._updateTabBadge();
    } catch (e) {
      dbgWarn('Refresh pending count gagal:', e.message);
    }
  },

  /* -------------------------------------------------- KIRIM */
  _confirmKirim() {
    if (this.submitting) return;
    const items = Object.values(this.cart);
    if (items.length === 0) {
      Toast.error('Keranjang kosong');
      return;
    }

    const totalQty = items.reduce((a, b) => a + b.qty, 0);
    const itemsKurang = items.filter(it => it.qty > (Number(it.stok_tersedia) || 0));
    const warnBlock = itemsKurang.length > 0
      ? '<div class="confirm-warning">' + U.icon('alert', 16) +
        '<div><strong>' + itemsKurang.length + ' item melebihi stok tersedia.</strong><br>' +
        'Pesanan tetap dikirim. Gudang akan konfirmasi ketersediaan.</div></div>'
      : '';

    const body =
      '<div style="font-size:13.5px;line-height:1.6">' +
        'Pesanan dari <strong>' + U.escapeHtml(this.session.nama_ruang) + '</strong>:<br>' +
        '<strong>' + items.length + ' item</strong> · total <strong>' +
        totalQty + ' pcs</strong>' +
      '</div>' +
      warnBlock +
      '<div class="confirm-list">' +
        items.map(it => {
          const stok = Number(it.stok_tersedia) || 0;
          const kurang = it.qty > stok;
          return '• ' + U.escapeHtml(it.nama) +
            ' — <strong>' + it.qty + '</strong> ' +
            U.escapeHtml(it.satuan || '') +
            (kurang ? ' <span style="color:var(--warning)">(stok: ' + stok + ')</span>' : '');
        }).join('<br>') +
      '</div>';

    const self = this;
    Modal.open({
      title: 'Kirim Pesanan?',
      icon: 'primary',
      subtitle: 'Pesanan akan diteruskan ke Apoteker & Gudang',
      body: body,
      actions: [
        { label: 'Periksa Lagi', class: 'btn-secondary' },
        {
          label: 'Ya, Kirim',
          class: 'btn-primary',
          close: false,
          icon: 'check',
          onClick: (btn) => self._kirim(btn)
        }
      ]
    });
  },

  async _kirim(btn) {
    if (this.submitting) return;
    this.submitting = true;

    const itemsSnapshot = Object.values(this.cart).map(it => ({
      kode: it.kode,
      nama: it.nama,
      tipe: it.tipe,
      satuan: it.satuan || '',
      qty: it.qty,
      stok_tersedia: Number(it.stok_tersedia) || 0
    }));
    const items = itemsSnapshot.map(it => ({
      kode_barang: it.kode,
      qty: it.qty
    }));
    const keterangan = this.catatan || '';
    const totalQty = itemsSnapshot.reduce((a, b) => a + b.qty, 0);

    Btn.setLoading(btn, 'Mengirim...');

    try {
      const res = await PesanApi.kirimPesanan({ items, keterangan });
      const idPesanan = (res.data && res.data.id_pesanan) || '-';
      const notified = !!(res.data && res.data.notified);
      const itemsKurang = (res.data && res.data.items_kurang) || 0;

      // Simpan snapshot untuk "Pesan Lagi" & offline fallback
      SnapshotStore.set(idPesanan, {
        items: itemsSnapshot,
        catatan: keterangan,
        total_qty: totalQty,
        waktu: Date.now()
      });

      // Reset cart SEGERA setelah sukses
      this.cart = {};
      this.catatan = '';

      if (this.currentTab === 'pesan') {
        this._renderTab();
      }

      Modal.close();
      U.vibrate([50, 50, 50]);
      U.beepSuccess();

      this._refreshPendingCount();

      const self = this;
      setTimeout(() => {
        Modal.open({
          title: 'Pesanan Terkirim',
          icon: 'success',
          body:
            '<div class="modal-success-info">' +
              '<div class="success-icon">' + U.icon('check', 40) + '</div>' +
              '<div class="success-title">Pesanan berhasil dikirim</div>' +
              '<div class="success-id">ID: <strong>' +
                U.escapeHtml(idPesanan) + '</strong></div>' +
              (notified
                ? '<div class="badge badge-success" ' +
                  'style="padding:8px 14px;font-size:12px">' +
                  U.icon('check', 14) + ' Notifikasi Telegram terkirim</div>'
                : '<div class="badge badge-warning" ' +
                  'style="padding:8px 14px;font-size:12px">' +
                  '⚠️ Notifikasi Telegram tidak terkirim</div>') +
              (itemsKurang > 0
                ? '<div class="badge badge-warning" ' +
                  'style="padding:8px 14px;font-size:12px;margin-top:8px">' +
                  U.icon('alert', 14) + ' ' + itemsKurang +
                  ' item melebihi stok — gudang akan konfirmasi</div>'
                : '') +
            '</div>',
          actions: [
            {
              label: 'Pesan Lagi',
              class: 'btn-secondary',
              onClick: () => { self._switchTab('pesan'); }
            },
            {
              label: 'Lihat Riwayat',
              class: 'btn-primary',
              icon: 'clipboard',
              onClick: () => { self._switchTab('riwayat'); }
            }
          ]
        });
      }, 220);
    } catch (err) {
      dbgErr('Kirim gagal:', err.message);
      if (this._handleApiError(err)) return;

      Toast.error('Gagal kirim: ' + err.message);

      // PARTIAL_WRITE: backend sudah beri id_pesanan di err.raw.data
      if (err.code === 'PARTIAL_WRITE' &&
          err.raw && err.raw.data && err.raw.data.id_pesanan) {
        Modal.close();
        const partialData = err.raw.data;
        setTimeout(() => {
          Modal.open({
            title: 'Pesanan Tercatat Sebagian',
            icon: 'warning',
            body:
              '<div style="font-size:13.5px;line-height:1.6">' +
                'ID pesanan <strong style="font-family:ui-monospace,monospace;' +
                'color:var(--primary-dark)">' +
                  U.escapeHtml(partialData.id_pesanan) + '</strong> ' +
                'tercatat di header, namun detail item gagal disimpan.' +
                '<br><br>' +
                'Hubungi admin dengan ID ini untuk perbaikan manual.' +
              '</div>',
            actions: [{ label: 'Tutup', class: 'btn-primary' }]
          });
        }, 220);
        return;
      }

      Btn.stopLoading(btn, 'Ya, Kirim', 'check');
    } finally {
      this.submitting = false;
    }
  },

  /* -------------------------------------------------- LOGOUT */
  async logout() {
    try { await Api.logout(); } catch (e) {}
    RuangStore.clear();
    this.session = null;
    this.cart = {};
    this.catatan = '';
    this.barangList = [];
    this._riwayatItems = [];
    this._pendingCount = 0;
    this._loggingIn = false;
    Toast.info('Anda telah keluar.');
    this.showLogin();
  }
};

/* ============================================================
   BOOT
   ============================================================ */
window.addEventListener('DOMContentLoaded', () => {
  dbg('[PESAN] v5.5.1 DOM ready');

  if (!installRuangApiOverride()) {
    const el = document.getElementById('boot-splash');
    if (el) el.classList.add('hide');
    document.getElementById('pesan-root').innerHTML =
      '<div style="padding:32px;text-align:center;color:#d32f2f;' +
      'font-family:system-ui,sans-serif">' +
        '<h2 style="margin-bottom:12px">Gagal memuat sistem</h2>' +
        '<p style="color:#666;line-height:1.6">' +
          'File <code style="background:#f0f0f0;padding:2px 6px;' +
          'border-radius:4px">shared/core.js</code> tidak ditemukan.' +
          '<br><br>' +
          'Pastikan struktur folder: <code>pesan.html</code> dan folder ' +
          '<code>shared/</code> sejajar.' +
        '</p>' +
      '</div>';
    return;
  }

  PesanApp.init().catch(err => {
    dbgErr('PesanApp init fatal:', err);
    const el = document.getElementById('boot-splash');
    if (el) el.classList.add('hide');
    Toast.error('Gagal memuat aplikasi: ' + err.message);
  });
});
</script>
